strong>After starting, within the first 30 seconds:</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Look over the stern for cooling water coming out with the exhaust.</strong> No water = <strong>stop the engine immediately.</strong> You have seconds before the impeller and then the exhaust system are destroyed. This is the single most important post-start check on a marine engine.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Listen. You will learn your engine's normal sound quickly, and any change from it is information.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Watch the oil pressure and temperature gauges settle.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Check the alternator is charging.</span></label></li></ul><p data-lang=\"ua\">Мнемоніка, яка використовується в морській індустрії — <strong>«WOBBLE»</strong>:</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Літера</th><th>Перевірка</th></tr></thead><tbody><tr><td><strong>W</strong> — Water (вода)</td><td>Рівень охолоджувача. <strong>Чи ВІДКРИТИЙ кінгстон забортної води?</strong> (Закрити і забути — це те, як імпелер згорає за 30 секунд.)</td></tr><tr><td><strong>O</strong> — Oil (масло)</td><td>Рівень масла двигуна і редуктора. Дивіться на колір — молочне масло означає попадання води.</td></tr><tr><td><strong>B</strong> — Belts (ремені)</td><td>Натяг і стан ременів генератора і водяного насоса.</td></tr><tr><td><strong>B</strong> — Bolts (болти)</td><td>Будь-що ослаблене, вібруюче або відсутнє. Опори двигуна.</td></tr><tr><td><strong>L</strong> — Leaks (протікання)</td><td>Паливо, масло, охолоджувач, вода. Дивіться в трюм. Будь-яка нова пляма — це повідомлення.</td></tr><tr><td><strong>E</strong> — Electrics (електрика)</td><td>Напруга акумулятора, чисті затиснуті клеми, увімкнений роз'єднувач.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Додатково, щоразу:</strong></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Ричаг передачі в НЕЙТРАЛІ</strong> перед поворотом ключа.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Нічого у воді за кормою</strong> — жодних кінців, плавців, фаліня шлюпки. <strong>Це та перевірка, яку пропускають, і саме так гребні винти намотують.</strong> Дивіться. Щоразу.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Рівень палива.</strong> Дизелі не терплять роботи «насухо» — повітря в системі означає прокачку, а це жалюгідна робота на хвилі.</span></label></li></ul><p data-lang=\"ua\"><strong>Після запуску, в перші 30 секунд:</strong></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Подивіться за корму — чи виходить охолоджуюча вода з вихлопом.</strong> Немає води = <strong>негайно зупиніть двигун.</strong> У вас секунди до знищення імпелера, а потім вихлопної системи. Це найважливіша перевірка після запуску морського двигуна.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Слухайте. Ви швидко вивчите нормальний звук свого двигуна, і будь-яка зміна — це інформація.</span></label></li></ul><hr><h3><span data-lang=\"en\">13.3 How a sailboat handles under power</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Як вітрильник керується під двигуном</span></h3><p data-lang=\"en\">A sailboat under power behaves nothing like a car and nothing like a motorboat. Four things you must internalise:</p><h4>1. No brakes, and enormous momentum</h4><p>A 5-tonne keelboat at 4 knots carries a lot of energy. <strong>Reverse gear is your brake</strong>, and it's weak. You must plan a stop several boat lengths ahead. The universal rule of docking:</p><blockquote class=\"callout\"><p><strong>\"Never approach a dock faster than you're willing to hit it.\"</strong></p><p data-lang=\"ua\"><strong>«Ніколи не підходьте до причалу швидше, ніж ви готові в нього вдаритися.»</strong></p></blockquote><h4>2. You steer from the stern, and only with water flowing over the rudder</h4><p>The rudder is at the back, so <strong>the stern swings out</strong> when you turn — you pivot around a point roughly a third of the way back from the bow, not around the bow like a car. Turning to starboard swings your stern to port. This is why boats hit things with their stern when leaving a slip.</p><p>Critically: <strong>a rudder only works when water is flowing past it.</strong> At zero speed you have zero steering. A brief burst of forward throttle sends water over the rudder and gives you steering authority for a moment — this is called \"giving her a kick ahead\", and it is the fundamental close-quarters technique.</p><h4>3. Prop walk</h4><p>In reverse, a single propeller pushes the stern sideways as well as backwards. Most boats' sterns walk in a consistent direction (commonly to port with a right-handed propeller). It is <strong>not</strong> a defect — it's a tool. Once you know which way your boat's stern walks in reverse, you can use it to pivot the boat into or out of a berth almost on the spot.</p><p><strong>Find this out deliberately:</strong> in open water, from a standstill, put her in reverse and observe which way the stern goes. Every skipper should know this number for their own boat.</p><h4>4. Wind and current dominate at low speed</h4><p>At 2 knots, a keelboat with a tall mast and high freeboard is essentially a sail. Wind will push you sideways faster than you'd believe, and a 1-knot current at a dock overwhelms your steering entirely.</p><blockquote class=\"callout\"><p><strong>Always know the direction of the wind AND the current before you begin any docking manoeuvre. If they conflict, the current usually wins for a heavy boat at low speed.</strong></p><p data-lang=\"ua\"><strong>Завжди знайте напрямок вітру І течії перед початком будь-якого маневру швартування. Якщо вони суперечать, для важкого судна на малій швидкості зазвичай перемагає течія.</strong></p></blockquote><p data-lang=\"ua\">Вітрильник під двигуном поводиться не як авто і не як моторний човен. Чотири речі, які треба засвоїти:</p><h4 data-lang=\"ua\">1. Немає гальм і величезна інерція</h4><p data-lang=\"ua\">Кільова яхта 5 тонн на 4 вузлах несе багато енергії. <strong>Задній хід — це ваше гальмо</strong>, і воно слабке.</p><h4 data-lang=\"ua\">2. Ви керуєте кормою, і лише коли вода тече по керму</h4><p data-lang=\"ua\">Кермо позаду, тому <strong>корма виноситься</strong> при повороті — ви обертаєтесь навколо точки приблизно на третині від носа, а не навколо носа, як авто. Поворот праворуч виносить корму вліво.</p><p data-lang=\"ua\">Критично: <strong>кермо працює лише коли вода тече поруч з ним.</strong> На нульовій швидкості у вас нуль керування. Короткий імпульс переднього ходу посилає воду по керму і дає керованість на мить — це називається «дати їй штовхок вперед» і це основна техніка в тісноті.</p><h4 data-lang=\"ua\">3. Відкидання гребного винта (prop walk)</h4><p data-lang=\"ua\">На задньому ходу одиночний винт штовхає корму вбік, а не лише назад. Корма більшості суден «крокує» в постійному напрямку. Це <strong>не</strong> дефект — це інструмент. Знаючи, куди крокує корма вашого судна на задньому ходу, ви можете розвертати судно в місце стоянки майже на місці.</p><p data-lang=\"ua\"><strong>Дізнайтесь це свідомо:</strong> у чистій воді, з нерухомого стану, дайте задній хід і спостерігайте, куди йде корма.</p><h4 data-lang=\"ua\">4. Вітер і течія домінують на малій швидкості</h4><p data-lang=\"ua\">На 2 вузлах кільова яхта з високою мачтою і високим бортом — це фактично вітрило. Вітер знесе вас убік швидше, ніж ви думаєте, а течія 1 вузол біля причалу повністю переважає ваше керування.</p><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">13.4 Docking</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швартування</span></h3><p data-lang=\"en\">The single most stressful thing a new skipper does, and it's mostly preparation, not skill.</p><h4>The procedure</h4><p><strong>Before you're anywhere near the dock:</strong></p><ol><li><strong>Look at the dock and decide exactly where you're going.</strong> Which side of the boat will be against the dock? Which cleats will you use? Is there room? Is anyone in the way?</li><li><strong>Assess wind and current direction and strength.</strong> Watch flags, other boats, and the water flowing past pilings.</li><li><strong>Plan to approach into the wind or current</strong> — whichever is stronger — so that reducing throttle slows you rather than letting you coast on.</li><li><strong>Brief the crew explicitly:</strong> who steps off (if anyone), which line goes on first and to which cleat, and who does what. <strong>\"Just help\" is not a brief.</strong></li><li><strong>Fenders out, at the right height</strong>, on the correct side.</li><li><strong>Docklines rigged and led outside the lifelines</strong>, coiled ready, with the boat end already secured. Nobody should be tying knots during the approach.</li><li><strong>Agree the abort plan.</strong> \"If it looks wrong, I'll say 'aborting', I'll power out into clear water, and we'll go round and try again.\" Say this out loud every time.</li></ol><p><strong>The approach:</strong></p><ol><li><strong>Approach slowly at a shallow angle</strong> — roughly 20–30° to the dock. Dead-slow speed.</li><li><strong>Take the boat out of gear and coast</strong> the last part where you can.</li><li><strong>A short burst of reverse</strong> stops you and, with prop walk, often pulls the stern in.</li><li><strong>Get one line on first</strong> — usually a midships spring or the bow line — and take a turn on a cleat. <strong>One well-placed line under control beats four people throwing ropes.</strong></li><li><strong>Then adjust at leisure.</strong> Once one line is on, the boat cannot escape and the urgency is over.</li></ol><p data-lang=\"en\"><strong>Non-negotiable safety rules:</strong></p><ul><li data-lang=\"en\"><strong>Never put a hand, foot, or leg between the boat and the dock.</strong> A 5-tonne boat closing gently will crush bone without slowing. Fenders are for fending; your limbs are not. This is the most common serious injury in marinas.</li><li data-lang=\"en\"><strong>Never jump for the dock.</strong> People fall in the gap, and the gap is where the boat is going. Step off calmly when the boat is alongside, or don't step off at all.</li><li data-lang=\"en\"><strong>Never wrap a line around your hand.</strong> Take a turn on a cleat and let the cleat take the load.</li><li data-lang=\"en\"><strong>If it's going wrong, abort.</strong> Power out, go round, try again. An aborted approach costs you three minutes and mild embarrassment. A bad approach costs gelcoat, or a finger. Experienced skippers abort routinely and think nothing of it.</li></ul><p data-lang=\"en\"><strong>Where beginners go wrong, in order of frequency:</strong> too fast; no plan; no crew brief; approaching downwind; and trying to fix a bad approach instead of aborting it.</p><p data-lang=\"ua\">Найстресовіша річ, яку робить новий шкіпер, і це переважно підготовка, а не майстерність.</p><p data-lang=\"ua\"><strong>До того, як ви близько до причалу:</strong></p><ol><li data-lang=\"ua\"><strong>Подивіться на причал і вирішіть точно, куди йдете.</strong> Яким бортом до причалу? Які утки використаєте? Чи є місце?</li><li data-lang=\"ua\"><strong>Оцініть напрямок і силу вітру й течії.</strong></li><li data-lang=\"ua\"><strong>Плануйте підхід проти вітру або течії</strong> — того, що сильніше.</li><li data-lang=\"ua\"><strong>Проінструктуйте екіпаж чітко:</strong> хто сходить, який кінець йде першим і на яку утку, хто що робить. <strong>«Просто допоможи» — це не інструктаж.</strong></li><li data-lang=\"ua\"><strong>Кранці за борт, на правильній висоті</strong>, з правильного боку.</li><li data-lang=\"ua\"><strong>Швартові заведені зовні леєрів</strong>, готові, з уже закріпленим судновим кінцем.</li><li data-lang=\"ua\"><strong>Погодьте план відмови.</strong> «Якщо буде виглядати погано, я скажу \"aborting\", вийду на чисту воду, і зайдемо знову.» Кажіть це вголос щоразу.</li></ol><p data-lang=\"ua\"><strong>Підхід:</strong></p><ol><li data-lang=\"ua\"><strong>Підходьте повільно під малим кутом</strong> — приблизно 20–30° до причалу.</li><li data-lang=\"ua\"><strong>Виведіть з передачі й котіться</strong> останню частину.</li><li data-lang=\"ua\"><strong>Короткий імпульс заднього ходу</strong> зупиняє вас і, з відкиданням винта, часто підтягує корму.</li><li data-lang=\"ua\"><strong>Заведіть один кінець першим</strong> — зазвичай середній шпринг або носовий — і візьміть оберт на утці. <strong>Один правильно заведений кінець під контролем краще за чотирьох людей, що кидають мотузки.</strong></li><li data-lang=\"ua\"><strong>Далі коригуйте спокійно.</strong> Коли один кінець заведений, судно не втече, і терміновість закінчилась.</li></ol><p data-lang=\"ua\"><strong>Правила безпеки без компромісів:</strong></p><ul><li data-lang=\"ua\"><strong>Ніколи не ставте руку, ногу чи стопу між судном і причалом.</strong> Судно 5 тонн, що м'яко наближається, роздавить кістку, не сповільнившись. Кранці для відбивання; ваші кінцівки ні. Це найпоширеніша серйозна травма в маринах.</li><li data-lang=\"ua\"><strong>Ніколи не стрибайте на причал.</strong> Люди падають у щілину, а щілина — це те, куди йде судно.</li><li data-lang=\"ua\"><strong>Ніколи не обмотуйте кінець навколо руки.</strong> Візьміть оберт на утці й дайте утці нести навантаження.</li><li data-lang=\"ua\"><strong>Якщо йде не так — відмовляйтесь.</strong> Вийдіть, зайдіть знову. Скасований підхід коштує три хвилини і легкий сором. Поганий підхід коштує гелькоуту або пальця. Досвідчені шкіпери відмовляються рутинно і не думають про це.</li></ul><hr><h3><span data-lang=\"en\">13.5 Leaving the dock, mooring buoys, and picking up</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Відхід, швартові буї та підхід</span></h3><h4><span data-lang=\"en\">Leaving a dock</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Відхід від причалу</span></h4><p data-lang=\"en\"></p><ol><li data-lang=\"en\"><strong>Plan which way you'll go and what the wind will do to you</strong> the moment the lines are off.</li><li data-lang=\"en\"><strong>Start the engine and check cooling water</strong> before releasing anything.</li><li data-lang=\"en\"><strong>Take off the lines you don't need</strong>, keeping one that controls the boat until last — often an aft spring or the bow line.</li><li data-lang=\"en\"><strong>Use springs to help:</strong> with the appropriate spring on and the engine ahead or astern, you can pivot the bow or the stern off the dock without touching anything. This is the trick that makes leaving a tight berth look easy.</li><li data-lang=\"en\"><strong>Watch your stern swing.</strong> You pivot amidships; if you turn away from the dock, your stern comes in <em>towards</em> it. Fenders stay on until you're clear.</li><li data-lang=\"en\"><strong>Get the fenders and lines in and stowed</strong> promptly — trailing lines find propellers.</li></ol><h4><span data-lang=\"en\">Mooring buoys</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швартові буї</span></h4><p data-lang=\"en\">In Halifax, mooring buoys are common in the Northwest Arm and at yacht clubs. Picking one up is a standard Basic Cruising skill.</p><ol><li data-lang=\"en\"><strong>Approach into the wind or current</strong>, slowly, so you can stop.</li><li data-lang=\"en\"><strong>Approach so the buoy comes up on the side where your crew is</strong>, and keep it visible — a buoy under the bow is invisible from the helm, so the crew must signal direction and distance with hand signals agreed in advance.</li><li data-lang=\"en\"><strong>Stop with the buoy right at the bow.</strong> Not amidships.</li><li data-lang=\"en\"><strong>Crew hooks the pickup line with a boat hook</strong> and leads it through the bow fairlead to a cleat.</li><li data-lang=\"en\"><strong>Secure properly</strong> — round turn and two half hitches, or a bowline, not a hasty half hitch.</li><li data-lang=\"en\"><strong>Check you're actually attached</strong> and check for chafe before relaxing.</li><li data-lang=\"en\"><strong>Then take a transit</strong> on two objects abeam to confirm you're not dragging.</li></ol><p data-lang=\"en\"><strong>Under sail, without an engine</strong>, the same approach applies but you must judge your stopping distance by luffing up. Practise this repeatedly in open water against a floating fender before you try it in a crowded mooring field.</p><p data-lang=\"ua\"></p><h4 data-lang=\"ua\">Відхід від причалу</h4><ol><li data-lang=\"ua\"><strong>Сплануйте, куди піде судно і що зробить з вами вітер</strong> у момент, коли кінці віддані.</li><li data-lang=\"ua\"><strong>Запустіть двигун і перевірте охолоджуючу воду</strong> перед тим, як щось віддавати.</li><li data-lang=\"ua\"><strong>Віддайте кінці, які не потрібні</strong>, залишивши той, що контролює судно, останнім.</li><li data-lang=\"ua\"><strong>Використовуйте шпринги:</strong> з відповідним шпрингом і двигуном на передньому чи задньому ходу можна відвести ніс або корму від причалу, ні до чого не торкаючись.</li><li data-lang=\"ua\"><strong>Слідкуйте за виносом корми.</strong> Ви обертаєтесь серединою; якщо повертаєте від причалу, корма йде <em>до</em> нього. Кранці залишаються, доки ви не відійшли.</li><li data-lang=\"ua\"><strong>Приберіть кранці й кінці</strong> негайно — кінці, що тягнуться, знаходять гребні винти.</li></ol><h4 data-lang=\"ua\">Швартові буї</h4><p data-lang=\"ua\">У Галіфаксі швартові буї поширені в Northwest Arm і в яхт-клубах. Взяття буя — стандартний навик Basic Cruising.</p><ol><li data-lang=\"ua\"><strong>Підходьте проти вітру або течії</strong>, повільно.</li><li data-lang=\"ua\"><strong>Підходьте так, щоб буй виходив з того боку, де ваш екіпаж</strong>, і тримайте його на виду — буй під носом невидимий з штурвала, тому екіпаж мусить показувати напрямок і відстань заздалегідь погодженими жестами.</li><li data-lang=\"ua\"><strong>Зупиніться так, щоб буй був точно на носі.</strong></li><li data-lang=\"ua\"><strong>Екіпаж підхоплює кінець відпорним гаком</strong> і проводить його через носову напрямну на утку.</li><li data-lang=\"ua\"><strong>Закріпіть як слід</strong> — обнос і два напівштики, або боулінь.</li><li data-lang=\"ua\"><strong>Перевірте, що ви справді прикріплені</strong>, і перевірте на протирання.</li><li data-lang=\"ua\"><strong>Потім візьміть створ</strong> на два об'єкти на траверзі, щоб підтвердити, що ви не дрейфуєте.</li></ol><hr><h3><span data-lang=\"en\">13.6 Engine problems and what to do</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Проблеми з двигуном і що робити</span></h3><p data-lang=\"en\">You do not need to be a mechanic. You do need to diagnose the four or five common failures, because they have simple fixes and they always happen at bad moments.</p><div class=\"table-wrap\"><table><thead><tr><th>Symptom</th><th>Likely cause</th><th>What to do</th></tr></thead><tbody><tr><td><strong>Won't turn over at all</strong></td><td>Battery, isolator switch off, loose terminal, gear not in neutral, engine kill/stop lever engaged</td><td>Check the isolator, check gear is in neutral, check terminals, try the other battery bank</td></tr><tr><td><strong>Turns over but won't start (diesel)</strong></td><td>Air in fuel, fuel filter blocked, out of fuel, stop lever engaged</td><td>Check fuel level, check and change the filter, <strong>bleed the fuel system</strong> — learn this procedure for your engine before you need it</td></tr><tr><td><strong>Started, but no cooling water from exhaust</strong></td><td><strong>Raw-water seacock closed</strong>, blocked intake, failed impeller, weed on the intake</td><td><strong>STOP THE ENGINE IMMEDIATELY.</strong> Check the seacock first (it's the most common cause and the easiest). Then the strainer. Then the impeller.</td></tr><tr><td><strong>Overheating alarm</strong></td><td>Loss of cooling water, broken belt, low coolant, blocked heat exchanger</td><td>Stop, let it cool, diagnose. <strong>Do not just keep going.</strong></td></tr><tr><td><strong>Sudden loss of drive / revs but no thrust</strong></td><td><strong>Something wrapped around the propeller</strong> — line, kelp, a fishing net, a plastic bag</td><td>Stop the engine, put it in neutral, and <strong>look</strong>. Never dive on a fouled prop in cold water alone or in a seaway.</td></tr><tr><td><strong>Black smoke</strong></td><td>Overloading, dirty air filter, over-propped</td><td>Reduce throttle</td></tr><tr><td><strong>White smoke</strong></td><td>Water in cylinders, or unburnt fuel</td><td>Serious; stop and diagnose</td></tr><tr><td><strong>Blue smoke</strong></td><td>Burning oil</td><td>Serious; investigate</td></tr><tr><td><strong>Engine runs but revs surge</strong></td><td>Air in fuel, partially blocked filter</td><td>Bleed and change the filter</td></tr></tbody></table></div><p data-lang=\"en\"><strong>What you must actually be able to do:</strong></p><ol><li data-lang=\"en\"><strong>Change a fuel filter and bleed the fuel system.</strong> Learn it at the dock with the manual open and clean hands. It is the single most valuable engine skill on a diesel sailboat.</li><li data-lang=\"en\"><strong>Change a raw-water impeller.</strong> Carry a spare. Carry two.</li><li data-lang=\"en\"><strong>Change an alternator/water pump belt.</strong> Carry a spare.</li><li data-lang=\"en\"><strong>Check and top up coolant and oil.</strong></li><li data-lang=\"en\"><strong>Clear the raw-water strainer.</strong></li></ol><p data-lang=\"en\"><strong>Carry aboard:</strong> spare impeller(s), spare belts, spare fuel filters, engine oil, a basic toolkit, gasket material, waterproof grease, self-amalgamating tape, and <strong>your engine's manual</strong>.</p><p data-lang=\"en\"><strong>And the thing that matters most: you are on a sailboat.</strong> If the engine dies, you have not lost propulsion. <strong>Put the sails up.</strong> Beginners panic at engine failure and forget they are standing on a vehicle that doesn't need one. Practise sailing on and off your mooring specifically so this is a normal event and not a crisis.</p><p data-lang=\"ua\">Вам не треба бути механіком. Але треба вміти діагностувати чотири-п'ять поширених відмов, бо вони мають прості рішення і завжди трапляються в поганий момент.</p><p data-lang=\"ua\"><strong>Що ви мусите вміти:</strong></p><ol><li data-lang=\"ua\"><strong>Замінити паливний фільтр і прокачати паливну систему.</strong> Вивчіть це на причалі з інструкцією і чистими руками. Це найцінніший навик щодо двигуна на дизельному вітрильнику.</li><li data-lang=\"ua\"><strong>Замінити імпелер забортної води.</strong> Майте запасний. Майте два.</li><li data-lang=\"ua\"><strong>Замінити ремінь генератора/водяного насоса.</strong> Майте запасний.</li><li data-lang=\"ua\"><strong>Перевірити й долити охолоджувач і масло.</strong></li><li data-lang=\"ua\"><strong>Прочистити фільтр забортної води.</strong></li></ol><p data-lang=\"ua\"><strong>Майте на борту:</strong> запасні імпелери, ремені, паливні фільтри, масло, базовий набір інструментів, прокладочний матеріал, водостійке змазування, самовулканізуючу ленту і <strong>інструкцію до двигуна</strong>.</p><p data-lang=\"ua\"><strong>І найголовніше: ви на вітрильнику.</strong> Якщо двигун відмовив, ви не втратили рухову установку. <strong>Підніміть вітрила.</strong> Новачки панікують при відмові двигуна і забувають, що стоять на транспортному засобі, якому двигун не потрібен. Тренуйтеся відходити й підходити до бочки під вітрилами саме для того, щоб це була звичайна подія, а не криза.</p><hr><h3><span data-lang=\"en\">13.7 Practice drills</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Тренувальні вправи</span></h3><p data-lang=\"en\">Book a calm morning with an instructor or an experienced friend and do nothing but this. It is the least glamorous and highest-value session in the course.</p><div class=\"table-wrap\"><table><thead><tr><th>Drill</th><th>What it teaches</th></tr></thead><tbody><tr><td><strong>Determine your prop walk direction</strong></td><td>The single most useful fact about your boat's handling</td></tr><tr><td><strong>Stop the boat from 4 knots</strong> — count the boat lengths</td><td>Your real stopping distance</td></tr><tr><td><strong>Figure-eights around two floating fenders</strong> at dead slow</td><td>Low-speed steering and throttle control</td></tr><tr><td><strong>Hold station</strong> — keep the bow within a metre of a mark, using bursts of gear</td><td>Precision throttle work, and the \"kick ahead\" technique</td></tr><tr><td><strong>Reverse in a straight line for 50 m</strong></td><td>Prop walk compensation, stern steering</td></tr><tr><td><strong>Turn the boat 360° in the smallest possible space</strong> using alternating forward/reverse and prop walk</td><td>Pivoting — the skill that gets you out of tight berths</td></tr><tr><td><strong>Come alongside a fender ten times</strong>, from both directions, in wind</td><td>Docking, without any risk to gelcoat</td></tr><tr><td><strong>Dock without touching the throttle after the last turn</strong></td><td>Judging momentum</td></tr><tr><td><strong>Pick up a mooring under power, then under sail</strong></td><td>Both are examined at Basic Cruising</td></tr><tr><td><strong>Leave a dock using only springs and the engine</strong></td><td>Tight-berth technique</td></tr><tr><td><strong>Deliberately abort an approach and go round</strong></td><td>Making abort a normal reflex, not a failure</td></tr><tr><td><strong>Kill the engine mid-harbour and sail home</strong></td><td>The one that turns engine failure from an emergency into an inconvenience</td></tr></tbody></table></div><p data-lang=\"ua\">Забронюйте спокійний ранок з інструктором або досвідченим другом і робіть лише це. Це найменш романтична і найцінніша сесія в курсі.</p><p data-lang=\"ua\">Остання вправа — <strong>вимкнути двигун посеред гавані й прийти додому під вітрилами</strong> — це та, що перетворює відмову двигуна з аварії на незручність.</p><hr><h3><span data-lang=\"en\">13.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>What does WOBBLE stand for?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the single most important check in the first 30 seconds after starting?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What do you do if no cooling water comes out with the exhaust?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What must you check astern before starting, and why?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why does a rudder stop working at zero speed, and what's the fix?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is prop walk, and how do you find out which way yours goes?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which usually wins at low speed for a heavy boat — wind or current?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>State the golden rule of docking speed.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the seven preparation steps before a docking approach.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which line should go on first, and why?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why must you never put a limb between the boat and the dock?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the abort plan, and why do you say it out loud?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the five engine repairs you should be able to do yourself.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Your engine dies in mid-harbour. What is your first thought?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає WOBBLE?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка найважливіша перевірка в перші 30 секунд після запуску?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що робити, якщо з вихлопом не виходить охолоджуюча вода?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що треба перевірити за кормою перед запуском і чому?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому кермо перестає працювати на нульовій швидкості і як це виправити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке відкидання гребного винта і як дізнатися, куди воно у вас?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що зазвичай перемагає на малій швидкості для важкого судна — вітер чи течія?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте золоте правило швидкості при швартуванні.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть сім підготовчих кроків перед підходом до причалу.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який кінець треба заводити першим і чому?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому ніколи не можна ставити кінцівку між судном і причалом?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке план відмови і чому його треба казати вголос?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять ремонтів двигуна, які ви мусите вміти самі.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Двигун відмовив посеред гавані. Яка ваша перша думка?</span></label></li></ul><hr>"}, "m14": {"t_en": "14 · Emergencies & MOB", "t_ua": "Аварії та людина за бортом", "html": "<h2>Module 14 — Emergencies &amp; Man Overboard</h2><h2 data-lang=\"ua\">Модуль 14 — Аварійні ситуації та людина за бортом</h2><p><strong>Study time / Час: ~2.5 hours + 4+ hours of drills</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Emergencies are handled by <strong>procedures practised in advance</strong>, not by cleverness in the moment. Under stress your working memory collapses and you will do only what you have rehearsed. So rehearse. Every skill in this module must be a drill you have physically done, not a passage you have read.</p><p data-lang=\"ua\">Аварійні ситуації вирішуються <strong>процедурами, відпрацьованими заздалегідь</strong>, а не кмітливістю в моменті. Під стресом ваша робоча пам'ять руйнується, і ви зробите лише те, що відрепетирували. Тож репетируйте. Кожен навик у цьому модулі мусить бути вправою, яку ви фізично виконали, а не текстом, який прочитали.</p></blockquote><hr><h3><span data-lang=\"en\">14.1 Man overboard — the single most important drill</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Людина за бортом — найважливіша вправа</span></h3><p data-lang=\"en\">In Halifax water at 12–18 °C, you have roughly <strong>10 minutes before the person in the water can no longer help themselves</strong>, and about an hour before unconsciousness. Recovery must be fast. Read <a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.2</a> again if the 1‑10‑1 numbers aren't automatic.</p><h4>Immediate actions — the first five seconds</h4><p>These happen simultaneously and they must be reflexive:</p><ol><li><strong>SHOUT \"MAN OVERBOARD!\"</strong> — loudly, so the whole crew knows instantly. Some crews use \"MOB\" — agree the call in advance.</li><li><strong>THROW flotation immediately</strong> — a horseshoe buoy, a lifebuoy, a cushion, anything buoyant. Throw it even if it lands far from them. It marks the spot and it gives them something to aim for. <strong>Throw first, think second.</strong></li><li><strong>PRESS the MOB button on the GPS/plotter.</strong> This marks the position electronically. In poor visibility this is what makes the difference between recovery and search.</li><li><strong>ASSIGN A SPOTTER</strong> — one person whose <em>only</em> job is to point at the person in the water and never take their eyes off them. Not to help, not to steer, not to handle lines. Just point and watch.</li><li><strong>DO NOT LOSE SIGHT OF THEM.</strong> A head in the water disappears at astonishingly short range — in a moderate sea, 50 metres can be enough to lose someone. This is why the spotter exists, and why they must do nothing else.</li></ol><p data-lang=\"en\"><strong>Point 4 is the one crews get wrong.</strong> In the confusion everyone tries to help with the boat and nobody watches the person. Then they're gone, and a recovery becomes a search. <strong>The spotter is the most important job on the boat.</strong> Say it in your crew brief every time.</p><h4>Recovery methods under sail</h4><p><strong>The Quick Stop</strong> — the standard method for Basic Cruising, and the best for shorthanded crews because you stay close to the person:</p><ol><li>Immediately <strong>turn into the wind</strong> (head up), regardless of what point of sail you were on.</li><li><strong>Do not release the sheets.</strong> Tack, leaving the jib backed. The boat slows dramatically and stays near the person.</li><li>Continue turning through the wind, then <strong>bear away</strong> and gybe to come back.</li><li>Approach the person <strong>from downwind, on a close reach</strong>, so you can control your speed by luffing.</li><li><strong>Stop with the person on the leeward side, just forward of amidships</strong>, and the boat drifting slowly.</li><li>Get a line to them and secure them to the boat <strong>before</strong> attempting to lift.</li></ol><p><strong>The Figure-Eight</strong> — simpler to steer, but takes you further away:</p><ol><li>Bear away onto a beam reach.</li><li>Sail away for a few boat lengths, then tack.</li><li>Return on a close reach to the person, controlling speed with the sails.</li></ol><p><strong>Under engine:</strong> drop or furl the headsail if you can, motor round, and <strong>approach from downwind</strong>. Critically: <strong>put the engine in NEUTRAL before the person is anywhere near the stern.</strong> A turning propeller near a person in the water is lethal. Many skippers stop the engine entirely for the final approach.</p><h4>Getting them back aboard — the hard part</h4><p data-lang=\"en\">This is where recoveries fail, and beginners consistently underestimate it. A cold, wet, exhausted adult in heavy clothing weighs an enormous amount and <strong>cannot help you</strong>. Their hands stopped working ten minutes ago.</p><p data-lang=\"en\"><strong>Have a plan and equipment for this specific problem:</strong></p><ul><li data-lang=\"en\"><strong>Secure them to the boat first.</strong> Get a line on them the instant you reach them. A person attached to the boat cannot be lost again while you sort out lifting.</li><li data-lang=\"en\"><strong>Boarding ladder</strong> — the easy answer, but often not usable by someone who's cold and weak, and impossible in a seaway.</li><li data-lang=\"en\"><strong>A halyard and a winch</strong> — the reliable method. Clip a spare halyard to their harness or a strop under their arms and winch them up. <strong>This is the single strongest argument for wearing a harness with a proper lifting point.</strong></li><li data-lang=\"en\"><strong>A dedicated lifting sling or MOB recovery system</strong> — worth the money if you sail seriously.</li><li data-lang=\"en\"><strong>Drop the mainsail into the water as a scoop</strong> — an old technique that works surprisingly well on small boats.</li><li data-lang=\"en\"><strong>The transom or swim platform</strong> — helpful in flat water, dangerous in a seaway where the stern is rising and falling metres.</li><li data-lang=\"en\"><strong>Keep them horizontal if possible</strong> during the lift and afterwards. In severe hypothermia, hauling someone vertically can cause a dangerous blood-pressure collapse.</li></ul><p data-lang=\"en\"><strong>After recovery:</strong></p><ul><li data-lang=\"en\">Get them <strong>out of the wind</strong>, out of wet clothing, and into dry insulation.</li><li data-lang=\"en\"><strong>Warm them gradually.</strong> No hot baths, no alcohol, no vigorous rubbing.</li><li data-lang=\"en\">Warm sweet non-alcoholic drinks if they are fully conscious and able to swallow.</li><li data-lang=\"en\"><strong>Call for medical help.</strong> Cold-water immersion has delayed effects, including cardiac and respiratory complications that can appear hours later. Anyone who has been immersed and become hypothermic should be assessed by a professional. Use PAN PAN or MAYDAY as the situation warrants.</li><li data-lang=\"en\"><strong>Watch them.</strong> Don't assume that once they're aboard and talking, it's over.</li></ul><p data-lang=\"ua\">У воді Галіфаксу при 12–18 °C у вас приблизно <strong>10 хвилин до того, як людина у воді більше не зможе собі допомогти</strong>, і близько години до втрати свідомості. Підняття мусить бути швидким.</p><h4 data-lang=\"ua\">Негайні дії — перші п'ять секунд</h4><p data-lang=\"ua\">Це відбувається одночасно і мусить бути рефлекторним:</p><ol><li data-lang=\"ua\"><strong>КРИЧІТЬ «MAN OVERBOARD!»</strong> — голосно, щоб увесь екіпаж дізнався миттєво.</li><li data-lang=\"ua\"><strong>НЕГАЙНО КИНЬТЕ ПЛАВУЧЕ</strong> — рятувальний круг, подушку, будь-що плавуче. Кидайте, навіть якщо воно впаде далеко. Це позначає місце і дає їм ціль. <strong>Спочатку кидайте, потім думайте.</strong></li><li data-lang=\"ua\"><strong>НАТИСНІТЬ кнопку MOB на GPS/плоттері.</strong> Це позначає позицію електронно.</li><li data-lang=\"ua\"><strong>ПРИЗНАЧТЕ СПОСТЕРІГАЧА</strong> — одну людину, чия <em>єдина</em> задача — показувати пальцем на людину у воді і не відводити очей. Не допомагати, не керувати, не працювати з кінцями. Лише показувати й дивитися.</li><li data-lang=\"ua\"><strong>НЕ ВТРАЧАЙТЕ ЇХ З ВИДУ.</strong> Голова у воді зникає на дивовижно малій відстані — при помірній хвилі 50 метрів може бути достатньо, щоб втратити людину.</li></ol><p data-lang=\"ua\"><strong>Пункт 4 — це те, що екіпажі роблять неправильно.</strong> У сум'ятті всі намагаються допомогти з судном, і ніхто не дивиться на людину. Потім її немає, і підняття стає пошуком. <strong>Спостерігач — найважливіша робота на судні.</strong></p><h4 data-lang=\"ua\">Методи підняття під вітрилами</h4><p data-lang=\"ua\"><strong>Quick Stop</strong> — стандартний метод для Basic Cruising і найкращий для малого екіпажу, бо ви залишаєтесь близько:</p><ol><li data-lang=\"ua\">Негайно <strong>вийдіть до вітру</strong>, незалежно від того, на якому курсі ви були.</li><li data-lang=\"ua\"><strong>Не віддавайте шкоти.</strong> Зробіть оверштаг, залишивши стаксель «навпаки». Судно різко гальмує і залишається біля людини.</li><li data-lang=\"ua\">Продовжуйте поворот через вітер, потім <strong>відійдіть від вітру</strong> і зробіть фордевінд, щоб повернутися.</li><li data-lang=\"ua\">Підходьте до людини <strong>з підвітряного боку, на повному бейдевінді</strong>, щоб контролювати швидкість заполіскуванням.</li><li data-lang=\"ua\"><strong>Зупиніться так, щоб людина була з підвітряного борту, трохи попереду міделя</strong>, і судно повільно дрейфувало.</li><li data-lang=\"ua\">Подайте їм кінець і закріпіть їх до судна <strong>перед</strong> спробою підняти.</li></ol><p data-lang=\"ua\"><strong>Під двигуном:</strong> підходьте <strong>з підвітряного боку</strong>. Критично: <strong>поставте двигун у НЕЙТРАЛЬ, перш ніж людина буде десь біля корми.</strong> Обертовий винт біля людини у воді смертельний. Багато шкіперів повністю зупиняють двигун на фінальному підході.</p><h4 data-lang=\"ua\">Підняття на борт — найважча частина</h4><p data-lang=\"ua\">Це те, де підняття зривається, і новачки постійно це недооцінюють. Замерзла, мокра, виснажена доросла людина у важкому одязі важить надзвичайно багато і <strong>не може вам допомогти</strong>. Її руки перестали працювати десять хвилин тому.</p><ul><li data-lang=\"ua\"><strong>Спочатку закріпіть їх до судна.</strong> Людина, прикріплена до судна, не може бути втрачена знову.</li><li data-lang=\"ua\"><strong>Трап</strong> — легка відповідь, але часто непридатна для замерзлої слабкої людини і неможлива на хвилі.</li><li data-lang=\"ua\"><strong>Фал і лебідка</strong> — надійний метод. Пристебніть запасний фал до їхньої страховки або стропа під руками і підніміть лебідкою. <strong>Це найсильніший аргумент носити страховий пояс з правильною точкою підйому.</strong></li><li data-lang=\"ua\"><strong>Спустіть грот у воду як «ковш»</strong> — старий прийом, що дивовижно добре працює на малих суднах.</li><li data-lang=\"ua\"><strong>Тримайте їх горизонтально, якщо можливо</strong>, під час підйому і після. При важкій гіпотермії підйом вертикально може викликати небезпечне падіння тиску.</li></ul><p data-lang=\"ua\"><strong>Після підняття:</strong></p><ul><li data-lang=\"ua\">Заберіть їх <strong>від вітру</strong>, зніміть мокрий одяг, дайте суху ізоляцію.</li><li data-lang=\"ua\"><strong>Гріть поступово.</strong> Ніяких гарячих ванн, алкоголю, інтенсивного розтирання.</li><li data-lang=\"ua\">Теплі солодкі безалкогольні напої, якщо людина при повній свідомості і може глитати.</li><li data-lang=\"ua\"><strong>Викличте медичну допомогу.</strong> Занурення в холодну воду має відкладені наслідки, включно з серцевими і дихальними ускладненнями, що можуть з'явитися через години. Використайте PAN PAN або MAYDAY за обстановкою.</li></ul><hr><h3><span data-lang=\"en\">14.2 The MOB drill you must actually run</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вправа MOB, яку треба реально виконувати</span></h3><p data-lang=\"en\">Reading about MOB is nearly worthless. Do this:</p><p data-lang=\"en\"><strong>The drill:</strong> throw a fender (with a weight and a small line, so it behaves a bit like a person) overboard <strong>without warning</strong>, and recover it. Time it.</p><div class=\"table-wrap\"><table><thead><tr><th>Stage</th><th>Target</th><th>Notes</th></tr></thead><tbody><tr><td>First attempts</td><td>Just complete it</td><td>Expect chaos. That's the point.</td></tr><tr><td>After 5 attempts</td><td>Under 5 minutes</td><td>Procedure starting to form</td></tr><tr><td>Competent</td><td>Under 3 minutes, consistently</td><td>Basic Cruising standard territory</td></tr><tr><td>Good</td><td>Under 3 minutes, in 15 kt, with different crew each time, including with <strong>you</strong> as the person \"overboard\" and a crew member driving</td><td>This is the real test</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Run it in these variations:</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Under sail, on each point of sail — the manoeuvre differs depending on where you started.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Under engine.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>With the minimum crew you actually sail with.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>With the skipper as the casualty.</strong> This is the scenario nobody practises and it's the most likely to be fatal — if you go over, does anyone else aboard know how to sail the boat back, use the radio, and start the engine? If not, fix that <em>today</em>.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>At dusk.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Then include the <strong>lift</strong>: actually hoist a heavy weight (a full water jug, or a willing crew member in a harness at the dock) out of the water with a halyard and winch, so you know it works and how long it takes.</span></label></li></ul><p data-lang=\"ua\">Читати про MOB майже безкорисно. Робіть так:</p><p data-lang=\"ua\"><strong>Вправа:</strong> кидайте кранець (з вагою і коротким кінцем, щоб він поводився трохи як людина) за борт <strong>без попередження</strong> і піднімайте його. Замірюйте час.</p><p data-lang=\"ua\"><strong>Виконуйте в таких варіантах:</strong></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Під вітрилами, на кожному курсі відносно вітру.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Під двигуном.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>З мінімальним екіпажем, з яким ви реально ходите.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>З шкіпером як постраждалим.</strong> Це сценарій, який ніхто не тренує, і він найімовірніше буде смертельним — якщо ви за бортом, чи знає хтось інший на борту, як привести судно назад, скористатися рацією і запустити двигун? Якщо ні — виправте це <em>сьогодні</em>.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>У сутінках.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Потім додайте <strong>підйом</strong>: реально підніміть важкий вантаж з води фалом і лебідкою, щоб знати, що це працює і скільки часу займає.</span></label></li></ul><hr><h3><span data-lang=\"en\">14.3 Other emergencies</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інші аварійні ситуації</span></h3><h4><span data-lang=\"en\">Fire</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Пожежа</span></h4><p data-lang=\"en\">A fire on a fibreglass boat is extremely serious. Fibreglass burns, there is nowhere to run, and fuel and gas are aboard.</p><ol><li data-lang=\"en\"><strong>Get everyone into PFDs and on deck</strong>, upwind of the fire.</li><li data-lang=\"en\"><strong>Cut the fuel and power</strong> — turn off the gas at the bottle, shut the fuel valve, isolate the batteries.</li><li data-lang=\"en\"><strong>Fight it with the extinguisher</strong> if it is small and you can do so safely. Aim at the base of the flames, sweep. Don't open a compartment fully — a rush of air feeds a fire; use a fire port if the boat has one.</li><li data-lang=\"en\"><strong>Do not use water on fuel or electrical fires.</strong></li><li data-lang=\"en\"><strong>MAYDAY early.</strong> Do not wait to see if you can win. If you win, cancel it.</li><li data-lang=\"en\"><strong>Prepare to abandon</strong> to a liferaft or dinghy. Grab bag, flares, water, EPIRB, handheld VHF.</li><li data-lang=\"en\"><strong>Do not re-enter</strong> a burning cabin for possessions.</li></ol><p data-lang=\"en\"><strong>Prevention:</strong> gas is the big one. Turn the propane off at the bottle every time. Check hoses annually. Fit a gas alarm. Sniff the bilge — LPG is heavier than air and sinks there. See also fuelling safety in <a href=\"#/m12\" data-nav=\"m12\">Module 12 §12.4</a>.</p><h4><span data-lang=\"en\">Taking on water</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Надходження води</span></h4><ol><li><strong>Find the source.</strong> Most flooding is not a hole in the hull — it's a failed <strong>seacock</strong>, a burst hose, a leaking stern gland, a failed cockpit drain, or the engine's raw-water system.</li><li><strong>Close the relevant seacock.</strong> This is why you learn where all of them are, and why every seacock should have a soft wooden bung tied next to it.</li><li><strong>Pump.</strong> Manual pump plus electric plus a bucket. A bucket in determined hands moves more water than most electric pumps, and this is a genuinely useful fact.</li><li><strong>Slow the boat</strong> — water pressure into a hole increases sharply with speed.</li><li><strong>MAYDAY</strong> if you're losing the battle. Do it <em>while</em> you still have power and a mast, not after.</li><li>Head for shallow water if sinking is likely — a boat in 3 m can be salvaged; a boat in 60 m cannot.</li></ol><h4><span data-lang=\"en\">Dismasting</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Втрата мачти</span></h4><ol><li><strong>Account for all crew immediately.</strong> Falling rigging injures people.</li><li><strong>Start the engine only after checking nothing is in the water astern</strong> — a dismasting drops a web of wire and rope around the boat, and it will find your propeller.</li><li><strong>Secure the rig.</strong> A broken mast alongside acts like a battering ram and will hole the hull. Either get it aboard and lash it, or cut it away with bolt croppers or a hacksaw (carry them).</li><li><strong>Assess:</strong> can you make a jury rig from the boom and a spare sail? Often yes.</li><li><strong>PAN PAN</strong> — this is an urgency, not usually a grave and imminent danger, unless you're being blown onto rocks.</li></ol><h4 data-lang=\"ua\"><span data-lang=\"en\">Grounding</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Посадка на мілину</span></h4><ol><li><strong>Note the state of tide immediately.</strong> Rising tide is good news and often the whole solution — you may simply wait. Falling tide means you must act <strong>now</strong>, within minutes.</li><li><strong>Check for damage and water ingress.</strong> Look in the bilge.</li><li><strong>Try to reduce draft and heel the boat:</strong> move crew weight to the low side, swing the boom out with a crew member on it, or take a halyard to the dinghy or another boat and pull the masthead sideways. Heeling a fin-keeled boat lifts the keel tip significantly.</li><li><strong>Try to reverse out the way you came in.</strong> That water was deep enough a minute ago.</li><li><strong>Set an anchor out into deep water</strong> (\"kedging off\") and haul on it.</li><li><strong>Do not accept an unclear tow</strong> — get the boat's insurance implications straight, use a strong point, and never take a line to a fitting that will tear out.</li><li><strong>On a falling tide, secure the boat against falling over</strong> and be prepared to wait for the next tide. Halifax's small tidal range is genuinely helpful here — the boat won't be left as high and dry as it would be in the Bay of Fundy.</li></ol><h4><span data-lang=\"en\">Steering failure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Відмова керування</span></h4><ul><li><strong>Rudder still attached, cables/quadrant broken:</strong> rig the <strong>emergency tiller</strong>. Know where yours is and that it fits — many are stowed in an inaccessible locker under three sail bags and have never been tested. <strong>Test it at the dock this season.</strong></li><li><strong>Rudder lost entirely:</strong> you can steer a sailboat with sail balance alone. Ease the main and trim the jib to bear away; trim the main and ease the jib to head up (see <a href=\"#/m02\" data-nav=\"m02\">Module 02 §2.6</a>). You can also trail a drogue or bucket off one quarter, or lash an oar or floorboard as a sweep.</li></ul><h4><span data-lang=\"en\">Medical emergencies</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Медичні аварії</span></h4><ul><li><strong>Carry a proper first aid kit</strong> and know what's in it. Add sea-specific items: seasickness medication, wound closure strips, a triangular bandage, burn dressings, and eye wash.</li><li><strong>Take a first aid course.</strong> Marine or wilderness first aid is ideal, because the defining feature is that help is hours away.</li><li><strong>PAN PAN</strong> for medical advice or assistance; <strong>MAYDAY</strong> if life-threatening.</li><li>The Coast Guard can arrange <strong>telemedical advice</strong>, evacuation, or a rendezvous. Give them: age, sex, symptoms, vital signs, what happened, what you've done, and your position.</li></ul><h4><span data-lang=\"en\">Capsize (dinghy)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перевертання (дінгі)</span></h4><ol><li><strong>Stay with the boat.</strong> It floats, it's visible, and it's your best flotation. Never swim for shore.</li><li><strong>Account for your crew.</strong> Check nobody is under the sail.</li><li><strong>Right it:</strong> stand on the centreboard, hold the gunwale or a righting line, and lean back. Use your body weight, not your arms.</li><li><strong>Be ready as it comes up</strong> — it may sail away without you, or capsize on top of you the other way.</li><li><strong>Watch for turtling</strong> (fully inverted, mast down). Much harder to recover; get weight on the centreboard early to prevent it.</li></ol><p data-lang=\"ua\"><strong>Короткий огляд інших аварій:</strong></p><p data-lang=\"ua\"><strong>Пожежа:</strong> усі в жилетах на палубу з навітряного боку → відключити газ, паливо, акумулятори → гасити вогнегасником у основу полум'я → <strong>не водою</strong> на паливо чи електрику → <strong>MAYDAY завчасно</strong> → готуйтесь залишити судно. Профілактика: газ — головна небезпека. Закривайте пропан на балоні щоразу.</p><p data-lang=\"ua\"><strong>Надходження води:</strong> знайдіть джерело (зазвичай це <strong>кінгстон</strong> або лопнув шланг, а не пробоїна) → закрийте кінгстон (тому в кожного мусить бути дерев'яна пробка поруч) → відкачуйте (<strong>відро в рішучих руках переміщує більше води, ніж більшість електронасосів</strong>) → зменште швидкість → <strong>MAYDAY</strong>, поки у вас ще є живлення → йдіть на мілку воду.</p><p data-lang=\"ua\"><strong>Втрата мачти:</strong> перевірте всіх людей → <strong>не запускайте двигун, не перевіривши воду за кормою</strong> → закріпіть або обріжте рангоут (майте болторіз) → оцініть можливість аварійного рангоуту → <strong>PAN PAN</strong>.</p><p data-lang=\"ua\"><strong>Посадка на мілину:</strong> негайно визначте стан припливу (приплив зростає — можна просто чекати; спадає — дійте <strong>зараз</strong>) → перевірте пошкодження і воду → зменште осадку креном (вага екіпажу на низький борт, фал у бік) → спробуйте вийти заднім ходом тим же шляхом → заведіть якір у глибоку воду і підтягуйтесь.</p><p data-lang=\"ua\"><strong>Відмова керування:</strong> аварійний румпель — <strong>перевірте свій на причалі цього сезону</strong>. Втрата керма — керуйте балансом вітрил, або тягніть за кормою плавучий якір з одного борту.</p><p data-lang=\"ua\"><strong>Медичні аварії:</strong> повна аптечка, курс першої допомоги (морська або «дика» — бо допомога за години), <strong>PAN PAN</strong> за консультацією, <strong>MAYDAY</strong> при загрозі життю.</p><p data-lang=\"ua\"><strong>Перевертання дінгі:</strong> <strong>залишайтесь з судном</strong> → перевірте екіпаж → станьте на шверт, тримайтесь за борт, відкиньтесь назад → будьте готові, коли воно піднімається → не дайте йому перевернутися повністю (мачтою вниз).</p><hr><h3><span data-lang=\"en\">14.4 The grab bag</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Аварійна сумка</span></h3><p data-lang=\"en\">A single waterproof bag, ready at all times, that you take if you have to abandon the boat. Assemble it once and don't raid it for anything.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Handheld VHF, waterproof, charged (and ideally floating)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>EPIRB or PLB</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Flares — a mix of parachute and hand-held</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Handheld GPS, or a phone in a waterproof case with a battery pack</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Drinking water</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>High-energy food</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Space blankets / thermal protective aids</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>First aid kit</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Knife</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Whistle and a signalling mirror</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Waterproof torch with spare batteries</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sunscreen and a hat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Copies of documents, and cash</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Any essential prescription medication</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>A pump or bailer for the liferaft/dinghy</span></label></li></ul><p data-lang=\"ua\">Одна водонепроникна сумка, готова завжди, яку ви берете, якщо мусите залишити судно. Зберіть її один раз і не розбирайте ні для чого.</p><p data-lang=\"ua\">Портативна VHF (заряджена, плавуча) · EPIRB/PLB · фальшфейєри (парашутні й ручні) · портативний GPS або телефон у водонепроникному чохлі з павербанком · питна вода · висококалорійна їжа · термоковдри · аптечка · ніж · свисток і сигнальне дзеркало · водонепроникний ліхтарик із запасними батарейками · сонцезахисний крем і капелюх · копії документів і гроші · необхідні ліки за рецептом · насос або черпак для плота.</p><hr><h3><span data-lang=\"en\">14.5 The crew brief — every trip, no exceptions</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інструктаж екіпажу — кожен вихід, без винятків</span></h3><p data-lang=\"en\">Two minutes at the dock. Do it even with experienced crew, and <em>especially</em> with family and friends who have never sailed.</p><p data-lang=\"en\">Point at each item physically as you say it:</p><ol><li data-lang=\"en\"><strong>\"Here are the PFDs. Here's how to put one on. Here's the whistle and light.\"</strong></li><li data-lang=\"en\"><strong>\"Here is the fire extinguisher. Here are the flares. Here is the first aid kit.\"</strong></li><li data-lang=\"en\"><strong>\"Here is the VHF. This is channel 16. This is how you set high power. Here is the MAYDAY card — read it now.\"</strong></li><li data-lang=\"en\"><strong>\"Here is the bilge pump, and here is its handle.\"</strong></li><li data-lang=\"en\"><strong>\"Here is the engine start, and here is the kill switch.\"</strong></li><li data-lang=\"en\"><strong>\"Watch the boom. When I say 'gybe-ho', get your head down.\"</strong></li><li data-lang=\"en\"><strong>\"If someone goes overboard: shout, throw something that floats, and one of you points at them and does nothing else.\"</strong></li><li data-lang=\"en\"><strong>\"If <em>I</em> go overboard, here is what you do: [specific instructions — stop the boat, throw flotation, press MOB on the plotter, MAYDAY on 16].\"</strong></li><li data-lang=\"en\"><strong>\"We are going here, we'll be back around this time, and I've told someone ashore.\"</strong></li><li data-lang=\"en\"><strong>\"Any questions? Anyone prone to seasickness? Anyone need medication now?\"</strong></li></ol><p data-lang=\"en\">Point 8 is the one that matters most and is almost never done. <strong>An incapacitated skipper with an unbriefed crew is a mass-casualty scenario.</strong> Two minutes prevents it.</p><p data-lang=\"ua\">Дві хвилини на причалі. Робіть це навіть з досвідченим екіпажем, і <em>особливо</em> з родиною і друзями, які ніколи не ходили під вітрилами. Показуйте на кожен предмет фізично, коли говорите.</p><p data-lang=\"ua\">Пункт 8 («якщо <em>я</em> впаду за борт, ось що ви робите») — найважливіший і майже ніколи не виконується. <strong>Недієздатний шкіпер з неінструктованим екіпажем — це сценарій з масовими жертвами.</strong> Дві хвилини це запобігають.</p><hr><h3><span data-lang=\"en\">14.6 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the five immediate actions for man overboard, in order.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the spotter's job, and what else may they do? (Trick question.)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe the Quick Stop method.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>From which direction do you approach a person in the water, and why?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What must you do with the engine before the person is near the stern?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is getting someone back aboard the hardest part?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the most reliable lifting method, and what equipment does it require?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why keep a hypothermic person horizontal?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why must a rescued person be medically assessed even if they seem fine?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Your target MOB recovery time?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the most under-practised MOB scenario?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the first thing you do in a fire, and when do you call MAYDAY?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the most common source of flooding on a sailboat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why check astern before starting the engine after a dismasting?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You go aground. What is the very first thing you check?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you steer a sailboat with no rudder?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name eight items in a grab bag.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recite the ten points of the crew brief.</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять негайних дій при людині за бортом, за порядком.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка задача спостерігача і що ще він може робити? (Питання з підступом.)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть метод Quick Stop.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>З якого боку ви підходите до людини у воді і чому?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що треба зробити з двигуном, перш ніж людина буде біля корми?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому підняття на борт — найважча частина?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який найнадійніший метод підйому і яке обладнання він вимагає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому тримати людину з гіпотермією горизонтально?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому врятовану людину треба оглянути медично, навіть якщо вона виглядає добре?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ваш цільовий час підняття MOB?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який сценарій MOB найменш відпрацьований?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що ви робите першим при пожежі і коли викликаєте MAYDAY?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яке найпоширеніше джерело надходження води на вітрильнику?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому перевіряти за кормою перед запуском двигуна після втрати мачти?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви сіли на мілину. Що ви перевіряєте найпершим?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як керувати вітрильником без керма?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть вісім предметів аварійної сумки.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Відтворіть десять пунктів інструктажу екіпажу.</span></label></li></ul><hr>"}, "m15": {"t_en": "15 · Basic Cruising", "t_ua": "Basic Cruising", "html": "<h2>Module 15 — Basic Cruising: The Practical Skills List</h2><h2 data-lang=\"ua\">Модуль 15 — Basic Cruising: перелік практичних навичок</h2><p><strong>Study time / Час: ~2 hours + 30+ hours on the water</strong> · <strong>This is your first real sailing certification</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">This is the module that turns everything you've read into a certification. <strong>Sail Canada Basic Cruising</strong> qualifies you to <em>\"cruise safely in familiar waters as both skipper and crew of a sloop-rigged keelboat of 6 to 10 metres with an outboard or inboard motor, in moderate wind and sea conditions, by day.\"</em> Read that sentence carefully — <strong>it makes you a skipper.</strong> It is the milestone that matters most on your whole path.</p><p data-lang=\"ua\">Це модуль, що перетворює все прочитане на сертифікацію. <strong>Sail Canada Basic Cruising</strong> дає вам кваліфікацію <em>«безпечно здійснювати круїзи у знайомих водах як шкіпер і як член екіпажу шлюпа 6–10 метрів із забортним чи стаціонарним двигуном, при помірному вітрі й морі, вдень.»</em> Прочитайте це речення уважно — <strong>воно робить вас шкіпером.</strong> Це найважливіша віха на всьому вашому шляху.</p></blockquote><hr><h3><span data-lang=\"en\">15.1 What the certification requires</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що вимагає сертифікація</span></h3><p data-lang=\"en\">The key thing to understand about Sail Canada standards: <strong>you must demonstrate every skill without coaching.</strong> Not \"with a hint\", not \"after being reminded\" — unprompted, correctly, in front of an evaluator. That is what separates a certification from a course you attended.</p><p data-lang=\"en\"><strong>Typical format:</strong> 4–5 days, or a series of weekend sessions, on a boat in the 6–10 m range with an engine. Some schools teach it in a day-sailing format spread over several weeks, which is often better for retention. Prerequisite is normally Start Keelboating or equivalent demonstrated ability.</p><p data-lang=\"en\"><strong>Where to do it in Halifax:</strong> the Armdale Yacht Club sailing school, the Royal Nova Scotia Yacht Squadron, Dartmouth Yacht Club, and private schools including Nova Sail and In Slocum's Wake all teach Sail Canada keelboat standards. Contacts and details in <a href=\"#/resources\" data-nav=\"resources\">appendix/halifax-resources.md</a>. <strong>Book in January or February for a spring course</strong> — the good ones fill early.</p><p data-lang=\"ua\">Головне, що треба зрозуміти про стандарти Sail Canada: <strong>ви мусите демонструвати кожен навик без підказок.</strong> Не «з натяком», не «після нагадування» — самостійно, правильно, перед екзаменатором. Саме це відрізняє сертифікацію від курсу, який ви відвідали.</p><p data-lang=\"ua\"><strong>Типовий формат:</strong> 4–5 днів або серія сесій на вихідних, на судні 6–10 м з двигуном. Деякі школи викладають це у форматі денних виходів протягом кількох тижнів, що часто краще для засвоєння.</p><p data-lang=\"ua\"><strong>Де це зробити в Галіфаксі:</strong> школа Armdale Yacht Club, Royal Nova Scotia Yacht Squadron, Dartmouth Yacht Club і приватні школи, включно з Nova Sail і In Slocum's Wake, викладають стандарти кільових яхт Sail Canada. Контакти й деталі в <a href=\"#/resources\" data-nav=\"resources\">appendix/halifax-resources.md</a>. <strong>Бронюйте в січні або лютому на весняний курс.</strong></p><hr><h3><span data-lang=\"en\">15.2 The skills checklist</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольний перелік навичок</span></h3><p data-lang=\"en\">Work through this and honestly mark each one. <strong>Anything unticked is what you practise next.</strong> Verify the current official standard with your school — Sail Canada publishes the definitive requirements and they are revised periodically. This list is a study aid built to match the standard's scope.</p><h4><span data-lang=\"en\">Preparation and knowledge</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Підготовка та знання</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Identify all parts of the boat, rig, and sails by their correct names</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Perform a complete pre-departure inspection</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Locate and explain all safety equipment aboard</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Confirm required safety equipment is present, in date, and functional</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Obtain and interpret a marine weather forecast, and make a go/no-go decision</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Read a tide table and apply it to the day's plan</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>File a sail plan</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Brief a crew on safety and their duties</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain the rules of the road and apply them under way</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Identify buoys and understand IALA Region B convention</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate proper VHF procedure, including a distress call format</span></label></li></ul><h4><span data-lang=\"en\">Rigging and sail handling</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Такелаж і робота з вітрилами</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Bend on and rig a mainsail and headsail correctly</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Hoist, trim, reef, and lower sails in control</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Reef and shake out a reef under way</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Furl and stow sails properly, and fit sail covers</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Coil, flake, and stow all lines</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use winches correctly and safely, and clear an override</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Tie and use: figure-eight, bowline, cleat hitch, clove hitch, round turn and two half hitches, reef knot, sheet bend, rolling hitch</span></label></li></ul><h4><span data-lang=\"en\">Boat handling under sail</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Керування під вітрилами</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Steer a compass course accurately</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Steer to the wind using telltales — hold the close-hauled groove</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Identify and sail all points of sail</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Trim sails correctly for each point of sail</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Tack the boat, giving correct commands, without losing way</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Gybe the boat under control, giving correct commands</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Rig and use a preventer</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recover from being in irons</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Heave-to and hold position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail a triangular course efficiently</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail to windward, tacking to a windward destination</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Stop the boat under sail in a chosen position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail on and off a mooring or dock <strong>without the engine</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate awareness of heel, weather helm, and when to reduce sail</span></label></li></ul><h4><span data-lang=\"en\">Boat handling under power</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Керування під двигуном</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Perform pre-start engine checks (WOBBLE)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Start, warm, and shut down the engine correctly, confirming cooling water</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Manoeuvre ahead and astern in confined space</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate understanding of prop walk on your boat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Turn the boat in a confined space</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Come alongside a dock under power, both sides, in wind</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Depart a dock using springs</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Pick up and depart a mooring under power</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Abort an approach and re-attempt</span></label></li></ul><h4 data-lang=\"ua\"><span data-lang=\"en\">Anchoring</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Постановка на якір</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Select an appropriate anchorage using a chart</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Calculate and set correct scope</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor and confirm the anchor is set</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Establish a transit to check for dragging</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Weigh anchor and stow ground tackle</span></label></li></ul><h4><span data-lang=\"en\">Safety and emergencies</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Безпека та аварійні ситуації</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Recover a man overboard under sail, unassisted, repeatedly</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recover a man overboard under power</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate a plan to lift a casualty aboard</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain and demonstrate actions for fire, flooding, grounding, and steering failure</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use the emergency tiller</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate correct use of PFDs, harness, and tether</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain cold-water survival and the 1‑10‑1 principle</span></label></li></ul><h4><span data-lang=\"en\">Navigation</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Навігація</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Read a chart and identify hazards, depths, and aids to navigation</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Plot a course and measure a distance</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Take and plot a bearing, and fix a position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use a transit and a clearing bearing</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Maintain a dead-reckoning position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use a depth sounder to confirm position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Plan and execute a short passage with a bolthole identified</span></label></li></ul><h4><span data-lang=\"en\">Seamanship and skippering</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Морська справа і шкіперство</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Take command: give clear instructions and manage a crew</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Maintain a proper lookout and delegate lookout duty</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Demonstrate courtesy and correct conduct around other vessels</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recognise your own limits and make conservative decisions</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Keep a log</span></label></li></ul><p data-lang=\"ua\">Пройдіть цей перелік і чесно відзначте кожен пункт. <strong>Усе невідзначене — це те, що ви тренуєте далі.</strong> Перевірте актуальний офіційний стандарт у своїй школі — Sail Canada публікує остаточні вимоги, і вони періодично оновлюються. Цей список — навчальний посібник, побудований відповідно до обсягу стандарту.</p><hr><h3><span data-lang=\"en\">15.3 Anchoring — the one big new skill</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Постановка на якір — головний новий навик</span></h3><p data-lang=\"
