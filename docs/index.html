s preferred.</td><td>буй розділення каналу</td></tr><tr><td><strong>Safe water / mid-channel</strong></td><td><strong>Red and white vertical stripes</strong>, spherical or with a red spherical topmark. White light, Morse \"A\" ( • — )</td><td>Safe water all around. Often marks a channel entrance or landfall. Pass on either side.</td><td>буй чистої води</td></tr><tr><td><strong>Isolated danger</strong></td><td><strong>Black with one or more red bands</strong>, two black spheres as topmark. White light, group flashing (2).</td><td>A specific small hazard with navigable water all around it. <strong>Stay away.</strong></td><td>буй окремої небезпеки</td></tr><tr><td><strong>Cardinal buoys</strong> (North/East/South/West)</td><td>Black and yellow bands + double-cone topmarks. Quick/very quick flashing white lights.</td><td>Indicates the safe side to pass: pass to the <strong>north</strong> of a North buoy, etc.</td><td>кардинальні буї</td></tr><tr><td><strong>Special</strong></td><td><strong>Yellow</strong>, X topmark, yellow light</td><td>Marks something that isn't a navigation hazard: a cable, spoil ground, outfall, military exercise area, or a <strong>racing mark</strong>.</td><td>спеціальний буй</td></tr><tr><td><strong>Mooring buoy</strong></td><td><strong>White with an orange horizontal band</strong> (Canada)</td><td>A place to moor.</td><td>швартовий буй</td></tr><tr><td><strong>Cautionary</strong></td><td><strong>Yellow</strong>, may have an orange/black symbol</td><td>Warns of something.</td><td>попереджувальний буй</td></tr><tr><td><strong>Information / Regulatory</strong> (Canadian system)</td><td><strong>White with orange bands</strong> and a <strong>shape</strong> in the middle:</td><td></td><td></td></tr><tr><td>— orange <strong>diamond</strong></td><td></td><td>Danger — the nature is written inside</td><td>небезпека</td></tr><tr><td>— orange <strong>diamond with a cross</strong></td><td></td><td><strong>Keep out</strong> — entry prohibited</td><td>вхід заборонено</td></tr><tr><td>— orange <strong>circle</strong></td><td></td><td>Controlled area — a restriction applies (e.g. speed limit), written inside</td><td>зона обмежень</td></tr><tr><td>— orange <strong>square</strong></td><td></td><td>Information — directions, distances, place names</td><td>інформація</td></tr><tr><td><strong>Swim buoy</strong></td><td><strong>White with orange band, sometimes \"SWIM\"</strong></td><td>Swimming area. Stay well clear.</td><td>зона купання</td></tr><tr><td><strong>Diver-down flag</strong></td><td><strong>Red flag with white diagonal stripe</strong> (Alpha flag = blue/white also used)</td><td><strong>Divers in the water.</strong> Stay at least 100 m away and slow right down.</td><td>прапор «водолаз під водою»</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Canada-specific note.</strong> Canada uses the international IALA system for navigation buoys <em>plus</em> its own distinctive set of white-and-orange <strong>regulatory and information buoys</strong>, which don't exist in most of the world. These orange-shape buoys are very likely to appear on your PCOC exam. Learn the four shapes: <strong>diamond = danger, crossed diamond = keep out, circle = controlled, square = information.</strong></p><p data-lang=\"ua\"><strong>Особливість Канади.</strong> Канада використовує міжнародну систему IALA для навігаційних буїв <em>плюс</em> власний характерний набір біло-оранжевих <strong>регуляторних та інформаційних буїв</strong>, яких немає в більшій частині світу. Ці оранжеві фігури дуже ймовірно з'являться на екзамені PCOC. Вивчіть чотири фігури: <strong>ромб = небезпека, ромб з хрестом = вхід заборонено, коло = зона обмежень, квадрат = інформація.</strong></p><hr><h3><span data-lang=\"en\">8.3 Navigation lights</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Навігаційні вогні</span></h3><p data-lang=\"en\">Lights are required <strong>from sunset to sunrise and in restricted visibility</strong>, which in Halifax means fog can require them at midday.</p><h4>The basic lights and their arcs</h4><div class=\"table-wrap\"><table><thead><tr><th>Light</th><th>Colour</th><th>Arc of visibility</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Port sidelight</strong></td><td>Red</td><td>112.5°, from dead ahead to just abaft the port beam</td><td>лівий бортовий вогонь</td></tr><tr><td><strong>Starboard sidelight</strong></td><td>Green</td><td>112.5°, from dead ahead to just abaft the starboard beam</td><td>правий бортовий вогонь</td></tr><tr><td><strong>Sternlight</strong></td><td>White</td><td>135°, aft</td><td>кормовий вогонь</td></tr><tr><td><strong>Masthead light</strong> (steaming light)</td><td>White</td><td>225°, forward — shown by <strong>power-driven</strong> vessels</td><td>топовий вогонь</td></tr><tr><td><strong>All-round light</strong></td><td>White</td><td>360°</td><td>круговий вогонь</td></tr><tr><td><strong>Towing light</strong></td><td>Yellow</td><td>135°, aft</td><td>буксирувальний вогонь</td></tr></tbody></table></div><p>Note: red + green sidelights (112.5° each) + sternlight (135°) = 360°. The arcs are designed to tile the whole circle exactly, so from any angle you see a specific, unambiguous combination.</p><h4><span data-lang=\"en\">What you display</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що ви виставляєте</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Your vessel</th><th>Lights required</th></tr></thead><tbody><tr><td><strong>Sailing vessel under sail, under 20 m</strong></td><td>Red + green sidelights + white sternlight. <em>May</em> combine all three in one <strong>tricolour lantern at the masthead</strong> — better visibility, less battery, but only one of the two options may be lit at a time.</td></tr><tr><td><strong>Sailing vessel under sail, optional extra</strong></td><td>May also show red-over-green all-round lights at the masthead (rarely used)</td></tr><tr><td><strong>Sailing vessel under ENGINE</strong></td><td>You are a power-driven vessel: sidelights + sternlight + <strong>white masthead (steaming) light</strong>. Turn the steaming light ON when you start motoring — a very common omission.</td></tr><tr><td><strong>Under 7 m and under 7 knots</strong> (e.g. a dinghy)</td><td>May show just an all-round white light, ideally with sidelights if practicable</td></tr><tr><td><strong>Sailing vessel under 7 m</strong></td><td>If it cannot show the standard lights, must have <strong>an electric torch or lighted lantern showing a white light ready to hand</strong> to show in time to prevent collision</td></tr><tr><td><strong>At anchor, under 50 m</strong></td><td>One <strong>all-round white light</strong> where best seen. Plus by day, a <strong>black ball</strong> forward.</td></tr><tr><td><strong>Vessel aground</strong></td><td>Anchor light(s) plus <strong>two all-round red lights</strong> vertically</td></tr><tr><td><strong>Not under command</strong></td><td><strong>Two all-round red lights</strong> vertically</td></tr><tr><td><strong>Restricted in ability to manoeuvre</strong></td><td><strong>Red–white–red</strong> all-round lights vertically</td></tr><tr><td><strong>Constrained by draught</strong></td><td><strong>Three all-round red lights</strong> vertically</td></tr><tr><td><strong>Fishing (trawling)</strong></td><td><strong>Green over white</strong> all-round</td></tr><tr><td><strong>Fishing (not trawling)</strong></td><td><strong>Red over white</strong> all-round</td></tr></tbody></table></div><p><strong>Memory aids for the vertical light stacks:</strong></p><ul><li><strong>\"Red over red, the captain is dead\"</strong> → two red = <strong>Not Under Command</strong></li><li><strong>\"Red over white, fishing tonight\"</strong> → fishing (not trawling)</li><li><strong>\"Green over white, trawling tonight\"</strong> → trawling</li><li><strong>\"Red white red, restricted ahead\"</strong> → Restricted in Ability to Manoeuvre</li><li><strong>\"Three reds in a row, deep draught below\"</strong> → Constrained by draught</li></ul><h4><span data-lang=\"en\">Interpreting what you see at night</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що ви бачите вночі</span></h4><div class=\"table-wrap\"><table><thead><tr><th>You see</th><th>The vessel is</th><th>Your action</th></tr></thead><tbody><tr><td><strong>Red and green together, no white above</strong></td><td>A <strong>sailing vessel</strong> coming <strong>straight at you</strong></td><td>Both should act; apply Rule 12 if you're also sailing</td></tr><tr><td><strong>Red and green together, with white above</strong></td><td>A <strong>power-driven vessel</strong> head-on</td><td>Both alter to <strong>starboard</strong></td></tr><tr><td><strong>Red only</strong></td><td>You see her <strong>port</strong> side; she is crossing <strong>right to left</strong></td><td><strong>You give way</strong> — she's on your starboard side</td></tr><tr><td><strong>Green only</strong></td><td>You see her <strong>starboard</strong> side; she is crossing <strong>left to right</strong></td><td><strong>You stand on</strong> — but keep watching</td></tr><tr><td><strong>White only, low, single</strong></td><td>Her <strong>stern</strong> — you are overtaking her, <strong>or</strong> a vessel at anchor</td><td><strong>You keep clear</strong> (overtaking vessel gives way)</td></tr><tr><td><strong>Two whites vertically aligned</strong></td><td>A power vessel over 50 m, seen from ahead — masthead + range light. <strong>Aligned = she's pointed at you.</strong></td><td>Determine which side; act early</td></tr><tr><td><strong>Two whites, one clearly left of the other</strong></td><td>A large vessel crossing. The lower/forward light shows which way she's heading.</td><td>Assess and act</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The masthead-light gotcha.</strong> If you see <strong>red + green + white above</strong>, that's a <em>power</em> vessel head-on. If you see <strong>red + green with no white</strong>, it's a <em>sailing</em> vessel head-on. That single white light changes the entire right-of-way analysis, and it's a favourite exam question.</p><p data-lang=\"ua\">Вогні обов'язкові <strong>від заходу до сходу сонця і при обмеженій видимості</strong>, а в Галіфаксі це означає, що туман може вимагати їх опівдні.</p><p data-lang=\"ua\"><strong>Підступність топового вогню.</strong> Якщо ви бачите <strong>червоний + зелений + білий вище</strong> — це судно <em>з двигуном</em> на зустрічному курсі. Якщо бачите <strong>червоний + зелений без білого</strong> — це <em>вітрильне</em> судно на зустрічному курсі. Цей один білий вогонь повністю змінює аналіз переваги руху, і це улюблене екзаменаційне питання.</p><hr><h3><span data-lang=\"en\">8.4 Day shapes</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Денні знаки</span></h3><p data-lang=\"en\">By day, vessels display black shapes instead of lights. Small but real exam content.</p><div class=\"table-wrap\"><table><thead><tr><th>Shape</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>One black ball</strong>, forward</td><td><strong>At anchor</strong></td><td>на якорі</td></tr><tr><td><strong>Three black balls</strong> vertically</td><td><strong>Aground</strong></td><td>на мілині</td></tr><tr><td><strong>Two black balls</strong> vertically</td><td><strong>Not under command</strong></td><td>не керується</td></tr><tr><td><strong>Ball–diamond–ball</strong> vertically</td><td><strong>Restricted in ability to manoeuvre</strong></td><td>обмежене в маневруванні</td></tr><tr><td><strong>A black cylinder</strong></td><td><strong>Constrained by draught</strong></td><td>обмежене осадкою</td></tr><tr><td><strong>One black cone, point DOWN</strong></td><td><strong>A sailing vessel proceeding under power</strong> — this one is yours!</td><td>вітрильник під двигуном</td></tr><tr><td><strong>Two cones, points together</strong> (like a diamond)</td><td>Fishing vessel with gear extending over 150 m</td><td>судно з ловними снастями</td></tr></tbody></table></div><p data-lang=\"en\">The cone-point-down is legally required when you motor with sails up, and it is almost universally ignored by recreational sailors. Know it for the exam, and know that other vessels may not display it — so if a sailboat is behaving like a motorboat, assume it <em>is</em> one.</p><p data-lang=\"ua\">Конус вершиною вниз юридично обов'язковий, коли ви йдете під двигуном з піднятими вітрилами, і його майже повсюдно ігнорують прогулянкові яхтсмени. Знайте його для екзамену і знайте, що інші судна можуть його не виставляти — тому якщо вітрильник поводиться як моторний човен, припускайте, що він <em>і є</em> моторний.</p><hr><h3><span data-lang=\"en\">8.5 Distress signals</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сигнали біди</span></h3><p data-lang=\"en\">Know these both to <em>use</em> them and to <em>recognise</em> them. Recognising another vessel's distress signal and responding is a legal duty.</p><div class=\"table-wrap\"><table><thead><tr><th>Signal</th><th>Notes</th></tr></thead><tbody><tr><td><strong>MAYDAY</strong> spoken on VHF Ch 16</td><td>The primary method. See <a href=\"#/m11\" data-nav=\"m11\">Module 11</a></td></tr><tr><td><strong>DSC distress alert</strong> — the red button on a DSC VHF</td><td>Fastest and most reliable. Sends your identity and GPS position automatically.</td></tr><tr><td><strong>EPIRB / PLB activation</strong></td><td>Satellite distress beacon — for offshore</td></tr><tr><td><strong>Red parachute flare</strong> (Type A)</td><td>Visible many miles, for attracting distant attention</td></tr><tr><td><strong>Red hand-held flare</strong> (Type B)</td><td>For pinpointing your position to a rescuer already nearby</td></tr><tr><td><strong>Buoyant/hand smoke signal</strong> (Type C/D) — orange smoke</td><td>Daytime only, good for aircraft</td></tr><tr><td><strong>SOS by any means</strong> — light, sound ( • • • — — — • • • )</td><td>—</td></tr><tr><td><strong>\"MAYDAY\" spoken aloud</strong></td><td>—</td></tr><tr><td><strong>Continuous sounding of a fog horn</strong></td><td>—</td></tr><tr><td><strong>A gun or explosive fired at ~1 minute intervals</strong></td><td>Traditional</td></tr><tr><td><strong>Slowly and repeatedly raising and lowering outstretched arms</strong></td><td>The visual signal anyone can give</td></tr><tr><td><strong>Orange distress sheet</strong> with a black square and circle</td><td>—</td></tr><tr><td><strong>Flames on the vessel</strong> (burning tar barrel etc.)</td><td>Traditional</td></tr><tr><td><strong>Code flags N over C</strong></td><td>—</td></tr><tr><td><strong>A square flag with a ball above or below it</strong></td><td>—</td></tr><tr><td><strong>Dye marker in the water</strong></td><td>—</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Flare discipline:</strong></p><ul><li data-lang=\"en\"><strong>Flares expire.</strong> They are typically valid for four years from the date of manufacture, and expired flares don't satisfy the legal requirement. Check dates every spring.</li><li data-lang=\"en\"><strong>Never dispose of old flares by firing them off</strong> \"for practice\" — a red flare over Halifax Harbour will launch a Coast Guard response, and you may be liable for costs. Expired flares must be disposed of properly; ask your yacht club or local fire service how, as arrangements vary.</li><li data-lang=\"en\"><strong>Point parachute flares downwind and away from the sails,</strong> and hold hand flares out over the water, downwind, gloved, with your arm outstretched. They burn extremely hot and drip.</li><li data-lang=\"en\"><strong>Save one.</strong> Don't fire everything at once. Fire when you have reason to think someone can see it — when you hear an aircraft or see a vessel.</li></ul><p data-lang=\"ua\">Знайте їх, щоб і <em>застосовувати</em>, і <em>розпізнавати</em>. Розпізнати сигнал біди іншого судна і відреагувати — це юридичний обов'язок.</p><p data-lang=\"ua\"><strong>Дисципліна щодо фальшфейєрів:</strong></p><ul><li data-lang=\"ua\"><strong>Фальшфейєри мають термін придатності.</strong> Зазвичай чотири роки з дати виготовлення, і прострочені не задовольняють юридичну вимогу. Перевіряйте дати щовесни.</li><li data-lang=\"ua\"><strong>Ніколи не утилізуйте старі фальшфейєри, запускаючи їх</strong> «для тренування» — червона ракета над гаванню Галіфаксу викличе реакцію Coast Guard, і ви можете відповідати за витрати. Прострочені підлягають належній утилізації; спитайте у своєму яхт-клубі або в місцевій пожарній службі як саме, бо порядок різниться.</li><li data-lang=\"ua\"><strong>Спрямовуйте парашутні ракети під вітер і від вітрил</strong>, а ручні тримайте за борт над водою, під вітер, у рукавичці, з витягнутою рукою. Вони горять надзвичайно гаряче і капають.</li><li data-lang=\"ua\"><strong>Збережіть один.</strong> Не запускайте все відразу. Запускайте, коли є підстави вважати, що хтось побачить — коли чуєте літак або бачите судно.</li></ul><hr><h3><span data-lang=\"en\">8.6 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Which IALA region is Canada, and what is the memory phrase?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Colour, shape, and number parity of a port-hand buoy? A starboard-hand buoy?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You are leaving Halifax Harbour for the open sea. Which side do red buoys go on?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does a red-and-white vertically striped buoy mean?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What are the four Canadian orange regulatory buoy shapes and their meanings?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does a yellow buoy indicate?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What lights must a sailing vessel under 20 m show under sail? Under engine?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What extra light must you switch on when you start the engine?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>At night you see red and green side by side with no white light. What is it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>At night you see only a red light. Do you give way?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>\"Red over red\" means what? \"Red white red\"?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What day shape must a sailing vessel under power display?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What shape does a vessel at anchor show by day? What light by night?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name six distress signals.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How long are flares valid, and how must expired ones be handled?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>До якого регіону IALA належить Канада і яка мнемонічна фраза?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Колір, форма і парність номера лівого буя? Правого буя?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви виходите з гавані Галіфаксу у відкрите море. З якого борту червоні буї?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає буй з червоно-білими вертикальними смугами?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які чотири канадські оранжеві регуляторні фігури і що вони означають?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що позначає жовтий буй?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які вогні мусить виставляти вітрильник менше 20 м під вітрилами? Під двигуном?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який додатковий вогонь треба включити, коли запускаєте двигун?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Уночі ви бачите червоний і зелений поруч без білого вогню. Що це?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Уночі ви бачите лише червоний вогонь. Ви уступаєте дорогу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає «червоний над червоним»? «Червоний-білий-червоний»?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який денний знак мусить виставляти вітрильник під двигуном?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який знак виставляє судно на якорі вдень? Який вогонь уночі?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть шість сигналів біди.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який термін дії фальшфейєрів і як утилізувати прострочені?</span></label></li></ul><hr>"}, "m09": {"t_en": "09 · Weather for Halifax", "t_ua": "Погода Галіфаксу", "html": "<h2>Module 09 — Weather for Halifax Sailors</h2><h2 data-lang=\"ua\">Модуль 09 — Погода для яхтсменів Галіфаксу</h2><p><strong>Study time / Час: ~3 hours + ongoing</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Weather is the skill that decides whether you have a good day, a bad day, or a rescue. Nova Scotia has genuinely challenging weather — fog, fast-moving systems, and a hurricane season — and it is entirely manageable if you understand it. This module is half general theory and half specific local knowledge you can't get from a textbook.</p><p data-lang=\"ua\">Погода — це навик, який визначає, чи буде у вас добрий день, поганий день, або рятувальна операція. Нова Шотландія має справді складну погоду — туман, швидкі системи і сезон ураганів — і все це цілком керовано, якщо ви це розумієте. Цей модуль — половина загальної теорії і половина конкретних місцевих знань, яких немає в підручниках.</p></blockquote><hr><h3><span data-lang=\"en\">9.1 Where to get the forecast</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Де брати прогноз</span></h3><p data-lang=\"en\">Use the <strong>official marine forecast</strong>, not a general weather app. Land forecasts are useless for sailing: they don't give you wind over water, sea state, or visibility, and land wind is not marine wind.</p><div class=\"table-wrap\"><table><thead><tr><th>Source</th><th>How to get it</th><th>Use for</th></tr></thead><tbody><tr><td><strong>Environment Canada marine forecast — \"Halifax Harbour and Approaches\"</strong></td><td>weather.gc.ca/marine — this is your primary source. Issued roughly <strong>four times daily, around 0300, 1000, 1530 and 2000</strong></td><td>Wind, visibility, sea state, warnings. Check it every time.</td></tr><tr><td><strong>Continuous Marine Broadcast (CMB)</strong> — Canadian Coast Guard</td><td>On VHF, commonly <strong>Ch 21B (WX8)</strong> or <strong>Ch 83B (WX9)</strong> depending on area — check which works in your location</td><td>The forecast on the water, without cell coverage. Also carries Notices to Shipping.</td></tr><tr><td><strong>Weatheradio Canada</strong></td><td>VHF WX1–WX7 (162.400 / 162.475 / 162.550 MHz among them)</td><td>Continuous marine and land forecasts, English and French</td></tr><tr><td><strong>Marine weather warnings</strong></td><td>Same sources</td><td>Small craft, gale, storm, hurricane force</td></tr><tr><td><strong>Wind apps</strong> (Windy, Windfinder, PredictWind)</td><td>Phone</td><td>Excellent for <em>planning</em> and seeing the pattern. <strong>Not</strong> a substitute for the official forecast and warnings.</td></tr><tr><td><strong>Buoy and station observations</strong></td><td>Environment Canada; the Halifax Harbour buoy</td><td><strong>Actual current conditions</strong> — far more valuable than a forecast for \"should I go now?\"</td></tr><tr><td><strong>Tide tables</strong></td><td>Fisheries and Oceans Canada (CHS)</td><td>Every trip. See <a href=\"#/m10\" data-nav=\"m10\">Module 10</a></td></tr><tr><td><strong>Look out the window</strong></td><td>Free</td><td>Always. Compare it to the forecast; that's how you learn.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The habit to build:</strong> check the forecast the <strong>night before</strong>, again in the <strong>morning</strong>, and again <strong>right before you leave</strong>. Then compare what actually happened to what was forecast, every time. After one season of doing that deliberately, you will have local weather instincts that no course can teach you.</p><p data-lang=\"ua\">Використовуйте <strong>офіційний морський прогноз</strong>, а не звичайний погодний застосунок. Наземні прогнози безкорисні для вітрильного спорту: вони не дають вітру над водою, стану моря чи видимості, а наземний вітер — це не морський вітер.</p><p data-lang=\"ua\"><strong>Звичка, яку треба виробити:</strong> перевіряйте прогноз <strong>напередодні ввечері</strong>, знову <strong>вранці</strong>, і знову <strong>безпосередньо перед виходом</strong>. Потім щоразу порівнюйте те, що фактично сталося, з тим, що прогнозували. Після одного сезону такої свідомої практики у вас з'явиться місцева погодна інтуїція, якій не навчить жоден курс.</p><hr><h3><span data-lang=\"en\">9.2 Wind: reading the numbers</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вітер: читання цифр</span></h3><p data-lang=\"en\">Marine forecasts give wind in <strong>knots</strong> (1 knot = 1 nautical mile per hour ≈ 1.85 km/h). Learn the Beaufort scale as <em>what it looks like and what it means for you</em>, not as trivia.</p><div class=\"table-wrap\"><table><thead><tr><th>Beaufort</th><th>Knots</th><th>km/h</th><th>Name</th><th>What you see on the water</th><th>What it means for a small keelboat</th></tr></thead><tbody><tr><td>0</td><td>&lt;1</td><td>&lt;2</td><td>Calm</td><td>Mirror</td><td>Motor. No sailing.</td></tr><tr><td>1</td><td>1–3</td><td>2–6</td><td>Light air</td><td>Ripples</td><td>Frustrating. Drifting.</td></tr><tr><td>2</td><td>4–6</td><td>7–11</td><td>Light breeze</td><td>Small wavelets</td><td>Pleasant, slow. <strong>Ideal first lesson.</strong></td></tr><tr><td>3</td><td>7–10</td><td>12–19</td><td>Gentle breeze</td><td>Crests begin to break</td><td><strong>Ideal learning conditions.</strong> Full sail, boat moves well.</td></tr><tr><td>4</td><td>11–16</td><td>20–30</td><td>Moderate breeze</td><td>Small waves, frequent whitecaps</td><td><strong>Great sailing.</strong> Exciting, full sail or first reef. Upper end is a lot for a first-timer.</td></tr><tr><td>5</td><td>17–21</td><td>31–39</td><td>Fresh breeze</td><td>Moderate waves, many whitecaps</td><td><strong>Reef.</strong> Demanding but rewarding. Not for beginners without an instructor.</td></tr><tr><td>6</td><td>22–27</td><td>40–50</td><td>Strong breeze</td><td>Large waves, white foam crests, spray</td><td><strong>Second reef.</strong> Genuinely hard work. Experienced crew only.</td></tr><tr><td>7</td><td>28–33</td><td>51–62</td><td>Near gale</td><td>Foam blown in streaks</td><td>Storm sails or stay ashore. Not recreational sailing.</td></tr><tr><td>8</td><td>34–40</td><td>63–74</td><td><strong>Gale</strong></td><td>Well-marked streaks of foam</td><td><strong>Emergency for a small boat.</strong> Do not go out.</td></tr><tr><td>9–12</td><td>41+</td><td>75+</td><td>Strong gale to hurricane</td><td>Survival conditions</td><td>Boats get damaged and people die.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Warning terminology in Canadian marine forecasts:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Warning</th><th>Wind</th><th>Meaning for you</th></tr></thead><tbody><tr><td><strong>Small Craft Warning</strong></td><td>20–33 kt</td><td><strong>Stay in port</strong> as a beginner. This is a warning issued specifically for boats like yours.</td></tr><tr><td><strong>Gale Warning</strong></td><td>34–47 kt</td><td>Do not go out. Secure your boat.</td></tr><tr><td><strong>Storm Warning</strong></td><td>48–63 kt</td><td>Serious. Prepare the boat for damage.</td></tr><tr><td><strong>Hurricane Force Wind Warning</strong></td><td>64+ kt</td><td>Haul out or storm-moor.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Beginner thresholds — be honest with yourself:</strong></p><ul><li data-lang=\"en\"><strong>Your first sails: 5–12 knots.</strong> That's Beaufort 2–4. Enough to sail properly, gentle enough to learn.</li><li data-lang=\"en\"><strong>Comfortable competence: up to 15 knots.</strong></li><li data-lang=\"en\"><strong>You should deliberately sail in 15–20 knots with an instructor</strong> before you consider yourself capable. Nova Scotia gives you 15–20 kt often, and a skipper who has only sailed in 8 knots is not ready for it.</li><li data-lang=\"en\"><strong>Above 20 knots: with an experienced skipper only</strong>, until you have many hours.</li><li data-lang=\"en\"><strong>A Small Craft Warning means you don't go.</strong> No exceptions while you're learning. The wind will still be there next weekend.</li></ul><p data-lang=\"en\"><strong>Gusts matter more than average.</strong> A forecast of \"15 knots gusting 25\" is a 25-knot day, not a 15-knot day, because you must rig for the gusts. The ratio matters too: gusts 40–50% above the mean indicate an unstable air mass and squally, shifty conditions. Gusts only 20% above the mean indicate steady, predictable wind.</p><p data-lang=\"ua\">Морські прогнози дають вітер у <strong>вузлах</strong> (1 вузол = 1 морська миля на годину ≈ 1,85 км/год). Вивчіть шкалу Бофорта як <em>те, як це виглядає і що це означає для вас</em>, а не як цікавинку.</p><p data-lang=\"ua\"><strong>Пороги для новачка — будьте чесні з собою:</strong></p><ul><li data-lang=\"ua\"><strong>Ваші перші виходи: 5–12 вузлів.</strong> Це Бофорт 2–4.</li><li data-lang=\"ua\"><strong>Комфортна компетентність: до 15 вузлів.</strong></li><li data-lang=\"ua\"><strong>Вам варто свідомо походити при 15–20 вузлах з інструктором</strong>, перш ніж вважати себе здатним. Нова Шотландія часто дає 15–20 вузлів, і шкіпер, який ходив лише при 8, до цього не готовий.</li><li data-lang=\"ua\"><strong>Понад 20 вузлів: лише з досвідченим шкіпером</strong>, поки у вас не буде багато годин.</li><li data-lang=\"ua\"><strong>Small Craft Warning означає, що ви не йдете.</strong> Без винятків, поки вчитеся. Вітер буде і наступних вихідних.</li></ul><p data-lang=\"ua\"><strong>Пориви важливіші за середнє.</strong> Прогноз «15 вузлів з поривами до 25» — це день на 25 вузлів, а не на 15, бо готуватися треба під пориви. Співвідношення теж має значення: пориви на 40–50% вище середнього вказують на нестабільну повітряну масу і шквалисті, зсувні умови.</p><hr><h3><span data-lang=\"en\">9.3 Halifax fog — the defining local hazard</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Туман Галіфаксу — визначальна місцева небезпека</span></h3><p data-lang=\"en\">Halifax gets <strong>over 100 days a year of fog or mist</strong>, and it is the single most distinctive feature of sailing here. You must understand it.</p><p data-lang=\"en\"><strong>Why it happens:</strong> warm, moist air moves over the <strong>cold water of the Labrador Current</strong>. The air is cooled from below to its dew point, and the moisture condenses into <strong>advection fog</strong> (sea fog). It's not the same mechanism as morning valley fog inland.</p><p data-lang=\"en\"><strong>Consequences of that mechanism:</strong></p><ul><li data-lang=\"en\"><strong>It is worst in late spring and early summer — June and July are the peak months</strong> — when the air is warming fast but the sea is still very cold. This is why your late-July start is fortunate: August and September have noticeably less fog.</li><li data-lang=\"en\"><strong>It does not \"burn off\" in the sun</strong> like radiation fog. Sea fog can persist for days. Waiting for it to clear may not work.</li><li data-lang=\"en\"><strong>It arrives fast.</strong> Visibility can go from 10 km to under 100 m in minutes as a fog bank rolls in from seaward. You can be sailing in sunshine, watch a grey wall approach, and be inside it before you finish reefing.</li><li data-lang=\"en\"><strong>It's often clear inshore and thick offshore</strong>, or the reverse. Fog frequently sits on the outer harbour and approaches while the Northwest Arm stays clear — which is a trap, because you go out in sunshine and come home to a wall.</li><li data-lang=\"en\"><strong>Marine forecasts use \"fog\" to mean visibility under 1 nautical mile.</strong></li></ul><p data-lang=\"en\"><strong>What to do about it:</strong></p><p data-lang=\"en\"><strong>Before you go:</strong></p><ul><li data-lang=\"en\">Check the visibility line in the marine forecast, every single time. Not just wind.</li><li data-lang=\"en\">If fog is forecast at all, and you're a beginner, <strong>sail somewhere you can get home from blind</strong> — the Northwest Arm or Bedford Basin, not out past McNabs Island.</li><li data-lang=\"en\">Have a plan written down: your route, compass bearings for each leg, and distances. Fog is when you need a plan you made when you could think clearly.</li></ul><p data-lang=\"en\"><strong>If you get caught in fog:</strong></p><ol><li data-lang=\"en\"><strong>Everyone puts on a PFD.</strong> Immediately, no discussion.</li><li data-lang=\"en\"><strong>Slow down</strong> to a speed from which you can stop in the visibility you have (Rule 6).</li><li data-lang=\"en\"><strong>Sound fog signals</strong> — as a sailing vessel: <strong>one prolonged plus two short</strong>, at least every two minutes. See <a href=\"#/m07\" data-nav=\"m07\">Module 07 §7.6</a>.</li><li data-lang=\"en\"><strong>Turn on navigation lights.</strong></li><li data-lang=\"en\"><strong>Post a dedicated lookout forward</strong>, and stop the engine periodically to <strong>listen</strong>. Sound is your primary sensor. You will often hear a ship's engine, a bell buoy, or surf on rocks before you see anything.</li><li data-lang=\"en\"><strong>Fix your position immediately and log it.</strong> Then keep a running log of course and speed so you can dead-reckon. If your GPS dies in fog with no known position, you are in real trouble.</li><li data-lang=\"en\"><strong>Get out of the shipping channel.</strong> Move to shallow water where big ships can't go — this is the single best decision available to you. Shallow water is safe water in fog.</li><li data-lang=\"en\"><strong>Radar reflector up.</strong> You are otherwise nearly invisible.</li><li data-lang=\"en\"><strong>Listen on VHF Ch 16 and the VTS channels</strong> for traffic movements.</li><li data-lang=\"en\"><strong>Consider anchoring</strong> in shallow water clear of channels, showing the correct signals, and simply waiting. There is no prize for arriving.</li></ol><p data-lang=\"en\"><strong>The honest beginner advice:</strong> for your first season or two, <strong>do not sail in fog, and do not sail when fog is forecast.</strong> Navigating in fog safely requires radar, AIS, solid dead-reckoning skill, and calm judgement under stress. Build those first. Halifax will give you plenty of clear days.</p><p data-lang=\"ua\">У Галіфаксі <strong>понад 100 днів на рік туману або мли</strong>, і це найхарактерніша риса плавання тут. Ви мусите це розуміти.</p><p data-lang=\"ua\"><strong>Чому це відбувається:</strong> тепле вологе повітря приходить над <strong>холодну воду Лабрадорської течії</strong>. Повітря охолоджується знизу до точки роси, і волога конденсується в <strong>адвективний туман</strong> (морський туман).</p><p data-lang=\"ua\"><strong>Наслідки цього механізму:</strong></p><ul><li data-lang=\"ua\"><strong>Найгірше в кінці весни й на початку літа — червень і липень пікові місяці.</strong> Саме тому ваш старт у кінці липня вдалий: у серпні й вересні туману помітно менше.</li><li data-lang=\"ua\"><strong>Він не «вигорає» на сонці</strong>, як радіаційний туман. Морський туман може триматися днями.</li><li data-lang=\"ua\"><strong>Він приходить швидко.</strong> Видимість може впасти з 10 км до менш ніж 100 м за хвилини.</li><li data-lang=\"ua\"><strong>Часто ясно біля берега і густо в морі</strong>, або навпаки. Туман часто сидить на зовнішній гавані й підходах, поки Northwest Arm залишається чистим — і це пастка, бо ви виходите на сонці, а повертаєтесь до стіни.</li><li data-lang=\"ua\"><strong>Морські прогнози використовують «fog» для видимості менше 1 морської милі.</strong></li></ul><p data-lang=\"ua\"><strong>Якщо туман застав вас:</strong></p><ol><li data-lang=\"ua\"><strong>Усі надівають жилети.</strong> Негайно, без обговорення.</li><li data-lang=\"ua\"><strong>Зменште швидкість</strong> до такої, з якої можете зупинитися в наявній видимості (Правило 6).</li><li data-lang=\"ua\"><strong>Подавайте туманні сигнали</strong> — як вітрильне судно: <strong>один продовжений і два короткі</strong>, не рідше кожні дві хвилини.</li><li data-lang=\"ua\"><strong>Увімкніть навігаційні вогні.</strong></li><li data-lang=\"ua\"><strong>Поставте окремого спостерігача на бак</strong> і періодично зупиняйте двигун, щоб <strong>слухати</strong>. Слух — ваш основний сенсор.</li><li data-lang=\"ua\"><strong>Негайно визначте своє місце і запишіть його.</strong> Далі ведіть постійний журнал курсу і швидкості для прокладки шляху.</li><li data-lang=\"ua\"><strong>Вийдіть з суднового ходу.</strong> Перейдіть на мілку воду, куди великі судна не можуть — це найкраще доступне вам рішення. Мілка вода в тумані — це безпечна вода.</li><li data-lang=\"ua\"><strong>Радарний відбивач нагору.</strong></li><li data-lang=\"ua\"><strong>Слухайте VHF канал 16 і канали VTS.</strong></li><li data-lang=\"ua\"><strong>Розгляньте варіант стати на якір</strong> на мілководді поза каналами, виставивши правильні сигнали, і просто чекати. Немає призу за прибуття.</li></ol><p data-lang=\"ua\"><strong>Чесна порада новачку:</strong> у перший сезон чи два <strong>не виходьте в туман і не виходьте, коли туман у прогнозі.</strong> Безпечна навігація в тумані вимагає радара, AIS, твердого навику прокладки і спокійного судження під стресом. Спочатку набудьте це. Галіфакс дасть вам достатньо ясних днів.</p><hr><h3><span data-lang=\"en\">9.4 The Halifax wind pattern</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вітровий режим Галіфаксу</span></h3><p data-lang=\"en\">Local knowledge that experienced Halifax sailors have and beginners don't:</p><p data-lang=\"en\"><strong>The southwesterly sea breeze</strong> is the summer workhorse. On a sunny summer afternoon, land heats faster than the cold ocean; the warm air rises, and cooler marine air flows in to replace it. The result is a reliable <strong>SW wind that builds through the afternoon</strong>, typically strongest between about 1400 and 1800, then eases in the evening. This is what makes Halifax summer sailing pleasant and predictable, and it's why club racing happens in the late afternoon and evening.</p><p data-lang=\"en\"><strong>Practical implications:</strong></p><ul><li data-lang=\"en\"><strong>Morning is often calm.</strong> If you want wind, go out after lunch. If you want calm water to practise docking or motoring drills, go out early.</li><li data-lang=\"en\"><strong>Plan the return leg.</strong> If the sea breeze builds to 18 knots by 4 pm and your home is upwind, that's a long, wet beat home at the end of a tiring day. Sail <em>upwind first</em>, downwind home — this is the single best planning habit for the local pattern.</li><li data-lang=\"en\"><strong>The sea breeze fights or reinforces the gradient wind.</strong> A SW gradient wind plus SW sea breeze can produce a much stronger afternoon than forecast. A NE gradient wind opposing the sea breeze can produce a confused, light, shifty mess.</li></ul><p data-lang=\"en\"><strong>Northwest Arm specifics:</strong> the Arm runs roughly northwest–southeast, lined with steep tree- and house-covered shores. This makes the wind inside it <strong>shifty, gusty, and channelled along the axis of the Arm</strong> regardless of the true gradient direction. Expect holes in the lee of the western shore and hard gusts funnelling between the hills. Excellent for learning to read wind; frustrating for racing.</p><p data-lang=\"en\"><strong>Bedford Basin:</strong> large, enclosed, and shielded by hills. Generally lighter than the outer harbour and prone to holes, but flat water — good for skill drills.</p><p data-lang=\"en\"><strong>Outside McNabs Island:</strong> the wind becomes much steadier and stronger, and you meet <strong>ocean swell</strong> for the first time. A boat that felt fine in the Arm feels quite different in a 1.5 m Atlantic swell, and so does the crew. Make your first trip out on a calm, clear day.</p><p data-lang=\"en\"><strong>Other patterns to know:</strong></p><ul><li data-lang=\"en\"><strong>Northerlies and northwesterlies</strong> are usually associated with cold, dry, clear air after a front. They're offshore winds here — which means flat water near shore but strong wind further out, and if you have engine trouble you're being blown away from land.</li><li data-lang=\"en\"><strong>Easterlies and northeasterlies</strong> bring wet, raw, onshore weather. A strong NE brings swell into the harbour approaches and is uncomfortable.</li><li data-lang=\"en\"><strong>Squalls and thunderstorms</strong> in summer can produce brief 40+ knot gusts and sudden 90° shifts. Watch for towering, anvil-topped clouds and darkening skies to the west. If you see a squall line coming: <strong>reef or drop sails, before it arrives</strong>, and take it on a broad reach.</li><li data-lang=\"en\"><strong>Frontal passages are fast.</strong> Nova Scotia sits under an active storm track. Wind can shift 90–180° in an hour as a front passes. A shift like that turns a comfortable sheltered anchorage into an exposed lee shore.</li></ul><p data-lang=\"ua\">Місцеві знання, які досвідчені яхтсмени Галіфаксу мають, а новачки ні:</p><p data-lang=\"ua\"><strong>Південно-західний морський бриз</strong> — літня «робоча кінь». Сонячного літнього дня земля нагрівається швидше за холодний океан; тепле повітря піднімається, і прохолодніше морське повітря надходить на його місце. Результат — надійний <strong>південно-західний вітер, що наростає протягом дня</strong>, найсильніший зазвичай між 14:00 і 18:00, потім слабшає ввечері.</p><p data-lang=\"ua\"><strong>Практичні висновки:</strong></p><ul><li data-lang=\"ua\"><strong>Ранок часто безвітряний.</strong> Хочете вітру — виходьте після обіду. Хочете спокійної води для тренування швартування — виходьте раніше.</li><li data-lang=\"ua\"><strong>Плануйте зворотний відрізок.</strong> Якщо морський бриз наростає до 18 вузлів до 16:00, а ваш дім проти вітру — це довге мокре лавірування додому в кінці втомливого дня. Ідіть <em>проти вітру спочатку</em>, за вітром додому — це найкорисніша планувальна звичка для місцевого режиму.</li></ul><p data-lang=\"ua\"><strong>Особливості Northwest Arm:</strong> затока йде приблизно з північного заходу на південний схід, з крутими берегами, укритими деревами й будинками. Через це вітер там <strong>зсувний, поривчастий і скерований вздовж осі затоки</strong> незалежно від справжнього градієнтного напрямку.</p><p data-lang=\"ua\"><strong>Bedford Basin:</strong> великий, закритий, заслонений пагорбами. Зазвичай слабкіший за зовнішню гавань і схильний до «дірок», але вода рівна — добре для відпрацювання навичок.</p><p data-lang=\"ua\"><strong>За McNabs Island:</strong> вітер стає значно стабільнішим і сильнішим, і ви вперше зустрічаєте <strong>океанську хвилю (swell)</strong>. Судно, яке добре почувалося в Arm, зовсім інакше почувається в атлантичній хвилі 1,5 м, і екіпаж теж. Робіть перший вихід туди спокійного ясного дня.</p><p data-lang=\"ua\"><strong>Інші режими, які варто знати:</strong></p><ul><li data-lang=\"ua\"><strong>Північні й північно-західні</strong> зазвичай пов'язані з холодним сухим ясним повітрям після фронту. Тут це відхідні від берега вітри — тобто рівна вода біля берега, але сильний вітер далі, і при поломці двигуна вас несе від землі.</li><li data-lang=\"ua\"><strong>Східні й північно-східні</strong> приносять вологу, сиру, нагінну погоду.</li><li data-lang=\"ua\"><strong>Шквали і грози</strong> влітку можуть давати короткі пориви понад 40 вузлів і раптові зсуви на 90°. Слідкуйте за високими хмарами з «ковадлом» і темнінням неба на заході. Якщо бачите лінію шквалу: <strong>візьміть риф або спустіть вітрила до того, як він прийде</strong>, і приймайте його на бакштазі.</li><li data-lang=\"ua\"><strong>Фронти проходять швидко.</strong> Нова Шотландія лежить під активним штормовим шляхом. Вітер може змінитись на 90–180° за годину.</li></ul><hr><h3><span data-lang=\"en\">9.5 Hurricanes and post-tropical storms</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Урагани та пост-тропічні шторми</span></h3><p data-lang=\"en\"><strong>The Atlantic hurricane season runs June to November, and the risk to Nova Scotia is concentrated in August, September and October.</strong> Storms that reach here have usually crossed cold water and weakened or transitioned to post-tropical, but they still routinely deliver destructive winds, heavy rain, and large swell. Nova Scotia has a long history of serious storm damage to boats and marinas.</p><p data-lang=\"en\"><strong>As a sailor, your obligations:</strong></p><ol><li data-lang=\"en\"><strong>Watch the tropical forecast from mid-August onward.</strong> The Canadian Hurricane Centre issues tracks and warnings. You typically get <strong>3–5 days of warning</strong> — that's ample time to act, and there is no excuse for being surprised.</li><li data-lang=\"en\"><strong>Know your boat's storm plan before the season</strong>, not when a storm is named. Options: haul out, move to a more sheltered berth, storm-moor with doubled lines, or move the boat entirely. Decide in July which you'll do.</li><li data-lang=\"en\"><strong>Doubled and tripled lines, chafe protection, all sails removed</strong> (a furled headsail left on a forestay in a hurricane will unfurl and destroy itself and possibly the rig), boom lashed, everything removable removed from the deck — dodger, bimini, solar panels, windvane, cushions, jerry cans.</li><li data-lang=\"en\"><strong>Never try to ride out a hurricane aboard.</strong> Boats are replaceable.</li><li data-lang=\"en\"><strong>Never try to outrun one at sea.</strong> Get to shelter early or don't go.</li><li data-lang=\"en\"><strong>Plan for the surge, not just the wind.</strong> Storm surge plus high tide can lift a boat above its pilings or above the dock entirely. This is how boats end up in parking lots.</li><li data-lang=\"en\"><strong>Expect big swell days before and after</strong> the storm itself, even if it passes well offshore. The sailing is unpleasant and the harbour entrance can be dangerous.</li></ol><p data-lang=\"en\"><strong>Practical seasonal advice:</strong> if you crew on other people's boats, <strong>volunteer to help with storm prep.</strong> It's exactly when owners need hands, it makes you welcome all season, and it teaches you more about ground tackle, chafe and line handling than any course. The same applies to the October haul-out.</p><p data-lang=\"ua\"><strong>Сезон атлантичних ураганів триває з червня по листопад, а риск для Нової Шотландії сконцентрований у серпні, вересні й жовтні.</strong> Шторми, що доходять сюди, зазвичай перетнули холодну воду і ослабли або перейшли в пост-тропічні, але вони регулярно приносять руйнівні вітри, сильний дощ і велику хвилю.</p><p data-lang=\"ua\"><strong>Ваші обов'язки як яхтсмена:</strong></p><ol><li data-lang=\"ua\"><strong>Слідкуйте за тропічним прогнозом з середини серпня.</strong> Canadian Hurricane Centre видає траєкторії та попередження. Зазвичай ви маєте <strong>3–5 днів попередження</strong> — цього цілком достатньо, щоб діяти.</li><li data-lang=\"ua\"><strong>Знайте штормовий план для свого судна до сезону</strong>, а не коли шторм уже названий. Варіанти: підняти на берег, перейти на захищенішу стоянку, штормове швартування з подвоєними кінцями, або відвести судно взагалі.</li><li data-lang=\"ua\"><strong>Подвоєні й потроєні кінці, захист від протирання, усі вітрила зняті</strong> (закручений стаксель на форштазі в ураган розкрутиться і знищить себе, а можливо і рангоут), ґік прив'язаний, усе знімне знято з палуби.</li><li data-lang=\"ua\"><strong>Ніколи не пробуйте перечекати ураган на борту.</strong> Судна замінні.</li><li data-lang=\"ua\"><strong>Ніколи не пробуйте втекти від нього в морі.</strong></li><li data-lang=\"ua\"><strong>Плануйте на нагінну хвилю, не лише на вітер.</strong> Штормова нагінна хвиля плюс повний приплив можуть підняти судно вище палів або вище причалу.</li><li data-lang=\"ua\"><strong>Очікуйте велику хвилю за дні до і після</strong> самого шторму, навіть якщо він проходить далеко в морі.</li></ol><hr><h3><span data-lang=\"en\">9.6 Reading the sky</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Читання неба</span></h3><p data-lang=\"en\">Instruments and forecasts are better than folklore, but a sailor who can read the sky notices change before the forecast updates.</p><div class=\"table-wrap\"><table><thead><tr><th>What you see</th><th>What it usually means</th></tr></thead><tbody><tr><td><strong>High wispy cirrus (\"mare's tails\") thickening</strong></td><td>A warm front is approaching, typically 12–24 hours out. Wind and rain coming.</td></tr><tr><td><strong>Halo around sun or moon</strong></td><td>Ice crystals in high cloud — moisture arriving, often precedes a front</td></tr><tr><td><strong>Sky greying and lowering, cloud thickening steadily</strong></td><td>Warm front arriving. Steady rain, wind backing then veering, poor visibility.</td></tr><tr><td><strong>Towering cumulus with sharp edges, growing vertically</strong></td><td>Instability. Showers and squalls likely.</td></tr><tr><td><strong>Anvil-shaped top on a tall cloud</strong></td><td>Mature thunderstorm. <strong>Expect violent gusts and lightning. Act now.</strong></td></tr><tr><td><strong>A dark line of cloud with a ragged base, approaching</strong></td><td>Squall line. <strong>Reduce sail immediately.</strong></td></tr><tr><td><strong>Sharp clearing, cold dry air, gusty NW wind, puffy cumulus</strong></td><td>Cold front has passed. Clearing but gusty and stronger for a while.</td></tr><tr><td><strong>Barometer falling steadily and fast</strong></td><td>Deepening low approaching. The faster the fall, the stronger the wind.</td></tr><tr><td><strong>Barometer falling slowly</strong></td><td>Gradual deterioration</td></tr><tr><td><strong>Barometer rising fast after a low</strong></td><td>Clearing, but often gusty and stronger before it settles</td></tr><tr><td><strong>Warm, humid, hazy, light wind, poor visibility</strong></td><td>Classic Nova Scotia fog conditions. Be careful.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The barometer.</strong> Get a barometer or use your phone's, and read it at fixed times daily. <strong>The rate of change matters far more than the absolute value.</strong> A drop of more than about 1 hPa per hour sustained means a serious system is coming. A drop of 3–5 hPa in three hours means take it seriously and get to shelter.</p><p data-lang=\"ua\">Прилади й прогнози краще за народні прикмети, але яхтсмен, який уміє читати небо, помічає зміну до оновлення прогнозу.</p><p data-lang=\"ua\"><strong>Барометр.</strong> Придбайте барометр або використовуйте телефонний і читайте у фіксований час щодня. <strong>Швидкість зміни значно важливіша за абсолютне значення.</strong> Падіння понад приблизно 1 гПа за годину, що триває, означає, що йде серйозна система. Падіння на 3–5 гПа за три години — ставтесь серйозно і йдіть у укриття.</p><hr><h3>9.7 The go / no-go decision / Рішення «йти / не йти»</h3><p data-lang=\"en\">Write this down and keep it with the boat. The hardest skill in sailing is deciding <em>not</em> to go.</p><p data-lang=\"en\"><strong>Do not go if any of these is true:</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>A <strong>Small Craft Warning</strong> or worse is in effect.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Wind or gusts are above your demonstrated ability, with your current crew.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fog</strong> is present or forecast, and you don't have the equipment and skill for it.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Thunderstorms are forecast for your window.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>A front is due to pass during your trip.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Any required safety equipment is missing or expired.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You haven't told anyone ashore where you're going.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The engine is unreliable, and the conditions require it as a backup.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anyone aboard is unwell, exhausted, or has been drinking.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>You have a bad feeling about it.</strong> Experienced sailors respect this. It is usually your brain integrating things you haven't consciously noticed.</span></label></li></ul><p data-lang=\"en\"><strong>The sentence to keep in mind:</strong></p><blockquote class=\"callout\"><p><strong>\"The sea will still be there tomorrow. The decision to go is always optional; the decision to come back is not.\"</strong></p><p data-lang=\"ua\"><strong>«Море буде і завтра. Рішення вийти завжди опційне; рішення повернутися — ні.»</strong></p></blockquote><p>There is no such thing as a wasted no-go decision. Every experienced skipper has a list of days they didn't go and regretted nothing.</p><p data-lang=\"ua\">Запишіть це і тримайте разом із судном. Найважчий навик у вітрильному спорті — вирішити <em>не</em> йти.</p><p data-lang=\"ua\"><strong>Не йдіть, якщо справджується хоч одне:</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Діє <strong>Small Craft Warning</strong> або серйозніше.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Вітер або пориви вище вашої підтвердженої здатності з поточним екіпажем.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Є або прогнозується <strong>туман</strong>, а у вас немає обладнання й навику для нього.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Прогнозуються грози на ваш період.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Під час вашого виходу має пройти фронт.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Відсутнє або прострочене будь-яке обов'язкове спорядження безпеки.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви не сказали нікому на берегі, куди йдете.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Двигун ненадійний, а умови вимагають його як резерв.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Хтось на борту хворий, виснажений або випив.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>У вас погане передчуття.</strong> Досвідчені яхтсмени це поважають. Зазвичай це ваш мозок інтегрує те, чого ви свідомо не помітили.</span></label></li></ul><p data-lang=\"ua\">Не існує «марного» рішення не йти. Кожен досвідчений шкіпер має список днів, коли він не пішов, і не жалкує ні про один.</p><hr><h3><span data-lang=\"en\">9.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the specific Environment Canada marine forecast area for your sailing.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly what times is that forecast issued?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which VHF channels carry the Continuous Marine Broadcast?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What wind range is a Small Craft Warning, and what do you do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What Beaufort force is 20 knots, and what does the water look like?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is \"15 gusting 25\" a 25-knot day?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain why Halifax fog forms, and why it doesn't burn off.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which months are worst for fog, and which are best for sailing?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>List the first five things you do if fog catches you.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is shallow water safer than deep water in fog?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the sea breeze pattern, and what planning rule follows from it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you sail upwind first and downwind home?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which months carry hurricane risk in Nova Scotia?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How much warning do you usually get for a hurricane, and what do you do with it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What barometric rate of change should alarm you?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recite three items from your no-go list.</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть конкретну зону морського прогнозу Environment Canada для вашого плавання.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Приблизно в який час виходить цей прогноз?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Які канали VHF передають Continuous Marine Broadcast?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який діапазон вітру у Small Craft Warning і що ви робите?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який бал Бофорта відповідає 20 вузлам і як виглядає вода?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому «15 з поривами 25» — це день на 25 вузлів?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, чому утворюється туман Галіфаксу і чому він не вигорає.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які місяці найгірші щодо туману і які найкращі для плавання?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Перелічіть перші п'ять дій, якщо туман застав вас.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому мілка вода в тумані безпечніша за глибоку?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який режим морського бризу і яке правило планування з нього випливає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому варто йти проти вітру спочатку, а за вітром додому?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які місяці несуть риск ураганів у Новій Шотландії?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Скільки попередження зазвичай є про ураган і що з ним робити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка швидкість зміни барометра має вас насторожити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть три пункти зі свого списку «не йти».</span></label></li></ul><hr>"}, "m10": {"t_en": "10 · Charts & navigation", "t_ua": "Карти та навігація", "html": "<h2>Module 10 — Charts, Tides &amp; Navigation</h2><h2 data-lang=\"ua\">Модуль 10 — Карти, припливи та навігація</h2><p><strong>Study time / Час: ~4 hours + ongoing</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Navigation is how you know where you are and where the rocks are. Modern GPS makes it feel unnecessary — right up to the moment your GPS fails, or you're in fog with a flat battery, and then it is the only thing that matters. This module is the foundation of the shore-based <strong>Coastal Navigation</strong> course, which is the best thing you can do with a Halifax winter.</p><p data-lang=\"ua\">Навігація — це те, як ви знаєте, де ви і де каміння. Сучасний GPS робить її наче непотрібною — рівно до моменту, коли GPS відмовляє, або ви в тумані з розрядженим акумулятором, і тоді це єдине, що має значення. Цей модуль — основа берегового курсу <strong>Coastal Navigation</strong>, який є найкращим використанням зими в Галіфаксі.</p></blockquote><hr><h3><span data-lang=\"en\">10.1 Charts and what's on them</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Карти і що на них</span></h3><p data-lang=\"en\">A nautical chart is not a map. A map shows the land; a chart shows the <strong>water</strong> — depths, hazards, aids to navigation, seabed type, and tidal information. Canadian charts are published by the <strong>Canadian Hydrographic Service (CHS)</strong>, part of Fisheries and Oceans Canada.</p><p data-lang=\"en\"><strong>Charts you'll want for Halifax:</strong> the harbour chart covering Halifax Harbour and the Northwest Arm, plus the approaches chart covering the outer harbour and offshore approaches. In the CHS catalogue these are in the 4200-series — the Halifax Harbour chart is commonly <strong>4237</strong> and the approaches chart <strong>4201</strong>. <strong>Verify the current chart numbers and editions with a chart dealer or the CHS catalogue</strong> before buying; numbering and coverage do get revised, and an out-of-date chart is a hazard, not an economy.</p><p data-lang=\"en\"><strong>Key things to read off a chart:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Symbol / feature</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>Numbers in open water</strong></td><td><strong>Depth</strong>, in metres on modern CHS charts, below chart datum. Always check the units in the title block — older charts may use fathoms or feet.</td></tr><tr><td><strong>Depth contours</strong></td><td>Lines joining equal depths. The 5 m and 10 m contours are your practical safety lines.</td></tr><tr><td><strong>Chart datum</strong></td><td>The reference level depths are measured from — normally <strong>Lower Low Water, Large Tide</strong>, a conservatively low level. So <strong>actual depth is usually chart depth PLUS the tide height.</strong></td></tr><tr><td><strong>Drying heights</strong> (underlined numbers)</td><td>Height the feature dries <em>above</em> chart datum — i.e. it's exposed at low water. Underlined = danger.</td></tr><tr><td><strong><code>+</code> or <code>*</code> symbols with numbers</strong></td><td>Rocks. A rock symbol with a dot means it's always submerged; other forms mean awash or drying.</td></tr><tr><td><strong><code>Wk</code></strong></td><td>Wreck</td></tr><tr><td><strong><code>Obstn</code></strong></td><td>Obstruction</td></tr><tr><td><strong>Buoy symbols with colour and light data</strong></td><td>e.g. <code>Fl G 4s</code> = flashing green every 4 seconds</td></tr><tr><td><strong><code>M</code>, <code>S</code>, <code>R</code>, <code>Co</code>, <code>Wd</code></strong></td><td>Seabed type: Mud, Sand, Rock, Coral, Weed. <strong>Critical for anchoring</strong> — mud and sand hold, rock and weed don't.</td></tr><tr><td><strong>Compass rose</strong></td><td>Shows <strong>true</strong> north and <strong>magnetic</strong> north, with the local variation and the year it was measured</td></tr><tr><td><strong>Anchorage symbol</strong> (an anchor)</td><td>Recognised anchorage</td></tr><tr><td><strong>Cables and pipelines</strong></td><td><strong>Never anchor on these.</strong></td></tr><tr><td><strong>Restricted / prohibited areas</strong></td><td>Naval zones, firing ranges, cable areas</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Paper vs electronic.</strong> Use both. Electronic charts (a plotter, or an app like Navionics on a tablet) are what you'll navigate with day to day — they're faster, they show your position, and they're genuinely safer in most conditions. But:</p><ul><li data-lang=\"en\"><strong>Carry paper charts of your area, and know how to use them.</strong> Electronics fail: batteries die, screens fail in rain, tablets overheat, and a lightning strike or a dunking ends the whole system at once.</li><li data-lang=\"en\"><strong>Electronic charts have errors and gaps</strong>, especially in surveyed detail. Zooming in does not add data that was never surveyed.</li><li data-lang=\"en\"><strong>Never navigate by GPS position alone in rocky water.</strong> Confirm with what you can see: a bearing on a headland, a depth sounder reading, a transit.</li><li data-lang=\"en\"><strong>Learn to plot on paper.</strong> It teaches you to think about where the hazards are, which staring at a moving boat-icon does not.</li></ul><p data-lang=\"ua\">Морська карта — це не мапа. Мапа показує землю; карта показує <strong>воду</strong> — глибини, небезпеки, засоби навігаційного обладнання, тип дна та припливну інформацію. Канадські карти видає <strong>Canadian Hydrographic Service (CHS)</strong>.</p><p data-lang=\"ua\"><strong>Карти для Галіфаксу:</strong> карта гавані, що охоплює гавань Галіфаксу і Northwest Arm, плюс карта підходів. У каталозі CHS це серія 4200 — карта гавані зазвичай <strong>4237</strong>, карта підходів <strong>4201</strong>. <strong>Перевірте актуальні номери і видання в дилера карт або в каталозі CHS</strong> перед покупкою; нумерація і покриття змінюються, а застаріла карта — це небезпека, а не економія.</p><p data-lang=\"ua\"><strong>Головне про глибини:</strong> глибини відраховуються від <strong>датума карти</strong> — зазвичай Lower Low Water, Large Tide, консервативно низького рівня. Отже <strong>фактична глибина зазвичай = глибина з карти ПЛЮС висота припливу.</strong></p><p data-lang=\"ua\"><strong>Папір проти електроніки.</strong> Використовуйте обидва. Але: <strong>майте паперові карти свого району і вмійте ними користуватись.</strong> Електроніка відмовляє. І <strong>ніколи не навігуйте лише за позицією GPS у скелястій воді</strong> — підтверджуйте тим, що бачите: пеленг на мис, показання ехолота, створ.</p><hr><h3><span data-lang=\"en\">10.2 Direction: true, magnetic, compass</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Напрямок: істинний, магнітний, компасний</span></h3><p data-lang=\"en\">Three different norths, and confusing them puts you on rocks.</p><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>True north (T)</strong></td><td>The geographic north pole. What charts are drawn to.</td></tr><tr><td><strong>Magnetic north (M)</strong></td><td>Where a compass needle actually points. Differs from true north by the local <strong>variation</strong>.</td></tr><tr><td><strong>Variation</strong></td><td>The angular difference between true and magnetic north at your location. Printed on the chart's compass rose, with the year and annual rate of change. <strong>In Nova Scotia, variation is significant — roughly 17–18° West</strong> at the time of writing. Verify the current value on a current chart, since it drifts.</td></tr><tr><td><strong>Deviation</strong></td><td>Error caused by the <strong>boat's own</strong> magnetism — engine, keel, electronics, that steel toolbox you left next to the compass. Varies with the boat's heading, and is recorded on a deviation card.</td></tr><tr><td><strong>Compass course</strong></td><td>What you actually steer, after applying both variation and deviation.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Conversion — the classic mnemonics:</strong></p><blockquote class=\"callout\"><p><strong>\"True Virgins Make Dull Companions\"</strong> — <strong>T</strong>rue → <strong>V</strong>ariation → <strong>M</strong>agnetic → <strong>D</strong>eviation → <strong>C</strong>ompass (going <em>from</em> chart <em>to</em> compass: <strong>add West</strong> errors)</p><p><strong>\"Can Dead Men Vote Twice\"</strong> — <strong>C</strong>ompass → <strong>D</strong>eviation → <strong>M</strong>agnetic → <strong>V</strong>ariation → <strong>T</strong>rue (going <em>from</em> compass <em>to</em> chart: <strong>subtract West</strong> errors)</p></blockquote><p><strong>The rule:</strong> <strong>West is best (add), East is least (subtract)</strong> — when converting from True to Compass. Reverse it going the other way.</p><p><strong>Worked example for Halifax.</strong> Your chart shows a course of <strong>090° True</strong>. Local variation is <strong>18° W</strong>. Your compass has <strong>2° E</strong> deviation on this heading.</p><div class=\"pre-wrap\"><pre>  True course              090° T\n  + Variation 18° W        +18       (West is best — add)\n  = Magnetic course        108° M\n  − Deviation 2° E          −2       (East is least — subtract)\n  = Compass course         106° C    ← this is what you steer</pre></div><p data-lang=\"en\"><strong>Practical reality:</strong> most cruising sailors work in <strong>magnetic</strong> throughout, because their plotter, hand-bearing compass and steering compass are all magnetic, and modern plotters can be set to display magnetic. That's fine and it's what you'll do day to day. But you must understand the conversion, because <strong>it's on the exam, the chart is in true, and one day you'll be plotting a bearing on paper in a hurry.</strong></p><p data-lang=\"ua\">Три різні «півночі», і плутанина між ними садить вас на камені.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Термін</th><th>Значення</th></tr></thead><tbody><tr><td><strong>Істинна північ (T)</strong></td><td>Географічний полюс. До неї креслять карти.</td></tr><tr><td><strong>Магнітна північ (M)</strong></td><td>Куди насправді показує стрілка компаса. Відрізняється від істинної на місцеве <strong>магнітне відхилення (variation)</strong>.</td></tr><tr><td><strong>Variation (магнітне відхилення)</strong></td><td>Кутова різниця між істинною і магнітною північчю у вашому місці. Надрукована на картушці карти. <strong>У Новій Шотландії воно значне — приблизно 17–18° W</strong> на час написання. Перевірте актуальне значення на актуальній карті.</td></tr><tr><td><strong>Deviation (девіація)</strong></td><td>Похибка від <strong>власного</strong> магнетизму судна — двигун, кіль, електроніка. Змінюється з курсом, записується в таблицю девіації.</td></tr><tr><td><strong>Компасний курс</strong></td><td>Те, чим ви фактично керуєте, після врахування обох похибок.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Правило:</strong> <strong>West is best (додавай), East is least (віднімай)</strong> — при переході від істинного до компасного. У зворотний бік — навпаки.</p><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">10.3 Tides</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Припливи</span></h3><p data-lang=\"en\">Halifax has a <strong>semi-diurnal tide</strong> — roughly two high waters and two low waters each day, about 12 hours 25 minutes apart, with successive highs of similar height.</p><p data-lang=\"en\"><strong>The tidal range in Halifax is modest: roughly 1.4 m on a mean tide, up to about 2 m on a large tide.</strong> That's gentle compared to the Bay of Fundy on the other side of the province, where the range is among the largest in the world. Halifax's small range is genuinely lucky for a learner — it means tidal height rarely determines whether you can go somewhere, and tidal <em>streams</em> in most of the harbour are weak.</p><p data-lang=\"en\"><strong>But it still matters:</strong></p><ul><li data-lang=\"en\"><strong>Depth.</strong> 1.5 m of tide is the difference between clearing a 1.8 m rock with your 1.5 m keel and hitting it. On a coast as rocky as Nova Scotia's, that's not academic.</li><li data-lang=\"en\"><strong>Current in constrictions.</strong> Tidal streams concentrate where water is squeezed. <strong>In the Narrows</strong> (between the MacKay and Macdonald bridges) the flow is strong enough to shape the seabed, and it will noticeably help or hinder you. A 2-knot current against a 4-knot boat halves your progress.</li><li data-lang=\"en\"><strong>Docking.</strong> Current at a dock matters more than wind for a heavy boat at low speed. Always know which way it's running before you approach.</li><li data-lang=\"en\"><strong>Dock lines.</strong> On a fixed pier, lines set at high water go tight at low water and can leave a boat hanging. On a floating dock, no issue.</li><li data-lang=\"en\"><strong>Anchoring.</strong> You need enough scope for high water and enough depth for low water. Calculate both.</li></ul><p data-lang=\"en\"><strong>Vocabulary:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Flood</strong></td><td>Rising tide, current flowing in</td><td>приплив</td></tr><tr><td><strong>Ebb</strong></td><td>Falling tide, current flowing out</td><td>відплив</td></tr><tr><td><strong>Slack water</strong></td><td>Between flood and ebb; minimal current</td><td>стояча вода</td></tr><tr><td><strong>High water (HW) / Low water (LW)</strong></td><td>The extremes</td><td>повна / мала вода</td></tr><tr><td><strong>Range</strong></td><td>Difference between HW and LW</td><td>амплітуда</td></tr><tr><td><strong>Spring tides</strong></td><td>Largest range; around new and full moon</td><td>сизигійні припливи</td></tr><tr><td><strong>Neap tides</strong></td><td>Smallest range; around first and last quarter</td><td>квадратурні припливи</td></tr><tr><td><strong>Chart datum</strong></td><td>Reference level for charted depths</td><td>нуль глибин</td></tr><tr><td><strong>Set and drift</strong></td><td>Direction and speed of a current</td><td>напрямок і швидкість течії</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The rule of twelfths</strong> (a quick mental approximation of tidal height between HW and LW, assuming a 6-hour tide):</p><div class=\"table-wrap\"><table><thead><tr><th>Hour after HW/LW</th><th>Fraction of range that moves</th></tr></thead><tbody><tr><td>1st hour</td><td>1/12</td></tr><tr><td>2nd hour</td><td>2/12</td></tr><tr><td>3rd hour</td><td>3/12</td></tr><tr><td>4th hour</td><td>3/12</td></tr><tr><td>5th hour</td><td>2/12</td></tr><tr><td>6th hour</td><td>1/12</td></tr></tbody></table></div><p data-lang=\"en\">So the tide moves fastest in the middle two hours and slowest at the turn. Useful for a rough answer without a calculator. For anything where grounding is possible, <strong>use the actual tide tables</strong> from the Canadian Hydrographic Service, not this approximation.</p><p data-lang=\"ua\">У Галіфаксі <strong>напівдобовий приплив</strong> — приблизно дві повні й дві малі води на добу, з інтервалом близько 12 годин 25 хвилин.</p><p data-lang=\"ua\"><strong>Амплітуда припливу в Галіфаксі помірна: приблизно 1,4 м на середньому припливі, до близько 2 м на великому.</strong> Це м'яко порівняно з затокою Фанді на іншому боці провінції, де амплітуда одна з найбільших у світі. Мала амплітуда Галіфаксу справді щастя для новачка.</p><p data-lang=\"ua\"><strong>Але це все одно має значення:</strong></p><ul><li data-lang=\"ua\"><strong>Глибина.</strong> 1,5 м припливу — це різниця між проходом над каменем 1,8 м з вашим кілем 1,5 м і ударом об нього.</li><li data-lang=\"ua\"><strong>Течія у звуженнях.</strong> Припливні течії концентруються там, де вода стиснута. <strong>У Narrows</strong> потік достатньо сильний, щоб формувати дно, і він помітно допоможе або перешкодить вам.</li><li data-lang=\"ua\"><strong>Швартування.</strong> Течія біля причалу важливіша за вітер для важкого судна на малій швидкості.</li><li data-lang=\"ua\"><strong>Швартові кінці.</strong> На нерухомому пірсі кінці, заведені на повній воді, натягуються на малій.</li><li data-lang=\"ua\"><strong>Постановка на якір.</strong> Потрібен достатній запас каната для повної води і достатня глибина для малої.</li></ul><p data-lang=\"ua\"><strong>Правило дванадцятих</strong> — швидка приблизна оцінка висоти припливу: 1/12, 2/12, 3/12, 3/12, 2/12, 1/12 за годинами. Приплив рухається найшвидше в середні дві години і найповільніше на переломі. Для будь-чого, де можлива посадка на мілину, <strong>використовуйте справжні таблиці припливів</strong> CHS, а не це наближення.</p><hr><h3><span data-lang=\"en\">10.4 Position fixing</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Визначення місця</span></h3><p data-lang=\"en\">Four methods, from most to least reliable — and you should be able to use all four.</p><h4>1. GPS</h4><p>Accurate to a few metres and effortless. <strong>Its weakness is total dependence on power and hardware.</strong> Always know your position by a second method well enough to continue if the screen goes dark. Write your position in the log every hour on a passage — that habit alone converts a GPS failure from an emergency into an inconvenience.</p><h4>2. Visual bearings — the three-point fix</h4><p>The classic. Take compass bearings on <strong>three</strong> identifiable charted objects roughly 60° apart (a lighthouse, a headland, a tower), plot each as a line on the chart, and your position is where they cross.</p><ul><li>Three lines will form a small triangle — the <strong>\"cocked hat\"</strong>. Your position is inside it. A big cocked hat means one of your bearings is bad.</li><li><strong>Assume you are at the corner of the cocked hat nearest the danger.</strong> That's the prudent assumption, always.</li><li>Use a <strong>hand-bearing compass</strong> — a small handheld compass you sight through. Cheap, batteryless, and the most useful navigation instrument you can own after a chart.</li></ul><h4>3. Transits (ranges) — the most accurate, and free</h4><p>When two fixed charted objects line up, one behind
