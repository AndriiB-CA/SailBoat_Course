y-focused instruction from certified instructors</strong> — better teaching than you can give her yourself for the next several years, and no parent-child teaching friction.</li></ol><p data-lang=\"en\"><strong>Practical timing:</strong> youth program registration typically opens in <strong>late winter or early spring</strong> and popular sessions fill. <strong>Ask about summer 2027 in January or February 2027.</strong> Also ask about a <strong>cold-water / capsize-recovery component</strong> — reputable programs cover it, wetsuits are usually required or recommended in Nova Scotia, and you want to know it's addressed.</p><p data-lang=\"ua\"><strong>Це найцінніша рекомендація цього модуля, і час ідеальний: вісім років — це саме вік входу в CANSail.</strong></p><p data-lang=\"ua\">У Галіфаксі відмінні дитячі програми, і вони навчають на <strong>Optimist</strong> — маленьких одномісних човнах, розроблених спеціально для дітей.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Клуб</th><th>Програма</th><th>Вік</th><th>Примітки</th></tr></thead><tbody><tr><td><strong>Dartmouth Yacht Club</strong></td><td><strong>CANSail 1–6</strong></td><td><strong>8–18</strong></td><td>Також програма <strong>«Wetfeet» для 5–8 років</strong>. Навчають на флоті <strong>Optimist і Club 420</strong>. CANSail 3–6 — пн–пт, 9:00–16:00, формат літнього табору. 697 Windmill Rd. Тел. <strong>(902) 468‑6050</strong></td></tr><tr><td><strong>AYC Sailing School</strong> (Armdale YC)</td><td><strong>Junior Sailing</strong>, програма CANSail</td><td><strong>5–18</strong></td><td>На <strong>Northwest Arm</strong> — дуже захищена вода. <strong>Членство в клубі не потрібне для участі</strong>, хоча члени мають знижку</td></tr><tr><td><strong>RNSYS</strong></td><td>Дитячі програми</td><td>—</td><td>Також на Northwest Arm</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>П'ять причин, чому це важливіше, ніж здається:</strong></p><ol><li data-lang=\"ua\"><strong>Вона стане кращою за вас, швидко, і в цьому суть.</strong> Дитина в дінгі отримує миттєвий фізичний зворотний зв'язок — неправильно оцінила порив, і ти перевернувся, безболісно, у човні, розрахованому на це. За одне літо вона розвине справжнє відчуття судна, на яке дорослим на кільових яхтах треба три сезони. Очікуйте, що вже наступної осені вона буде виправляти ваше налаштування вітрил. Дозвольте їй.</li><li data-lang=\"ua\"><strong>Це стає <em>її</em> справою, а не вашим хобі, куди її тягнуть.</strong> Це різниця між дитиною, яка ходить під вітрилами, і дитиною, яку возять. У цьому вся суть.</li><li data-lang=\"ua\"><strong>Це прекрасно вирішує родинну логістику.</strong> Якщо ви з партнером на дорослих курсах у тому ж клубі, де вона в юніорській програмі, <strong>усі ходять під вітрилами в одному місці в один день.</strong></li><li data-lang=\"ua\"><strong>Вона знайде друзів, які ходять під вітрилами</strong> — саме це утримує захоплення в підлітковому віці.</li><li data-lang=\"ua\"><strong>Це структуроване, контрольоване навчання від сертифікованих інструкторів</strong> — краще, ніж ви зможете дати їй самі, і без тертя «батько вчить дитину».</li></ol><p data-lang=\"ua\"><strong>Практично:</strong> реєстрація в дитячі програми зазвичай відкривається <strong>в кінці зими або на початку весни</strong>, і популярні сесії заповнюються. <strong>Питайте про літо 2027 у січні–лютому 2027.</strong> Також запитайте про <strong>компонент холодної води й підняття після перевертання</strong> — гідрокостюми в Новій Шотландії зазвичай обов'язкові або рекомендовані.</p><hr><h3><span data-lang=\"en\">20.6 Designing a trip your family will enjoy</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Похід, який сподобається родині</span></h3><p data-lang=\"en\">The most common mistake is applying your own ambition to a trip with a child aboard. Design for the least experienced, least patient person on the boat.</p><h4>The rules for a first family sail</h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Under 10 knots of wind</strong>, flat water, warm sunny day. Wait for the right day rather than using the day you have off.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>One to two hours maximum.</strong> Genuinely. Shorter than you want.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Sheltered water only</strong> — the Northwest Arm or Bedford Basin. No swell, no fog, no traffic.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Minimal heel.</strong> Heel is what frightens people, and 20° feels catastrophic to someone who doesn't know the boat can't tip over. <strong>Reef early and sail deliberately underpowered</strong> on family trips — you'll go slower and everyone will be happier. Sail flat.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Explain what's about to happen, before it happens.</strong> \"The boat's going to lean over a bit now, that's normal, it can't tip. Watch — I'll show you.\" Narrated heel is fine; surprise heel is terrifying.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>A destination that isn't sailing</strong> — see below.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Turn back the moment anyone stops enjoying it</strong>, with no visible disappointment from you. That last part is the whole trick.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>End while it's still fun.</strong> Leave them wanting more. Every time.</span></label></li></ul><h4><span data-lang=\"en\">The family veto</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Родинне право вето</span></h4><p data-lang=\"en\">Establish this explicitly, out loud, and honour it absolutely:</p><blockquote class=\"callout\"><p><strong>Anyone aboard can say \"I'd like to go back now,\" and we go back. No argument, no persuasion, no sighing, no \"just twenty more minutes.\" Ever.</strong></p><p data-lang=\"ua\"><strong>Будь-хто на борту може сказати «я хочу повернутися», і ми повертаємось. Без суперечок, без переконування, без зітхань, без «ще двадцять хвилин». Ніколи.</strong></p></blockquote><p>The first time you honour that without complaint, you've bought enormous trust. The first time you <em>don't</em>, you've taught your family that their comfort is negotiable against your plans — and they will be reluctant next time. This is the highest-leverage rule in the module.</p><h4><span data-lang=\"en\">Family destinations near Halifax</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Родинні напрямки біля Галіфаксу</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Destination</th><th>Why it works with a child</th></tr></thead><tbody><tr><td><strong>The Northwest Arm</strong></td><td>Home in fifteen minutes from anywhere in it. Sheltered, flat, interesting shoreline, other boats to watch. <strong>This is your default for a year.</strong></td></tr><tr><td><strong>Bedford Basin</strong></td><td>Big, flat, sheltered. Room to let her steer for an hour without hazards.</td></tr><tr><td><strong>McNabs Island</strong></td><td>🌟 <strong>The best family day sail in Halifax.</strong> A provincial park island in the outer harbour with beaches to land on, historic fortifications to explore, and picnic spots. <strong>Crucially, the sailing is transport to an adventure</strong> rather than the point of the day — which is exactly the right structure for an 8-year-old. Check the chart for approaches and anchorages, and pick a settled day.</td></tr><tr><td><strong>Anchoring for a swim and lunch</strong></td><td>Anchor somewhere sheltered, swim (briefly — cold), eat, then sail home. The anchoring and the bucket-of-seawater are the entertainment.</td></tr><tr><td><strong>The waterfront, by water</strong></td><td>Sail past the container terminals and the naval dockyard. Big ships are genuinely thrilling for children — from a safe distance and outside the channel.</td></tr><tr><td><strong>Later: St. Margaret's Bay, Chester, Mahone Bay</strong></td><td>Once she's confident and you're certified. Islands, coves, and villages with ice cream.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The ice cream principle.</strong> It sounds trivial and it is not. If arriving somewhere means something she genuinely wants — a beach, a fort to climb, a shop with ice cream — then the sail is the exciting part of getting there. If arriving means turning around and sailing home, the sail is the whole experience and it has to carry the entire day on its own. Give her a reason to want to arrive.</p><p data-lang=\"ua\"><strong>Правила першого родинного виходу:</strong> ☐ <strong>менше 10 вузлів вітру</strong>, рівна вода, теплий сонячний день (чекайте правильного дня, а не використовуйте той, коли ви вільні) · ☐ <strong>максимум одна-дві години</strong>, справді — коротше, ніж вам хочеться · ☐ <strong>лише захищена вода</strong> — Northwest Arm або Bedford Basin · ☐ <strong>мінімальний крен</strong> (крен — це те, що лякає людей; <strong>беріть риф рано і йдіть свідомо недовантаженими вітром</strong> у родинних виходах — повільніше, зате всі щасливіші) · ☐ <strong>пояснюйте, що зараз станеться, до того як воно станеться</strong> («судно зараз трохи нахилиться, це нормально, перевернутися воно не може — дивись, я покажу»; прокоментований крен нормальний, неочікуваний — жахливий) · ☐ <strong>пункт призначення, який не є плаванням</strong> · ☐ <strong>повертайте в момент, коли комусь перестало бути приємно</strong>, без видимого розчарування з вашого боку · ☐ <strong>закінчуйте, поки ще весело.</strong></p><p data-lang=\"ua\"><strong>Родинне право вето:</strong> встановіть це явно, вголос, і дотримуйтесь абсолютно. Перший раз, коли ви це виконаєте без нарікань, ви купили величезну довіру. Перший раз, коли <em>не</em> виконаєте, ви навчили родину, що їхній комфорт можна торгувати проти ваших планів.</p><p data-lang=\"ua\"><strong>Напрямки:</strong> <strong>Northwest Arm</strong> (додому за п'ятнадцять хвилин; <strong>ваш варіант за замовчуванням на рік</strong>) · <strong>Bedford Basin</strong> (простір, щоб дати їй керувати годину без небезпек) · 🌟 <strong>McNabs Island — найкращий родинний денний вихід у Галіфаксі</strong> (острів-парк з пляжами, історичними фортифікаціями для дослідження, місцями для пікніка; <strong>головне — плавання є транспортом до пригоди</strong>, а не сенсом дня) · <strong>стати на якір для купання й обіду</strong> · <strong>набережна з води</strong> (великі судна справді захоплюють дітей — з безпечної відстані й поза каналом) · <strong>згодом: St. Margaret's Bay, Chester, Mahone Bay.</strong></p><p data-lang=\"ua\"><strong>Принцип мороженого.</strong> Звучить дрібно, але це не так. Якщо прибуття кудись означає щось, чого вона справді хоче — пляж, форт, магазин з мороженим — тоді плавання це захоплива частина шляху туди. Дайте їй причину хотіти прибути.</p><hr><h3><span data-lang=\"en\">20.7 Your partner: co-skipper, not passenger</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Ваш партнер: співшкіпер, а не пасажир</span></h3><p data-lang=\"en\">This section is short and it is not optional.</p><p data-lang=\"en\">Your partner may want to become a genuine sailor, or may be happy to come along and read a book. Both are entirely legitimate choices, and you should not push. <strong>But there is one hard requirement regardless of which they choose:</strong></p><blockquote class=\"callout\"><h4><strong>If you are incapacitated — overboard, injured, unconscious, or violently seasick — your partner must be able to get the boat and your daughter home safely.</strong></h4><h4 data-lang=\"ua\"><strong>Якщо ви недієздатні — за бортом, травмовані, без свідомості або сильно вкачані — ваш партнер мусить зуміти доставити судно й вашу дочку додому в безпеці.</strong></h4></blockquote><p data-lang=\"en\">A skipper who is the single point of failure for a boat carrying a child has built an unsafe system, no matter how skilled that skipper is. This is the scenario nobody practises and it is the one with the worst possible outcome.</p><h4>The minimum competency, whether or not they want to \"learn to sail\"</h4><p>Your partner must be able to, <strong>unprompted and alone</strong>:</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Start and stop the engine</strong>, and put it in gear</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Steer the boat under power</strong>, and get it home or to any dock</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Drop or furl the sails</strong> and secure them</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Send a MAYDAY</strong> on VHF Channel 16 — the <a href=\"#/checklists\" data-nav=\"checklists\">MAYDAY card</a> taped by the radio, read out loud at least once as practice</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Press the MOB button</strong> on the plotter and read a position off it</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Perform a MOB recovery</strong> — stop the boat, get flotation to the person, get back to them</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Locate</strong> PFDs, flares, fire extinguisher, first aid kit, bilge pump and its handle, engine kill switch, and every seacock</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Know the plan</strong> — where you're going, how to get back, who's ashore expecting you</span></label></li></ul><p data-lang=\"en\"><strong>Practise this properly, at least once every season:</strong> you sit down in the cockpit, hands off, and say <em>\"I'm out of action. Take us home.\"</em> Then let them do it, entirely, including the docking. It will be uncomfortable for both of you the first time and it is worth every minute.</p><h4>The much better version</h4><p data-lang=\"en\">Strongly consider having your partner do the <strong>PCOC alongside you</strong> (it's an evening) and <strong>Start Keelboating together</strong>. Two reasons, and the second is the real one:</p><ol><li data-lang=\"en\"><strong>Safety.</strong> Two competent skippers is a fundamentally more robust boat than one skipper and one passenger.</li><li data-lang=\"en\"><strong>It's much more fun, and it lasts.</strong> A shared activity survives; a hobby one person has and the other tolerates does not. The couples who are still sailing together in twenty years are overwhelmingly the ones where both people can sail the boat. If one person is always in charge and the other is always being instructed, resentment accumulates quietly and the boat gets used less every year.</li></ol><p data-lang=\"en\"><strong>And one piece of relationship advice that experienced cruising couples all give:</strong> do not teach your own partner if it goes badly. Pay an instructor. The instructor-student dynamic is corrosive between partners in a way it isn't with a stranger, and \"why did you do it <em>that</em> way\" in front of your daughter is how family sailing dies. Get a third party to do the teaching, and be crew for each other afterwards.</p><p data-lang=\"ua\">Цей розділ короткий і не опційний.</p><p data-lang=\"ua\">Ваш партнер може хотіти стати справжнім яхтсменом, а може бути радий просто бути на борту з книгою. Обидва варіанти цілком легітимні, і тиснути не варто. <strong>Але є одна жорстка вимога незалежно від вибору:</strong> якщо ви недієздатні, партнер мусить зуміти привести судно й дочку додому.</p><p data-lang=\"ua\"><strong>Шкіпер, який є єдиною точкою відмови на судні з дитиною, побудував небезпечну систему</strong>, наскільки б вмілим він не був.</p><p data-lang=\"ua\"><strong>Мінімальна компетентність, самостійно і без підказок:</strong> ☐ запустити й зупинити двигун, включити передачу · ☐ керувати судном під двигуном і привести його додому чи до будь-якого причалу · ☐ спустити або закрутити вітрила · ☐ <strong>передати MAYDAY</strong> на каналі 16 (картка біля станції, прочитана вголос хоча б раз як тренування) · ☐ натиснути кнопку MOB і зчитати позицію · ☐ <strong>виконати підняття людини за бортом</strong> · ☐ <strong>знайти</strong> жилети, фальшфейєри, вогнегасник, аптечку, трюмний насос і його ручку, вимикач двигуна і всі кінгстони · ☐ знати план походу.</p><p data-lang=\"ua\"><strong>Тренуйте це щонайменше раз на сезон:</strong> ви сідаєте в кокпіті, руки геть, і кажете: <em>«Я вийшов зі строю. Веди нас додому.»</em> Далі нехай зроблять усе повністю, включно зі швартуванням.</p><p data-lang=\"ua\"><strong>Значно краща версія:</strong> серйозно розгляньте, щоб партнер зробив <strong>PCOC разом з вами</strong> (це один вечір) і <strong>Start Keelboating разом</strong>. Дві причини, і друга справжня: <strong>безпека</strong> (двоє компетентних шкіперів — принципово надійніше судно) і <strong>це значно цікавіше й довговічніше</strong> (спільне заняття виживає; хобі, яке має одна людина, а інша терпить, — ні. Пари, які через двадцять років все ще ходять під вітрилами разом, — це переважно ті, де обидва вміють керувати судном).</p><p data-lang=\"ua\"><strong>І одна порада щодо стосунків, яку дають усі досвідчені круїзні пари:</strong> не вчіть власного партнера, якщо це йде погано. Заплатіть інструктору. Динаміка «вчитель–учень» руйнівна між партнерами так, як не буває з незнайомцем, а «чому ти зробила це <em>так</em>» на очах у дочки — це те, як гине родинне плавання. Нехай навчає третя сторона, а ви потім будьте екіпажем один для одного.</p><hr><h3><span data-lang=\"en\">20.8 Practical family matters</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Практичні родинні питання</span></h3><h4><span data-lang=\"en\">Seasickness in children</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Морська хвороба в дітей</span></h4><p data-lang=\"en\">Children often <strong>won't say</strong> they feel sick, or won't have the words. Watch for: going quiet, pale, unusually sleepy, yawning, loss of interest, cold hands, or asking to lie down.</p><ul><li data-lang=\"en\"><strong>Medicate before departure</strong>, not after — an hour or more ahead. <strong>Ask a pharmacist or your doctor for paediatric dosing</strong>; do not guess at adult doses or split adult tablets without advice.</li><li data-lang=\"en\"><strong>Keep her on deck, looking at the horizon.</strong> Below is much worse.</li><li data-lang=\"en\"><strong>Give her the helm.</strong> It genuinely works better than medication for mild cases, because it re-syncs vision with motion.</li><li data-lang=\"en\"><strong>Something bland to eat.</strong> An empty stomach is worse than a full one.</li><li data-lang=\"en\"><strong>Keep her warm.</strong> Cold makes it dramatically worse.</li><li data-lang=\"en\"><strong>No reading, no tablet</strong> once she's feeling it — the very thing that cured the boredom now causes the sickness.</li><li data-lang=\"en\"><strong>If she's genuinely sick: put her PFD on and clip her on.</strong> Sick people go to the rail, and people at the rail fall overboard. This is the point at which seasickness becomes a safety issue.</li><li data-lang=\"en\"><strong>Then go home.</strong> Don't push through it with a child. Pushing through teaches her that boats mean feeling awful.</li></ul><h4><span data-lang=\"en\">Sun, cold and clothing</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сонце, холод і одяг</span></h4><ul><li><strong>Children burn faster.</strong> Hat, sunglasses, and real sunscreen reapplied — glare off water doubles the exposure, and Halifax's cool overcast days burn people who never notice.</li><li><strong>Children chill faster.</strong> Layers of <strong>wool or synthetic, never cotton</strong>. Cotton holds water and steals heat.</li><li><strong>A complete spare dry set in a waterproof bag</strong>, always. She will get wet, and a cold wet child ends the day instantly. This one bag has saved more family sails than any other item.</li><li><strong>Proper footwear with grip.</strong> Bare feet on a wet deck is how children fall.</li><li><strong>Sailing gloves in her size</strong> if she's handling lines.</li><li><strong>A warm hat even in summer.</strong> Most heat loss is from the head, and evenings on the water are cold here.</li></ul><h4><span data-lang=\"en\">The head, and other realities</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Гальюн та інші реалії</span></h4><ul><li><strong>A working toilet matters more with a child than any performance feature.</strong> Sort this out; it's not a luxury.</li><li><strong>Show her how it works</strong> and what may not be flushed, before it's urgent.</li><li><strong>Bucket contingency.</strong> Have a plan.</li><li><strong>Motion below</strong> makes changing clothes and using the head hard for a child. Do both at anchor or at the dock when you can.</li></ul><p data-lang=\"ua\"><strong>Морська хвороба в дітей:</strong> діти часто <strong>не скажуть</strong>, що їм погано, або не мають слів. Слідкуйте: замовкла, побліднішала, незвично сонна, зіває, втратила інтерес, холодні руки. <strong>Дайте препарат до виходу</strong>, не після — за годину або більше; <strong>питайте фармацевта або лікаря про дитячі дози</strong>, не вгадуйте і не діліть дорослі таблетки без консультації. <strong>Тримайте на палубі, обличчям до горизонту.</strong> <strong>Дайте їй штурвал</strong> — для легких випадків це працює краще за ліки. Щось нейтральне з'їсти. <strong>Тримайте в теплі.</strong> Ніякого читання й планшета, коли її вже почало вкачувати. <strong>Якщо справді погано — надіньте жилет і пристібніть</strong> (людей з морською хворобою тягне до борту, а люди біля борту падають за борт). <strong>Потім ідіть додому.</strong> Не «продавлюйте» це з дитиною — так вона вивчить, що судно означає почуватися погано.</p><p data-lang=\"ua\"><strong>Сонце, холод, одяг:</strong> діти <strong>швидше згорають</strong> (капелюх, окуляри, крем — відблиск від води подвоює експозицію) · діти <strong>швидше замерзають</strong> (шари <strong>вовни або синтетики, ніколи бавовни</strong>) · <strong>повний запасний сухий комплект у водонепроникному мішку, завжди</strong> (вона намокне, а замерзла мокра дитина миттєво завершує день; цей один мішок врятував більше родинних виходів, ніж будь-що інше) · нормальне взуття з зачепом (босі ноги на мокрій палубі — це те, як діти падають) · рукавички її розміру · <strong>тепла шапка навіть літом</strong>.</p><p data-lang=\"ua\"><strong>Гальюн:</strong> <strong>робочий туалет з дитиною важливіший за будь-яку ходову характеристику.</strong> Покажіть їй, як він працює і що не можна змивати, до того як стане терміново.</p><hr><h3><span data-lang=\"en\">20.9 What not to do</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чого не робити</span></h3><p data-lang=\"en\">The reliable ways to lose your family's interest permanently:</p><div class=\"table-wrap\"><table><thead><tr><th>❌ Don't</th><th>Why</th></tr></thead><tbody><tr><td><strong>Sail in 20 knots \"to toughen them up\"</strong></td><td>It doesn't build resilience; it builds fear. Fear learned young is very hard to unlearn.</td></tr><tr><td><strong>Push through seasickness</strong></td><td>Teaches her that boats mean feeling terrible. Go home.</td></tr><tr><td><strong>Plan a long passage early</strong></td><td>Nothing about a six-hour beat is enjoyable for a beginner of any age.</td></tr><tr><td><strong>Attempt an overnight before day sails are reliably fun</strong></td><td>Sleeping aboard multiplies everything — good and bad.</td></tr><tr><td><strong>Sail overpowered and heavily heeled</strong></td><td>You know the boat can't capsize. They don't, and the feeling is genuinely alarming. <strong>Reef early and sail flat with family aboard.</strong></td></tr><tr><td><strong>Shout</strong></td><td>Even ordinary sailing urgency reads as anger to a child, and to a partner learning. Lower your voice deliberately when things get busy — good skippers get <em>quieter</em> under pressure, not louder.</td></tr><tr><td><strong>Correct your partner's technique in front of your daughter</strong></td><td>Corrosive for both relationships at once.</td></tr><tr><td><strong>Make a child's PFD negotiable</strong></td><td>You will be renegotiating it forever, and one day you'll lose.</td></tr><tr><td><strong>Skip the \"if I'm incapacitated\" plan</strong></td><td>The single highest-consequence omission on a family boat.</td></tr><tr><td><strong>Let sailing become the thing Dad does that everyone accommodates</strong></td><td>The end state is a boat nobody uses. <strong>CANSail for your daughter and Start Keelboating for your partner are the structural fix</strong> — then it's a family activity with three participants, not one enthusiast and two passengers.</td></tr><tr><td><strong>Stay out longer because <em>you're</em> enjoying it</strong></td><td>This is the one that quietly does the most damage, and it's the hardest to resist.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Надійні способи назавжди втратити інтерес родини:</strong> ходити при 20 вузлах, «щоб загартувати» (це будує не стійкість, а страх) · продавлювати морську хворобу · планувати довгий перехід рано · пробувати ночівлю до того, як денні виходи стабільно приємні · ходити перевантаженим вітром з великим креном (<strong>беріть риф рано й ідіть рівно з родиною на борту</strong>) · <strong>кричати</strong> (навіть звичайна вітрильна поспішність читається дитиною як гнів; добрі шкіпери під тиском стають <em>тихішими</em>, не голоснішими) · виправляти техніку партнера на очах у дочки · робити дитячий жилет предметом торгу · пропускати план «якщо я недієздатний» · <strong>дозволити плаванню стати тим, що робить тато, а всі підлаштовуються</strong> (кінцевий стан — судно, яким ніхто не користується; <strong>CANSail для дочки і Start Keelboating для партнера — це структурне виправлення</strong>) · <strong>залишатися довше, бо <em>вам</em> приємно</strong> (це те, що тихо завдає найбільшої шкоди, і найважче втриматись).</p><hr><h3><span data-lang=\"en\">20.10 A realistic family plan</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Реалістичний родинний план</span></h3><div class=\"table-wrap\"><table><thead><tr><th>When</th><th>You</th><th>Your partner</th><th>Your daughter (8→10)</th></tr></thead><tbody><tr><td><strong>Aug–Oct 2026</strong></td><td>PCOC. Crew at races. Start Keelboating.</td><td><strong>PCOC too</strong> — it's one evening. Come on a Try Sailing session.</td><td>A Try Sailing session or a club open day. <strong>Buy her PFD and do the in-water test.</strong> No pressure at all — just let her see boats and meet people.</td></tr><tr><td><strong>Winter 2026/27</strong></td><td>ROC(M), Coastal Navigation. Research boats (<a href=\"#/m19\" data-nav=\"m19\">Module 19</a>).</td><td>Consider ROC(M) as well — a second radio operator is genuinely useful.</td><td><strong>Register for CANSail 1, summer 2027 — book in January or February.</strong></td></tr><tr><td><strong>May–Aug 2027</strong></td><td><strong>Basic Cruising.</strong> Log hours.</td><td><strong>Start Keelboating</strong>, ideally at the same club.</td><td><strong>CANSail 1–2 in an Optimist.</strong> She'll capsize repeatedly and love it.</td></tr><tr><td><strong>Summer 2027</strong></td><td>Family day sails: Northwest Arm → Bedford Basin → <strong>McNabs Island</strong>. Short, flat, sunny, ice cream.</td><td>Crew, then helm. Practise the \"I'm out of action, take us home\" drill once.</td><td>Helm duty. Official lookout. Buoy-spotter. Log-keeper.</td></tr><tr><td><strong>Autumn 2027</strong></td><td><strong>Buy the boat</strong>, or join a co-op.</td><td>Involved in the decision — it has to suit them too.</td><td>Let her come to viewings. Let her have an opinion about the boat.</td></tr><tr><td><strong>Winter 2027/28</strong></td><td>Prepare the boat. Fit <strong>lifeline netting</strong> and a dodger.</td><td>Learn the systems alongside you, not after you.</td><td>Give her a locker and a berth that are <strong>hers</strong>. It matters more than you'd think.</td></tr><tr><td><strong>2028</strong></td><td>Intermediate Cruising. First overnight to Chester.</td><td>Genuinely co-skippering.</td><td><strong>CANSail 3–4.</strong> Probably trimming your sails better than you do, and telling you so.</td></tr><tr><td><strong>2029+</strong></td><td>Mahone Bay and Lunenburg as a family cruise.</td><td>Taking watches.</td><td>Racing her own dinghy, and old enough to take real responsibility aboard.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The measure of success in 2029</strong> isn't your certification level or the boat you own. It's that all three of you can sail, that your daughter has her own sailing life rather than being a passenger in yours, and that when you suggest a weekend on the water, nobody groans.</p><p data-lang=\"ua\"><strong>Міра успіху в 2029 році</strong> — не ваш рівень сертифікації і не судно, яким ви володієте. А те, що всі троє вміють ходити під вітрилами, що у вашої дочки є власне вітрильне життя, а не роль пасажира у вашому, і що коли ви пропонуєте вихідні на воді, ніхто не стогне.</p><hr><h3><span data-lang=\"en\">20.11 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the real measure of a successful family sail?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why do the 1‑10‑1 numbers not apply directly to a child?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>When does a child wear a PFD? Name the exceptions. (There are none.)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Is a child's PFD sized by age or by weight?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a crotch strap essential, and why not an inflatable for a child?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe the PFD lift test, and why \"she'll grow into it\" is dangerous.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why do the in-water PFD test before the season?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name four real jobs an 8-year-old can do aboard.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is helming the best job for a child?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which Halifax clubs run CANSail, and from what age?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give three reasons CANSail matters more than teaching her yourself.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the family veto, and what happens if you break it once?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is McNabs Island a better family destination than a longer sail?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the \"ice cream principle\"?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the eight things your partner must be able to do alone.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you not teach your own partner to sail?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What do you do when a child starts feeling seasick? What do you do next?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What's the one bag that saves family sails?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why reef early with family aboard?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка справжня міра успішного родинного виходу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому числа 1‑10‑1 не застосовуються напряму до дитини?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Коли дитина носить жилет? Назвіть винятки. (Їх немає.)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Дитячий жилет підбирають за віком чи за вагою?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому пахова стропа обов'язкова і чому дитині не надувний жилет?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть тест на підйом жилета і чому «вона доросте» небезпечно.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому робити тест жилета у воді до сезону?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть чотири справжні роботи, які може виконувати 8-річна дитина на борту.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому керування — найкраща робота для дитини?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які клуби Галіфаксу проводять CANSail і з якого віку?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть три причини, чому CANSail важливіший за ваше власне навчання її.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке родинне право вето і що станеться, якщо ви порушите його один раз?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому McNabs Island кращий родинний напрямок, ніж довший перехід?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке «принцип мороженого»?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть вісім речей, які ваш партнер мусить уміти самостійно.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому не варто самому вчити свого партнера ходити під вітрилами?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що робити, коли дитину починає вкачувати? Що робити після цього?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який один мішок рятує родинні виходи?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому брати риф рано, коли родина на борту?</span></label></li></ul><hr><p data-lang=\"en\"><strong>Fair winds, all three of you.</strong></p>"}, "glossary": {"t_en": "Glossary EN ⇄ UA", "t_ua": "Глосарій", "html": "<h2>Bilingual Sailing Glossary — English ⇄ Українська</h2><h2 data-lang=\"ua\">Двомовний словник вітрильних термінів</h2><p data-lang=\"en\">Organised by topic, because that's how you'll need it. The <strong>\"Say it\"</strong> column gives the English pronunciation in Cyrillic for words whose spelling misleads — sailing English is full of these, and mispronouncing them is the fastest way to be misunderstood on a boat.</p><p data-lang=\"ua\">Організовано за темами, бо саме так вам це буде потрібно. Колонка <strong>«Вимова»</strong> дає англійську вимову кирилицею для слів, чиє написання обманює — у вітрильній англійській таких багато, і неправильна вимова — найшвидший спосіб бути незрозумілим на судні.</p><hr><h3><span data-lang=\"en\">1. Directions &amp; orientation</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Напрямки та орієнтація</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Say it</th><th>Українська</th></tr></thead><tbody><tr><td>Bow</td><td>бау</td><td>ніс (судна)</td></tr><tr><td>Stern</td><td>стерн</td><td>корма</td></tr><tr><td>Port</td><td>порт</td><td>лівий борт</td></tr><tr><td>Starboard</td><td>СТА-берд</td><td>правий борт</td></tr><tr><td>Amidships</td><td>а-МІД-шипс</td><td>мідель, середина судна</td></tr><tr><td>Forward / fore</td><td>ФОР-ворд</td><td>вперед, у бік носа</td></tr><tr><td>Aft / abaft</td><td>афт</td><td>у бік корми</td></tr><tr><td>Windward</td><td>ВІНД-ворд</td><td>навітряний (борт)</td></tr><tr><td>Leeward</td><td>ЛУ-ард</td><td>підвітряний (борт)</td></tr><tr><td>Abeam</td><td>а-БІМ</td><td>на траверзі, під 90°</td></tr><tr><td>Ahead / astern</td><td>—</td><td>попереду / позаду, за кормою</td></tr><tr><td>Aloft</td><td>а-ЛОФТ</td><td>наверху, на мачті</td></tr><tr><td>Below</td><td>—</td><td>внизу, в каюті</td></tr><tr><td>On deck</td><td>—</td><td>на палубі</td></tr><tr><td>Topsides</td><td>—</td><td>надводний борт</td></tr><tr><td>Athwartships</td><td>а-ТВОРТ-шипс</td><td>поперек судна</td></tr><tr><td>Outboard / inboard</td><td>—</td><td>назовні / всередину від борту</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">2. Hull &amp; structure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Корпус і конструкція</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Say it</th><th>Українська</th></tr></thead><tbody><tr><td>Hull</td><td>халл</td><td>корпус</td></tr><tr><td>Deck</td><td>дек</td><td>палуба</td></tr><tr><td>Foredeck</td><td>ФОР-дек</td><td>бак, передня палуба</td></tr><tr><td>Cockpit</td><td>КОК-піт</td><td>кокпіт</td></tr><tr>< /td><td>стан моря</td></tr><tr><td>Front</td><td>франт</td><td>фронт</td></tr><tr><td>Low / high (pressure)</td><td>—</td><td>циклон / антициклон</td></tr><tr><td>Barometer</td><td>ба-РОМ-і-тер</td><td>барометр</td></tr><tr><td>Squall line</td><td>—</td><td>лінія шквалу</td></tr><tr><td>Post-tropical storm</td><td>—</td><td>пост-тропічний шторм</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">14. Tides &amp; currents</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Припливи та течії</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Say it</th><th>Українська</th></tr></thead><tbody><tr><td>Tide</td><td>тайд</td><td>приплив/відплив</td></tr><tr><td>Flood / ebb</td><td>флад / еб</td><td>приплив / відплив (течія)</td></tr><tr><td>High water / low water</td><td>—</td><td>повна / мала вода</td></tr><tr><td>Slack water</td><td>слек</td><td>стояча вода</td></tr><tr><td>Range</td><td>рейндж</td><td>амплітуда припливу</td></tr><tr><td>Spring tide</td><td>—</td><td>сизигійний приплив (найбільший)</td></tr><tr><td>Neap tide</td><td>ніп</td><td>квадратурний приплив (найменший)</td></tr><tr><td>Rule of twelfths</td><td>твелфтс</td><td>правило дванадцятих</td></tr><tr><td>Tidal stream</td><td>—</td><td>припливна течія</td></tr><tr><td>Tidal gate</td><td>—</td><td>припливні «ворота»</td></tr><tr><td>Tide table</td><td>—</td><td>таблиця припливів</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">15. Engine &amp; systems</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Двигун і системи</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Say it</th><th>Українська</th></tr></thead><tbody><tr><td>Engine</td><td>ЕН-джин</td><td>двигун</td></tr><tr><td>Inboard / outboard</td><td>—</td><td>стаціонарний / забортний</td></tr><tr><td>Auxiliary</td><td>оґ-ЗІЛ-я-рі</td><td>допоміжний (двигун)</td></tr><tr><td>Propeller / prop</td><td>про-ПЕЛ-ер</td><td>гребний винт</td></tr><tr><td>Prop walk</td><td>—</td><td>відкидання корми винтом</td></tr><tr><td>Ahead / astern / neutral</td><td>—</td><td>передній / задній хід / нейтраль</td></tr><tr><td>Throttle</td><td>ТРОТ-л</td><td>газ, ричаг подачі</td></tr><tr><td>Raw water</td><td>—</td><td>забортна вода (охолодження)</td></tr><tr><td>Coolant</td><td>КУЛ-ант</td><td>охолоджуюча рідина</td></tr><tr><td>Strainer</td><td>СТРЕЙН-ер</td><td>фільтр забортної води</td></tr><tr><td>Fuel filter</td><td>—</td><td>паливний фільтр</td></tr><tr><td>To bleed the fuel system</td><td>блід</td><td>прокачати паливну систему</td></tr><tr><td>Alternator</td><td>ОЛ-тер-нейт-ор</td><td>генератор</td></tr><tr><td>Belt</td><td>белт</td><td>ремінь</td></tr><tr><td>Battery bank</td><td>—</td><td>батарея акумуляторів</td></tr><tr><td>Isolator switch</td><td>—</td><td>роз'єднувач</td></tr><tr><td>Amp-hour</td><td>—</td><td>ампер-година</td></tr><tr><td>Holding tank</td><td>—</td><td>фекальний бак</td></tr><tr><td>Propane / LPG</td><td>ПРО-пейн</td><td>пропан, зріджений газ</td></tr><tr><td>Carbon monoxide (CO)</td><td>—</td><td>монооксид вуглероду</td></tr><tr><td>Winterise</td><td>ВІН-тер-айз</td><td>консервувати на зиму</td></tr><tr><td>Haul-out</td><td>ХОЛ-аут</td><td>підйом на берег</td></tr><tr><td>Launch</td><td>лонч</td><td>спуск на воду</td></tr><tr><td>Antifoul</td><td>ЕН-ті-фаул</td><td>фарба проти обростання</td></tr><tr><td>Anode</td><td>ЕН-оуд</td><td>анод (протикорозійний)</td></tr><tr><td>Survey</td><td>СЕР-вей</td><td>сюрвей, технічна експертиза</td></tr><tr><td>Osmosis</td><td>оз-МОУ-сіс</td><td>осмос (у склопластику)</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">16. Certifications &amp; documents</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сертифікації та документи</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Українська</th></tr></thead><tbody><tr><td>PCOC (Pleasure Craft Operator Card)</td><td>картка оператора прогулянкового судна (обов'язкова)</td></tr><tr><td>PCL (Pleasure Craft Licence)</td><td>ліцензія прогулянкового судна (реєстрація корпусу)</td></tr><tr><td>ROC(M)</td><td>сертифікат радіооператора (морський)</td></tr><tr><td>Sail Canada</td><td>Sail Canada (національна федерація)</td></tr><tr><td>Sail Nova Scotia</td><td>Sail Nova Scotia (провінційна федерація)</td></tr><tr><td>CANSail 1–6</td><td>програма навчання на дінгі</td></tr><tr><td>Start Keelboating</td><td>початковий рівень на кільовій яхті</td></tr><tr><td>Basic Cruising</td><td>базовий круїзний стандарт (шкіпер 6–10 м)</td></tr><tr><td>Intermediate Cruising</td><td>середній круїзний стандарт (9–12 м, чартер)</td></tr><tr><td>Advanced Cruising</td><td>продвинутий стандарт (включно з нічними переходами)</td></tr><tr><td>Offshore</td><td>океанський стандарт</td></tr><tr><td>Coastal Navigation</td><td>прибережна навігація (береговий курс)</td></tr><tr><td>ICC (International Certificate of Competence)</td><td>міжнародний сертифікат компетентності</td></tr><tr><td>Bareboat charter</td><td>бербоут-чартер (яхта без екіпажу)</td></tr><tr><td>Transport Canada</td><td>Transport Canada (федеральне міністерство транспорту)</td></tr><tr><td>CHS (Canadian Hydrographic Service)</td><td>Канадська гідрографічна служба</td></tr><tr><td>MCTS</td><td>служба зв'язку і руху суден Coast Guard</td></tr><tr><td>Canadian Coast Guard</td><td>Канадська берегова охорона</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">17. The most confusing words in sailing English</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Найзаплутаніші слова</span></h3><p data-lang=\"en\"><strong>🇨🇦 EN / 🇺🇦 UA</strong> — These trip up every learner. Learn them deliberately.</p><div class=\"table-wrap\"><table><thead><tr><th>Word</th><th>The confusion</th><th>Resolution</th></tr></thead><tbody><tr><td><strong>Tack</strong></td><td>Three meanings</td><td>(1) the sail's lower forward corner / галсовий кут; (2) which side the wind is on / галс; (3) to turn the bow through the wind / поворот оверштаг</td></tr><tr><td><strong>Sheet</strong></td><td>Not a sail, not fabric</td><td>A <strong>rope</strong> that controls a sail's angle / шкот</td></tr><tr><td><strong>Line vs rope</strong></td><td>Both are \"мотузка\"</td><td>A <strong>line</strong> has a job on the boat; <strong>rope</strong> is the raw material</td></tr><tr><td><strong>Luff</strong></td><td>Noun and verb</td><td>Noun: the sail's leading edge / передня шкаторина. Verb: to flutter, <strong>or</strong> to turn towards the wind</td></tr><tr><td><strong>Draft</strong></td><td>Two meanings</td><td>(1) how deep the boat sits / осадка; (2) the depth of curve in a sail / пузо</td></tr><tr><td><strong>Head</strong></td><td>Three meanings</td><td>(1) the toilet / гальюн; (2) the sail's top corner / топовий кут; (3) \"head to wind\" / у левентик</td></tr><tr><td><strong>Beam</strong></td><td>Two meanings</td><td>(1) the boat's width / ширина; (2) 90° to the side (\"abeam\") / траверз</td></tr><tr><td><strong>Leeward</strong></td><td>Spelling vs sound</td><td>Written \"leeward\", said <strong>\"LOO-ard\"</strong></td></tr><tr><td><strong>Gunwale</strong></td><td>Spelling vs sound</td><td>Written \"gunwale\", said <strong>\"GUN-el\"</strong></td></tr><tr><td><strong>Boatswain</strong></td><td>Spelling vs sound</td><td>Written \"boatswain\", said <strong>\"BOH-sun\"</strong></td></tr><tr><td><strong>Forecastle</strong></td><td>Spelling vs sound</td><td>Written \"forecastle\", said <strong>\"FOKE-sl\"</strong></td></tr><tr><td><strong>Bow</strong></td><td>Homograph</td><td>The front of the boat — rhymes with \"cow\", <strong>not</strong> with \"low\"</td></tr><tr><td><strong>Gybe / jibe</strong></td><td>Two spellings</td><td>Same word. British \"gybe\", American \"jibe\".</td></tr><tr><td><strong>Windward / weather</strong></td><td>Interchangeable</td><td>Both mean the side the wind comes from</td></tr><tr><td><strong>Port</strong></td><td>Two meanings</td><td>(1) left side / лівий борт; (2) a harbour / порт</td></tr><tr><td><strong>Knot</strong></td><td>Two meanings</td><td>(1) speed unit / вузол швидкості; (2) a tied knot / зав'язаний вузол</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">18. Phrases you'll hear constantly</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фрази, які ви чутимете постійно</span></h3><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>English</th><th>Українська</th></tr></thead><tbody><tr><td>\"What tack are we on?\"</td><td>«На якому ми галсі?»</td></tr><tr><td>\"Ease it a bit.\"</td><td>«Трохи потравіть.»</td></tr><tr><td>\"She's overpowered.\"</td><td>«Судно перевантажене вітром.»</td></tr><tr><td>\"Let's put a reef in.\"</td><td>«Візьмемо риф.»</td></tr><tr><td>\"Watch your head — boom coming across.\"</td><td>«Голову! Ґік переходить.»</td></tr><tr><td>\"Keep her in the groove.\"</td><td>«Тримайте в «канавці».»</td></tr><tr><td>\"You're pinching.\"</td><td>«Ви йдете занадто круто.»</td></tr><tr><td>\"Bear away a touch.\"</td><td>«Трохи від вітру.”</td></tr><tr><td>\"Coming about!\"</td><td>«Робимо оверштаг!»</td></tr><tr><td>\"We're being lifted / headed.\"</td><td>«Вітер зайшов на нас / проти нас.»</td></tr><tr><td>\"There's more wind coming.\"</td><td>«Іде більше вітру.»</td></tr><tr><td>\"Fenders and lines ready.\"</td><td>«Кранці й швартові готові.»</td></tr><tr><td>\"One hand for the boat.\"</td><td>«Одна рука для судна.»</td></tr><tr><td>\"Clip on.\"</td><td>«Пристібніться.»</td></tr><tr><td>\"Nice job.\"</td><td>«Добре зроблено.»</td></tr><tr><td>\"Fair winds.\"</td><td>«Попутного вітру.»</td></tr></tbody></table></div><hr>"}, "resources": {"t_en": "Halifax resources", "t_ua": "Ресурси Галіфаксу", "html": "<h2>Appendix A — Halifax Sailing Resources</h2><h2 data-lang=\"ua\">Додаток A — Ресурси для вітрильного спорту в Галіфаксі</h2><blockquote class=\"callout\"><p data-lang=\"en\"><strong>⚠️ Verify everything here before relying on it.</strong> Programs, prices, schedules, and contact details change every season, and this appendix was compiled from public sources rather than by calling each organisation. <strong>Phone or email to confirm.</strong> Where a specific price or date matters to your plan, treat what follows as a starting point for your own research, not as fact.</p><p data-lang=\"ua\"><strong>⚠️ Перевіряйте все тут перед тим, як на це покладатися.</strong> Програми, ціни, розписи та контакти змінюються щосезону, і цей додаток складено з публічних джерел, а не шляхом обзвону кожної організації. <strong>Телефонуйте або пишіть, щоб підтвердити.</strong></p></blockquote><hr><h3><span data-lang=\"en\">A.1 Governing bodies</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Керівні органи</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Organisation</th><th>Role</th><th>Where to look</th></tr></thead><tbody><tr><td><strong>Sail Canada</strong></td><td>National governing body. Publishes the official keelboat/cruising standards, the CANSail dinghy program, and the ROC(M) and PCOC information pages. <strong>The authoritative source for what each certification requires.</strong></td><td>sailing.ca</td></tr><tr><td><strong>Sail Nova Scotia</strong></td><td>Provincial governing body. Coordinates training and lists member clubs and programs across the province, including adult learn-to-sail options. <strong>Start here to find courses.</strong></td><td>sailnovascotia.ca</td></tr><tr><td><strong>Transport Canada</strong></td><td>Federal regulator. Publishes the <strong><em>Safe Boating Guide</em> (TP 511)</strong> — the authority on required safety equipment and boating law — plus the PCOC accredited-provider list and the Pleasure Craft Licence application.</td><td>tc.canada.ca</td></tr><tr><td><strong>CPS‑ECP</strong> (Canadian Power and Sail Squadrons)</td><td>Delivers and examines the <strong>ROC(M)</strong> marine radio certificate on behalf of ISED Canada, and runs boating and navigation courses.</td><td>Tel. <strong>1‑888‑277‑2628</strong></td></tr><tr><td><strong>Canadian Hydrographic Service</strong> (Fisheries and Oceans Canada)</td><td>Charts, <em>Sailing Directions</em>, and tide tables.</td><td>charts.gc.ca</td></tr><tr><td><strong>Canadian Coast Guard / MCTS Halifax</strong></td><td>Marine safety, distress response, Continuous Marine Broadcast, and vessel traffic services.</td><td>VHF Ch 16</td></tr><tr><td><strong>Halifax Port Authority</strong></td><td>Authority over all vessels in the port, commercial and recreational. Publishes the <strong>Marine Safety Handbook</strong> and <strong>Port Information Guide</strong> — worth reading if you sail in the harbour.</td><td>porthalifax.ca</td></tr><tr><td><strong>Boating Safety Infoline</strong> (Transport Canada)</td><td>Ask for the list of accredited PCOC providers, or any boating safety question.</td><td><strong>1‑800‑267‑6687</strong></td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">A.2 Yacht clubs and sailing schools</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Яхт-клуби та школи</span></h3><p data-lang=\"en\">These are the places that teach adults in the Halifax area. Contact several — availability varies, and late-season cancellations are common.</p><h4>Armdale Yacht Club (AYC) / AYC Sailing School</h4><ul><li><strong>Where:</strong> Melville Island, in the <strong>Northwest Arm</strong>. A century-old club in a very sheltered location, which is what makes it good for beginners.</li><li><strong>Programs:</strong> An <strong>Adult &amp; Family Keelboating</strong> program aimed at introducing people to sailing, with the option to be <strong>evaluated and certified under Sail Canada's Start Keelboating</strong> standard (participants 16+). Youth programs from about age 11. Classroom sessions run in winter as well as on-water sessions through summer and fall.</li><li><strong>Membership:</strong> Reportedly <strong>not required</strong> to take part, though <strong>members receive a discount</strong> on program fees. Confirm current arrangements.</li><li><strong>Look for:</strong> aycsailing.ca / aycss.ca, armdaleyachtclub.ns.ca</li><li><strong>Why it's a good first call:</strong> sheltered water, adult-focused program, no membership barrier, and a certification pathway.</li></ul><h4>Royal Nova Scotia Yacht Squadron (RNSYS)</h4><ul><li><strong>Where:</strong> Purcell's Cove Road, on the <strong>Northwest Arm</strong>. One of the oldest yacht clubs in North America.</li><li><strong>Programs:</strong> <strong>Adult programs</strong> (adults only), taught by Sail Canada certified instructors, ranging from short introductory sessions to keelboat courses at basic and intermediate levels, plus learn-to-race coaching. Notably they run a short <strong>\"Try Sailing!\"</strong> introduction — a one-off session covering the basics on a cruise of the Northwest Arm. Separate youth programs.</li><li><strong>Contact:</strong> Main line reported as <strong>(902) 477‑5653</strong>; program enquiries to <strong>sailnow@rnsys.com</strong></li><li><strong>Look for:</strong> rnsys.com/adultsailingprograms</li><li><strong>Why it's a good first call:</strong> the \"Try Sailing\" session is the ideal zero-commitment first step, and they teach both Basic and Intermediate keelboat levels.</li></ul><h4>Dartmouth Yacht Club (DYC)</h4><ul><li><strong>Where:</strong> <strong>Bedford Basin</strong> area, Dartmouth side.</li><li><strong>Programs:</strong> Follows <strong>CANSail and Sail Canada Keelboat</strong> curricula. Classes for adults as well as youth (from about age 5), starting in summer and continuing into fall.</li><li><strong>Racing:</strong> Runs <strong>Wednesday Night Racing</strong> from <strong>May into October</strong>, in three series, on the Basin. Reported as welcoming guests, with <strong>skippers regularly looking for crew</strong> — the club's own guidance is essentially \"meet us at the dock.\" Crew memberships exist and are cheaper than full membership.</li><li><strong>Look for:</strong> dartmouthyachtclub.ca</li><li><strong>Why it matters to you:</strong> <strong>this is your best route to free hours on the water.</strong> Wednesday night racing is the single highest-value thing on this page for a beginner.</li></ul><h4>Bedford Basin Yacht Club</h4><ul><li><strong>Where:</strong> Bedford, at the head of the Basin.</li><li><strong>Character:</strong> Community club on sheltered water.</li><li><strong>Worth contacting</strong> about membership, moorings, and any adult programs.</li></ul><h4>Nova Sail</h4><ul><li><strong>Type:</strong> Private sailing school.</li><li><strong>Programs:</strong> Courses based on the <strong>Sail Canada or IYT</strong> curriculum, with certification from introductory through to advanced levels. Principal instructor reported as Judy Robertson.</li><li><strong>Look for:</strong> novasail.ca</li><li><strong>Why it matters:</strong> private instruction can be more flexible on scheduling than club programs, and IYT is relevant if you plan to charter abroad.</li></ul><h4>In Slocum's Wake Yacht Training</h4><ul><li><strong>Type:</strong> Private yacht training, Halifax.</li><li><strong>Programs:</strong> Accredited sailing courses with licensed instructors, offering sailing certifications.</li><li><strong>Look for:</strong> listed on nauticed.org and other school directories.</li></ul><h4>Saint Mary's Boat Club</h4><ul><li><strong>Where:</strong> Northwest Arm.</li><li><strong>Character:</strong> Community/municipal boating facility on the Arm — worth investigating for accessible small-boat and paddling options.</li></ul><h4><span data-lang=\"en\">Youth &amp; junior programs — for an 8-year-old</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Дитячі програми</span></h4><p data-lang=\"en\">Eight is exactly the entry age for CANSail, Sail Canada's dinghy program. See <a href=\"#/m20\" data-nav=\"m20\">Module 20 §20.5</a> for why this matters more than teaching her yourself.</p><div class=\"table-wrap\"><table><thead><tr><th>Club</th><th>Program</th><th>Ages</th><th>Boats</th><th>Contact</th></tr></thead><tbody><tr><td><strong>Dartmouth Yacht Club</strong></td><td><strong>CANSail 1–6</strong>, plus a <strong>\"Wetfeet\"</strong> program for younger children</td><td><strong>CANSail 8–18</strong>; Wetfeet <strong>5–8</strong></td><td><strong>Optimist</strong> and <strong>Club 420</strong> fleet</td><td>697 Windmill Rd, Dartmouth · <strong>(902) 468‑6050</strong> · admin@dartmouthyachtclub.ca · dartmouthyachtclub.ca</td></tr><tr><td><strong>AYC Sailing School</strong> (Armdale Yacht Club)</td><td><strong>Junior Sailing</strong>, CANSail curriculum, certified instructors</td><td><strong>5–18</strong></td><td>Dinghies, on the sheltered <strong>Northwest Arm</strong></td><td>aycsailing.ca/junior-sailing-programs · <strong>membership not required</strong> to participate (members get a discount)</td></tr><tr><td><strong>Royal Nova Scotia Yacht Squadron</strong></td><td>Youth sailing programs</td><td>—</td><td>Northwest Arm</td><td>rnsys.com/youthsailingprograms · <strong>(902) 477‑5653</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>Timing:</strong> youth registration typically opens in <strong>late winter / early spring</strong> and popular sessions fill. <strong>Ask in January or February</strong> for the following summer. Also ask specifically about the <strong>cold-water and capsize-recovery component</strong>, and whether wetsuits are required or provided — in Nova Scotia they matter.</p><p data-lang=\"ua\">Вісім років — саме вік входу в CANSail, програму Sail Canada для дінгі. Чому це важливіше за ваше власне навчання дочки — див. <a href=\"#/m20\" data-nav=\"m20\">Модуль 20 §20.5</a>.</p><p data-lang=\"ua\"><strong>Час:</strong> реєстрація в дитячі програми зазвичай відкривається <strong>в кінці зими / на початку весни</strong>, і популярні сесії заповнюються. <strong>Питайте в січні–лютому</strong> на наступне літо. Також окремо питайте про <strong>компонент холодної води й підняття після перевертання</strong> і чи потрібні гідрокостюми.</p><hr><h4><span data-lang=\"en\">Buying a boat — where to look</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Купівля судна — де шукати</span></h4><p data-lang=\"en\">Full guidance, prices and a survey checklist in <a href=\"#/m19\" data-nav=\"m19\">Module 19</a>.</p><div class=\"table-wrap\"><table><thead><tr><th>Source</th><th>Good for</th></tr></thead><tbody><tr><td><strong>Yacht club noticeboards and word of mouth</strong></td><td><strong>Start here.</strong> Often the best boats at the best prices, with a <em>knowable</em> maintenance history. A real reason to join a club before you buy.</td></tr><tr><td><strong>Walk the yards in late October</strong></td><td>Boats coming out of the water with \"for sale\" signs, and you can see the whole hull. The best time and place to shop.</td></tr><tr><td><strong>Kijiji</strong> — Halifax / Nova Scotia sailboat sections</td><td>Largest pool of private local listings; very mixed quality</td></tr><tr><td><strong>BoatDealers.ca</strong></td><td>Canadian dealer and private listings</td></tr><tr><td><strong>YachtWorld</strong> (Nova Scotia filter)</td><td>Broker listings, higher-end, well documented</td></tr><tr><td><strong>Ocean Yacht Sales</strong></td><td>Brokerage covering Canada's Atlantic provinces</td></tr><tr><td><strong>Atlantic Yacht Sales</strong></td><td>Nova Scotia brokerage</td></tr><tr><td><strong>Nova Scotia / Maritime sailing Facebook groups</strong></td><td>Where boats get mentioned before they're formally listed</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Services you'll need:</strong> a <strong>marine surveyor</strong> (commonly <strong>$15–30/ft</strong>, so roughly <strong>$450–900</strong> for a 30-footer — engage your <em>own</em>, not the seller's), a <strong>yard for the haul-out</strong> (<strong>$200–600</strong> for a survey haul; AYC publishes yard labour around <strong>$62/hour</strong> with a half-hour minimum), and a <strong>marine insurer</strong> (sailboats commonly <strong>0.75–1.5% of insured value</strong> annually). Ask at the clubs for current recommendations — in a community this size, word of mouth beats online reviews.</p><p data-lang=\"ua\">Повні рекомендації, ціни й чек-лист сюрвею — у <a href=\"#/m19\" data-nav=\"m19\">Модулі 19</a>. <strong>Починайте з дошок об'яв у клубах і сарафанного радіо</strong>, і <strong>пройдіться майданчиками в кінці жовтня</strong>. Далі: Kijiji, BoatDealers.ca, YachtWorld з фільтром НШ, Ocean Yacht Sales, Atlantic Yacht Sales, групи у Facebook. <strong>Потрібні послуги:</strong> морський сюрвейєр (<strong>$15–30/фут</strong>, ~<strong>$450–900</strong> за 30-футове; беріть <em>свого</em>), майданчик для підйому (<strong>$200–600</strong>), морський страховик (<strong>0,75–1,5% від застрахованої вартості</strong> на рік).</p><hr><h4>Beyond Halifax</h4><ul><li><strong>St. Margaret's Bay area</strong> — sailing clubs in the Hubbards and St. Margaret's areas.</li><li><strong>Chester Yacht Club</strong> — Mahone Bay, strong racing and cruising tradition.</li><li><strong>Lunenburg Yacht Club</strong> — Mahone Bay.</li><li><strong>Cape Breton</strong> — clubs on the Bras d'Or Lakes.</li></ul><hr><h3><span data-lang=\"en\">A.3 What to ask when you call</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що питати при зверненні</span></h3><p data-lang=\"en\">A script, so you don't have to compose one. Adapt as needed.</p><blockquote class=\"callout\"><p><em>\"Hello — I'm a complete beginner, based in Halifax, and I'd like to learn to sail properly with the goal of getting Sail Canada certified. I have a few questions:</em></p><ol><li><em>Do you have any spots or cancellations left in adult keelboat courses this season?</em></li><li><em>Can you put me on a waitlist, and when do you open registration for next spring?</em></li><li><em>Do you offer a short introductory or 'try sailing' session?</em></li><li><em>Which Sail Canada standards can I be certified in through you — Start Keelboating, Basic Cruising, Intermediate?</em></li><li><em>Do I need to be a member, and is there a crew or associate membership category?</em></li><li><em>What does it cost, all in?</em></li><li><em>Is there any way to crew on member boats to get hours — racing or cruising?</em></li><li><em>Do you run winter classroom courses — navigation, or the ROC(M) radio certificate?\"</em></li></ol></blockquote><p data-lang=\"ua\">Скрипт, щоб не складати самому:</p><blockquote class=\"callout\"><p data-lang=\"ua\"><em>«Добрий день — я абсолютний новачок з Галіфаксу і хочу навчитися вітрильному спорту як слід, з метою отримати сертифікацію Sail Canada. Кілька питань:</em></p><ol><li data-lang=\"ua\"><em>Чи є вільні місця або відмови на курсах кільових яхт для дорослих цього сезону?</em></li><li data-lang=\"ua\"><em>Чи можна мене в список очікування, і коли відкривається реєстрація на весну?</em></li><li data-lang=\"ua\"><em>Чи є короткий ознайомчий вихід?</em></li><li data-lang=\"ua\"><em>Які стандарти Sail Canada я можу отримати через вас?</em></li><li data-lang=\"ua\"><em>Чи потрібне членство, і чи є категорія crew/associate?</em></li><li data-lang=\"ua\"><em>Скільки це коштує в цілому?</em></li><li data-lang=\"ua\"><em>Чи є можливість ходити екіпажем на суднах членів, щоб набрати години — гонки або круїзи?</em></li><li data-lang=\"ua\"><em>Чи проводите ви зимові аудиторні курси — навігація або ROC(M)?»</em></li></ol></blockquote><hr><h3><span data-lang=\"en\">A.4 Weather, tides &amp; charts</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Погода, припливи та карти</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>What for</th></tr></thead><tbody><tr><td><strong>weather.gc.ca/marine</strong> → <em>Halifax Harbour and Approaches</em></td><td><strong>Your primary forecast.</strong> Issued roughly 4×/day (about 0300, 1000, 1530, 2000). Wind, visibility, sea state, warnings.</td></tr><tr><td><strong>Continuous Marine Broadcast</strong> — VHF <strong>Ch 21B (WX8)</strong> / <strong>Ch 83B (WX9)</strong></td><td>The forecast on the water. Confirm which channel works locally.</td></tr><tr><td><strong>Weatheradio Canada</strong> — VHF WX1–WX7</td><td>Continuous forecasts, English and French.</td></tr><tr><td><strong>Canadian Hydrographic Service</strong> — charts.gc.ca</td><td>Charts, <strong><em>Sailing Directions</em> for Nova Scotia</strong> (essential for coastal cruising), and <strong>tide tables</strong>.</td></tr><tr><td><strong>Halifax Harbour chart</strong></td><td>Commonly <strong>CHS 4237</strong>; approaches commonly <strong>CHS 4201</strong>. <strong>Verify current numbers and editions with a chart dealer.</strong></td></tr><tr><td><strong>Canadian Hurricane Centre</strong></td><td>Tropical storm tracks and warnings — check from mid-August.</td></tr><tr><td><strong>Windy / Windfinder / PredictWind</strong></td><td>Excellent for planning and pattern-spotting. <strong>Not</strong> a substitute for the official forecast and warnings.</td></tr><tr><td><strong>Navionics or equivalent</strong></td><td>Electronic charts on a phone/tablet. Useful; carry paper too.</td></tr><tr><td><strong>Halifax Harbour buoy observations</strong></td><td>Actual current conditions — better than a forecast for \"should I go right now?\"</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">A.5 Local practicalities</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Місцева практика</span></h3><p data-lang=\"en\"></p><p data-lang=\"en\"><strong>Season:</strong> roughly <strong>May (launch) to late October (haul-out)</strong>. August and September are arguably the best sailing months — less fog than June/July, warmest water, reliable sea breeze.</p><p data-lang=\"en\"><strong>Water temperature:</strong> roughly <strong>8–12 °C in June</strong>, peaking around <strong>12–18 °C in July and August</strong>. <strong>Never warm enough to be safe unprotected.</strong> See <a href=\"#/m01\" data-nav=\"m01\">Module 01</a>.</p><p data-lang=\"en\"><strong>Fog:</strong> over 100 days a year of fog or mist, <strong>worst in June and July</strong>.</p><p data-lang=\"en\"><strong>Tides:</strong> semi-diurnal; range roughly <strong>1.4 m mean, up to about 2 m on a large tide</strong>. Modest, but current is significant in <strong>the Narrows</strong>.</p><p data-lang=\"en\"><strong>Prevailing summer wind:</strong> <strong>southwesterly sea breeze</strong>, building through the afternoon, typically strongest 1400–1800.</p><p data-lang=\"en\"><strong>Hurricane season:</strong> risk concentrated <strong>August–October</strong>.</p><p data-lang=\"en\"><strong>VHF:</strong> Ch <strong>16</strong> distress and calling. Halifax vessel traffic commonly on <strong>Ch 12 and Ch 14</strong> — verify locally. CMB weather on <strong>21B / 83B</strong>.</p><p data-lang=\"en\"><strong>Chandleries and marine services:</strong> Halifax has marine supply stores, riggers, sailmakers, surveyors, and boatyards. Ask at the yacht clubs for current recommendations — in a community this size, word of mouth is more reliable than online reviews.</p><p data-lang=\"ua\"></p><p data-lang=\"ua\"><strong>Сезон:</strong> приблизно з <strong>травня (спуск) до кінця жовтня (підйом)</strong>. Серпень і вересень — імовірно найкращі місяці.</p><p data-lang=\"ua\"><strong>Температура води:</strong> приблизно <strong>8–12 °C у червні</strong>, максимум <strong>12–18 °C у липні–серпні</strong>. <strong>Ніколи не досить тепла, щоб бути безпечною без захисту.</strong></p><p data-lang=\"ua\"><strong>Туман:</strong> понад 100 днів на рік, <strong>найгірше в червні й липні</strong>.</p><p data-lang=\"ua\"><strong>Припливи:</strong> напівдобові; амплітуда приблизно <strong>1,4 м середня, до 2 м на великому припливі</strong>. Помірна, але течія значна в <strong>Narrows</strong>.</p><p data-lang=\"ua\"><strong>Переважний літній вітер:</strong> <strong>південно-західний морський бриз</strong>, наростає протягом дня, найсильніший 14:00–18:00.</p><p data-lang=\"ua\"><strong>Сезон ураганів:</strong> риск сконцентрований <strong>серпень–жовтень</strong>.</p><p data-lang=\"ua\"><strong>VHF:</strong> канал <strong>16</strong> — біда і виклик. Рух суден Галіфаксу зазвичай на <strong>каналах 12 і 14</strong> — перевірте локально. Погода CMB на <strong>21B / 83B</strong>.</p><hr><h3><span data-lang=\"en\">A.6 Costs — planning estimates only</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Витрати — лише для планування</span></h3><p data-lang=\"en\">Approximate 2026 Canadian dollars, for budgeting. <strong>Confirm all prices directly.</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Estimate</th></tr></thead><tbody><tr><td>PCOC online course + card</td><td>$40–70</td></tr><tr><td>Try Sailing / intro session</td><td>$50–100</td></tr><tr><td>Start Keelboating course</td><td>$400–700</td></tr><tr><td>Basic Cruising course</td><td>$700–1,200</td></tr><tr><td>Intermediate Cruising course</td><td>$1,200–2,000</td></tr><tr><td>ROC(M) marine radio certificate</td><td>$75–150</td></tr><tr><td>Coastal Navigation (winter, shore-based)</td><td>$250–450</td></tr><tr><td>Club crew / associate membership</td><td>$200–600/yr</td></tr><tr><td>Full club membership</td><td>Varies widely — ask</td></tr><tr><td>Personal gear (spread over time)</td><td>$400–900</td></tr><tr><td><strong>Child's PFD</strong> (foam, crotch strap, head support)</td><td><strong>$50–120</strong></td></tr><tr><td><strong>CANSail junior program</strong>, per session</td><td><strong>$250–600</strong></td></tr><tr><td><strong>Child's sailing gear</strong> — boots, gloves, warm layers, waterproofs</td><td><strong>$200–450</strong></td></tr><tr><td>Chart + tide tables</td><td>$30–80</td></tr><tr><td><strong>Realistic Year 1 total</strong></td><td><strong>$1,500–2,500</strong></td></tr><tr><td>Boat ownership annual running cost</td><td><strong>~10–20% of boat value per year</strong> — full breakdown in <a href=\"#/m19\" data-nav=\"m19\">Module 19 §19.5</a></td></tr><tr><td>Realistic all-in first year on a $30,000 boat</td><td><strong>≈ $40,000–50,000</strong></td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">A.7 Reading list</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Список літератури</span></h3><p data-lang=\"en\"></p><p data-lang=\"en\"><strong>Official and free — read these first:</strong></p><ol><li data-lang=\"en\"><strong><em>Safe Boating Guide</em> (TP 511)</strong>, Transport Canada — <strong>the single most important document.</strong> Free. Authoritative on required equipment and Canadian boating law.</li><li data-lang=\"en\"><strong>Sail Canada's published standards</strong> for each certification level — tells you exactly what you'll be examined on.</li><li data-lang=\"en\"><strong><em>Sailing Directions</em> for Nova Scotia</strong>, CHS — essential before any coastal cruise.</li><li data-lang=\"en\"><strong>Port of Halifax Marine Safety Handbook / Port Information Guide</strong> — if you sail in the harbour.</li></ol><p data-lang=\"en\"><strong>Books worth owning:</strong></p><ol><li data-lang=\"en\"><strong><em>The Annapolis Book of Seamanship</em></strong> — John Rousmaniere. The standard comprehensive reference. If you buy one book, buy this.</li><li data-lang=\"en\"><strong><em>Sailing for Dummies</em></strong> or <strong><em>Start Sailing Right</em></strong> — genuinely good, genuinely simple beginner texts. No shame in either.</li><li data-lang=\"en\"><strong><em>Chapman Piloting &amp; Seamanship</em></strong> — the encyclopaedic North American reference.</li><li data-lang=\"en\"><strong><em>Heavy Weather Sailing</em></strong> — Adlard Coles. For later, and sobering.</li><li data-lang=\"en\"><strong><em>This Old Boat</em></strong> — Don Casey. If you buy a boat.</li><li data-lang=\"en\"><strong><em>Storm Tactics Handbook</em></strong> — Lin and Larry Pardey. For the offshore stage.</li><li data-lang=\"en\">Anything on the history of Nova Scotia schooners and the <em>Bluenose</em> — because you'll sail past that history, and it makes the place mean more.</li></ol><p data-lang=\"ua\"></p><p data-lang=\"ua\"><strong>Офіційне і безкоштовне — читайте перш за все:</strong></p><ol><li data-lang=\"ua\"><strong><em>Safe Boating Guide</em> (TP 511)</strong>, Transport Canada — <strong>найважливіший документ.</strong> Безкоштовно.</li><li data-lang=\"ua\"><strong>Опубліковані стандарти Sail Canada</strong> для кожного рівня сертифікації.</li><li data-lang=\"ua\"><strong><em>Sailing Directions</em> для Нової Шотландії</strong>, CHS — обов'язково перед будь-яким прибережним круїзом.</li><li data-lang=\"ua\"><strong>Marine Safety Handbook порту Галіфакс.</strong></li></ol><p data-lang=\"ua\"><strong>Книги, які варто мати:</strong> <em>The Annapolis Book of Seamanship</em> (Rousmaniere) — якщо купуєте одну книгу, купуйте цю · <em>Sailing for Dummies</em> / <em>Start Sailing Right</em> — справді добрі прості тексти для новачків · <em>Chapman Piloting &amp; Seamanship</em> · <em>Heavy Weather Sailing</em> (Adlard Coles) — на потім · <em>This Old Boat</em> (Don Casey) — якщо купуєте судно · <em>Storm Tactics Handbook</em> (Pardey).</p><hr><h3><span data-lang=\"en\">A.8 Emergency contacts</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Аварійні контакти</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Situation</th><th>Contact</th></tr></thead><tbody><tr><td><strong>Marine distress — life-threatening</strong></td><td><strong>VHF Channel 16</strong> (and press the <strong>DSC distress button</strong> if fitted). This reaches the Canadian Coast Guard <strong>and every vessel in range.</strong></td></tr><tr><td>Marine distress — by phone</td><td><strong>911</strong> (they will connect you to marine SAR)</td></tr><tr><td>Marine urgency (not life-threatening)</td><td><strong>PAN PAN on VHF Ch 16</strong></td></tr><tr><td>Vessel traffic / harbour movements</td><td>Halifax Traffic (MCTS), commonly <strong>VHF Ch 12 / 14</strong> — verify locally</td></tr><tr><td>Pollution report</td><td>Canadian Coast Guard</td></tr><tr><td>Boating safety questions</td><td><strong>1‑800‑267‑6687</strong> (Transport Canada Boating Safety Infoline)</td></tr><tr><td>Weather on the water</td><td><strong>VHF Ch 21B / 83B</strong> (Continuous Marine Broadcast)</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Print this table and tape it inside the boat, next to the radio, along with your MAYDAY card.</strong></p><p data-lang=\"ua\"><strong>Розпечатайте цю таблицю і приклейте всередині судна біля радіостанції, разом з карткою MAYDAY.</strong></p><hr>"}, "checklists": {"t_en": "Checklists", "t_ua": "Контрольні листи", "html": "<h2>Appendix B — Printable Checklists</h2><h2 data-lang=\"ua\">Додаток B — Контрольні листи для друку</h2><p data-lang=\"en\">Print these, laminate them if you can, and keep them aboard. Checklists exist because memory fails under stress and time pressure — that's not a weakness, it's how brains work. Professional mariners and pilots use checklists for exactly this reason.</p><p data-lang=\"ua\">Розпечатайте це, заламінуйте, якщо можете, і тримайте на борту. Контрольні листи існують, бо пам'ять підводить під стресом і в спішці — це не слабкість, це те, як працює мозок. Професійні моряки й пілоти використовують чек-листи саме тому.</p><hr><h3><span data-lang=\"en\">B.1 Pre-departure — every trip</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перед виходом — кожен раз</span></h3><h4><span data-lang=\"en\">Shore-side</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">На берегі</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Marine forecast</strong> checked — wind, gusts, <strong>visibility</strong>, sea state, warnings</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Tide</strong> checked — for departure <strong>and return</strong> time</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Go / no-go decision</strong> made honestly (see <a href=\"#/m09\" data-nav=\"m09\">Module 09 §9.7</a>)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Sail plan filed</strong> — someone ashore knows where, who, when back, and <strong>what to do if you're not</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Phone charged, in a waterproof case</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Warm layers and foul-weather gear aboard, for everyone</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Water and food aboard</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sunscreen, hat, sunglasses</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Seasickness medication taken by anyone who needs it — <strong>an hour before departure</strong></span></label></li></ul><h4><span data-lang=\"en\">Boat</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Судно</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Bilge</strong> checked — dry, or pumped</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Seacocks</strong> in correct positions</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Rigging inspected</strong> — shrouds, stays, turnbuckles, pins, chainplates, gooseneck (see <a href=\"#/m03\" data-nav=\"m03\">Module 03 §3.3</a>)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Sails rigged</strong> — halyards attached, battens in, outhaul rigged</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Sheets led correctly</strong>, outside the shrouds, with <strong>stopper knots in the ends</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Topping lift holding the boom</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fuel</strong> level adequate for the trip <strong>plus a reserve</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Battery</strong> on, voltage adequate</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Engine: WOBBLE</strong> — Water, Oil, Belts, Bolts, Leaks, Electrics</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Raw-water seacock OPEN</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Nothing in the water astern</strong> — no lines, no dinghy painter</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Fenders and docklines ready, departure plan agreed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Winch handles aboard and stowed</span></label></li></ul><h4><span data-lang=\"en\">Safety equipment located and functional</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Спорядження безпеки</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>PFDs</strong> — one per person, correct size, accessible, <strong>and being worn</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Harnesses and tethers, if conditions warrant</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Flares</strong> —
