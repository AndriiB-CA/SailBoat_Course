en\">Anchoring is the major skill Basic Cruising adds beyond day sailing, and it's what lets you actually <em>go</em> somewhere and stay.</p><h4>The procedure</h4><ol><li><strong>Choose the anchorage from the chart.</strong> You need: adequate depth at low water, shelter from the <strong>forecast</strong> wind direction (not the current one), good holding ground, swinging room, and no cables or pipelines.</li><li><strong>Check the seabed type on the chart.</strong> <strong>Mud (M) and sand (S) hold well. Rock (R) and weed (Wd) hold badly.</strong> This one chart symbol determines whether you sleep.</li><li><strong>Approach slowly, into the wind or current</strong>, and stop over your chosen spot.</li><li><strong>Lower the anchor under control</strong> — don't dump the whole chain in a heap, which piles on top of the anchor and prevents it setting. Lower it steadily as the boat drifts back.</li><li><strong>Pay out the correct scope</strong> as you drift or motor gently astern.</li><li><strong>Set the anchor:</strong> once the scope is out, snub the rode and apply gentle reverse throttle. The anchor should dig in and the boat should stop. Feel the rode — a dragging anchor sends a distinctive juddering vibration; a set anchor goes solid and the boat comes up short.</li><li><strong>Confirm it's holding</strong> — take a <strong>transit</strong> on two objects abeam and watch it for several minutes. If they separate, you're dragging.</li><li><strong>Note your position, depth, and time</strong>, and calculate what the depth will be at low water and how the swing will look at high water.</li><li><strong>Show the correct signals</strong> — an all-round white light at night, a black ball forward by day.</li><li><strong>Set an anchor watch</strong> if conditions are marginal, or an anchor alarm on the plotter.</li></ol><h4>Scope — how much rode to let out</h4><blockquote class=\"callout\"><p><strong>Minimum 5:1 in settled conditions. 7:1 or more in strong wind. All-chain rode can use less than rope-and-chain, because the chain's weight helps the pull stay horizontal.</strong></p><p data-lang=\"ua\"><strong>Мінімум 5:1 у спокійних умовах. 7:1 або більше при сильному вітрі.</strong></p></blockquote><p><strong>Scope is measured against the depth at HIGH water, plus your bow height above the water.</strong> Getting this wrong is the classic beginner error: you anchor at low water with 5:1, the tide comes in, and now your effective scope is much less and the anchor pulls upward instead of horizontally — and lifts out.</p><p><strong>Worked example:</strong></p><div class=\"pre-wrap\"><pre>  Depth at low water where you're anchored ......  4 m\n  Tidal range still to come .....................  2 m\n  Height of your bow roller above the water .....  1 m\n  ──────────────────────────────────────────────────────\n  Maximum vertical distance at high water .......  7 m\n  Scope at 5:1  =  7 × 5  .......................  35 m of rode\n  Scope at 7:1  =  7 × 7  .......................  49 m of rode</pre></div><p data-lang=\"en\"><strong>Why anchors hold:</strong> an anchor works by digging into the seabed, and it only digs if the pull on it is close to <strong>horizontal</strong>. Scope is what makes the pull horizontal. Too little scope means an upward pull, and an upward pull lifts the anchor out no matter how good the anchor is. This is why \"let out more chain\" is the answer to almost every anchoring problem.</p><p data-lang=\"en\"><strong>Also:</strong> use a <strong>snubber</strong> (a length of stretchy nylon line, or a rubber snubber, between chain and boat) to absorb shock loads. Chain doesn't stretch, so every wave jerks the anchor. A snubber dramatically improves holding and makes the night much quieter.</p><p data-lang=\"ua\">Постановка на якір — головний навик, який Basic Cruising додає до денних виходів, і саме він дає можливість реально <em>дійти</em> кудись і залишитись.</p><p data-lang=\"ua\"><strong>Процедура:</strong> виберіть місце по карті (глибина на малій воді, укриття від <strong>прогнозованого</strong> вітру, добре дно, місце для розвороту, немає кабелів) → <strong>перевірте тип дна: мул (M) і пісок (S) тримають добре, скеля (R) і водорості (Wd) погано</strong> → підходьте повільно проти вітру → <strong>опускайте якір під контролем</strong>, не кидайте весь ланцюг купою → потравіть правильну довжину → <strong>закріпіть якір</strong>: обтягніть і дайте м'який задній хід; той, що тягнеться, дає характерну вібрацію, а закріплений стає твердо → <strong>підтвердьте створом</strong> на два об'єкти на траверзі → запишіть місце, глибину і час → виставте правильні сигнали → поставте якірну вахту або сигналізацію.</p><p data-lang=\"ua\"><strong>Довжина каната (scope):</strong> <strong>мінімум 5:1 у спокійних умовах, 7:1 або більше при сильному вітрі.</strong> І критично: <strong>міряється від глибини на ПОВНІЙ воді плюс висота вашого носа над водою.</strong> Класична помилка новачка: стати на якір на малій воді з 5:1, приплив прийшов, і тепер ваша фактична довжина значно менша, а якір тягне вгору замість горизонтально — і виривається.</p><p data-lang=\"ua\"><strong>Чому якорі тримають:</strong> якір працює, вгризаючись у дно, і він вгризається лише якщо тяга близька до <strong>горизонтальної</strong>. Довжина каната — це те, що робить тягу горизонтальною. Саме тому «потравіть більше ланцюга» — це відповідь майже на кожну якірну проблему.</p><p data-lang=\"ua\"><strong>Також:</strong> використовуйте <strong>амортизатор</strong> (відрізок пружного нейлонового троса між ланцюгом і судном), щоб поглинати ударні навантаження. Ланцюг не тягнеться, тому кожна хвиля ривком дергає якір.</p><hr><h3><span data-lang=\"en\">15.4 Building the hours</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Набір годин</span></h3><p data-lang=\"en\">The certificate is a threshold, not a destination. What actually makes you a competent skipper is hours, in varied conditions, with responsibility.</p><p data-lang=\"en\"><strong>How to get hours cheaply in Halifax, in order of value:</strong></p><ol><li data-lang=\"en\"><strong>Crew on club races.</strong> Free, weekly, and you sail with people who are much better than you. Dartmouth Yacht Club runs Wednesday-night racing from May into October; other clubs have their own series. Racing teaches sail trim and boat handling faster than any other activity, because you get immediate comparative feedback — the boat next to you is either gaining or losing, and you find out why.</li><li data-lang=\"en\"><strong>Volunteer as crew for deliveries and cruises.</strong> Owners frequently need hands for a passage to Chester or Lunenburg, or for spring/autumn deliveries. Say yes to everything.</li><li data-lang=\"en\"><strong>Help with launch, haul-out, and maintenance.</strong> Not sailing hours, but you learn systems, and you become the person owners invite.</li><li data-lang=\"en\"><strong>Join a sailing club as a crew member.</strong> Crew memberships are far cheaper than full memberships and get you onto the dock where the opportunities are.</li><li data-lang=\"en\"><strong>Look into a sailing co-op or fractional-share program.</strong> Dramatically cheaper than ownership and gets you regular time at the helm rather than on the rail.</li><li data-lang=\"en\"><strong>Charter locally for day sails</strong> once you're certified — it's the cheapest way to be <em>in command</em>, which is a different skill from crewing.</li></ol><p data-lang=\"en\"><strong>The thing nobody tells beginners:</strong> crewing and skippering are different skills. You can crew for five seasons and still be lost the first time you're the one making decisions. <strong>Deliberately seek time in command</strong>, even if it's a small boat on a calm day, because command is what Basic Cruising certifies and what the next level builds on.</p><p data-lang=\"ua\">Сертифікат — це порог, а не пункт призначення. Компетентним шкіпером вас робить кількість годин, у різних умовах, з відповідальністю.</p><p data-lang=\"ua\"><strong>Як набрати годин недорого в Галіфаксі, за цінністю:</strong></p><ol><li data-lang=\"ua\"><strong>Ходіть екіпажем на клубних гонках.</strong> Безкоштовно, щотижня, і ви ходите з людьми, які значно кращі за вас. Гонки вчать налаштуванню вітрил і керуванню швидше за будь-що інше, бо ви отримуєте миттєвий порівняльний зворотний зв'язок.</li><li data-lang=\"ua\"><strong>Ходіть волонтером на перегони суден і круїзи.</strong> Власникам часто потрібні руки для переходу в Chester або Lunenburg.</li><li data-lang=\"ua\"><strong>Допомагайте зі спуском, підйомом і обслуговуванням.</strong> Це не години під вітрилами, але ви вивчаєте системи і стаєте людиною, яку власники запрошують.</li><li data-lang=\"ua\"><strong>Вступіть до клубу як crew member.</strong> Такі членства значно дешевші за повні.</li><li data-lang=\"ua\"><strong>Подивіться на вітрильний кооператив або програму часткової участі.</strong> Значно дешевше за володіння і дає регулярний час за штурвалом, а не на борту.</li><li data-lang=\"ua\"><strong>Беріть чартер локально на денні виходи</strong>, коли сертифіковані — найдешевший спосіб бути <em>у командуванні</em>.</li></ol><p data-lang=\"ua\"><strong>Те, чого новачкам не кажуть:</strong> бути членом екіпажу і бути шкіпером — різні навички. Ви можете ходити екіпажем п'ять сезонів і все одно розгубитися, коли рішення приймаєте ви. <strong>Свідомо шукайте час у командуванні</strong>, навіть на малому судні спокійного дня.</p><hr><h3><span data-lang=\"en\">15.5 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>State exactly what Basic Cruising qualifies you to do.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does \"without coaching\" mean for certification?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What are the two seabed types that hold an anchor well, and two that don't?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is minimum anchoring scope in settled conditions? In strong wind?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Is scope measured from low water or high water depth? Why does it matter?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Calculate the rode needed at 7:1 for 3 m depth at low water, 2 m of tide to come, and a 1 m bow height.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you know an anchor has set, versus dragging?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you check for dragging without instruments?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does a snubber do and why does chain need one?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name three ways to accumulate cheap sailing hours in Halifax.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is crewing not the same skill as skippering?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which items on the §15.2 checklist can you not yet tick?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте точно, на що дає право Basic Cruising.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає «без підказок» для сертифікації?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які два типи дна добре тримають якір і які два погано?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка мінімальна довжина каната в спокійних умовах? При сильному вітрі?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Довжина міряється від глибини малої чи повної води? Чому це важливо?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Розрахуйте канат при 7:1 для глибини 3 м на малій воді, 2 м припливу і висоти носа 1 м.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як зрозуміти, що якір закріпився, а не тягнеться?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як перевірити дрейф без приладів?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що робить амортизатор і чому ланцюгу він потрібен?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три способи набрати недорогі години в Галіфаксі.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому робота в екіпажі — не той самий навик, що шкіперство?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які пункти переліку §15.2 ви ще не можете відзначити?</span></label></li></ul><hr>"}, "m16": {"t_en": "16 · Intermediate Cruising", "t_ua": "Intermediate Cruising", "html": "<h2>Module 16 — Intermediate Cruising: Overnight, Anchoring, Living Aboard</h2><h2 data-lang=\"ua\">Модуль 16 — Intermediate Cruising: нічні стоянки, якір, життя на борту</h2><p><strong>Study time / Час: ~3 hours + 40+ hours on the water</strong></p><blockquote class=\"callout\"><p data-lang=\"en\"><strong>Sail Canada Intermediate Cruising</strong> qualifies you to skipper a 9–12 m sloop with an inboard engine in coastal waters by day, at a level acceptable for <strong>bareboat chartering on extended coastal cruises</strong>. This is the certification that opens the world: it's the level charter companies look for, and the level at which sailing stops being a lesson and becomes travel.</p><p data-lang=\"ua\"><strong>Sail Canada Intermediate Cruising</strong> дає право бути шкіпером шлюпа 9–12 м зі стаціонарним двигуном у прибережних водах вдень, на рівні, прийнятному для <strong>бербоут-чартеру в тривалих прибережних круїзах</strong>. Це сертифікація, що відкриває світ: саме цей рівень шукають чартерні компанії, і саме на цьому рівні вітрильний спорт перестає бути уроком і стає подорожжю.</p></blockquote><hr><h3><span data-lang=\"en\">16.1 What changes from Basic to Intermediate</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що змінюється від Basic до Intermediate</span></h3><p data-lang=\"en\">The jump is bigger than the names suggest. Five things change fundamentally:</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>Basic Cruising</th><th>Intermediate Cruising</th></tr></thead><tbody><tr><td><strong>Boat size</strong></td><td>6–10 m, outboard or inboard</td><td>9–12 m, inboard — heavier, more systems, more momentum</td></tr><tr><td><strong>Duration</strong></td><td>Day sails, familiar waters</td><td><strong>Multi-day passages</strong>, unfamiliar waters</td></tr><tr><td><strong>Sleeping</strong></td><td>Ashore</td><td><strong>Aboard</strong> — anchoring and mooring overnight, in changing conditions</td></tr><tr><td><strong>Systems</strong></td><td>Minimal</td><td>Water, electrical, propane, holding tank, refrigeration, heating — all of which fail</td></tr><tr><td><strong>Responsibility</strong></td><td>Skipper a boat</td><td><strong>Command a crew, over time, including their food, rest, morale, and safety in a place you've never been</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The real difference is time.</strong> A day sail forgives almost everything, because if anything goes wrong you go home. On a five-day cruise, you must manage fatigue, deteriorating weather, food and water, a broken toilet, crew who are cold and grumpy, and decisions whose consequences arrive tomorrow rather than in ten minutes. <strong>Intermediate Cruising is a course in judgement, not in boat handling.</strong></p><p data-lang=\"ua\">Стрибок більший, ніж підказують назви. П'ять речей змінюються фундаментально: розмір судна, тривалість, ночівля на борту, кількість систем, і — головне — характер відповідальності.</p><p data-lang=\"ua\"><strong>Справжня різниця — це час.</strong> Денний вихід прощає майже все, бо якщо щось не так — ви йдете додому. У п'ятиденному круїзі ви мусите керувати втомою, погіршенням погоди, їжею і водою, зламаним гальюном, замерзлим і сварливим екіпажем, і рішеннями, наслідки яких приходять завтра, а не за десять хвилин. <strong>Intermediate Cruising — це курс судження, а не керування судном.</strong></p><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">16.2 Advanced anchoring</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Продвинута постановка на якір</span></h3><p data-lang=\"en\">You learned the basics in <a href=\"#/m15\" data-nav=\"m15\">Module 15</a>. Overnight anchoring in unfamiliar coves — which is exactly what cruising Nova Scotia's South Shore involves — needs more.</p><h4>Choosing an anchorage for the night</h4><p>Assess in this order:</p><ol><li><strong>Shelter from the forecast wind, for the whole night.</strong> Not the current wind. If the forecast has the wind veering from southwest to northwest overnight — which happens constantly here as fronts pass — a cove that's beautifully sheltered at 2000 becomes an exposed lee shore at 0300. <strong>This is the single most common serious anchoring mistake.</strong></li><li><strong>Swinging room.</strong> Your boat will swing through a full circle of radius = your scope. Check what's within that circle at every state of tide: other boats, rocks, the shore, lobster gear.</li><li><strong>Depth at low water.</strong> Calculate it. Don't estimate.</li><li><strong>Holding ground</strong> — mud or sand, from the chart.</li><li><strong>Escape route.</strong> Can you leave in the dark, in the forecast conditions, if you have to? An anchorage you cannot exit at night is a trap.</li><li><strong>Other boats' scope.</strong> A boat anchored on all chain swings differently from one on rope. Anchor well clear, and if you arrive last, you're the one who moves.</li></ol><h4>Techniques beyond a single anchor</h4><ul><li><strong>Two anchors in a V (forked moor)</strong> — reduces swinging room and increases holding for a blow.</li><li><strong>Bahamian moor</strong> — two anchors set 180° apart, so the boat swings in a tight circle with a reversing tidal current. Useful in narrow tidal creeks.</li><li><strong>Anchor plus a stern line ashore</strong> — common in small Nova Scotia coves; keeps you from swinging into the rocks.</li><li><strong>Trip line / anchor buoy</strong> — a line from the anchor's crown to a small float, so you can pull it out backwards if it fouls on rock or an old mooring chain. <strong>Worth using on the Nova Scotia coast</strong>, where the bottom holds a century of fishing gear and old moorings.</li></ul><h4>The anchor watch</h4><ul><li><strong>Set an anchor alarm</strong> on your plotter or phone — it alerts you if the boat moves outside a set radius.</li><li><strong>Take a transit before dark</strong>, and note the bearing and distance to two objects.</li><li><strong>Note the depth</strong> and check it periodically — a change in depth means you've moved.</li><li><strong>In marginal conditions, keep a real watch.</strong> Someone awake, checking every 30 minutes.</li><li><strong>Set an alarm to check at the tide turn</strong>, when the boat swings and loads the anchor from a new direction.</li><li><strong>Have a plan for dragging at 0300 in the rain:</strong> engine ready, a torch to hand, a spare anchor accessible, and everyone knowing their job. Rehearse it verbally before bed.</li></ul><p data-lang=\"ua\">Ви вивчили основи в <a href=\"#/m15\" data-nav=\"m15\">Модулі 15</a>. Нічна стоянка в незнайомих бухтах — а саме це і є круїзинг по Південному узбережжю Нової Шотландії — вимагає більшого.</p><h4 data-lang=\"ua\">Вибір місця для ночівлі</h4><ol><li data-lang=\"ua\"><strong>Укриття від прогнозованого вітру, на всю ніч.</strong> Не від поточного. Якщо прогноз має зсув вітру з південно-західного на північно-західний за ніч — а тут це відбувається постійно з проходом фронтів — бухта, чудово захищена у 20:00, стає відкритим підвітряним берегом у 3:00. <strong>Це найпоширеніша серйозна помилка при постановці на якір.</strong></li><li data-lang=\"ua\"><strong>Місце для розвороту.</strong> Судно опише повне коло радіусом = довжині вашого каната. Перевірте, що в цьому колі при кожному стані припливу.</li><li data-lang=\"ua\"><strong>Глибина на малій воді.</strong> Розрахуйте. Не оцінюйте на око.</li><li data-lang=\"ua\"><strong>Ґрунт</strong> — мул або пісок, за картою.</li><li data-lang=\"ua\"><strong>Шлях відходу.</strong> Чи можете ви вийти в темряві, у прогнозованих умовах, якщо треба? Бухта, з якої не можна вийти вночі, — це пастка.</li><li data-lang=\"ua\"><strong>Довжина каната інших суден.</strong> Ставайте з великим запасом, а якщо прийшли останніми — переміщуєтесь ви.</li></ol><h4 data-lang=\"ua\">Прийоми понад один якір</h4><ul><li data-lang=\"ua\"><strong>Два якорі «V»</strong> — зменшує зону розвороту і збільшує тримання при вітрі.</li><li data-lang=\"ua\"><strong>Багамський спосіб</strong> — два якорі під 180°, щоб судно розвертало по тісному колу при зворотній припливній течії.</li><li data-lang=\"ua\"><strong>Якір плюс кормовий кінець на берег</strong> — поширено в малих бухтах Нової Шотландії.</li><li data-lang=\"ua\"><strong>Трос-вирвач з буйком на якорі</strong> — щоб витягнути якір назад, якщо він зачепився за скелю або старий швартовий ланцюг. <strong>Варто використовувати на узбережжі Нової Шотландії</strong>, де дно містить століття рибальських снастей і старих бочок.</li></ul><h4 data-lang=\"ua\">Якірна вахта</h4><ul><li data-lang=\"ua\"><strong>Встановіть якірну сигналізацію</strong> на плоттері або телефоні.</li><li data-lang=\"ua\"><strong>Візьміть створ до темряви</strong> і запишіть пеленг та відстань до двох об'єктів.</li><li data-lang=\"ua\"><strong>Запишіть глибину</strong> і перевіряйте періодично — зміна глибини означає, що ви зрушили.</li><li data-lang=\"ua\"><strong>У межових умовах тримайте справжню вахту.</strong></li><li data-lang=\"ua\"><strong>Поставте будильник на перелом припливу</strong>, коли судно розвертається і навантажує якір з нового напрямку.</li><li data-lang=\"ua\"><strong>Майте план на випадок дрейфу в 3:00 під дощем:</strong> двигун готовий, ліхтарик під рукою, запасний якір доступний, і всі знають свою роль. Проговоріть це вголос перед сном.</li></ul><hr><h3><span data-lang=\"en\">16.3 Boat systems</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Системи судна</span></h3><p data-lang=\"en\">On a 9–12 m cruising boat you become responsible for a small building's worth of infrastructure. Every one of these will fail eventually, and usually at the least convenient moment.</p><div class=\"table-wrap\"><table><thead><tr><th>System</th><th>What you must know</th><th>Common failure</th></tr></thead><tbody><tr><td><strong>Electrical</strong></td><td>Battery banks (house vs start), the isolator, how to charge, how much you're consuming, how to read a battery monitor</td><td><strong>Flat house battery</strong> — the number one cruising failure. Learn your daily amp-hour consumption and your charging capacity.</td></tr><tr><td><strong>Fresh water</strong></td><td>Tank capacity, the pump, how to conserve, where the filler is</td><td>Pump failure or an empty tank you didn't monitor</td></tr><tr><td><strong>Propane / LPG</strong></td><td>Where the bottle and shut-off are, how to check for leaks, ventilation</td><td><strong>Leak — this is the fire and explosion risk.</strong> LPG is heavier than air and sinks into the bilge. Shut off at the bottle every time.</td></tr><tr><td><strong>Head (toilet) &amp; holding tank</strong></td><td>How it works, what may not be flushed, tank capacity, where to pump out, seacock positions</td><td><strong>Blockage.</strong> Nothing goes in that didn't come out of a person. Not wipes, not paper towel.</td></tr><tr><td><strong>Bilge pumps</strong></td><td>Where the manual and electric pumps are, where the handle is, how to test them</td><td>Blocked strainer, dead float switch</td></tr><tr><td><strong>Engine</strong></td><td>See <a href=\"#/m13\" data-nav=\"m13\">Module 13</a></td><td>Fuel, cooling, belts</td></tr><tr><td><strong>Refrigeration</strong></td><td>Power draw, how to reduce it</td><td>Massive power consumption — often the reason for a flat battery</td></tr><tr><td><strong>Heating</strong></td><td>Operation, ventilation, <strong>carbon monoxide risk</strong></td><td>CO. Never run an unvented heater in a closed cabin.</td></tr><tr><td><strong>Seacocks</strong></td><td><strong>Where every single one is</strong>, and how to close it</td><td>Corrosion or hose failure. Have a soft wooden bung tied at each one.</td></tr><tr><td><strong>Steering</strong></td><td>Cables, quadrant, and the emergency tiller</td><td>Cable failure — know where the emergency tiller is and that it fits</td></tr><tr><td><strong>Ground tackle</strong></td><td>Windlass operation and manual override</td><td>Windlass or breaker failure</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The habit:</strong> on any boat you skipper, on your first day aboard, physically <strong>locate and touch</strong> every seacock, every pump, every shut-off, the battery isolator, the emergency tiller, the flares, and the fire extinguishers. Write them on a card. On a chartered boat this is a formal handover item — insist on it, and don't accept a handover done in five minutes because the previous charterer was late.</p><p data-lang=\"ua\">На круїзній яхті 9–12 м ви стаєте відповідальними за інфраструктуру невеликого будинку. Кожна з цих систем колись відмовить, і зазвичай у найменш зручний момент.</p><p data-lang=\"ua\"><strong>Звичка:</strong> на будь-якому судні, яким ви командуєте, у перший день на борту фізично <strong>знайдіть і торкніться</strong> кожного кінгстона, кожного насоса, кожного вентиля, роз'єднувача акумулятора, аварійного румпеля, фальшфейєрів і вогнегасників. Запишіть їх на картку. На чартерному судні це формальний пункт передачі — вимагайте його і не приймайте передачу за п'ять хвилин.</p><hr><h3><span data-lang=\"en\">16.4 Living aboard and provisioning</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Життя на борту та провізія</span></h3><p data-lang=\"en\">Cruising is mostly domestic logistics, and getting them wrong is what makes crews miserable — and a miserable crew makes bad decisions.</p><p data-lang=\"en\"><strong>Provisioning:</strong></p><ul><li data-lang=\"en\"><strong>Plan meals, then shop.</strong> Not the other way round.</li><li data-lang=\"en\"><strong>Plan for one meal a day being impossible to cook</strong> because of the sea state. Have something that requires no cooking and can be eaten one-handed.</li><li data-lang=\"en\"><strong>Carry more water than you think</strong> — roughly 2–4 litres per person per day for drinking and cooking, plus washing. Water is the resource you cannot improvise.</li><li data-lang=\"en\"><strong>Hot food and hot drinks transform crew morale</strong> in cold, wet conditions far more than the calories justify. A thermos of soup made <em>before</em> it gets rough is worth more than any pep talk.</li><li data-lang=\"en\"><strong>Everything must be stowed for a 30° heel and a slam.</strong> Anything not secured becomes a projectile. Do this before you leave, not when the first wave hits.</li><li data-lang=\"en\"><strong>Nothing glass, if avoidable.</strong></li></ul><p data-lang=\"en\"><strong>Crew management — the part that isn't in the syllabus:</strong></p><ul><li data-lang=\"en\"><strong>Rest is a safety system.</strong> A tired skipper makes bad decisions and cannot be replaced. On anything over a day, sleep is not optional; establish watches and actually keep them.</li><li data-lang=\"en\"><strong>Watch systems:</strong> on a short coastal passage, a rolling 3-hours-on/3-off or 4-on/4-off works. The rule is that off-watch crew genuinely rest.</li><li data-lang=\"en\"><strong>Feed people before they get hungry, and warm them before they get cold.</strong> Both degrade judgement long before anyone complains.</li><li data-lang=\"en\"><strong>Seasickness prevention is a crew-management task</strong>, not a personal failing. Medicate before departure, keep people on deck, give them the helm. See <a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.8</a>.</li><li data-lang=\"en\"><strong>Brief, then delegate.</strong> A crew with jobs is happy; a crew watching the skipper do everything is anxious and useless.</li><li data-lang=\"en\"><strong>Say what you're worried about.</strong> Crews handle known risks far better than a skipper's visible unexplained tension.</li><li data-lang=\"en\"><strong>Have a plan everyone knows.</strong> Uncertainty is what frightens people, not weather.</li></ul><p data-lang=\"en\"><strong>The thing that ends cruises early:</strong> almost never weather or gear failure. It's a crew member who is cold, seasick, frightened, exhausted, or has stopped enjoying it and hasn't been able to say so. <strong>Managing people is the actual skill of a cruising skipper</strong>, and it is the one this course can only point at — you learn it by doing it.</p><p data-lang=\"ua\">Круїзинг — це переважно побутова логістика, і помилки в ній роблять екіпаж нещасним — а нещасний екіпаж приймає погані рішення.</p><p data-lang=\"ua\"><strong>Провізія:</strong></p><ul><li data-lang=\"ua\"><strong>Плануйте меню, потім купуйте.</strong> Не навпаки.</li><li data-lang=\"ua\"><strong>Плануйте на те, що одну їжу на день приготувати буде неможливо</strong> через стан моря. Майте те, що не потребує готування і їсться однією рукою.</li><li data-lang=\"ua\"><strong>Беріть більше води, ніж думаєте</strong> — приблизно 2–4 літри на людину на добу для пиття й готування, плюс миття.</li><li data-lang=\"ua\"><strong>Гаряча їжа й гарячі напої змінюють настрій екіпажу</strong> в холодних мокрих умовах значно сильніше, ніж виправдовують калорії. Термос із супом, зроблений <em>до</em> того, як заштормило, вартий більше за будь-яку промову.</li><li data-lang=\"ua\"><strong>Усе мусить бути закріплено на крен 30° і удар.</strong> Усе незакріплене стає снарядом.</li></ul><p data-lang=\"ua\"><strong>Керування екіпажем — частина, якої немає в програмі:</strong></p><ul><li data-lang=\"ua\"><strong>Відпочинок — це система безпеки.</strong> Втомлений шкіпер приймає погані рішення і його неможливо замінити.</li><li data-lang=\"ua\"><strong>Вахти:</strong> на короткому прибережному переході працює 3 години через 3 або 4 через 4. Правило: підвахтові справді відпочивають.</li><li data-lang=\"ua\"><strong>Годуйте людей до того, як вони зголодніють, і грійте до того, як замерзнуть.</strong> Обидва погіршують судження задовго до того, як хтось поскаржиться.</li><li data-lang=\"ua\"><strong>Профілактика морської хвороби — це задача керування екіпажем</strong>, а не особиста слабкість.</li><li data-lang=\"ua\"><strong>Проінструктуйте, потім делегуйте.</strong> Екіпаж з роботою щасливий; екіпаж, що дивиться, як шкіпер робить усе, тривожний і безкорисний.</li><li data-lang=\"ua\"><strong>Кажіть, що вас турбує.</strong> Екіпажі справляються з відомими рисками значно краще, ніж з видимою незрозумілою напругою шкіпера.</li><li data-lang=\"ua\"><strong>Майте план, який усі знають.</strong> Людей лякає невизначеність, а не погода.</li></ul><p data-lang=\"ua\"><strong>Те, що завершує круїзи раніше строку:</strong> майже ніколи не погода і не поломки. Це член екіпажу, який замерз, укачався, злякався, виснажився або перестав отримувати задоволення і не зміг про це сказати. <strong>Керування людьми — це і є справжня майстерність круїзного шкіпера.</strong></p><hr><h3><span data-lang=\"en\">16.5 Coastal passage making</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Прибережні переходи</span></h3><p data-lang=\"en\">At this level, passages become the point rather than the practice. Additional considerations beyond <a href=\"#/m10\" data-nav=\"m10\">Module 10</a>:</p><ul><li data-lang=\"en\"><strong>Plan around headlands.</strong> Wind and sea are consistently stronger and more confused off a headland: the wind accelerates round it and the seabed shoals, steepening the waves. On the Nova Scotia coast, allow extra margin at every point and cape — <strong>Chebucto Head and Peggys Point deserve real respect</strong> in any wind with south in it.</li><li data-lang=\"en\"><strong>Time your arrival for daylight.</strong> Entering an unfamiliar rocky harbour after dark, tired, is how boats are lost. If you're going to be late, slow down and arrive at dawn, or divert. The passage plan should have arrival timing as a hard constraint, not an outcome.</li><li data-lang=\"en\"><strong>Tidal gates.</strong> Where current is strong, plan to arrive at the right state of tide, not the convenient hour.</li><li data-lang=\"en\"><strong>Watch for lobster gear.</strong> The Nova Scotia coast is dense with lobster buoys and their float lines during the season, and a line around your propeller ends your engine. In gear-heavy areas, motor slowly and post a bow lookout. Know the local season dates.</li><li data-lang=\"en\"><strong>Fog contingency for every leg.</strong> See <a href=\"#/m09\" data-nav=\"m09\">Module 09 §9.3</a>. Every leg needs an answer to \"what do I do if the visibility closes right here?\"</li><li data-lang=\"en\"><strong>Log discipline.</strong> Position, course, speed, weather, and barometer, every hour. If the electronics fail, that log is your position.</li><li data-lang=\"en\"><strong>Real boltholes, verified.</strong> Not \"there's a bay there\" — an actual harbour you have researched, whose entrance you could find at night in a blow.</li></ul><p data-lang=\"ua\">На цьому рівні переходи стають самою метою, а не тренуванням. Додаткові чинники понад <a href=\"#/m10\" data-nav=\"m10\">Модуль 10</a>:</p><ul><li data-lang=\"ua\"><strong>Плануйте з урахуванням мисив.</strong> Вітер і хвиля стабільно сильніші й хаотичніші біля мису: вітер розганяється навколо нього, а дно піднімається, роблячи хвилі крутішими. На узбережжі Нової Шотландії давайте додатковий запас на кожному миси — <strong>Chebucto Head і Peggys Point заслуговують справжньої повагі</strong> при будь-якому вітрі з південною складовою.</li><li data-lang=\"ua\"><strong>Плануйте прибуття на світлий час.</strong> Захід у незнайому скелясту гавань у темряві, втомленим — це те, як гинуть судна.</li><li data-lang=\"ua\"><strong>Припливні «ворота».</strong> Де течія сильна, плануйте прибуття на правильний стан припливу, а не на зручну годину.</li><li data-lang=\"ua\"><strong>Слідкуйте за лобстеровими снастями.</strong> Узбережжя Нової Шотландії щільно заставлене лобстеровими буйками з кінцями в сезон, і кінець на винті завершує роботу двигуна. У насичених районах ідіть повільно і поставте спостерігача на бак.</li><li data-lang=\"ua\"><strong>План на туман для кожного відрізка.</strong></li><li data-lang=\"ua\"><strong>Дисципліна журналу.</strong> Місце, курс, швидкість, погода і барометр, щогодини.</li><li data-lang=\"ua\"><strong>Справжні порти-укриття, перевірені.</strong></li></ul><hr><h3>16.6 Toward Advanced and Offshore / До Advanced і Offshore</h3><p data-lang=\"en\">Beyond Intermediate the ladder continues:</p><p data-lang=\"en\"><strong>Advanced Cruising</strong> adds <strong>night sailing</strong> as its defining element, plus extended coastal passages. Night sailing is a genuinely different discipline:</p><ul><li data-lang=\"en\">Your depth perception and distance judgement largely stop working. Lights are your only information, which is why <a href=\"#/m08\" data-nav=\"m08\">Module 08 §8.3</a> stops being exam material and becomes survival.</li><li data-lang=\"en\"><strong>Preserve night vision.</strong> Red lighting only below and at the chart table; no white torches; dim the plotter right down. It takes 20–30 minutes to recover night vision and one careless white light to destroy it.</li><li data-lang=\"en\"><strong>Watch systems become mandatory</strong>, and so does clipping on — always, at night, without exception.</li><li data-lang=\"en\"><strong>Everything takes longer and feels worse.</strong> Reefing at 0200 in rain is a different task from reefing at noon. This is why you practise it at noon.</li><li data-lang=\"en\">Fatigue management becomes the primary safety system.</li></ul><p data-lang=\"en\"><strong>Offshore</strong> adds passages beyond coastal waters: heavy-weather technique, storm tactics, self-sufficiency, medical autonomy, liferaft and abandon-ship drill, weather routing, and multi-day watch systems. Typically earned on an actual offshore passage with an instructor.</p><p data-lang=\"en\"><strong>Nova Scotia is genuinely excellent for this progression.</strong> You have sheltered water to learn in, real ocean thirty minutes away, a rugged coast that teaches navigation properly, and a serious offshore sailing tradition — Halifax has been a starting point for ocean racing and cruising for well over a century. The step from \"competent coastal skipper\" to \"offshore sailor\" is available to you locally, which is not true in most of the world.</p><p data-lang=\"ua\">За Intermediate драбина продовжується:</p><p data-lang=\"ua\"><strong>Advanced Cruising</strong> додає <strong>нічні переходи</strong> як визначальний елемент, плюс тривалі прибережні переходи. Нічне плавання — справді інша дисципліна:</p><ul><li data-lang=\"ua\">Ваше сприйняття глибини й оцінка відстані практично перестають працювати. Вогні — ваша єдина інформація, і саме тому <a href=\"#/m08\" data-nav=\"m08\">Модуль 08 §8.3</a> перестає бути екзаменаційним матеріалом і стає виживанням.</li><li data-lang=\"ua\"><strong>Зберігайте нічний зір.</strong> Лише червоне освітлення внизу і на штурманському столі; жодних білих ліхтариків; яскравість плоттера на мінімум. Відновлення нічного зору займає 20–30 хвилин, а знищує його один необережний білий вогонь.</li><li data-lang=\"ua\"><strong>Вахти стають обов'язковими</strong>, як і пристібання — завжди, вночі, без винятків.</li><li data-lang=\"ua\"><strong>Усе займає більше часу і відчувається гірше.</strong> Взяти риф у 2:00 під дощем — це інша задача, ніж узяти риф опівдні. Саме тому ви тренуєтесь опівдні.</li></ul><p data-lang=\"ua\"><strong>Offshore</strong> додає переходи за межі прибережних вод: техніка важкої погоди, штормова тактика, автономність, медична самостійність, тренування з рятувальним плотом, погодний роутинг і багатодобові вахти.</p><p data-lang=\"ua\"><strong>Нова Шотландія справді відмінна для цієї прогресії.</strong> У вас є захищена вода для навчання, справжній океан за тридцять хвилин, суворе узбережжя, що вчить навігації як слід, і серйозна традиція океанського плавання. Крок від «компетентного прибережного шкіпера» до «океанського яхтсмена» доступний вам локально, а це неправда для більшої частини світу.</p><hr><h3><span data-lang=\"en\">16.7 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>State what Intermediate Cruising qualifies you to do.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the five things that change fundamentally from Basic to Intermediate.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the most common serious anchoring mistake for an overnight stay?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What must you check within your swinging circle?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is a trip line, and why is it useful on the Nova Scotia coast?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name four elements of a proper anchor watch.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why set an alarm for the tide turn?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the number one cruising system failure, and how do you prevent it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is LPG specifically dangerous on a boat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What should you physically locate on your first day aboard any boat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How much water per person per day?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why does hot food matter more than its calories?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What actually ends most cruises early?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is rest a safety system?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why are headlands more dangerous, and which two near Halifax deserve respect?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why must arrival timing be a hard constraint in a passage plan?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the defining new element of Advanced Cruising?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you preserve night vision, and how long does it take to recover?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте, на що дає право Intermediate Cruising.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять речей, що фундаментально змінюються від Basic до Intermediate.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка найпоширеніша серйозна помилка при постановці на якір на ніч?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що треба перевірити в межах свого кола розвороту?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке трос-вирвач і чому він корисний на узбережжі Нової Шотландії?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть чотири елементи належної якірної вахти.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому ставити будильник на перелом припливу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка відмова систем у круїзингу найпоширеніша і як їй запобігти?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому газ LPG особливо небезпечний на судні?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що треба фізично знайти в перший день на будь-якому судні?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Скільки води на людину на добу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому гаряча їжа важливіша за свої калорії?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що насправді завершує більшість круїзів раніше строку?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому відпочинок — це система безпеки?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому миси небезпечніші і які два біля Галіфаксу заслуговують поваги?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому час прибуття мусить бути жорстким обмеженням у плані переходу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який визначальний новий елемент Advanced Cruising?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як зберігати нічний зір і скільки часу займає його відновлення?</span></label></li></ul><hr>"}, "m17": {"t_en": "17 · Cruising grounds", "t_ua": "Райони плавання", "html": "<h2>Module 17 — Halifax &amp; South Shore Cruising Grounds</h2><h2 data-lang=\"ua\">Модуль 17 — Райони плавання: Галіфакс і Південне узбережжя</h2><p><strong>Study time / Час: ~2 hours + seasons of exploring</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">This is the reward. You live a day's sail from cruising grounds that people fly across the Atlantic to visit. This module is a progression of destinations, from your first hour on the water to a real multi-day cruise.</p><p data-lang=\"en\"><strong>⚠️ Everything here is orientation, not pilotage.</strong> Distances are approximate, and no description of an anchorage or an entrance in this document is adequate for navigation. <strong>Use current charts, the CHS <em>Sailing Directions</em> for Nova Scotia, and local advice for every passage.</strong> The Nova Scotia coast is rocky, and much of it is unforgiving of assumptions.</p><p data-lang=\"ua\">Це і є нагорода. Ви живете за один денний перехід від районів плавання, до яких люди летять через Атлантику. Цей модуль — прогресія напрямків, від першої години на воді до справжнього багатоденного круїзу.</p><p data-lang=\"ua\"><strong>⚠️ Усе тут — орієнтування, а не лоція.</strong> Відстані приблизні, і жоден опис бухти чи входу в цьому документі не є достатнім для навігації. <strong>Використовуйте актуальні карти, CHS <em>Sailing Directions</em> для Нової Шотландії та місцеві поради для кожного переходу.</strong></p></blockquote><hr><h3>17.1 Zone 1 — The Northwest Arm / Зона 1 — Northwest Arm</h3><p data-lang=\"en\"><strong>Your classroom.</strong> A deep, sheltered inlet roughly 3.5 km long and 0.5 km wide, running southeast–northwest right into the city, protected from ocean swell by the Halifax peninsula.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>Distance</strong></td><td>It's your front door</td></tr><tr><td><strong>Conditions</strong></td><td>Flat water, no swell, shifty and gusty wind channelled along the axis</td></tr><tr><td><strong>Traffic</strong></td><td>Recreational only — sailing dinghies, keelboats, rowers, kayakers, paddleboarders</td></tr><tr><td><strong>On the shore</strong></td><td>The Royal Nova Scotia Yacht Squadron and, on Melville Island, the Armdale Yacht Club; Saint Mary's Boat Club; Deadman's Island at the northwestern end</td></tr><tr><td><strong>Best for</strong></td><td>Every early skill: tacking and gybing drills, MOB practice, mooring pickups, docking, reading wind</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Why it's such a good teacher:</strong> the steep, tree- and house-lined shores make the wind shifty and gusty, which forces you to pay attention constantly. A beginner who learns in the Arm develops better wind awareness than one who learns in a steady open-water breeze. Expect holes in the lee of the western shore and hard gusts funnelling between the hills.</p><p data-lang=\"en\"><strong>Watch for:</strong> dense recreational traffic on summer evenings, rowing shells (fast, low, and their crews are facing backwards — <strong>they cannot see you</strong>), swimmers, and moorings.</p><p data-lang=\"ua\"><strong>Ваш навчальний клас.</strong> Глибока захищена затока приблизно 3,5 км довжиною і 0,5 км шириною, що тягнеться з південного сходу на північний захід прямо в місто, захищена від океанської хвилі Галіфакським півостровом.</p><p data-lang=\"ua\"><strong>Чому це такий добрий учитель:</strong> крутих берегів, обсаджених деревами й будинками, роблять вітер зсувним і поривчастим, що змушує вас постійно бути уважними. Новачок, який учиться в Arm, розвиває краще відчуття вітру, ніж той, хто вчиться при стабільному вітрі на відкритій воді.</p><p data-lang=\"ua\"><strong>Слідкуйте за:</strong> щільним рухом прогулянкових суден літніми вечорами, академічними човнами (швидкі, низькі, і їхні екіпажі сидять спиною вперед — <strong>вони вас не бачать</strong>), плавцями і швартовими бочками.</p><hr><h3>17.2 Zone 2 — Bedford Basin &amp; the Narrows / Зона 2 — Bedford Basin і Narrows</h3><p data-lang=\"en\">A very large, deep, enclosed basin at the head of the harbour, connected to the outer harbour by <strong>the Narrows</strong>, the constricted channel between the MacKay and Macdonald bridges.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>Conditions</strong></td><td>Flat, sheltered, often lighter than outside; prone to wind holes</td></tr><tr><td><strong>On the shore</strong></td><td>Dartmouth Yacht Club (Wrights Cove area), Bedford Basin Yacht Club</td></tr><tr><td><strong>Best for</strong></td><td>Flat-water skill drills, and <strong>club racing</strong> — Dartmouth YC runs Wednesday-night racing from May into October</td></tr><tr><td><strong>Hazards</strong></td><td><strong>The Narrows</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The Narrows demands genuine respect.</strong> It is:</p><ul><li data-lang=\"en\"><strong>Constricted</strong> — big ships have minimal room to manoeuvre, and cannot leave the channel.</li><li data-lang=\"en\"><strong>Strongly tidal</strong> — the current here is strong enough to shape the seabed, scouring it down to gravel. It will noticeably help or hinder a 5-knot sailboat.</li><li data-lang=\"en\"><strong>Busy</strong> — it is the route for every commercial and naval vessel going to or from the upper harbour.</li><li data-lang=\"en\"><strong>Bridged</strong> — two bridges, with associated structures and lighting that complicate night navigation.</li></ul><p data-lang=\"en\"><strong>Rules for the Narrows:</strong> transit at slack water or with a fair tide if you can. Stay out of the channel. Know what commercial traffic is moving — listen to Halifax Traffic on the VTS channels <em>before</em> you commit. Never attempt to cross ahead of a ship here. If the tide is against you and the wind is light, use the engine rather than drifting sideways into the channel.</p><p data-lang=\"ua\">Дуже великий, глибокий, закритий басейн у верхів'ї гавані, з'єднаний із зовнішньою гаванню через <strong>Narrows</strong> — звужений канал між мостами MacKay і Macdonald.</p><p data-lang=\"ua\"><strong>Narrows вимагає справжньої поваги.</strong> Він звужений (великі судна мають мінімум місця і не можуть вийти з каналу), з сильною припливною течією (достатньо сильною, щоб формувати дно), завантажений (шлях кожного комерційного й військового судна) і з двома мостами.</p><p data-lang=\"ua\"><strong>Правила для Narrows:</strong> проходьте на стоячій воді або з попутною течією. Тримайтеся поза каналом. Знайте, який комерційний рух відбувається — слухайте Halifax Traffic на каналах VTS <em>до</em> того, як увійти. Ніколи не намагайтесь перетнути курс перед судном тут.</p><hr><h3><span data-lang=\"en\">17.3 Zone 3 — Halifax Harbour proper &amp; McNabs Island</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Зона 3 — власне гавань і McNabs Island</span></h3><p data-lang=\"en\">The main harbour: the working commercial port, the naval dockyard, the container terminals, the ferry routes, and the waterfront.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>Conditions</strong></td><td>More wind than the Arm, some chop, no significant swell inside</td></tr><tr><td><strong>Traffic</strong></td><td><strong>Heavy and serious.</strong> Container ships, tankers, naval vessels, cruise ships, ferries, tugs, pilot boats</td></tr><tr><td><strong>Best for</strong></td><td>Learning traffic awareness; the gateway to everywhere else</td></tr><tr><td><strong>Destination</strong></td><td><strong>McNabs Island</strong> — a large island in the outer harbour, a provincial park, with anchorages and historic fortifications ashore. A classic first \"somewhere\" for a Halifax sailor.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>This is where you practise being a small vessel among large ones.</strong> Read <a href=\"#/m07\" data-nav=\"m07\">Module 07 §7.5</a> again before your first harbour sail. The key habits: stay out of the channel, cross at right angles and astern, monitor VHF 16 and the VTS channels, and never assume you have been seen.</p><p data-lang=\"en\"><strong>A day sail to McNabs Island</strong> is the ideal step-up trip: it requires you to cross a shipping channel deliberately and carefully, anchor in a real anchorage, and get home again. Check the chart for approaches and depths, and pick a settled day.</p><p data-lang=\"ua\">Основна гавань: робочий комерційний порт, військово-морська база, контейнерні термінали, паромні маршрути і набережна.</p><p data-lang=\"ua\"><strong>Саме тут ви тренуєтесь бути малим судном серед великих.</strong> Перечитайте <a href=\"#/m07\" data-nav=\"m07\">Модуль 07 §7.5</a> перед першим виходом у гавань. Ключові звички: тримайтеся поза каналом, перетинайте під прямим кутом і за кормою, слухайте VHF 16 і канали VTS, і ніколи не припускайте, що вас побачили.</p><p data-lang=\"ua\"><strong>Денний вихід до McNabs Island</strong> — ідеальний крок вперед: він вимагає свідомо й обережно перетнути судновий хід, стати на якір у справжній бухті і повернутися додому.</p><hr><h3><span data-lang=\"en\">17.4 Zone 4 — The outer approaches &amp; Chebucto Head</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Зона 4 — зовнішні підходи і Chebucto Head</span></h3><p data-lang=\"en\">Past McNabs Island and out through the harbour approaches, you are in the <strong>open North Atlantic</strong>. This is a genuine transition, and it deserves a deliberate first attempt on a calm, clear day.</p><p data-lang=\"en\"><strong>What changes:</strong></p><ul><li data-lang=\"en\"><strong>Ocean swell.</strong> For the first time you meet a long, low, powerful swell that has crossed open ocean. It's not the same as harbour chop — the boat's motion becomes a slow roll and pitch that affects crew far more than the wave height suggests. <strong>Expect seasickness in crew who were fine inside.</strong></li><li data-lang=\"en\"><strong>Steadier, stronger wind</strong>, free of land effects.</li><li data-lang=\"en\"><strong>Fog.</strong> The outer approaches are where sea fog sits. It can be clear in the Arm and thick out here, which is precisely the trap described in <a href=\"#/m09\" data-nav=\"m09\">Module 09 §9.3</a>.</li><li data-lang=\"en\"><strong>Real consequences.</strong> Beyond the harbour, a failure means a longer time before help and a lee shore that is rock.</li></ul><p data-lang=\"en\"><strong>Chebucto Head</strong>, on the western side of the approaches, is a significant headland with a lighthouse. As with any headland, <strong>wind and sea are stronger and more confused off it</strong> — the wind accelerates around it and the seabed shoals, steepening the waves. Give it room, and treat it with respect in any wind with south in it.</p><p data-lang=\"en\"><strong>Your first ocean trip, done properly:</strong> a settled, clear, 8–12 knot day, with an experienced sailor aboard, out past McNabs to the approaches and back. Everyone in PFDs. Seasickness medication taken an hour before departure. Nothing to prove, and turn back the moment anyone is unhappy.</p><p data-lang=\"ua\">За McNabs Island і через підходи гавані ви в <strong>відкритій Північній Атлантиці</strong>. Це справжній перехід, і він заслуговує на свідому першу спробу спокійного ясного дня.</p><p data-lang=\"ua\"><strong>Що змінюється:</strong> <strong>океанська хвиля (swell)</strong> — довга, низька, потужна, що перетнула відкритий океан; рух судна стає повільною качкою, що впливає на екіпаж значно сильніше, ніж підказує висота хвилі — <strong>очікуйте морської хвороби в тих, кому було добре всередині</strong>; стабільніший і сильніший вітер; <strong>туман</strong> — саме на зовнішніх підходах сидить морський туман; і <strong>справжні наслідки</strong> — за гаванню відмова означає довший час до допомоги і підвітряний берег зі скель.</p><p data-lang=\"ua\"><strong>Chebucto Head</strong> — значний мис із маяком на західній стороні підходів. Як і в будь-якого мису, <strong>вітер і хвиля біля нього сильніші й хаотичніші.</strong> Давайте йому запас.</p><hr><h3>17.5 Zone 5 — St. Margaret's Bay / Зона 5 — St. Margaret's Bay</h3><p data-lang=\"en\">The next bay west, and your first real coastal passage destination — roughly a full day's sail from Halifax around Chebucto Head and Peggys Point.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>Character</strong></td><td>A large, relatively open bay with sailing clubs, small communities, and a long shoreline</td></tr><tr><td><strong>Nearby</strong></td><td><strong>Peggys Cove</strong>, on the eastern approach — extremely famous, extremely photogenic, extremely rocky and exposed. Its granite shore and unpredictable surge make the immediate area genuinely hazardous; it is a place to admire from a safe distance and to visit by car.</td></tr><tr><td><strong>Sailing</strong></td><td>There are sailing clubs on the bay, including in the Hubbards and St. Margaret's areas — good sources of local knowledge</td></tr><tr><td><strong>Best for</strong></td><td>Your first passage where you leave your home harbour behind</td></tr></tbody></table></div><p data-lang=\"en\">The passage from Halifax to St. Margaret's Bay is a proper coastal trip: exposed coast, a significant headland, ocean swell, and a destination you must navigate into. It's the step where planning stops being an exercise. Do it in settled weather, plan the return leg carefully, and identify boltholes along the coast.</p><p data-lang=\"ua\">Наступна затока на захід і ваш перший справжній прибережний перехід — приблизно повний день ходу з Галіфаксу навколо Chebucto Head і Peggys Point.</p><p data-lang=\"ua\"><strong>Поблизу — Peggys Cove</strong>, на східному підході: надзвичайно відома, надзвичайно фотогенічна, надзвичайно скеляста й відкрита. Її гранітний берег і непередбачувана нагінна хвиля роблять безпосередню зону справді небезпечною; це місце, яке варто розглядати з безпечної відстані й відвідувати автомобілем.</p><p data-lang=\"ua\">Перехід Галіфакс — St. Margaret's Bay це справжня прибережна подорож: відкритий берег, значний мис, океанська хвиля і пункт призначення, у який треба зайти по навігації. Це крок, на якому планування перестає бути вправою.</p><hr><h3>17.6 Zone 6 — Mahone Bay, Chester &amp; Lunenburg / Зона 6 — Mahone Bay, Chester і Lunenburg</h3><p data-lang=\"en\"><strong>This is the world-class cruising ground, and it is on your doorstep.</strong> People plan international sailing holidays around this coast.</p><div class=\"table-wrap\"><table><thead><tr><th>Place</th><th>What it is</th></tr></thead><tbody><tr><td><strong>Mahone Bay</strong></td><td>A large bay reputed to hold hundreds of islands, with countless coves, protected anchorages, and short hops between them. It is the classic Nova Scotia cruising area — genuinely comparable to celebrated cruising grounds elsewhere, and far less crowded.</td></tr><tr><td><strong>Chester</strong></td><td>A well-known sailing village on Mahone Bay with a strong yachting tradition and a long-established regatta culture. A natural first overnight destination.</td></tr><tr><td><strong>The town of Mahone Bay</strong></td><td>Picturesque waterfront town, famous for the three churches on its harbourfront.</td></tr><tr><td><strong>Lunenburg</strong></td><td>UNESCO World Heritage old town, home port of the schooner <em>Bluenose II</em>, working waterfront, and the emotional centre of Nova Scotia's sailing heritage. Arriving here on your own boat is a genuine milestone.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The classic cruise, and the one to aim for:</strong></p><div class=\"pre-wrap\"><pre>  Halifax  →  Chester  →  Mahone Bay islands  →  Lunenburg  →  back\n       roughly 4–7 days, depending on how long you linger</pre></div><p data-lang=\"en\"><strong>Why it's such good cruising:</strong> many islands and coves within short distances of each other, so passages between anchorages are hours rather than days; genuine shelter in most wind directions; interesting towns with real history; and — unlike the Mediterranean or the Caribbean — it is not crowded.</p><p data-lang=\"en\"><strong>Why it demands care:</strong> the coast is <strong>rock</strong>, much of it is unmarked, fog is common, and the water is cold. <strong>This is chart-and-<em>Sailing Directions</em> cruising, not eyeball cruising.</strong> Every entrance must be researched. Local knowledge is genuinely valuable here — talk to people at the clubs before you go, and ask specifically about entrances, unmarked rocks, and where not to anchor.</p><p data-lang=\"en\"><strong>Beyond:</strong> the coast continues southwest to Liverpool, Shelburne, and around Cape Sable to the Bay of Fundy — where the tidal range becomes extreme and tidal planning becomes the dominant navigational concern. Northeast from Halifax lies the Eastern Shore, and beyond it <strong>Cape Breton and the Bras d'Or Lakes</strong>, an inland salt-water sea widely considered one of the finest cruising areas in North America. All of it is reachable from your home port.</p><p data-lang=\"ua\"><strong>Це район плавання світового класу, і він у вас під дверима.</strong> Люди планують міжнародні вітрильні відпустки навколо цього узбережжя.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Місце</th><th>Що це</th></tr></thead><tbody><tr><td><strong>Mahone Bay</strong></td><td>Велика затока, у якій, за поширеними даними, сотні островів, з безліччю бухт, захищених стоянок і короткими переходами між ними. Це класичний круїзний район Нової Шотландії — справді порівнянний з відомими круїзними районами світу, і значно менш завантажений.</td></tr><tr><td><strong>Chester</strong></td><td>Відоме вітрильне містечко на Mahone Bay з сильною яхтовою традицією. Природний перший пункт для ночівлі.</td></tr><tr><td><strong>Місто Mahone Bay</strong></td><td>Живописне прибережне місто, відоме трьома церквами на набережній.</td></tr><tr><td><strong>Lunenburg</strong></td><td>Старе місто зі списку Всесвітньої спадщини UNESCO, порт шхуни <em>Bluenose II</em>, робоча набережна і емоційний центр вітрильної спадщини Нової Шотландії. Прийти сюди на власному судні — справжня віха.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Класичний круїз, до якого варто прагнути:</strong> Галіфакс → Chester → острови Mahone Bay → Lunenburg → назад, приблизно 4–7 днів.</p><p data-lang=\"ua\"><strong>Чому це такий добрий круїзинг:</strong> багато островів і бухт на коротких відстанях одна від одної, тому переходи між стоянками — це години, а не дні; справжнє укриття при більшості напрямків вітру; цікаві міста зі справжньою історією; і — на відміну від Середземномор'я чи Карибів — тут не тісно.</p><p data-lang=\"ua\"><strong>Чому це вимагає обережності:</strong> узбережжя — це <strong>скеля</strong>, значна частина непозначена, туман поширений, а вода холодна. <strong>Це круїзинг по карті й <em>Sailing Directions</em>, а не «на око».</strong> Кожен вхід треба вивчити. Місцеві знання тут справді цінні — говоріть з людьми в клубах перед виходом і питайте конкретно про входи, непозначені скелі і де не ставати на якір.</p><p data-lang=\"ua\"><strong>Далі:</strong> узбережжя продовжується на південний захід до Liverpool, Shelburne і навколо Cape Sable до затоки Фанді, де амплітуда припливу стає екстремальною. На північний схід від Галіфаксу — Eastern Shore, а за ним <strong>Cape Breton і Bras d'Or Lakes</strong>, внутрішнє солоне море, яке широко вважають одним з найкращих круїзних районів Північної Америки.</p><hr><h3><span data-lang=\"en\">17.7 Your progression</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Ваша прогресія</span></h3><p data-lang=\"en\">Do these in order. Each one adds exactly one new element, which is how you build competence without frightening yourself or your crew.</p><div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Trip</th><th>Roughly</th><th>New element introduced</th></tr></thead><tbody><tr><td>1</td><td>Northwest Arm circuits</td><td>2 h</td><td>Everything basic, in total safety</td></tr><tr><td>2</td><td>Arm → outer harbour → back</td><td>3 h</td><td>Commercial traffic awareness</td></tr><tr><td>3</td><td>Bedford Basin, incl. a Narrows transit</td><td>4 h</td><td>Tidal current, a constricted channel</td></tr><tr><td>4</td><td>McNabs Island and back</td><td>4–5 h</td><td>Crossing a shipping channel; anchoring</td></tr><tr><td>5</td><td>Out to the approaches / Chebucto Head</td><td>5–6 h</td><td><strong>Ocean swell</strong>, headland effects</td></tr><tr><td>6</td><td>Halifax → St. Margaret's Bay</td><td>Full day</td><td>First real coastal passage</td></tr><tr><td>7</td><td>Halifax → Chester, overnight</td><td>2 days</td><td><strong>Sleeping aboard</strong>, night anchoring</td></tr><tr><td>8</td><td>Chester → Mahone Bay islands</td><td>2–3 days</td><td>Multiple anchorages, island navigation</td></tr><tr><td>9</td><td>→ Lunenburg and return</td><td>4–7 days</td><td><strong>A real cruise.</strong> The goal.</td></tr><tr><td>10</td><td>Eastern Shore, or Bras d'Or Lakes</td><td>1–2 weeks</td><td>Extended cruising, remote coast</td></tr></tbody></table></div><p data-lang=\"ua\">Виконуйте це за порядком. Кожен пункт додає рівно один новий елемент — саме так будується компетентність без переляку для себе й екіпажу.</p><hr><h3><span data-lang=\"en\">17.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is the Northwest Arm a particularly good place to learn?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name three hazards specific to the Arm.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the four reasons the Narrows demands respect.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What should you do before transiting the Narrows?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is your first \"somewhere\" destination in the harbour, and what does it require you to do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What three things change when you pass out through the harbour approaches?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why are headlands more dangerous, and which one guards the western approaches?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is Peggys Cove a place to admire rather than approach?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the three main destinations of the classic South Shore cruise.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is the South Shore excellent cruising, and what makes it demanding?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why must this coast be navigated by chart rather than by eye?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is your next trip on the §17.7 progression?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому Northwest Arm особливо добре місце для навчання?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три небезпеки, специфічні для Arm.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть чотири причини, чому Narrows вимагає поваги.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що треба зробити перед проходом Narrows?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який ваш перший пункт призначення в гавані і що він вимагає зробити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які три речі змінюються, коли ви виходите через підходи гавані?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому миси небезпечніші і який з них охороняє західні підходи?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому Peggys Cove — місце для споглядання, а не для підходу?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три основні пункти класичного круїзу по Південному узбережжю.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому Південне узбережжя — відмінний круїзинг і що робить його вимогливим?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому це узбережжя треба проходити по карті, а не «на око»?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який ваш наступний похід за прогресією §17.7?</span></label></li></ul><hr>"}, "m18": {"t_en": "18 · Ownership & mastery", "t_ua": "Володіння та майстерність", "html": "<h2>Module 18 — Owning a Boat in Nova Scotia &amp; the Road to Mastery</h2><h2 data-lang=\"ua\">Модуль 18 — Володіння судном у Новій Шотландії та шлях до майстерності</h2><p><strong>Study time / Час: ~2 hours + years</strong></p><hr><h3><span data-lang=\"en\">18.1 Should you buy a boat?</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чи варто купувати судно?</span></h3><p data-lang=\"en\">The honest answer for most new sailors is: <strong>not yet, and possibly not ever.</strong> Consider the alternatives first, because they are genuinely better for most people.</p><div class=\"table-wrap\"><table><thead><tr><th>Option</th><th>Roughly costs</th><th>Best for</th></tr></thead><tbody><tr><td><strong>Crewing on other people's boats</strong></td><td><strong>Free</strong></td><td>Everyone, always. Never stop doing this.</td></tr><tr><td><strong>Club membership + club boats</strong></td><td>Membership + modest fees</td><td>Regular sailing without ownership. Many clubs have keelboats or dinghies members can use.</td></tr><tr><td><strong>Sailing co-op / fractional share</strong></td><td>A share of costs</td><td><strong>The sweet spot for most people.</strong> You get regular access and command time without carrying the whole burden.</td></tr><tr><td><strong>Local charter</strong></td><td>Per day/week</td><td>Occasional sailing; trying different boats; a family trip</td></tr><tr><td><strong>Ownership</strong></td><td>See below</td><td>People who want a <em>specific</em> boat, will use it a lot, and enjoy maintenance</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The rule that holds up:</strong> you should own a boat when you can articulate exactly what you want to do that the other options don't allow, and when you've sailed enough to know what boat you want. Buying in your first two seasons usually means buying the wrong boat and discovering you dislike sanding.</p><p data-lang=\"en\"><strong>A useful reality check:</strong> annual running costs commonly work out around <strong>10% or more of the boat's value per year</strong>, before you fix anything unexpected. And in Nova Scotia there's the seasonal cost that inland sailors don't have: <strong>haul-out, winter storage, winterising, and spring launch, every single year.</strong></p><p data-lang=\"ua\">Чесна відповідь для більшості новачків: <strong>ще не зараз, і можливо ніколи.</strong> Спочатку розгляньте альтернативи, бо для більшості людей вони справді краще.</p><p data-lang=\"ua\"><strong>Правило, яке працює:</strong> варто купувати судно, коли ви можете чітко сформулювати, що саме ви хочете робити, чого інші варіанти не дозволяють, і коли ви наплавали достатньо, щоб знати, яке судно вам потрібне. Покупка в перші два сезони зазвичай означає покупку неправильного судна і відкриття, що вам не подобається шліфувати корпус.</p><p data-lang=\"ua\"><strong>Корисна перевірка реальністю:</strong> щорічні витрати на утримання зазвичай складають близько <strong>10% або більше від вартості судна на рік</strong>, до будь-яких неочікуваних ремонтів. А в Новій Шотландії є сезонна витрата, якої немає у «внутрішніх» яхтсменів: <strong>підйом на берег, зимове зберігання, консервація і весняний спуск, кожного року.</strong></p><hr><h3><span data-lang=\"en\">18.2 What boat, for Nova Scotia</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Яке судно для Нової Шотландії</span></h3><p data-lang=\"en\">If you do buy, this coast has specific requirements. It is cold, foggy, rocky, and it has real ocean swell and a hurricane season.</p><p data-lang=\"en\"><strong>What actually matters here:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Feature</th><th>Why, in Nova Scotia specifically</th></tr></thead><tbody><tr><td><strong>A solid, seaworthy, well-built hull</strong></td><td>You have genuine ocean on your doorstep. A boat designed for lakes is the wrong boat.</td></tr><tr><td><strong>Moderate draft</strong></td><td>The coast is rocky and many coves are shallow. Deep draft closes destinations to you. Around 1.2–1.6 m is a practical compromise for a mid-size cruiser.</td></tr><tr><td><strong>A reliable inboard diesel</strong></td><td>Fog, calms, tidal currents, and getting off a lee shore. Your engine is safety equipment here.</td></tr><tr><td><strong>An enclosed or well-protected cockpit; a dodger</strong></td><td>Cold, wet, foggy sailing. A dodger transforms this coast from endurance into pleasure. It is not a luxury.</td></tr><tr><td><strong>Cabin heating</strong></td><td>The season is short and the shoulder months are cold. Heat extends your season at both ends and makes overnight cruising genuinely comfortable.</td></tr><tr><td><strong>Radar and/or AIS</strong></td><td><strong>Fog and heavy commercial traffic.</strong> If you buy one electronic system, make it AIS; if two, add radar.</td></tr><tr><td><strong>Good ground tackle, oversized</strong></td><td>Rocky and weedy bottoms, and you'll be anchoring in unfamiliar coves. Go one size up on the anchor. Always.</td></tr><tr><td><strong>Simple systems</strong></td><td>Every system is something that fails at the least convenient moment. Fewer, better systems beat many clever ones.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Size:</strong> something in the <strong>8–11 m (26–36 ft)</strong> range is the practical sweet spot for a first cruising boat here — big enough for the swell and for sleeping aboard on a South Shore cruise, small enough that one or two people can handle it, and small enough that haul-out and storage don't become the dominant cost.</p><p data-lang=\"ua\">Якщо ви все ж купуєте, це узбережжя має конкретні вимоги. Тут холодно, туманно, скелясто, є справжня океанська хвиля і сезон ураганів.</p><p data-lang=\"ua\"><strong>Що справді важливо тут:</strong> міцний морехідний корпус (у вас справжній океан під дверима — судно, розраховане на озера, це неправильне судно) · <strong>помірна осадка</strong> (узбережжя скелясте і багато бухт мілкі; приблизно 1,2–1,6 м — практичний компроміс) · <strong>надійний стаціонарний дизель</strong> (туман, штилі, течії і відхід від підвітряного берега — тут двигун це спорядження безпеки) · <strong>закритий або добре захищений кокпіт і рубка-дожер</strong> (холодне, мокре, туманне плавання; дожер перетворює це узбережжя з випробування на задоволення — це не розкіш) · <strong>обігрів каюти</strong> (сезон короткий, а перехідні місяці холодні) · <strong>радар і/або AIS</strong> (туман і щільний комерційний рух) · <strong>добре, збільшене якірне пристрій</strong> (скелясті й зарослі дна — беріть якір на один розмір більше, завжди) · <strong>прості системи</strong>.</p><p data-lang=\"ua\"><strong>Розмір:</strong> приблизно <strong>8–11 м (26–36 футів)</strong> — практично оптимально для першого круїзного судна тут.</p><hr><h3><span data-lang=\"en\">18.3 Buying: the process</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Купівля: процес</span></h3><p data-lang=\"en\"></p><ol><li data-lang=\"en\"><strong>Sail many boats first.</strong> Crew, charter, and borrow. You cannot know what you want until you've felt the difference between boats.</li><li data-lang=\"en\"><strong>Decide your real budget:</strong> purchase price + survey + immediate repairs + first year's running costs. The purchase price is often the smaller half.</li><li data-lang=\"en\"><strong>Search:</strong> yacht brokers, club noticeboards (frequently the best deals, from members who know the boat's history), online listings, and word of mouth. In a small sailing community like Halifax, <strong>reputation and history are findable</strong> — ask around about a specific boat and you will learn things no listing tells you.</li><li data-lang=\"en\"><strong>Get a professional survey. Always. No exceptions.</strong> A marine surveyor will find osmosis, rot, rig fatigue, corroded chainplates, delamination, and a failing engine. A survey costs a fraction of what it saves, and it is also usually required for insurance and financing.</li><li data-lang=\"en\"><strong>Sea trial</strong> — sail it, and run the engine hard for a sustained period. Many faults only appear under load and at temperature.</li><li data-lang=\"en\"><strong>Check the paperwork:</strong> clear title, no liens, the <strong>Pleasure Craft Licence</strong> or registration transfer, and tax obligations on the sale.</li><li data-lang=\"en\"><strong>Negotiate on the survey findings.</strong> This is what the survey is for.</li><li data-lang=\"en\"><strong>Insurance</strong> before you take delivery. Insurers here will ask about your qualifications and experience — <strong>which is another concrete reason the Sail Canada certifications are worth having.</strong></li><li data-lang=\"en\"><strong>Register or licence the boat:</strong> the <strong>Pleasure Craft Licence (PCL)</strong> is free and required for engines ≥10 hp / 7.5 kW; the number must be displayed on the bow. Full <strong>registration</strong> is a separate, more formal process, needed for a legally recognised vessel name and generally expected for international voyaging.</li></ol><p data-lang=\"ua\"></p><ol><li data-lang=\"ua\"><strong>Спочатку походіть на багатьох судах.</strong></li><li data-lang=\"ua\"><strong>Визначте справжній бюджет:</strong> ціна + сюрвей + негайні ремонти + перший рік утримання. Ціна покупки часто менша половина.</li><li data-lang=\"ua\"><strong>Шукайте:</strong> яхтові брокери, дошки об'яв у клубах (часто найкращі варіанти, від членів, які знають історію судна), онлайн-оголошення і сарафанне радіо. У малій вітрильній спільноті, як Галіфакс, <strong>репутацію й історію можна знайти</strong> — попитайте про конкретне судно.</li><li data-lang=\"ua\"><strong>Зробіть професійний сюрвей. Завжди. Без винятків.</strong> Морський сюрвейєр знайде осмос, гниль, втому такелажу, корозію обушків вант, розшарування і несправний двигун. Сюрвей коштує частку від того, що він зберігає, і зазв
