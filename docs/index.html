present and <strong>in date</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fire extinguisher(s)</strong> — present, charged, accessible</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>First aid kit</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>VHF</strong> — working, on Ch 16, and a radio check done</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Handheld VHF charged, in the grab bag</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Bilge pump and its handle</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Buoyant heaving line</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Lifebuoy / horseshoe with light</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Boarding ladder or reboarding device</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sound-signalling device (horn/whistle)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Navigation lights tested</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor and rode ready to deploy</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Charts, tide tables, hand-bearing compass aboard</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Knife accessible from the cockpit</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Radar reflector up, if fog is possible</span></label></li></ul><h4><span data-lang=\"en\">After engine start</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Після запуску двигуна</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Cooling water flowing from the exhaust</strong> — if not, <strong>STOP IMMEDIATELY</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Oil pressure and temperature normal</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Alternator charging</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Gear engages ahead and astern</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Steering responds</span></label></li></ul><hr><h3><span data-lang=\"en\">B.2 Crew safety brief — every trip, no exceptions</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інструктаж екіпажу</span></h3><p data-lang=\"en\">Two minutes. <strong>Point at each item physically</strong> as you say it. Do this even with experienced crew.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here are the PFDs, here's how to wear one, here's the whistle and light.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here's the fire extinguisher. The flares. The first aid kit.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here's the VHF. This is channel 16. This is high power. Here's the MAYDAY card — read it now.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here's the bilge pump and its handle.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here's the engine start and the kill switch.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Here are the seacocks.\"</strong> (On a boat you're skippering for the first time, and for overnight crew.)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Watch the boom. When I say 'gybe-ho', get your head down and stay down.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"One hand for the boat. Move on the high side. Nobody forward of the mast without telling me.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"If someone goes over: shout, throw something that floats, and one of you points at them and does absolutely nothing else.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"If <em>I</em> go over, here is exactly what you do: [stop the boat / throw flotation / press MOB on the plotter / MAYDAY on channel 16].\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"We're going here, back around this time, and I've told someone ashore.\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>\"Questions? Anyone prone to seasickness? Anyone need medication now?\"</strong></span></label></li></ul><p data-lang=\"ua\">Дві хвилини. <strong>Показуйте фізично на кожен предмет.</strong> Пункт про «якщо <em>я</em> впаду за борт» — найважливіший і майже завжди пропускається.</p><hr><h3><span data-lang=\"en\">B.3 Man overboard — immediate actions</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Людина за бортом</span></h3><p data-lang=\"en\"><strong>First five seconds, simultaneously:</strong></p><ol><li data-lang=\"en\">☐ <strong>SHOUT \"MAN OVERBOARD!\"</strong></li><li data-lang=\"en\">☐ <strong>THROW flotation</strong> — immediately, even if it lands far away</li><li data-lang=\"en\">☐ <strong>PRESS MOB</strong> on the GPS/plotter</li><li data-lang=\"en\">☐ <strong>ASSIGN A SPOTTER</strong> — one person, points at them, does nothing else, ever</li><li data-lang=\"en\">☐ <strong>DO NOT LOSE SIGHT OF THEM</strong></li></ol><p data-lang=\"en\"><strong>Then:</strong></p><ol><li data-lang=\"en\">☐ <strong>Quick Stop:</strong> head up, tack leaving the jib backed, come back</li><li data-lang=\"en\">☐ Approach <strong>from downwind</strong>, on a close reach, controlling speed by luffing</li><li data-lang=\"en\">☐ Stop with them <strong>on the leeward side, just forward of amidships</strong></li><li data-lang=\"en\">☐ <strong>Engine in NEUTRAL</strong> before they're near the stern</li><li data-lang=\"en\">☐ <strong>Get a line on them and secure them to the boat</strong> — before attempting to lift</li><li data-lang=\"en\">☐ Lift with a <strong>halyard and winch</strong> if needed. Keep them <strong>horizontal</strong>.</li><li data-lang=\"en\">☐ Out of the wind, out of wet clothes, into dry insulation. <strong>Warm gradually.</strong></li><li data-lang=\"en\">☐ <strong>PAN PAN or MAYDAY.</strong> Get medical help — cold-water immersion has delayed effects.</li></ol><p data-lang=\"ua\"><strong>Перші п'ять секунд, одночасно:</strong> КРИЧІТЬ · КИНЬТЕ плавуче · НАТИСНІТЬ MOB · ПРИЗНАЧТЕ СПОСТЕРІГАЧА (лише показує, більше нічого) · НЕ ВТРАЧАЙТЕ З ВИДУ.</p><hr><h3><span data-lang=\"en\">B.4 Reefing — when and how</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Взяття рифів</span></h3><h4 data-lang=\"ua\"><span data-lang=\"en\">Reef NOW if</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Беріть риф ЗАРАЗ, якщо:</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Heel is consistently over <strong>20–25°</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Heavy weather helm — you're fighting the tiller</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The leeward rail is going under</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You're constantly spilling wind to keep control</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The crew look worried, or have gone quiet</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>You are asking yourself whether to reef.</strong> ← This one alone is sufficient.</span></label></li></ul><h4><span data-lang=\"en\">Procedure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Процедура</span></h4><ol><li>☐ <strong>Reduce load</strong> — head up, or better, <strong>heave-to</strong></li><li>☐ <strong>Take up the topping lift</strong></li><li>☐ <strong>Ease the main halyard</strong> to the reef mark</li><li>☐ <strong>Secure the new tack</strong> — cringle on the horn, or tension the luff line</li><li>☐ <strong>Haul the reefing line at the clew</strong> tight along the boom</li><li>☐ <strong>Re-tension the halyard</strong></li><li>☐ Tidy loose sail with reef ties — <strong>do not trap the foot</strong></li><li>☐ <strong>Ease the topping lift</strong>, sheet in, re-trim</li><li>☐ <strong>Reduce the headsail too</strong> — or you'll be unbalanced with lee helm</li></ol><hr><h3><span data-lang=\"en\">B.5 Docking</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швартування</span></h3><h4><span data-lang=\"en\">Before the approach</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">До підходу</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Decided <strong>exactly</strong> where you're going and which side is to the dock</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Wind and current</strong> direction and strength assessed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Approaching <strong>into</strong> the stronger of the two</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Crew briefed:</strong> who steps off, which line first, to which cleat, who does what</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fenders out</strong>, correct side, correct height</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Docklines rigged</strong>, led outside the lifelines, boat end secured, coiled ready</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Abort plan agreed and said out loud:</strong> <em>\"If it looks wrong I'll say 'aborting', power out, and we'll go round.\"</em></span></label></li></ul><h4><span data-lang=\"en\">The approach</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Підхід</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Slow.</strong> Never faster than you're willing to hit the dock.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Shallow angle, roughly 20–30°</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Out of gear and coasting for the last part</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Short burst of <strong>reverse</strong> to stop</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>One line on first</strong>, turn taken on a cleat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Adjust everything else at leisure</span></label></li></ul><h4><span data-lang=\"en\">Absolute rules</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Абсолютні правила</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Never</strong> a hand, foot, or leg between boat and dock</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Never</strong> jump for the dock</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Never</strong> wrap a line around your hand</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Abort freely.</strong> It costs three minutes.</span></label></li></ul><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">B.6 Anchoring</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Постановка на якір</span></h3><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchorage chosen from the <strong>chart</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Shelter from the FORECAST wind, for the whole time you'll be there</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Seabed type checked</strong> — mud/sand good, rock/weed bad</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Depth at low water</strong> calculated, not estimated</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Swinging room</strong> checked at all states of tide — boats, rocks, shore, gear</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Escape route</strong> exists, usable in the dark and in the forecast conditions</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Scope calculated:</strong> (depth at <strong>high</strong> water + bow height) × <strong>5 minimum, 7+ in wind</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Approach <strong>into wind/current</strong>, stop over the spot</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Lower under control</strong> — don't dump the chain in a pile</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Pay out scope while drifting/motoring gently astern</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Set it:</strong> snub the rode, gentle reverse. Feel for juddering (dragging) vs solid (set)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Snubber rigged</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Transit taken</strong> on two objects abeam</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Depth, position, and time noted</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Anchor light / black ball</strong> displayed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor alarm set</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Alarm set for the <strong>tide turn</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Dragging plan</strong> rehearsed verbally before bed</span></label></li></ul><hr><h3><span data-lang=\"en\">B.7 Fog</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Туман</span></h3><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>PFDs on everyone.</strong> Immediately.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Slow to a speed you can stop from</strong> in the visibility you have</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Sound fog signals</strong> — sailing vessel: <strong>one prolonged + two short</strong>, at least every 2 min</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Navigation lights on</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Dedicated lookout forward.</strong> Stop the engine periodically to <strong>listen</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fix your position and log it.</strong> Then log course and speed continuously for DR</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Get out of the shipping channel</strong> — into shallow water where big ships can't go</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Radar reflector up</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Monitor VHF 16 and the VTS channels</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Consider <strong>anchoring</strong> in shallow water clear of channels and simply waiting</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><em>There is no prize for arriving.</em></span></label></li></ul><hr><h3><span data-lang=\"en\">B.8 Fire</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Пожежа</span></h3><ol><li>☐ <strong>Everyone into PFDs, on deck, upwind of the fire</strong></li><li>☐ <strong>Cut the fuel and power</strong> — gas off at the bottle, fuel valve shut, batteries isolated</li><li>☐ <strong>Extinguisher at the base of the flames</strong>, sweeping. Use a fire port rather than opening a compartment fully</li><li>☐ <strong>No water</strong> on fuel or electrical fires</li><li>☐ <strong>MAYDAY early</strong> — don't wait to see if you'll win. Cancel it if you do.</li><li>☐ <strong>Prepare to abandon</strong> — grab bag, liferaft/dinghy, flares</li><li>☐ <strong>Do not re-enter</strong> for possessions</li></ol><hr><h3><span data-lang=\"en\">B.9 Taking on water</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Надходження води</span></h3><ol><li>☐ <strong>Find the source</strong> — usually a <strong>seacock</strong>, hose, stern gland, or cockpit drain, not a hull breach</li><li>☐ <strong>Close the seacock.</strong> Wooden bungs are tied next to each one.</li><li>☐ <strong>Pump</strong> — manual + electric + <strong>bucket</strong> (a bucket moves more water than most pumps)</li><li>☐ <strong>Slow the boat</strong> — pressure into a hole rises sharply with speed</li><li>☐ <strong>MAYDAY while you still have power and a mast</strong></li><li>☐ <strong>Head for shallow water</strong> if sinking is likely</li></ol><hr><h3><span data-lang=\"en\">B.10 Grab bag contents</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вміст аварійної сумки</span></h3><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Handheld VHF — waterproof, charged, ideally floating</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>EPIRB or PLB</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Flares — parachute and hand-held</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Handheld GPS, or phone in a waterproof case + battery pack</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Drinking water</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>High-energy food</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Space blankets / thermal protective aids</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>First aid kit</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Knife</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Whistle and signalling mirror</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Waterproof torch + spare batteries</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sunscreen and hat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Copies of documents, and cash</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Essential prescription medication</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Pump or bailer for the raft/dinghy</span></label></li></ul><hr><h3><span data-lang=\"en\">B.11 MAYDAY card — copy this next to your radio</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Картка MAYDAY</span></h3><div class=\"pre-wrap\"><pre>════════════════════════════════════════════════════════════\n  VHF CHANNEL 16 — HIGH POWER\n  (If DSC fitted: LIFT COVER, HOLD DISTRESS BUTTON first)\n════════════════════════════════════════════════════════════\n\n  \"MAYDAY, MAYDAY, MAYDAY\"\n\n  \"THIS IS  ______________  ______________  ______________\"\n              (boat name, three times)\n\n  \"MAYDAY  ______________\"\n              (boat name, once)\n\n  \"MY POSITION IS  ________________________________\"\n              (lat/long, OR bearing + distance from a landmark)\n\n  \"________________________________________________\"\n              (nature of distress)\n\n  \"WE REQUIRE IMMEDIATE ASSISTANCE\"\n\n  \"________  PERSONS ON BOARD\"\n\n  \"________________________________________________\"\n              (boat description, colour, other information)\n\n  \"OVER\"\n\n\n════════════════════════════════════════════════════════════\n  PAN PAN  = urgency, not life-threatening\n  SÉCURITÉ = safety information\n  MAYDAY RELAY = passing on someone else's distress\n════════════════════════════════════════════════════════════\n  POSITION IS THE MOST IMPORTANT INFORMATION.\n  If you can say only one thing, say WHERE YOU ARE.\n  NEVER hesitate to call. There is no penalty for\n  a good-faith MAYDAY.\n════════════════════════════════════════════════════════════</pre></div><hr><h3><span data-lang=\"en\">B.12 End of day</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Кінець дня</span></h3><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Sails furled, flaked, and <strong>covered</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Halyards secured so they can't fly or slap</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Boom secured with the topping lift</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>All lines coiled and stowed in their homes</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Nothing left dangling in the water</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Docklines set with <strong>springs</strong>, allowing for tide</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Fenders positioned at the actual contact points</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Bilge dry</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Seacocks closed</strong> as appropriate for the boat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Gas off at the bottle</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Battery isolator / electrics as appropriate</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Engine seacock closed if that's the boat's practice</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Hatches shut, boat locked</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Gear removed</strong> — wet clothing, food, rubbish</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Log filled in</strong> (see <a href=\"#/drills\" data-nav=\"drills\">logbook</a>)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Told your shore contact you're back safely</strong> ← the step everyone forgets, and it triggers false alarms when skipped</span></label></li></ul><hr>"}, "drills": {"t_en": "Logbook & drills", "t_ua": "Журнал і вправи", "html": "<h2>Appendix C — Logbook &amp; Practice Drills</h2><h2 data-lang=\"ua\">Додаток C — Судновий журнал і тренувальні вправи</h2><hr><h3><span data-lang=\"en\">C.1 Why keep a log</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чому вести журнал</span></h3><p data-lang=\"en\">Four concrete reasons, not sentiment:</p><ol><li data-lang=\"en\"><strong>Certifications ask for hours and days.</strong> Intermediate Cruising and above, and every charter company and insurer, will want to know your experience. <strong>A log is evidence; memory is not.</strong> Start on day one, because you cannot reconstruct it later.</li><li data-lang=\"en\"><strong>It's how you see your own progress.</strong> Sailing improvement is invisible day to day and obvious across a season. Reading your first entries after a year is genuinely encouraging.</li><li data-lang=\"en\"><strong>It's a navigation tool.</strong> On a passage, an hourly log of position, course, and speed is your dead-reckoning backup when the electronics die. See <a href=\"#/m10\" data-nav=\"m10\">Module 10 §10.4</a>.</li><li data-lang=\"en\"><strong>It's how you learn from mistakes.</strong> Writing down \"got caught by the afternoon sea breeze building, had a miserable beat home\" is what stops you doing it a second time.</li></ol><p data-lang=\"ua\">Чотири конкретні причини, не сентименти:</p><ol><li data-lang=\"ua\"><strong>Сертифікації вимагають години й дні.</strong> Intermediate Cruising і вище, а також кожна чартерна компанія і страховик спитають про ваш досвід. <strong>Журнал — це доказ; пам'ять — ні.</strong> Починайте з першого дня.</li><li data-lang=\"ua\"><strong>Це те, як ви бачите власний прогрес.</strong> Прогрес у вітрильному спорті невидимий день до дня і очевидний через сезон.</li><li data-lang=\"ua\"><strong>Це навігаційний інструмент.</strong> На переході погодинний журнал місця, курсу і швидкості — ваш резерв для прокладки, коли електроніка відмовила.</li><li data-lang=\"ua\"><strong>Це те, як ви вчитеся на помилках.</strong></li></ol><hr><h3><span data-lang=\"en\">C.2 Log entry template</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Шаблон запису</span></h3><p data-lang=\"en\">Copy this into a notebook or a spreadsheet. Fill it in the same day, not a week later.</p><div class=\"pre-wrap\"><pre>═══════════════════════════════════════════════════════════════\n  DATE:  ______________          BOAT:  __________________\n  TYPE / LENGTH:  ______________________________________\n  SKIPPER:  ____________  MY ROLE:  crew / helm / SKIPPER\n  CREW:  _______________________________________________\n\n  FROM:  ______________  TO:  ______________\n  DEPARTED:  ______  RETURNED:  ______  HOURS UNDERWAY: ____\n  DISTANCE (nm):  ______     NIGHT HOURS:  ______\n\n  ── CONDITIONS ────────────────────────────────────────────\n  WIND:  direction ______  speed ______ kt  gusts ______ kt\n  SEA:   ____________________  VISIBILITY:  ______________\n  WEATHER:  ______________________  BAROMETER:  __________\n  TIDE:  HW ______  LW ______  Range ______\n\n  ── WHAT I DID ────────────────────────────────────────────\n  Manoeuvres / skills practised:\n  ______________________________________________________\n  ______________________________________________________\n\n  Sails carried (full / 1st reef / 2nd reef / storm):\n  ______________________________________________________\n\n  Navigation done (fixes, DR, passage plan, pilotage):\n  ______________________________________________________\n\n  ── WHAT WENT WELL ────────────────────────────────────────\n  ______________________________________________________\n\n  ── WHAT WENT WRONG, AND WHY ──────────────────────────────\n  ______________________________________________________\n  ______________________________________________________\n\n  ── WHAT I'LL DO DIFFERENTLY ──────────────────────────────\n  ______________________________________________________\n\n  ── SOMETHING I LEARNED / A TERM I DIDN'T KNOW ────────────\n  ______________________________________________________\n═══════════════════════════════════════════════════════════════</pre></div><p data-lang=\"en\"><strong>The three fields that matter most</strong> are the last three. Anyone can record wind speed. Writing down honestly what went wrong, why, and what you'll change is what actually converts hours into skill. Most people skip them, and most people plateau.</p><p data-lang=\"ua\"><strong>Три найважливіші поля</strong> — останні три. Записати швидкість вітру може будь-хто. Чесно записати, що пішло не так, чому, і що ви зміните — саме це перетворює години на майстерність. Більшість людей їх пропускає, і більшість людей зупиняється в розвитку.</p><hr><h3><span data-lang=\"en\">C.3 Running totals</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Наростаючі підсумки</span></h3><p data-lang=\"en\">Keep a summary page. Certifications and charter companies ask in these terms.</p><div class=\"table-wrap\"><table><thead><tr><th>Metric</th><th>Total</th></tr></thead><tbody><tr><td>Total hours underway</td><td></td></tr><tr><td>Hours <strong>as skipper</strong> (in command)</td><td></td></tr><tr><td>Hours as crew</td><td></td></tr><tr><td>Total nautical miles</td><td></td></tr><tr><td><strong>Night hours</strong></td><td></td></tr><tr><td>Days aboard / overnight passages</td><td></td></tr><tr><td>Largest boat sailed (LOA)</td><td></td></tr><tr><td>Strongest wind sailed in (kt)</td><td></td></tr><tr><td>Number of MOB recoveries practised</td><td></td></tr><tr><td>Number of times anchored overnight</td><td></td></tr><tr><td>Different boats sailed</td><td></td></tr><tr><td>Different cruising areas</td><td></td></tr></tbody></table></div><p data-lang=\"en\"><strong>Track \"hours as skipper\" separately and deliberately.</strong> It is a different skill from crewing, it's what certifications actually assess, and it's the number that will be low unless you consciously pursue it. See <a href=\"#/m15\" data-nav=\"m15\">Module 15 §15.4</a>.</p><p data-lang=\"ua\"><strong>Відслідковуйте «години як шкіпер» окремо і свідомо.</strong> Це інший навик, ніж робота в екіпажі, і саме це оцінюють сертифікації. Це буде низьке число, якщо ви не будете свідомо його наздоганяти.</p><hr><h3><span data-lang=\"en\">C.4 The drill progression</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Прогресія вправ</span></h3><p data-lang=\"en\">Work down the list. Do each until it's <strong>boring</strong> — boring means competent. Tick and date each one, and date the <em>second</em> time you did it too, because one success is luck.</p><h4><span data-lang=\"en\">Level 1 — Boat feel</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Відчуття судна</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail a beam reach in a straight line for 5 minutes, sails trimmed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Identify wind direction with your eyes closed, then check the masthead</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Head up and bear away smoothly, coordinating sheets with the helm</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Find and hold the close-hauled groove using telltales, for 3 minutes</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name every part of the boat you touch, out loud, for a whole session</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Feel weather helm build and de-power <strong>before</strong> the boat heels excessively</span></label></li></ul><h4><span data-lang=\"en\">Level 2 — Core manoeuvres</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Основні маневри</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>10 consecutive tacks without getting stuck in irons</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Deliberately get into irons and recover, 5 times</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>10 controlled gybes, main sheeted in, boom never slams</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Rig and use a preventer</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Heave-to, hold it 5 minutes, sail away — 5 times unassisted</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Reef and shake out under sail in 12–15 kt, in under 5 minutes</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Stop the boat in a chosen spot under sail</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail a triangular course — beat, reach, run — hitting each mark</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail backwards deliberately, and steer while doing it</span></label></li></ul><h4><span data-lang=\"en\">Level 3 — Under power</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Під двигуном</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Determine your boat's <strong>prop walk</strong> direction</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Stop from 4 knots — count the boat lengths</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Figure-eights around two fenders at dead slow</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Hold station — bow within a metre of a mark, using bursts of gear</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Reverse in a straight line for 50 m</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Turn 360° in the smallest possible space using prop walk</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Come alongside a fender 10 times, both sides, in wind</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Leave a dock using <strong>only springs and the engine</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Deliberately abort an approach and go round</span></label></li></ul><h4><span data-lang=\"en\">Level 4 — Mooring and anchoring</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швартування та якір</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Pick up a mooring under power, 5 times</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Pick up a mooring <strong>under sail</strong>, 3 successes out of 5</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Leave a mooring under sail</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor, set, and confirm with a transit</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor, calculate scope correctly for high water, and stay overnight</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Weigh anchor and stow the ground tackle properly</span></label></li></ul><h4><span data-lang=\"en\">Level 5 — Safety</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Безпека</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>MOB recovery under sail — fender in under <strong>3 minutes</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>MOB from each point of sail</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>MOB under power, engine in neutral before the approach</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>MOB <strong>with you as the casualty</strong> and someone else driving ← the one that matters</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Actually lift a heavy weight from the water</strong> with a halyard and winch</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Fit and steer with the <strong>emergency tiller</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Steer with <strong>sail balance only</strong>, no rudder input</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Locate every seacock, pump, and shut-off by feel, with your eyes closed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Send a full mock MAYDAY out loud, from memory, correctly ← do this on land</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Kill the engine mid-harbour and sail home</span></label></li></ul><h4><span data-lang=\"en\">Level 6 — Navigation</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Навігація</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Steer an accurate compass course for 15 minutes</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Take and plot a three-point fix; assess your cocked hat</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use a transit to hold a channel line</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use a clearing bearing to avoid a charted hazard</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Maintain a DR position for an hour, then check it against GPS</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Convert true to compass, and back, without notes</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Use the depth sounder to confirm (or disprove) your position</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Plan and execute a passage with a <strong>verified bolthole</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Navigate a leg with the plotter <strong>switched off</strong></span></label></li></ul><h4><span data-lang=\"en\">Level 7 — Skippering</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Шкіперство</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Deliver a full crew brief from memory, pointing at each item</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Take a boat out and back with <strong>novice crew</strong>, in command, and keep them happy</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Make a <strong>no-go decision</strong> and stick to it</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sail a whole day without touching the engine — including leaving and returning</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Complete a coastal passage as skipper</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Anchor overnight in an unfamiliar cove as skipper</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Teach a manoeuvre to a beginner</strong> ← the fastest way to find the holes in your own understanding</span></label></li></ul><hr><h3><span data-lang=\"en\">C.5 Weekly practice habits</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Щотижневі звички</span></h3><p data-lang=\"en\">Small, consistent, and they compound.</p><div class=\"table-wrap\"><table><thead><tr><th>Frequency</th><th>Habit</th></tr></thead><tbody><tr><td><strong>Daily, 10 min</strong></td><td><strong>Tie knots.</strong> Two weeks of this and you're done for life. Aim for the bowline behind your back.</td></tr><tr><td><strong>Daily, 2 min</strong></td><td>Read the marine forecast for Halifax Harbour and Approaches, <strong>and then look out the window</strong>. Comparing the two is how you build weather instinct.</td></tr><tr><td><strong>Weekly</strong></td><td>Learn 10 new terms from the <a href=\"#/glossary\" data-nav=\"glossary\">glossary</a>. Say them out loud.</td></tr><tr><td><strong>Weekly</strong></td><td>Read one course module, or re-read one you've since experienced on the water</td></tr><tr><td><strong>Every sail</strong></td><td>Fill in the log the same day — especially the last three fields</td></tr><tr><td><strong>Every sail</strong></td><td>Ask yourself \"what tack am I on? what point of sail?\" until it's automatic</td></tr><tr><td><strong>Every sail</strong></td><td>Learn one new thing and write it down</td></tr><tr><td><strong>Monthly</strong></td><td>Review your drill checklist. What's still unticked? Plan the next session around it.</td></tr><tr><td><strong>Monthly</strong></td><td>Practise a MOB recovery. It degrades fast without repetition.</td></tr><tr><td><strong>Every season</strong></td><td>Check flare dates, service the inflatable PFD, inspect the rigging, test the emergency tiller</td></tr></tbody></table></div><p data-lang=\"ua\">Малі, послідовні, і вони накопичуються.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Частота</th><th>Звичка</th></tr></thead><tbody><tr><td><strong>Щодня, 10 хв</strong></td><td><strong>В'яжіть вузли.</strong> Два тижні — і це з вами назавжди. Мета — боулінь за спиною.</td></tr><tr><td><strong>Щодня, 2 хв</strong></td><td>Читайте морський прогноз для Halifax Harbour and Approaches, <strong>а потім дивіться у вікно</strong>. Порівняння двох — це те, як будується погодна інтуїція.</td></tr><tr><td><strong>Щотижня</strong></td><td>Вивчайте 10 нових термінів з <a href=\"#/glossary\" data-nav=\"glossary\">глосарія</a>. Промовляйте вголос.</td></tr><tr><td><strong>Щотижня</strong></td><td>Читайте один модуль курсу, або перечитуйте той, що ви вже пережили на воді</td></tr><tr><td><strong>Кожен вихід</strong></td><td>Заповнюйте журнал того ж дня — особливо останні три поля</td></tr><tr><td><strong>Кожен вихід</strong></td><td>Питайте себе «на якому я галсі? на якому курсі?» доки не стане автоматичним</td></tr><tr><td><strong>Щомісяця</strong></td><td>Переглядайте чек-лист вправ. Що досі не відзначено?</td></tr><tr><td><strong>Щомісяця</strong></td><td>Тренуйте підняття людини за бортом. Без повторення навик швидко деградує.</td></tr><tr><td><strong>Щосезону</strong></td><td>Перевіряйте терміни фальшфейєрів, обслуговуйте надувний жилет, оглядайте такелаж, перевіряйте аварійний румпель</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">C.6 Self-assessment — end of each season</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Самооцінка в кінці сезону</span></h3><p data-lang=\"en\">Answer honestly, in writing, every autumn. This is how you decide what next season is for.</p><ol><li data-lang=\"en\">How many hours did I log? How many <strong>as skipper</strong>?</li><li data-lang=\"en\">What is the strongest wind I sailed in <strong>confidently</strong>, not just survived?</li><li data-lang=\"en\">Which drills on the §C.4 list are still unticked, and why?</li><li data-lang=\"en\">What am I still afraid of? (Be specific. Fear is a training plan.)</li><li data-lang=\"en\">What went wrong this season, and did I write down why?</li><li data-lang=\"en\">Did I make any decision I now think was unsafe? What was the pressure that caused it?</li><li data-lang=\"en\">Did I ever go out when I shouldn't have? What made me?</li><li data-lang=\"en\">Did I ever <strong>not</strong> go out and regret it? (Usually the answer is no — worth noticing.)</li><li data-lang=\"en\">Would my crew sail with me again? Would they know what to do if I were incapacitated?</li><li data-lang=\"en\">What is the single skill that, if I fixed it, would improve everything else?</li><li data-lang=\"en\">What am I doing over the winter?</li><li data-lang=\"en\">What is next season's concrete goal, with a date?</li></ol><p data-lang=\"ua\">Відповідайте чесно, письмово, кожної осені. Саме так ви вирішуєте, для чого наступний сезон.</p><ol><li data-lang=\"ua\">Скільки годин я записав? Скільки <strong>як шкіпер</strong>?</li><li data-lang=\"ua\">Який найсильніший вітер, у якому я ходив <strong>впевнено</strong>, а не просто вижив?</li><li data-lang=\"ua\">Які вправи зі списку §C.4 досі не відзначені і чому?</li><li data-lang=\"ua\">Чого я досі боюся? (Конкретно. Страх — це план тренувань.)</li><li data-lang=\"ua\">Що пішло не так цього сезону і чи записав я чому?</li><li data-lang=\"ua\">Чи приймав я рішення, яке зараз вважаю небезпечним? Який тиск його спричинив?</li><li data-lang=\"ua\">Чи виходив я коли-небудь, коли не варто було? Що мене змусило?</li><li data-lang=\"ua\">Чи був випадок, коли я <strong>не</strong> вийшов і пожалкував? (Зазвичай відповідь «ні» — це варто помітити.)</li><li data-lang=\"ua\">Чи пішов би мій екіпаж зі мною знову? Чи знали б вони, що робити, якби я став недієздатним?</li><li data-lang=\"ua\">Який єдиний навик, якщо його виправити, покращив би все інше?</li><li data-lang=\"ua\">Що я роблю протягом зими?</li><li data-lang=\"ua\">Яка конкретна мета наступного сезону, з датою?</li></ol><hr>"}, "links": {"t_en": "Vetted links", "t_ua": "Перевірені посилання", "html": "<h2>Appendix D — Vetted Online Resources</h2><h2 data-lang=\"ua\">Додаток D — Перевірені онлайн-ресурси</h2><p data-lang=\"en\">A short list, deliberately. There is an enormous amount of sailing content online and most of it is worse than the official free sources. These are the ones worth your time, roughly in the order you should use them.</p><p data-lang=\"ua\">Короткий список, свідомо. Онлайн існує величезна кількість матеріалів про вітрильний спорт, і більшість з них гірші за офіційні безкоштовні джерела. Ось ті, що варті вашого часу, приблизно в порядку використання.</p><blockquote class=\"callout\"><p><strong>⚠️ Verify before relying.</strong> URLs, programs, and prices change. Where this course states a specific figure — a price, a channel number, a chart number, an issue time — treat it as a starting point and confirm it at the source.</p></blockquote><hr><h3><span data-lang=\"en\">D.1 Start here — official, free, authoritative</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Почніть тут</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>Where</th><th>Why it matters</th></tr></thead><tbody><tr><td><strong><em>Safe Boating Guide</em> (TP 511)</strong></td><td>Transport Canada — tc.canada.ca</td><td><strong>The single most important document in this whole course.</strong> Free. It is the authority on required safety equipment, Canadian boating law, and the PCOC syllabus. Everything in <a href=\"#/m01\" data-nav=\"m01\">Module 01</a> and <a href=\"#/m12\" data-nav=\"m12\">Module 12</a> should be checked against it.</td></tr><tr><td><strong>PCOC information &amp; accredited provider list</strong></td><td>tc.canada.ca, or Boating Safety Infoline <strong>1‑800‑267‑6687</strong></td><td>Where to buy your legal card, from a provider that actually counts.</td></tr><tr><td><strong>Pleasure Craft Licence (PCL) application</strong></td><td>Transport Canada</td><td>Free hull registration, required for engines ≥10 hp / 7.5 kW.</td></tr><tr><td><strong>Sail Canada</strong></td><td>sailing.ca</td><td><strong>The definitive source for what each certification requires.</strong> Published standards for Basic Cruising, Intermediate Cruising, and the rest; the CANSail dinghy program guide; ROC(M) and PCOC information. Read the actual standard for the level you're working toward.</td></tr><tr><td><strong>Sail Nova Scotia</strong></td><td>sailnovascotia.ca</td><td>Provincial body. <strong>Start here to find courses and clubs</strong> — including adult learn-to-sail options across the province.</td></tr><tr><td><strong>CPS‑ECP</strong> (Canadian Power and Sail Squadrons)</td><td><strong>1‑888‑277‑2628</strong></td><td>Where you get the <strong>ROC(M)</strong> marine radio certificate, plus boating and navigation courses. Winter is the season for these.</td></tr><tr><td><strong>Environment Canada marine forecasts</strong></td><td>weather.gc.ca/marine</td><td><em>Halifax Harbour and Approaches.</em> Issued roughly 4×/day. <strong>Check it every single time you sail.</strong></td></tr><tr><td><strong>Canadian Hydrographic Service</strong></td><td>charts.gc.ca</td><td>Charts, <strong><em>Sailing Directions</em> for Nova Scotia</strong>, and tide tables. Essential before any coastal passage.</td></tr><tr><td><strong>Canadian Hurricane Centre</strong></td><td>Environment Canada</td><td>Tropical storm tracks and warnings. Check from mid-August.</td></tr><tr><td><strong>Port of Halifax</strong> — Marine Safety Handbook &amp; Port Information Guide</td><td>porthalifax.ca</td><td>If you sail in Halifax Harbour, read these. They cover port practices that apply to pleasure craft, exclusion zones, and traffic.</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">D.2 Learning to sail — theory and technique</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Навчання</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>Why</th></tr></thead><tbody><tr><td><strong>US Sailing</strong> and <strong>RYA</strong> published materials</td><td>The two most respected English-language training bodies. Their books and online courses are excellent, and their terminology matches what your Halifax instructor uses.</td></tr><tr><td><strong>NauticEd</strong></td><td>Structured online sailing theory courses, including navigation. Reasonable supplement to on-water training; not a substitute.</td></tr><tr><td><strong>Practical Boat Owner</strong> and <strong>Yachting Monthly</strong></td><td>British sailing magazines with genuinely good technical and seamanship content, and useful \"what went wrong\" case studies. Their conditions (cold, tidal, foggy, North Atlantic) are much closer to Nova Scotia's than Caribbean or Mediterranean content.</td></tr><tr><td><strong>Sailing Uma, Sail Life, Yachting Monthly's Crash Test Boat series</strong></td><td>Video content that is actually instructive rather than lifestyle filler. The <em>Crash Test Boat</em> series in particular — they deliberately sank, dismasted, and set fire to a boat to test emergency procedures.</td></tr><tr><td><strong>Animated Knots by Grog</strong></td><td>animatedknots.com — the clearest knot instruction anywhere, animated step by step. Use it alongside <a href=\"#/m06\" data-nav=\"m06\">Module 06</a>.</td></tr><tr><td><strong>The COLREGs, full text</strong></td><td>Available free online. Worth reading the actual rules once, not just summaries. They're shorter and clearer than you'd expect.</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">D.3 Weather &amp; tools</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Погода та інструменти</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Resource</th><th>Why</th></tr></thead><tbody><tr><td><strong>Windy.com</strong></td><td>Best visual wind forecasting for planning and understanding patterns. Compare models. <strong>Not a substitute for the official forecast and warnings.</strong></td></tr><tr><td><strong>Windfinder</strong></td><td>Spot forecasts and tide predictions; has a Halifax Harbour buoy page.</td></tr><tr><td><strong>PredictWind</strong></td><td>More serious passage-planning and routing tool.</td></tr><tr><td><strong>Navionics / iSailor / Aqua Map</strong></td><td>Electronic charts on phone or tablet. Genuinely useful. <strong>Carry paper as well</strong> — see <a href=\"#/m10\" data-nav=\"m10\">Module 10 §10.1</a>.</td></tr><tr><td><strong>Marine Traffic / AIS websites</strong></td><td>Watch Halifax commercial traffic in real time. <strong>Genuinely educational</strong> — spend an evening watching ship movements in the harbour and the Narrows and you'll understand the traffic patterns you need to avoid.</td></tr><tr><td><strong>Tide tables from CHS</strong></td><td>The authoritative source. Not an app's approximation.</td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">D.4 Community — the underrated resource</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Спільнота</span></h3><p data-lang=\"en\">The single best resource is people, and it is free.</p><div class=\"table-wrap\"><table><thead><tr><th>Where</th><th>What you get</th></tr></thead><tbody><tr><td><strong>Your local yacht club dock, in person, on a race night</strong></td><td>Crew opportunities, local knowledge, and the answer to every question you have. <strong>Nothing online competes with this.</strong> Go on a Wednesday.</td></tr><tr><td><strong>Club noticeboards</strong></td><td>Crew wanted, boats for sale, courses, and the boat you'll eventually buy</td></tr><tr><td><strong>r/sailing and r/liveaboard (Reddit)</strong></td><td>Large, generally knowledgeable communities. Good for general questions; be sceptical of confident strangers on safety topics.</td></tr><tr><td><strong>Sailing Anarchy forums</strong></td><td>Blunt, experienced, racing-heavy. Thick skin required; genuine expertise present.</td></tr><tr><td><strong>Cruisers Forum</strong></td><td>Deep archives on boats, systems, and cruising areas. Excellent for maintenance and gear research.</td></tr><tr><td><strong>Local Facebook groups</strong> for Nova Scotia sailing</td><td>Where day-to-day local information actually circulates — crew calls, conditions, gear</td></tr><tr><td><strong>Sail Nova Scotia member club list</strong></td><td>The systematic way to find every club and program in the province</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The thing to internalise:</strong> sailors are, as a group, unusually willing to help beginners. The sport depends on it — every experienced sailor was taught by someone, and most are glad to pass it on. <strong>The single highest-value action available to you is showing up at a dock and saying \"I'm new, can I help?\"</strong> No website replaces that.</p><p data-lang=\"ua\"><strong>Що варто засвоїти:</strong> яхтсмени як група надзвичайно охоче допомагають новачкам. Спорт на цьому тримається — кожного досвідченого яхтсмена хтось навчив, і більшість раді передати це далі. <strong>Найцінніша дія, доступна вам, — прийти на причал і сказати «я новачок, чи можу я допомогти?»</strong> Жоден сайт цього не замінить.</p><hr><h3><span data-lang=\"en\">D.5 Ukrainian-language resources</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Ресурси українською</span></h3><p data-lang=\"ua\">Матеріалів українською щодо вітрильного спорту помітно менше, ніж англійською, і майже нічого немає про канадські правила чи Нову Шотландію. Практична порада:</p><ul><li data-lang=\"ua\"><strong>Використовуйте цей курс як мовний мост.</strong> Двомовний <a href=\"#/glossary\" data-nav=\"glossary\">глосарій</a> спеціально побудований, щоб ви могли читати англійські джерела, маючи український опорний переклад.</li><li data-lang=\"ua\"><strong>Українські та європейські вітрильні школи й федерації</strong> мають матеріали українською щодо загальної теорії — вона універсальна. Але <strong>правила, буї, сертифікації й документи в Канаді інші</strong>: буйова система тут IALA Регіон B (протилежна європейській), а сертифікація — Sail Canada, не RYA чи ISSA. Не переносьте європейські деталі сюди.</li><li data-lang=\"ua\"><strong>Українська діаспора в Галіфаксі й Новій Шотландії</strong> значна. Варто пошукати місцеві українські спільноти — можливо, хтось уже ходить під вітрилами тут і може допомогти з термінологією й контактами.</li><li data-lang=\"ua\"><strong>Вивчайте англійські терміни як основні.</strong> На воді, на екзамені і в радіозв'язку буде англійська. Українська тут — для розуміння, а не для роботи.</li></ul><p data-lang=\"en\">Ukrainian-language sailing material is much scarcer than English, and there is essentially nothing covering Canadian regulations or Nova Scotia specifically. This course's bilingual glossary is built to bridge that gap: use the Ukrainian to confirm your understanding, and the English as your working language. Be careful about importing European sailing material wholesale — <strong>buoyage is inverted between IALA Region A (Europe) and Region B (Canada)</strong>, and the certification systems are entirely different.</p><hr><h3><span data-lang=\"en\">D.6 What to skip</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що пропустити</span></h3><p data-lang=\"en\">Being honest about the noise:</p><ul><li data-lang=\"en\"><strong>Most YouTube \"learn to sail\" content</strong> is lifestyle vlogging with sailing in the background. Pleasant; not instructional. Judge by whether it teaches a specific skill.</li><li data-lang=\"en\"><strong>Caribbean and Mediterranean sailing content</strong> is fun but the conditions are irrelevant to you. Warm water, no fog, different buoyage region, no hurricane haul-out. Prefer British, Pacific Northwest, New England, or Atlantic Canadian sources — cold water, tides, fog, rock.</li><li data-lang=\"en\"><strong>Anything that makes sailing sound risk-free</strong>, or that treats safety equipment as optional. If a source is casual about PFDs or reefing, ignore everything else it says.</li><li data-lang=\"en\"><strong>Gear reviews before you know what you need.</strong> You cannot evaluate a piece of equipment for a use case you haven't experienced. Sail first, buy later.</li><li data-lang=\"en\"><strong>Buying a boat before your second season.</strong> Covered in <a href=\"#/m18\" data-nav=\"m18\">Module 18</a>, but it belongs on this list too.</li></ul><p data-lang=\"ua\">Чесно про шум:</p><ul><li data-lang=\"ua\"><strong>Більшість «навчального» контенту на YouTube</strong> — це лайфстайл-влоги з вітрильниками на фоні. Приємно; не навчально.</li><li data-lang=\"ua\"><strong>Карибський і середземноморський контент</strong> цікавий, але умови не мають до вас відношення: тепла вода, немає туману, інший регіон буїв, немає підйому на берег перед ураганами. Обирайте британські, атлантично-канадські, новоанглійські джерела — холодна вода, припливи, туман, скеля.</li><li data-lang=\"ua\"><strong>Будь-що, що подає вітрильний спорт як безризиковий</strong>, або трактує спорядження безпеки як опційне.</li><li data-lang=\"ua\"><strong>Огляди снаряження до того, як ви знаєте, що вам потрібно.</strong></li></ul><hr><h3><span data-lang=\"en\">D.7 The three things worth doing this week</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Три речі на цей тиждень</span></h3><p data-lang=\"en\"></p><ol><li data-lang=\"en\"><strong>Buy and complete the PCOC</strong> from a Transport Canada accredited provider. One evening. Done for life.</li><li data-lang=\"en\"><strong>Download the <em>Safe Boating Guide</em> (TP 511)</strong> and read it properly. It's free and it's the actual law.</li><li data-lang=\"en\"><strong>Go to a yacht club dock on a Wednesday evening and offer to crew.</strong> This is the one that changes everything, and it costs nothing.</li></ol><p data-lang=\"ua\"></p><ol><li data-lang=\"ua\"><strong>Купіть і пройдіть PCOC</strong> у провайдера, акредитованого Transport Canada. Один вечір. Назавжди.</li><li data-lang=\"ua\"><strong>Завантажте <em>Safe Boating Guide</em> (TP 511)</strong> і прочитайте як слід. Безкоштовно, і це справжній закон.</li><li data-lang=\"ua\"><strong>Прийдіть на причал яхт-клубу в середу ввечері і запропонуйте себе як екіпаж.</strong> Саме це змінює все, і це безкоштовно.</li></ol><hr>"}};

  const QUIZ     = [{"n": 1, "q": "<strong>Choose a Transport Canada accredited provider.</strong> Several offer the whole thing online. Transport Canada publishes the list of accredited providers, and you can also call the Boating Safety Infoline at <strong>1‑800‑267‑6687</strong>. Costs run roughly <strong>$30–70 CAD</strong> depending on the provider; all fees are set by the providers, not the government.", "a": "<strong>Yes.</strong> The requirement applies to any pleasure craft <em>fitted</em> with a motor, even when the motor is off."}, {"n": 2, "q": "<strong>Work through the study material.</strong> Transport Canada requires a <strong>minimum of 3 hours of study time</strong>, and the platform will enforce that — you cannot simply skip to the test.", "a": "<strong>It never expires.</strong> Valid for life."}, {"n": 3, "q": "<strong>Take the test.</strong> Typically about <strong>50 multiple-choice questions</strong>, with a <strong>pass mark around 75%</strong>, taken online and usually open-book with unlimited or generous time. <strong>Confirm the exact format with your provider</strong> — question counts and pass marks vary between accredited providers.", "a": "<strong>40 hp (30 kW)</strong> — for ages 12 to under 16 operating without direct supervision."}, {"n": 4, "q": "<strong>Get your card.</strong> Most providers give you a temporary printable certificate immediately and mail the permanent plastic card. <strong>Carry it aboard.</strong>", "a": "<strong>Your starboard (right) side</strong> — \"red right returning\". Canada is IALA Region B."}, {"n": 5, "q": "Do not overfill; fuel expands.", "a": "<strong>Red, cone/nun shaped, even numbers.</strong>"}, {"n": 6, "q": "Wipe up spills.", "a": "<strong>Keep out</strong> — entry is prohibited."}, {"n": 7, "q": "<strong>Open everything and ventilate the bilge</strong>, then <strong>sniff the bilge</strong> before starting. Gasoline vapour is heavier than air and pools in the bilge — this is how boats explode.", "a": "<strong>Both alter course to starboard</strong> and pass port-to-port."}, {"n": 8, "q": "Run the blower before starting an inboard gasoline engine.", "a": "<strong>You do.</strong> The vessel with the other on her own starboard side gives way."}, {"n": 9, "q": "A sailing vessel is motoring with sails up. In the collision regulations, what type of vessel is she?", "a": "<strong>A power-driven vessel.</strong> She has no sailing privileges."}, {"n": 10, "q": "What day shape should that vessel display?", "a": "<strong>A black cone, point down</strong>, displayed forward."}, {"n": 11, "q": "You hear five short rapid blasts from a ship. What does it mean?", "a": "<strong>Danger / \"I do not understand your intentions.\"</strong> Act immediately."}, {"n": 12, "q": "What is the fog signal for a sailing vessel underway, and at what interval?", "a": "<strong>One prolonged blast plus two short blasts</strong>, at intervals of not more than 2 minutes."}, {"n": 13, "q": "At night you see a red light and a green light with a white light above them. What is it, and what do you do?", "a": "<strong>A power-driven vessel head-on.</strong> Both vessels alter course to starboard."}, {"n": 14, "q": "Name three items of required safety equipment on a small sailboat.", "a": "Any three of: an approved PFD per person, a buoyant heaving line (≥15 m), a bailer or manual bilge pump, a sound-signalling device, a manual propelling device or anchor with ≥15 m of rode, navigation lights, a fire extinguisher, flares or a watertight flashlight, a reboarding device, a magnetic compass."}, {"n": 15, "q": "What are the three numbers of the 1‑10‑1 principle?", "a": "<strong>1 minute</strong> to control your breathing (cold shock), <strong>10 minutes</strong> of meaningful movement before cold incapacitation, <strong>1 hour</strong> before unconsciousness from hypothermia."}, {"n": 16, "q": "Someone falls overboard in 14 °C water. What is your first concern in the first minute?", "a": "<strong>Getting their breathing under control</strong> and keeping their airway out of the water. Cold shock and the gasp reflex drown people, not hypothermia."}, {"n": 17, "q": "You want to keep warm in the water. Should you swim?", "a": "<strong>No.</strong> Swimming dumps heat about three times faster. Adopt HELP and stay still."}, {"n": 18, "q": "What must you do after being involved in a collision?", "a": "<strong>Stop and render assistance</strong>, provided you can do so without serious danger to your own vessel and crew. It is a legal duty."}, {"n": 19, "q": "Where must a PCL number be displayed?", "a": "<strong>On both sides of the bow</strong>, above the waterline, in block characters of the required minimum height, contrasting with the hull."}, {"n": 20, "q": "Before starting an inboard gasoline engine, what must you do?", "a": "<strong>Ventilate the bilge and run the blower</strong>, and sniff for fuel vapour before turning the key."}, {"n": 21, "q": "What are the symptoms of carbon monoxide poisoning, and what do they resemble?", "a": "<strong>Headache, dizziness, nausea, fatigue, confusion</strong> — they closely resemble <strong>seasickness</strong>, which is why CO poisoning is missed aboard boats."}, {"n": 22, "q": "What wind speed range triggers a Small Craft Warning?", "a": "<strong>20 to 33 knots.</strong>"}, {"n": 23, "q": "Which VHF channel is the distress and calling channel?", "a": "<strong>Channel 16</strong> (156.800 MHz)."}, {"n": 24, "q": "What are the three levels of radio priority calls?", "a": "<strong>MAYDAY</strong> (distress — grave and imminent danger), <strong>PAN PAN</strong> (urgency), <strong>SÉCURITÉ</strong> (safety)."}, {"n": 25, "q": "What is the first piece of information you should give in a MAYDAY after identifying yourself?", "a": "<strong>Your position.</strong> It is the one thing rescuers cannot work without."}];
  const PROGRESS_IDS = ["m00", "m01", "m02", "m03", "m04", "m05", "m06", "m07", "m08", "m09", "m10", "m11", "m12", "m13", "m14", "m15", "m16", "m17", "m18", "m19", "m20"];

  const TOOLS = [
    { id: "t-pos",   en: "Points of sail explorer", ua: "Курси відносно вітру" },
    { id: "t-quiz",  en: "PCOC practice exam",      ua: "Пробний екзамен PCOC" },
    { id: "t-cards", en: "Glossary flashcards",     ua: "Картки глосарія" },
    { id: "t-calc",  en: "Boat cost calculator",    ua: "Калькулятор вартості судна" },
    { id: "t-log",   en: "Logbook",                 ua: "Судновий журнал" }
  ];

  /* ---------------- persistence (degrades to memory) ---------------- */
  const KEY = "halifax-sailing-v1";
  let mem = null;
  function load() {
    if (mem) return mem;
    try {
      mem = JSON.parse(localStorage.getItem(KEY) || "{}");
    } catch (e) { mem = {}; }
    if (!mem.done)  mem.done = {};
    if (!mem.ck)    mem.ck = {};
    if (!mem.log)   mem.log = [];
    if (!mem.quiz)  mem.quiz = {};
    return mem;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(load())); } catch (e) { /* memory only */ }
  }
  const S = load();

  /* ---------------- helpers ---------------- */
  const $  = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const app = $("#app"), content = $("#content"), docTitle = $("#docTitle");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  let toastT;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200);
  }

  const money = n => "$" + Math.round(n).toLocaleString("en-CA");

  // Bilingual heading + intro for a tool view. In "both" mode the Ukrainian
  // sits under the English as a subtitle / separate paragraph rather than being
  // concatenated onto it.
  function toolHead(en, ua, dEn, dUa) {
    return '<div class="tool-head"><h2>' +
             '<span data-lang="en">' + en + "</span>" +
             '<span data-lang="ua">' + ua + "</span>" +
             '<em class="sub" data-lang="both">' + ua + "</em>" +
           "</h2>" +
           '<p data-lang="en">' + dEn + "</p>" +
           '<p data-lang="ua">' + dUa + "</p></div>";
  }

  // An inline EN/UA pair, separated when both are shown
  const pair = (en, ua) =>
    '<span data-lang="en">' + en + "</span>" +
    '<span class="sep" data-lang="both"> / </span>' +
    '<span data-lang="ua">' + ua + "</span>";

  /* ---------------- navigation ---------------- */
  let current = "readme";

  function buildNav() {
    const nav = $("#nav");
    let h = "";
    NAV.forEach(g => {
      h += '<p class="nav-group">' + esc(g.group) + "</p>";
      g.items.forEach(it => {
        h += '<button class="nav-item" data-go="' + it.id + '">' +
               '<span class="dot"></span>' +
               '<span><span data-lang="en">' + esc(it.en) + "</span>" +
               '<span data-lang="ua">' + esc(it.ua) + "</span></span></button>";
      });
    });
    h += '<p class="nav-group">Interactive tools · Інструменти</p>';
    TOOLS.forEach(t => {
      h += '<button class="nav-item tool" data-go="' + t.id + '">' +
             '<span class="dot"></span>' +
             '<span><span data-lang="en">' + esc(t.en) + "</span>" +
             '<span data-lang="ua">' + esc(t.ua) + "</span></span></button>";
    });
    nav.innerHTML = h;
    nav.addEventListener("click", e => {
      const b = e.target.closest("[data-go]");
      if (b) { go(b.dataset.go); closeNav(); }
    });
  }

  function refreshNav() {
    $$("#nav .nav-item").forEach(b => {
      const id = b.dataset.go;
      b.setAttribute("aria-current", id === current ? "true" : "false");
      b.classList.toggle("done", !!S.done[id]);
    });
    const total = PROGRESS_IDS.length;
    const done = PROGRESS_IDS.filter(id => S.done[id]).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("#progFill").style.width = pct + "%";
    $("#progTxt").textContent = done + " of " + total + " modules";
    $("#progPct").textContent = pct + "%";
  }

  function closeNav() { app.classList.remove("nav-open"); $("#burger").setAttribute("aria-expanded", "false"); }

  /* ---------------- document rendering ---------------- */
  const order = [];
  NAV.forEach(g => g.items.forEach(i => order.push(i.id)));

  function renderDoc(id) {
    const d = DOCS[id];
    if (!d) return;
    docTitle.textContent = d.t_en;
    const idx = order.indexOf(id);
    const prev = idx > 0 ? order[idx - 1] : null;
    const next = idx >= 0 && idx < order.length - 1 ? order[idx + 1] : null;
    const isMod = PROGRESS_IDS.indexOf(id) >= 0;
    const done = !!S.done[id];

    let foot = '<div class="doc-foot"><div class="btn-row">';
    if (prev) foot += '<button class="btn" data-go="' + prev + '">← ' + esc(DOCS[prev].t_en) + "</button>";
    if (next) foot += '<button class="btn" data-go="' + next + '">' + esc(DOCS[next].t_en) + " →</button>";
    foot += "</div>";
    if (isMod) {
      foot += '<button class="btn ' + (done ? "done" : "primary") + '" id="markBtn">' +
              (done ? "✓ Completed" : "Mark as complete") + "</button>";
    }
    foot += "</div>";

    content.innerHTML = '<article class="doc">' + d.html + "</article>" + foot;
    wireDoc(id);
    content.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function wireDoc(id) {
    // persistent checkboxes, keyed by document + index
    $$(".ck", content).forEach((box, i) => {
      const k = id + ":" + i;
      box.checked = !!S.ck[k];
      box.addEventListener("change", () => {
        if (box.checked) S.ck[k] = 1; else delete S.ck[k];
        save();
      });
    });
    const mark = $("#markBtn");
    if (mark) mark.addEventListener("click", () => {
      if (S.done[id]) delete S.done[id]; else S.done[id] = 1;
      save(); refreshNav(); renderDoc(id);
      toast(S.done[id] ? "Marked complete" : "Marked incomplete");
    });
    content.addEventListener("click", navDelegate);
  }

  function navDelegate(e) {
    const b = e.target.closest("[data-go],[data-nav]");
    if (!b) return;
    const t = b.dataset.go || b.dataset.nav;
    if (t) { e.preventDefault(); go(t); }
  }

  /* ---------------- router ---------------- */
  function go(id) {
    current = id;
    $("#search").value = "";
    if (id.indexOf("t-") === 0) renderTool(id); else renderDoc(id);
    refreshNav();
    try { history.replaceState(null, "", "#/" + id); } catch (e) {}
  }

  /* ---------------- search ---------------- */
  let INDEX = null;
  function buildIndex() {
    if (INDEX) return INDEX;
    INDEX = {};
    const scratch = document.createElement("div");
    Object.keys(DOCS).forEach(id => {
      scratch.innerHTML = DOCS[id].html;
      INDEX[id] = (scratch.textContent || "").replace(/\s+/g, " ").toLowerCase();
    });
    scratch.innerHTML = "";
    return INDEX;
  }

  function runSearch(q) {
    q = q.trim().toLowerCase();
    if (q.length < 2) { go(current); return; }
    const idx = buildIndex();
    const hits = [];
    Object.keys(DOCS).forEach(id => {
      const pos = idx[id].indexOf(q);
      if (pos >= 0) {
        const from = Math.max(0, pos - 70);
        hits.push({ id: id, title: DOCS[id].t_en, snippet: idx[id].slice(from, pos + 130) });
      }
    });
    docTitle.textContent = "Search";
    if (!hits.length) {
      content.innerHTML = '<div class="tool-head"><h2>No matches</h2>' +
        "<p>Nothing found for “" + esc(q) + "”. Try a shorter or more common word.</p></div>";
      return;
    }
    let h = '<div class="tool-head"><h2>' + hits.length + ' section' + (hits.length > 1 ? "s" : "") +
            " matching “" + esc(q) + "”</h2></div><div class=\"results\">";
    hits.forEach(r => {
      const s = esc(r.snippet).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"),
                                       "<mark>$1</mark>");
      h += '<button class="result" data-go="' + r.id + '"><b>' + esc(r.title) + "</b><span>…" + s + "…</span></button>";
    });
    h += "</div>";
    content.innerHTML = h;
    content.addEventListener("click", navDelegate);
  }
