<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A complete bilingual English/Ukrainian sailing course for beginners in Halifax, Nova Scotia — from the PCOC licence to Sail Canada skipper certification, with interactive tools.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9973;</text></svg>">
</head>
<body>
<title>Sailing Halifax · Interactive Course</title>

<style>
  /* ==========================================================
     Palette from Canadian Hydrographic Service chart convention:
     white-blue deep-water ground, navy engraving ink, and the
     cautionary magenta charts reserve for radio and warning
     information as the single accent. Buoy red/green stay
     strictly semantic.
     ========================================================== */
  :root {
    --water:#EDF2F5; --surface:#FAFCFD; --shoal:#DFEAF0; --sink:#E4EBEF;
    --ink:#0F1B24; --ink-soft:#556975; --ink-faint:#8598A4;
    --rule:#C4D3DC; --rule-soft:#DCE6EC;
    --magenta:#AC1A6E; --magenta-bg:#FBEAF3;
    --buoy-red:#AF262B; --buoy-green:#1C6E45;
    --shadow:0 1px 2px rgba(15,27,36,.06);
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --measure:68ch;
    --rail:274px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --water:#0B151C; --surface:#121E26; --shoal:#1A2A34; --sink:#0E1922;
      --ink:#E3EDF2; --ink-soft:#9AAEBA; --ink-faint:#6B808D;
      --rule:#2A3D49; --rule-soft:#1E2E38;
      --magenta:#F27CBE; --magenta-bg:#2B1526;
      --buoy-red:#EE7A7E; --buoy-green:#5FBE8C;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --water:#0B151C; --surface:#121E26; --shoal:#1A2A34; --sink:#0E1922;
    --ink:#E3EDF2; --ink-soft:#9AAEBA; --ink-faint:#6B808D;
    --rule:#2A3D49; --rule-soft:#1E2E38;
    --magenta:#F27CBE; --magenta-bg:#2B1526;
    --buoy-red:#EE7A7E; --buoy-green:#5FBE8C;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  :root[data-theme="light"]{
    --water:#EDF2F5; --surface:#FAFCFD; --shoal:#DFEAF0; --sink:#E4EBEF;
    --ink:#0F1B24; --ink-soft:#556975; --ink-faint:#8598A4;
    --rule:#C4D3DC; --rule-soft:#DCE6EC;
    --magenta:#AC1A6E; --magenta-bg:#FBEAF3;
    --buoy-red:#AF262B; --buoy-green:#1C6E45;
    --shadow:0 1px 2px rgba(15,27,36,.06);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--water);color:var(--ink);font-family:var(--body);
       font-size:16px;line-height:1.62;-webkit-text-size-adjust:100%}

  /* ---------- language visibility ---------- */
  .app[data-lang="en"] [data-lang="ua"]{display:none}
  .app[data-lang="ua"] [data-lang="en"]{display:none}
  .app:not([data-lang="both"]) [data-lang="both"]{display:none}
  /* where a Ukrainian subtitle is rendered separately, the inline Ukrainian
     twin would duplicate it in "both" mode */
  .app[data-lang="both"] .nav-item [data-lang="ua"],
  .app[data-lang="both"] .tool-head h2 > [data-lang="ua"]{display:none}

  /* ---------- shell ---------- */
  .app{display:flex;min-height:100vh}

  /* ---------- sidebar ---------- */
  .rail{
    width:var(--rail);flex:0 0 var(--rail);background:var(--surface);
    border-right:1px solid var(--rule);height:100vh;position:sticky;top:0;
    max-height:100vh;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .rail-head{padding:1.1rem 1.1rem .85rem;border-bottom:1px solid var(--rule-soft);
             display:flex;flex-direction:column;gap:.7rem}
  .brand{font-family:var(--display);font-size:1.16rem;font-weight:600;line-height:1.15;
         letter-spacing:-.01em;margin:0}
  .brand small{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.15em;
               text-transform:uppercase;color:var(--magenta);margin-bottom:.3rem;font-weight:400}
  .prog{display:flex;flex-direction:column;gap:.32rem}
  .prog-bar{height:4px;background:var(--sink);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;width:0;background:var(--magenta);transition:width .3s}
  .prog-txt{font-family:var(--mono);font-size:.63rem;letter-spacing:.08em;color:var(--ink-faint);
            display:flex;justify-content:space-between}
  .rail-search{padding:.7rem 1.1rem;border-bottom:1px solid var(--rule-soft)}
  .rail-search input{
    width:100%;padding:.5rem .6rem;font-family:var(--body);font-size:.86rem;
    background:var(--water);color:var(--ink);border:1px solid var(--rule);border-radius:2px;
  }
  .rail-search input:focus{outline:2px solid var(--magenta);outline-offset:1px}
  .rail-nav{overflow-y:auto;flex:1;padding:.55rem 0 2rem}
  .nav-group{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
             color:var(--ink-faint);padding:.95rem 1.1rem .34rem}
  .nav-item{
    display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
    padding:.4rem 1.1rem;border:0;background:none;color:var(--ink-soft);
    font-family:var(--body);font-size:.86rem;line-height:1.3;cursor:pointer;
    border-left:2px solid transparent;
  }
  .nav-item:hover{background:var(--shoal);color:var(--ink)}
  .nav-item[aria-current="true"]{background:var(--magenta-bg);color:var(--ink);
                                 border-left-color:var(--magenta);font-weight:600}
  .nav-item:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px;border:1px solid var(--ink-faint)}
  .nav-item.done .dot{background:var(--buoy-green);border-color:var(--buoy-green)}
  .nav-item.tool .dot{border-radius:1px;border-color:var(--magenta)}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--surface);
    border-bottom:1px solid var(--rule);padding:.6rem clamp(1rem,3vw,2rem);
    display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
  }
  .topbar .doc-title{font-family:var(--display);font-size:1rem;font-weight:600;
                     margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .burger{display:none;background:none;border:1px solid var(--rule);border-radius:2px;
          color:var(--ink);padding:.35rem .55rem;cursor:pointer;font-size:1rem;line-height:1}
  .seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:0 0 auto}
  .seg button{
    appearance:none;border:0;border-left:1px solid var(--rule);background:var(--surface);
    color:var(--ink-soft);font-family:var(--mono);font-size:.7rem;letter-spacing:.05em;
    padding:.4rem .62rem;cursor:pointer;
  }
  .seg button:first-child{border-left:0}
  .seg button:hover{background:var(--shoal);color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--magenta);color:var(--surface)}
  .seg button:focus-visible{outline:2px solid var(--magenta);outline-offset:-2px}

  .content{padding:clamp(1.1rem,3.4vw,2.4rem);max-width:1000px;width:100%}
  .doc{min-width:0}

  /* ---------- article typography ---------- */
  .doc h2{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.05rem);font-weight:600;
          line-height:1.14;letter-spacing:-.015em;text-wrap:balance;margin:0 0 .7rem}
  .doc h3{font-family:var(--display);font-size:1.32rem;font-weight:600;line-height:1.2;
          text-wrap:balance;margin:2.3rem 0 .55rem;padding-top:.9rem;border-top:1px solid var(--rule-soft)}
  .doc h4{font-family:var(--body);font-size:.94rem;font-weight:700;letter-spacing:.02em;
          margin:1.7rem 0 .45rem;color:var(--ink)}
  .doc h5{font-family:var(--mono);font-size:.7rem;font-weight:400;letter-spacing:.13em;
          text-transform:uppercase;color:var(--magenta);margin:1.4rem 0 .4rem}
  .doc p{margin:0 0 .85rem;max-width:var(--measure)}
  .doc ul,.doc ol{margin:0 0 1rem;padding-left:1.35rem}
  .doc li{margin:0 0 .38rem;max-width:var(--measure)}
  .doc hr{border:0;border-top:1px solid var(--rule-soft);margin:1.7rem 0}
  .doc a{color:var(--magenta);text-decoration-thickness:1px;text-underline-offset:2px}
  .doc a:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .doc code{font-family:var(--mono);font-size:.86em;background:var(--shoal);
            padding:.08em .3em;border-radius:2px}
  .doc [data-lang="ua"]{color:var(--ink-soft)}
  .doc h2 [data-lang="ua"],.doc h3 [data-lang="ua"]{color:var(--ink-soft);font-style:italic}
  .doc strong{font-weight:700}

  .pre-wrap{overflow-x:auto;background:var(--sink);border:1px solid var(--rule-soft);
            border-radius:2px;margin:0 0 1.1rem}
  .doc pre{font-family:var(--mono);font-size:.76rem;line-height:1.45;margin:0;padding:.9rem 1rem;
           white-space:pre}

  .table-wrap{overflow-x:auto;margin:0 0 1.2rem;border:1px solid var(--rule-soft);border-radius:2px}
  .doc table{border-collapse:collapse;width:100%;min-width:32rem;font-size:.88rem}
  .doc th,.doc td{text-align:left;vertical-align:top;padding:.5rem .75rem;
                  border-bottom:1px solid var(--rule-soft)}
  .doc th{font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;text-transform:uppercase;
          color:var(--ink-faint);font-weight:400;background:var(--sink);white-space:nowrap}
  .doc tbody tr:last-child td{border-bottom:0}
  .tabular{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

  .doc blockquote.callout{
    margin:0 0 1.2rem;padding:.9rem 1.05rem;background:var(--magenta-bg);
    border:1px solid var(--magenta);border-radius:2px;
  }
  .doc blockquote.callout > :last-child{margin-bottom:0}
  .doc blockquote.callout h3,.doc blockquote.callout h4{border-top:0;padding-top:0;margin-top:.4rem}

  .doc ul.checklist{list-style:none;padding-left:0}
  .doc ul.checklist li{margin-bottom:.3rem}
  .doc ul.checklist label{display:grid;grid-template-columns:1.05rem 1fr;gap:.6rem;
                          align-items:start;cursor:pointer}
  .doc ul.checklist input{margin:.34rem 0 0;accent-color:var(--magenta);width:.95rem;height:.95rem}
  .doc ul.checklist input:checked + span{color:var(--ink-faint);text-decoration:line-through}
  .doc details{border:1px solid var(--rule);border-radius:2px;padding:.7rem .9rem;margin:0 0 1.1rem;
               background:var(--surface)}
  .doc summary{cursor:pointer;font-weight:700}

  /* ---------- doc footer ---------- */
  .doc-foot{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:space-between;
            margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
  .btn{
    appearance:none;font-family:var(--body);font-size:.85rem;padding:.5rem .85rem;
    border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{background:var(--shoal)}
  .btn:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.done{background:var(--buoy-green);border-color:var(--buoy-green);color:#fff}
  .btn-row{display:flex;gap:.55rem;flex-wrap:wrap}

  /* ---------- search results ---------- */
  .results{display:flex;flex-direction:column;gap:.7rem;max-width:var(--measure)}
  .result{border:1px solid var(--rule);border-radius:2px;background:var(--surface);
          padding:.75rem .9rem;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
  .result:hover{background:var(--shoal)}
  .result:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .result b{display:block;font-family:var(--display);font-size:1.02rem;margin-bottom:.2rem}
  .result span{font-size:.83rem;color:var(--ink-soft)}
  .result mark{background:var(--magenta-bg);color:var(--ink);font-weight:700;padding:0 .1em}

  /* ---------- tools ---------- */
  .tool-head{margin:0 0 1.4rem}
  .tool-head h2{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.05rem);font-weight:600;
                line-height:1.14;letter-spacing:-.015em;margin:0 0 .35rem}
  .tool-head p{margin:0 0 .5rem;color:var(--ink-soft);max-width:var(--measure)}
  .tool-head p:last-child{margin-bottom:0}
  .tool-head h2 .sub{display:block;font-size:.95rem;font-style:italic;font-weight:400;
                     color:var(--ink-soft);letter-spacing:0;margin-top:.1em}
  .sep{color:var(--ink-faint)}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;
        box-shadow:var(--shadow);padding:1.15rem 1.15rem 1.3rem;margin:0 0 1.3rem}
  .card > :first-child{margin-top:0}
  .card h3{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:0 0 .6rem}
  .card-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
              color:var(--ink-faint);margin:0 0 .8rem;padding-bottom:.5rem;
              border-bottom:1px solid var(--rule-soft)}

  /* points of sail explorer */
  .pos-wrap{display:grid;grid-template-columns:1fr;gap:1.2rem;align-items:start}
  @media(min-width:860px){.pos-wrap{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
  .pos-svg{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
  .pos-svg:active{cursor:grabbing}
  .pos-svg .zone{fill:var(--shoal)}
  .pos-svg .rim{fill:none;stroke:var(--rule);stroke-width:1}
  .pos-svg .tick{stroke:var(--rule);stroke-width:1}
  .pos-svg .arc{fill:none;stroke:var(--magenta);stroke-width:3;stroke-linecap:round}
  .pos-svg .hull{fill:var(--surface);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
  .pos-svg .sail{fill:var(--magenta-bg);stroke:var(--magenta);stroke-width:2;stroke-linejoin:round}
  .pos-svg .boomline{stroke:var(--magenta);stroke-width:2.5;stroke-linecap:round}
  .pos-svg .wind{stroke:var(--magenta);stroke-width:2;fill:none}
  .pos-svg .windfill{fill:var(--magenta)}
  .pos-svg .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;fill:var(--ink-faint)}
  .pos-svg .lbl-wind{font-family:var(--mono);font-size:11px;letter-spacing:.1em;fill:var(--magenta)}
  .pos-svg .handle{fill:var(--magenta);stroke:var(--surface);stroke-width:2.5}
  .pos-readout{display:flex;flex-direction:column;gap:.85rem}
  .pos-name{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.1;margin:0}
  .pos-name em{display:block;font-size:.98rem;font-style:italic;font-weight:400;
               color:var(--ink-soft);margin-top:.15rem}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:1px;
         background:var(--rule-soft);border:1px solid var(--rule-soft)}
  .facts div{background:var(--surface);padding:.6rem .7rem}
  .facts dt{font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
            color:var(--ink-faint);margin-bottom:.22rem}
  .facts dd{margin:0;font-family:var(--mono);font-size:.95rem;font-variant-numeric:tabular-nums}
  .pos-note{background:var(--magenta-bg);border:1px solid var(--magenta);border-radius:2px;
            padding:.7rem .85rem;font-size:.88rem}
  .pos-note p{margin:0}
  .pos-note p + p{margin-top:.4rem}
  .pos-presets{display:flex;flex-wrap:wrap;gap:.4rem}
  .pos-presets button{font-family:var(--mono);font-size:.68rem;padding:.35rem .55rem;
                      border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);
                      border-radius:2px;cursor:pointer}
  .pos-presets button:hover{background:var(--shoal);color:var(--ink)}
  .pos-presets button[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
  .pos-presets button:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
  input[type=range]{width:100%;accent-color:var(--magenta)}

  /* quiz */
  .q-progress{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--ink-faint);
              text-transform:uppercase;margin:0 0 .7rem}
  .q-text{font-family:var(--display);font-size:1.28rem;line-height:1.32;margin:0 0 1.1rem;
          max-width:var(--measure)}
  .q-answer{background:var(--shoal);border-left:3px solid var(--buoy-green);border-radius:2px;
            padding:.85rem 1rem;margin:0 0 1.1rem;font-size:.94rem;max-width:var(--measure)}
  .q-answer strong{color:var(--ink)}
  .q-score{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);
           font-variant-numeric:tabular-nums}
  .q-final{font-family:var(--display);font-size:1.5rem;margin:0 0 .5rem}

  /* flashcards */
  .fc{
    background:var(--surface);border:1px solid var(--rule);border-radius:3px;
    min-height:11rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.5rem;padding:1.6rem 1.2rem;text-align:center;cursor:pointer;user-select:none;
    box-shadow:var(--shadow);
  }
  .fc:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .fc .term{font-family:var(--display);font-size:1.85rem;font-weight:600;line-height:1.15}
  .fc .say{font-family:var(--mono);font-size:.85rem;color:var(--magenta)}
  .fc .topic{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
             color:var(--ink-faint)}
  .fc .hint{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
            color:var(--ink-faint);margin-top:.3rem}
  .fc-controls{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
  select{font-family:var(--body);font-size:.85rem;padding:.45rem .55rem;background:var(--surface);
         color:var(--ink);border:1px solid var(--rule);border-radius:2px}
  select:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}

  /* calculator */
  .calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.9rem;
             margin:0 0 1.2rem}
  .field{display:flex;flex-direction:column;gap:.28rem}
  .field label{font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
               color:var(--ink-faint)}
  .field input[type=number]{font-family:var(--mono);font-size:1rem;padding:.45rem .55rem;
    background:var(--water);color:var(--ink);border:1px solid var(--rule);border-radius:2px;width:100%}
  .field input:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
  .opt{display:flex;align-items:center;gap:.5rem;font-size:.85rem;cursor:pointer}
  .opt input{accent-color:var(--magenta)}
  .total-row td{font-weight:700;border-top:2px solid var(--rule)!important;background:var(--sink)}
  .calc-note{font-size:.83rem;color:var(--ink-soft);max-width:var(--measure)}

  /* logbook */
  .log-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.75rem;
            margin:0 0 .9rem}
  .log-form input,.log-form textarea{font-family:var(--body);font-size:.88rem;padding:.45rem .55rem;
    background:var(--water);color:var(--ink);border:1px solid var(--rule);border-radius:2px;width:100%}
  .log-form textarea{grid-column:1/-1;min-height:4.5rem;resize:vertical}
  .log-form input:focus-visible,.log-form textarea:focus-visible{outline:2px solid var(--magenta);outline-offset:1px}
  .empty{color:var(--ink-faint);font-style:italic;font-size:.9rem}

  .warn-box{background:var(--magenta-bg);border:1px solid var(--magenta);border-radius:2px;
            padding:.85rem 1rem;font-size:.88rem;margin:0 0 1.2rem;max-width:var(--measure)}
  .warn-box p{margin:0}
  .warn-box p + p{margin-top:.45rem}

  .toast{
    position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:100;
    background:var(--ink);color:var(--water);font-size:.85rem;padding:.6rem 1rem;border-radius:3px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .toast.show{opacity:1}

  .scrim{display:none}

  /* ---------- mobile ---------- */
  @media(max-width:860px){
    .burger{display:block}
    .rail{
      position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-102%);
      transition:transform .22s ease;box-shadow:0 0 26px rgba(0,0,0,.22);height:100dvh;
    }
    .app.nav-open .rail{transform:none}

  const DOCS     = {"readme": {"t_en": "Overview", "t_ua": "Огляд", "html": "<h2>Sailing from Zero to Skipper — Halifax, Nova Scotia</h2><h2 data-lang=\"ua\">Вітрильний спорт від нуля до шкіпера — Галіфакс, Нова Шотландія</h2><p>A complete, bilingual (English / Ukrainian) sailing course written for a total beginner living in <strong>Halifax, Nova Scotia, Canada</strong>. It takes you from \"I have never been on a sailboat\" to holding the legal card you need to operate a boat in Canada, plus the real recognised sailing certifications that let you skipper a yacht — here at home and abroad.</p><p data-lang=\"ua\">Повний двомовний (англійська / українська) курс вітрильного спорту, написаний для повного новачка, який живе в <strong>Галіфаксі, Нова Шотландія, Канада</strong>. Він проведе вас від «я ніколи не був на вітрильнику» до отримання офіційної картки, необхідної для керування судном у Канаді, а також справжніх визнаних сертифікатів, які дозволять вам бути шкіпером яхти — і тут, і за кордоном.</p><hr><h3><span data-lang=\"en\">The single most important thing to understand first</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Найважливіше, що треба зрозуміти на початку</span></h3><p data-lang=\"en\">In Canada there is <strong>no \"sailboat driver's licence\"</strong> in the way there is a car driver's licence. Instead there are two completely different things, and you need both:</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>What it is</th><th>Legally required?</th></tr></thead><tbody><tr><td><strong>PCOC</strong> (Pleasure Craft Operator Card)</td><td>A government proof-of-competency card. A short safety exam. Covers rules, buoys, safety gear, emergencies. Valid <strong>for life</strong>.</td><td><strong>Yes</strong> — required by law for anyone operating a pleasure craft <strong>with a motor</strong>, including a sailboat with an auxiliary engine, even when the engine is switched off.</td></tr><tr><td><strong>Sail Canada certifications</strong> (Start Keelboating → Basic Cruising → Intermediate Cruising → Advanced → Offshore)</td><td>Real sailing skill qualifications. Taught and examined on the water by certified instructors. This is what actually makes you a sailor.</td><td><strong>No</strong> — not required by law. But it is what clubs, insurers, and charter companies ask for, and it is what keeps you and your crew alive.</td></tr></tbody></table></div><p data-lang=\"en\">So the honest answer to \"how do I get licensed?\" is: <strong>PCOC gives you the legal right. Sail Canada gives you the competence.</strong> This course delivers both.</p><p data-lang=\"ua\">У Канаді <strong>немає «водійських прав на вітрильник»</strong> так, як є права на автомобіль. Замість цього є дві абсолютно різні речі, і вам потрібні обидві:</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th></th><th>Що це</th><th>Обов'язково за законом?</th></tr></thead><tbody><tr><td><strong>PCOC</strong> (Pleasure Craft Operator Card)</td><td>Державна картка, що підтверджує компетентність. Короткий екзамен з безпеки. Охоплює правила, буї, спорядження безпеки, аварійні ситуації. Дійсна <strong>пожиттєво</strong>.</td><td><strong>Так</strong> — за законом обов'язкова для кожного, хто керує прогулянковим судном <strong>з двигуном</strong>, включно з вітрильником з допоміжним двигуном, навіть коли двигун вимкнений.</td></tr><tr><td><strong>Сертифікати Sail Canada</strong> (Start Keelboating → Basic Cruising → Intermediate Cruising → Advanced → Offshore)</td><td>Справжні кваліфікації вітрильної майстерності. Навчання та екзамен на воді з сертифікованими інструкторами. Саме це робить вас справжнім яхтсменом.</td><td><strong>Ні</strong> — не вимагається законом. Але саме це запитують яхт-клуби, страхові компанії та чартерні фірми, і саме це збереже життя вам і вашому екіпажу.</td></tr></tbody></table></div><p data-lang=\"ua\">Отже, чесна відповідь на питання «як отримати ліцензію?»: <strong>PCOC дає вам юридичне право. Sail Canada дає вам компетентність.</strong> Цей курс дає обидва.</p><blockquote class=\"callout\"><p>⚠️ <strong>Also required, and often forgotten:</strong> the <strong>Pleasure Craft Licence (PCL)</strong> is a <em>boat</em> registration — a free number for the hull, required if your boat has an engine of 10 hp (7.5 kW) or more. PCOC = licence for <strong>you</strong>. PCL = licence for <strong>the boat</strong>. They are not the same thing.</p><p data-lang=\"ua\">⚠️ <strong>Також обов'язково, і часто забувають:</strong> <strong>Pleasure Craft Licence (PCL)</strong> — це реєстрація <em>судна</em>, безкоштовний номер для корпусу, обов'язковий, якщо ваш човен має двигун 10 к.с. (7,5 кВт) або більше. PCOC = ліцензія для <strong>вас</strong>. PCL = ліцензія для <strong>човна</strong>. Це різні речі.</p></blockquote><hr><h3><span data-lang=\"en\">How this course is built</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Як побудований цей курс</span></h3><p data-lang=\"en\">Every lesson is written <strong>twice</strong> — English first, then Ukrainian immediately below, marked like this:</p><blockquote class=\"callout\"><p data-lang=\"en\">English text.</p><p data-lang=\"ua\">Український текст.</p></blockquote><p>Do not skip the English. Your instructor in Halifax will teach in English, the exam is in English, and radio calls are in English. Reading both versions side by side is how you build the vocabulary you will actually need on the water. Every technical term appears in both languages, and the full <a href=\"#/glossary\" data-nav=\"glossary\">Glossary</a> pairs them.</p><p data-lang=\"ua\">Кожен урок написаний <strong>двічі</strong> — спочатку англійською, потім українською одразу нижче, позначено так, як вище.</p><p data-lang=\"ua\">Не пропускайте англійську частину. Ваш інструктор у Галіфаксі викладатиме англійською, екзамен англійською, і радіозв'язок англійською. Читання обох версій паралельно — саме так ви побудуєте словниковий запас, який справді потрібен на воді. Кожен технічний термін подано двома мовами, а повний <a href=\"#/glossary\" data-nav=\"glossary\">Глосарій</a> поєднує їх.</p><hr><h3><span data-lang=\"en\">Course structure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Структура курсу</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Stage</th><th>Modules</th><th>Goal</th><th>Where</th></tr></thead><tbody><tr><td><strong>Stage 0 — Orientation</strong></td><td><a href=\"#/m00\" data-nav=\"m00\">00</a></td><td>Understand the licensing landscape, pick your path, set up your season</td><td>Home</td></tr><tr><td><strong>Stage 1 — Survive</strong></td><td><a href=\"#/m01\" data-nav=\"m01\">01</a> – <a href=\"#/m02\" data-nav=\"m02\">02</a></td><td>Cold-water safety, PFDs, and the physics of why a boat sails</td><td>Home</td></tr><tr><td><strong>Stage 2 — Understand the boat</strong></td><td><a href=\"#/m03\" data-nav=\"m03\">03</a> – <a href=\"#/m06\" data-nav=\"m06\">06</a></td><td>Boat parts, points of sail, sail trim, tacking/gybing, knots</td><td>Home + dock</td></tr><tr><td><strong>Stage 3 — Legal &amp; shore knowledge</strong></td><td><a href=\"#/m07\" data-nav=\"m07\">07</a> – <a href=\"#/m12\" data-nav=\"m12\">12</a></td><td>COLREGs, buoys, weather, charts, VHF radio, <strong>PCOC exam</strong></td><td>Home</td></tr><tr><td><strong>Stage 4 — Practical seamanship</strong></td><td><a href=\"#/m13\" data-nav=\"m13\">13</a> – <a href=\"#/m15\" data-nav=\"m15\">15</a></td><td>Engine, docking, emergencies, MOB, <strong>Basic Cruising</strong></td><td>On the water</td></tr><tr><td><strong>Stage 5 — Cruising &amp; mastery</strong></td><td><a href=\"#/m16\" data-nav=\"m16\">16</a> – <a href=\"#/m18\" data-nav=\"m18\">18</a></td><td>Anchoring, overnight, night sailing, Halifax cruising grounds, boat ownership</td><td>On the water</td></tr><tr><td><strong>Specialist tracks</strong></td><td><a href=\"#/m19\" data-nav=\"m19\">19</a> · <a href=\"#/m20\" data-nav=\"m20\">20</a></td><td><strong>Buying a boat in Nova Scotia</strong> (models, real prices, survey, true cost of ownership) and <strong>sailing with your family</strong> (child PFDs, CANSail for kids, trip design, co-skippering)</td><td>Home + on the water</td></tr></tbody></table></div><p>Full detail, hour estimates, and a dated Halifax season plan: <strong><a href=\"#/map\" data-nav=\"map\">COURSE_MAP.md</a></strong></p><p data-lang=\"ua\">Повна деталізація, оцінка годин та датований план сезону в Галіфаксі: <strong><a href=\"#/map\" data-nav=\"map\">COURSE_MAP.md</a></strong></p><hr><h3><span data-lang=\"en\">Live site</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Живий сайт</span></h3><p><strong>🌐 &lt;https://andriib-ca.github.io/SailBoat_Course/&gt;</strong></p><p>Deployed from <code>docs/</code> on every push by <code>.github/workflows/pages.yml</code>. Two pages:</p><ul><li><strong><a href=\"https://andriib-ca.github.io/SailBoat_Course/\" target=\"_blank\" rel=\"noopener\">/</a></strong> — the full interactive course</li><li><strong><a href=\"https://andriib-ca.github.io/SailBoat_Course/deck.html\" target=\"_blank\" rel=\"noopener\">/deck.html</a></strong> — the phone-sized quick-reference card</li></ul><p>The site asks search engines not to index it (<code>docs/robots.txt</code> plus a <code>noindex</code> meta tag) — a request that compliant crawlers honour, not access control.</p><p>Build details and how to rebuild: <a href=\"#/readme\" data-nav=\"readme\">web/README.md</a>.</p><hr><h3><span data-lang=\"en\">Interactive web app</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інтерактивний застосунок</span></h3><p data-lang=\"en\">The whole course as a <strong>single interactive page</strong> — every module and appendix with sidebar navigation, full-text search, an <strong>EN / UA / both</strong> language toggle, per-module progress tracking, and every checklist in the course made tickable and saved in your browser. Plus five tools built from the course content:</p><div class=\"table-wrap\"><table><thead><tr><th>Tool</th><th>What it does</th></tr></thead><tbody><tr><td><strong>Points of sail explorer</strong></td><td>Drag the boat around the wind and watch the sail ease out, the tack flip, and the trim angle change. The relationship you need in your hands, not just on a page.</td></tr><tr><td><strong>PCOC practice exam</strong></td><td>The 25 practice questions, shuffled and scored against the typical 75% pass mark.</td></tr><tr><td><strong>Glossary flashcards</strong></td><td>394 EN ⇄ UA term pairs, filterable by topic, drillable in either direction.</td></tr><tr><td><strong>Boat cost calculator</strong></td><td>Enter a price and length; get the annual running cost and the realistic all-in first year — the number most buyers never work out.</td></tr><tr><td><strong>Logbook</strong></td><td>Log hours, track hours as skipper separately, and export the whole thing as Markdown.</td></tr></tbody></table></div><p data-lang=\"en\">Published at: &lt;https://claude.ai/code/artifact/bcbdd612-704d-4ddf-83a1-70cf8c2e609c&gt;</p><p data-lang=\"en\">Rebuild it after editing any module with <code>python3 web/build.py</code>.</p><p data-lang=\"ua\">Увесь курс як <strong>одна інтерактивна сторінка</strong> — усі модулі й додатки з бічною навігацією, повнотекстовим пошуком, перемикачем мови <strong>EN / UA / обидві</strong>, відстеженням прогресу по модулях і всіма чек-листами курсу, які можна відмічати (зберігаються у браузері). Плюс п'ять інструментів: <strong>дослідник курсів відносно вітру</strong>, <strong>пробний екзамен PCOC</strong>, <strong>картки глосарія</strong> (394 пари термінів), <strong>калькулятор вартості судна</strong> і <strong>судновий журнал</strong> з експортом.</p><p data-lang=\"ua\">Перезбирайте після редагування модулів: <code>python3 web/build.py</code>.</p><hr><h3><span data-lang=\"en\">Phone-friendly quick reference</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швидкий довідник для телефону</span></h3><p data-lang=\"en\">Smaller and faster to load than the full app, for when you are at the dock or in a hurry: a condensed <strong>Deck Card</strong> holding the things you actually need at the dock or in a hurry: the 1‑10‑1 cold-water principle, points of sail, right of way, buoyage, the commands, the MAYDAY format, the pre-departure checklist, and the Halifax numbers. It has an <strong>EN / UA / both</strong> language toggle so you can collapse it to one language on a small screen. Published at: &lt;https://claude.ai/code/artifact/b0591ec2-e5b0-4121-badb-7b2df0bf0abf&gt;</p><p data-lang=\"ua\">Скорочена <strong>Палубна картка</strong> містить те, що справді потрібно на причалі або в спішці: принцип 1‑10‑1, курси відносно вітру, правила розходження, систему буїв, команди, формат MAYDAY, чек-лист перед виходом і числа Галіфаксу. Має перемикач мови <strong>EN / UA / обидві</strong>, щоб на малому екрані залишити одну.</p><hr><h3><span data-lang=\"en\">Reference material</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Довідкові матеріали</span></h3><ul><li><strong><a href=\"#/glossary\" data-nav=\"glossary\">Glossary EN ⇄ UA</a></strong> — every sailing term in both languages, with pronunciation help</li><li><strong><a href=\"#/resources\" data-nav=\"resources\">Halifax resources</a></strong> — clubs, schools, contacts, realistic costs</li><li><strong><a href=\"#/checklists\" data-nav=\"checklists\">Checklists</a></strong> — pre-departure, safety gear, docking, reefing, MOB</li><li><strong><a href=\"#/drills\" data-nav=\"drills\">Drills &amp; logbook</a></strong> — what to practise, and how to log hours</li><li><strong><a href=\"#/links\" data-nav=\"links\">Vetted links</a></strong> — free official sources worth your time</li></ul><hr><h3><span data-lang=\"en\">Start here</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Почніть тут</span></h3><p data-lang=\"en\">Read <a href=\"#/m00\" data-nav=\"m00\">Module 00 — Orientation</a>. It is short, and it tells you exactly what to book this week. It is <strong>late July</strong> as this course is written, which means the Halifax season is at its best right now and you can be on the water within days — do not wait for winter to \"study first.\"</p><p data-lang=\"ua\">Прочитайте <a href=\"#/m00\" data-nav=\"m00\">Модуль 00 — Орієнтація</a>. Він короткий, і він скаже вам точно, що забронювати цього тижня. Зараз <strong>кінець липня</strong>, коли створюється цей курс, а це означає, що сезон у Галіфаксі саме в найкращій формі, і ви можете вийти на воду за кілька днів — не чекайте зими, щоб «спочатку повчитися».</p><hr><h3><span data-lang=\"en\">Important disclaimer</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Важливе застереження</span></h3><p data-lang=\"en\">This course is a study aid and a training plan. It is <strong>not</strong> a substitute for:</p><ol><li data-lang=\"en\"><strong>Transport Canada's official <em>Safe Boating Guide</em> (TP 511)</strong> — the authority on required safety equipment and Canadian boating law. Equipment requirements depend on your exact boat length and configuration, and they change. Always verify against TP 511.</li><li data-lang=\"en\"><strong>Hands-on instruction from a Sail Canada certified instructor.</strong> You cannot learn to feel a boat from a document. Sailing is a physical skill.</li><li data-lang=\"en\"><strong>Current charts, tide tables, and marine forecasts.</strong> Any local detail in this course (chart numbers, VHF channels, prices, schedules) should be re-checked before you rely on it.</li></ol><p data-lang=\"en\">Nothing here is legal advice. Certification requirements are set by Transport Canada, ISED Canada, and Sail Canada, and only they can tell you the current rules.</p><p data-lang=\"ua\">Цей курс — навчальний посібник і план тренувань. Він <strong>не</strong> замінює:</p><ol><li data-lang=\"ua\"><strong>Офіційний <em>Safe Boating Guide</em> (TP 511) від Transport Canada</strong> — головне джерело щодо обов'язкового спорядження безпеки та канадського законодавства про судноплавство. Вимоги до спорядження залежать від точної довжини та конфігурації вашого судна, і вони змінюються. Завжди перевіряйте за TP 511.</li><li data-lang=\"ua\"><strong>Практичне навчання від сертифікованого інструктора Sail Canada.</strong> Неможливо навчитися відчувати судно з документа. Вітрильний спорт — це фізичний навик.</li><li data-lang=\"ua\"><strong>Актуальні карти, таблиці припливів і морські прогнози.</strong> Будь-які локальні деталі в цьому курсі (номери карт, VHF-канали, ціни, розписи) слід перевірити повторно, перш ніж на них покладатися.</li></ol><p data-lang=\"ua\">Ніщо тут не є юридичною консультацією. Вимоги до сертифікації встановлюють Transport Canada, ISED Canada та Sail Canada, і лише вони можуть повідомити актуальні правила.</p>"}, "map": {"t_en": "Course map & season plan", "t_ua": "Карта курсу та план сезону", "html": "<h2>Course Map &amp; Halifax Season Plan</h2><h2 data-lang=\"ua\">Карта курсу та план сезону в Галіфаксі</h2><hr><h3><span data-lang=\"en\">Part 1 — The certification ladder</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Частина 1 — Драбина сертифікацій</span></h3><p data-lang=\"en\">Here is the whole landscape on one page. Read it once; you do not need to memorise it.</p><p data-lang=\"ua\">Ось уся картина на одній сторінці. Прочитайте один раз; запам'ятовувати не потрібно.</p><h4><span data-lang=\"en\">Legal documents (issued by the Government of Canada)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Юридичні документи (видає уряд Канади)</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Document</th><th>What it lets you do</th><th>How you get it</th><th>Time</th><th>Cost (approx.)</th><th>Expires?</th></tr></thead><tbody><tr><td><strong>PCOC</strong> — Pleasure Craft Operator Card</td><td>Legally operate any motorised pleasure craft in Canada, incl. a sailboat with an auxiliary engine</td><td>Accredited online course + exam</td><td>3–6 h</td><td>$40–70 CAD</td><td>Never</td></tr><tr><td><strong>PCL</strong> — Pleasure Craft Licence</td><td>Registers the <em>hull</em>; required for engines ≥10 hp / 7.5 kW</td><td>Free application to Transport Canada</td><td>~2 weeks processing</td><td><strong>Free</strong></td><td>Renew every 10 yrs</td></tr><tr><td><strong>ROC(M)</strong> — Restricted Operator Certificate (Maritime)</td><td>Legally transmit on a marine VHF radio</td><td>Course + exam via CPS‑ECP (Canadian Power &amp; Sail Squadrons)</td><td>8–12 h</td><td>$75–150 CAD</td><td>Never</td></tr></tbody></table></div><h4><span data-lang=\"en\">Skill certifications (issued by Sail Canada)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сертифікати майстерності (видає Sail Canada)</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Level</th><th>You can...</th><th>Typical format</th><th>Prerequisite</th></tr></thead><tbody><tr><td><strong>Start Keelboating</strong></td><td>Sail a small keelboat as competent crew; handle sheets, helm, basic manoeuvres</td><td>2–4 days</td><td>None</td></tr><tr><td><strong>Basic Cruising</strong></td><td><strong>Skipper</strong> a 6–10 m sloop with an engine, by day, in moderate wind, in familiar waters</td><td>4–5 days</td><td>Start Keelboating (or equivalent skill)</td></tr><tr><td><strong>Intermediate Cruising</strong></td><td>Skipper a 9–12 m yacht with inboard engine, coastal, by day — <strong>the bareboat charter level</strong></td><td>5 days, often live-aboard</td><td>Basic Cruising</td></tr><tr><td><strong>Advanced Cruising</strong></td><td>Extended coastal passages including <strong>at night</strong></td><td>5–7 days</td><td>Intermediate Cruising</td></tr><tr><td><strong>Offshore</strong></td><td>Offshore passages, watch systems, heavy weather</td><td>Passage-based</td><td>Advanced Cruising</td></tr><tr><td><em>Coastal Navigation</em> (shore-based)</td><td>Chart work, tides, position fixing, passage planning</td><td>Winter classroom</td><td>None</td></tr><tr><td><em>Advanced Navigation</em> (shore-based)</td><td>Tidal computation, electronic nav, complex passage planning</td><td>Winter classroom</td><td>Coastal Navigation</td></tr></tbody></table></div><p data-lang=\"en\">Note the parallel track: <strong>CANSail 1–6</strong> is Sail Canada's <em>dinghy</em> program (small centreboard boats). CANSail teaches boat-feel faster and cheaper than keelboats because a dinghy responds instantly and capsizes harmlessly. If you want to become genuinely good rather than merely certified, do CANSail 1–2 alongside your keelboat training. It is the single best value in sailing education.</p><p data-lang=\"ua\">Зверніть увагу на паралельний шлях: <strong>CANSail 1–6</strong> — це програма Sail Canada для <em>дінгі</em> (малих човнів зі шверцем). CANSail навчає «відчуттю судна» швидше та дешевше, ніж кільові яхти, бо дінгі реагує миттєво і перевертається безболісно. Якщо ви хочете стати справді добрим, а не просто сертифікованим, пройдіть CANSail 1–2 паралельно з навчанням на кільовій яхті. Це найкраще співвідношення ціни та якості в навчанні вітрильному спорту.</p><h4><span data-lang=\"en\">If you want to charter abroad</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Якщо хочете брати яхту в чартер за кордоном</span></h4><p data-lang=\"en\">Canadian certificates are not automatically recognised in Europe. For a bareboat charter in Croatia, Greece, or the BVI you will usually need an <strong>ICC (International Certificate of Competence)</strong> or an <strong>IYT International Bareboat Skipper</strong>. Canadians typically obtain the ICC through an <strong>RYA-recognised training centre</strong> (Canada is not a signatory to the UN resolution that makes ICC issuance automatic). Some charter companies and their insurers will not accept an ICC alone and specifically ask for IYT Bareboat Skipper — check with the charter company <strong>before</strong> you pay for a certification. Practically: get to Sail Canada Intermediate Cruising first, then add whichever paper your chosen charter company demands.</p><p data-lang=\"ua\">Канадські сертифікати не визнаються автоматично в Європі. Для бербоут-чартеру в Хорватії, Греції або на Британських Віргінських островах вам зазвичай потрібен <strong>ICC (International Certificate of Competence)</strong> або <strong>IYT International Bareboat Skipper</strong>. Канадці зазвичай отримують ICC через <strong>центр навчання, визнаний RYA</strong> (Канада не підписала резолюцію ООН, яка робить видачу ICC автоматичною). Деякі чартерні компанії та їхні страховики не приймають лише ICC і вимагають саме IYT Bareboat Skipper — уточніть у чартерної компанії <strong>перед</strong> тим, як платити за сертифікацію. Практично: спочатку дійдіть до Sail Canada Intermediate Cruising, а потім додайте той документ, який вимагає обрана чартерна компанія.</p><hr><h3><span data-lang=\"en\">Part 2 — Module list with time estimates</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Частина 2 — Список модулів з оцінкою часу</span></h3><div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Module</th><th>Study time</th><th>Water time</th><th>Feeds into</th></tr></thead><tbody><tr><td>00</td><td><a href=\"#/m00\" data-nav=\"m00\">Orientation &amp; your first week</a></td><td>30 min</td><td>—</td><td>Everything</td></tr><tr><td>01</td><td><a href=\"#/m01\" data-nav=\"m01\">Safety &amp; cold water — read this first</a></td><td>1.5 h</td><td>—</td><td>PCOC, survival</td></tr><tr><td>02</td><td><a href=\"#/m02\" data-nav=\"m02\">How a sailboat actually works</a></td><td>2 h</td><td>—</td><td>All sailing</td></tr><tr><td>03</td><td><a href=\"#/m03\" data-nav=\"m03\">Boat anatomy &amp; rigging</a></td><td>2 h</td><td>2 h at dock</td><td>Start Keelboating</td></tr><tr><td>04</td><td><a href=\"#/m04\" data-nav=\"m04\">Points of sail &amp; sail trim</a></td><td>2.5 h</td><td>ongoing</td><td>Start Keelboating</td></tr><tr><td>05</td><td><a href=\"#/m05\" data-nav=\"m05\">Manoeuvres: tacking, gybing, heaving-to, reefing</a></td><td>2.5 h</td><td>ongoing</td><td>Basic Cruising</td></tr><tr><td>06</td><td><a href=\"#/m06\" data-nav=\"m06\">Knots &amp; ropework</a></td><td>2 h</td><td>practise daily</td><td>All levels</td></tr><tr><td>07</td><td><a href=\"#/m07\" data-nav=\"m07\">Rules of the road (COLREGs)</a></td><td>3 h</td><td>—</td><td><strong>PCOC</strong></td></tr><tr><td>08</td><td><a href=\"#/m08\" data-nav=\"m08\">Buoys, lights, shapes &amp; sound signals</a></td><td>2.5 h</td><td>—</td><td><strong>PCOC</strong></td></tr><tr><td>09</td><td><a href=\"#/m09\" data-nav=\"m09\">Weather for Halifax sailors</a></td><td>3 h</td><td>ongoing</td><td>Safety, Basic Cruising</td></tr><tr><td>10</td><td><a href=\"#/m10\" data-nav=\"m10\">Charts, tides &amp; navigation</a></td><td>4 h</td><td>ongoing</td><td>Coastal Navigation</td></tr><tr><td>11</td><td><a href=\"#/m11\" data-nav=\"m11\">VHF radio &amp; ROC(M)</a></td><td>3 h</td><td>—</td><td><strong>ROC(M)</strong></td></tr><tr><td>12</td><td><a href=\"#/m12\" data-nav=\"m12\">PCOC exam preparation</a></td><td>2 h</td><td>—</td><td><strong>PCOC</strong></td></tr><tr><td>13</td><td><a href=\"#/m13\" data-nav=\"m13\">Engine, docking &amp; boat handling under power</a></td><td>2 h</td><td>6 h+</td><td>Basic Cruising</td></tr><tr><td>14</td><td><a href=\"#/m14\" data-nav=\"m14\">Emergencies &amp; man overboard</a></td><td>2.5 h</td><td>4 h+</td><td>Basic Cruising</td></tr><tr><td>15</td><td><a href=\"#/m15\" data-nav=\"m15\">Basic Cruising — the practical skills list</a></td><td>2 h</td><td>30 h+</td><td><strong>Basic Cruising cert</strong></td></tr><tr><td>16</td><td><a href=\"#/m16\" data-nav=\"m16\">Intermediate Cruising: anchoring, overnight, provisioning</a></td><td>3 h</td><td>40 h+</td><td><strong>Intermediate cert</strong></td></tr><tr><td>17</td><td><a href=\"#/m17\" data-nav=\"m17\">Halifax &amp; South Shore cruising grounds</a></td><td>2 h</td><td>seasons</td><td>Passage planning</td></tr><tr><td>18</td><td><a href=\"#/m18\" data-nav=\"m18\">Owning a boat in Nova Scotia &amp; the road to mastery</a></td><td>2 h</td><td>years</td><td>Mastery</td></tr><tr><td><strong>19</strong></td><td><a href=\"#/m19\" data-nav=\"m19\"><strong>Buying a boat in Nova Scotia — a practical guide</strong></a></td><td>3 h</td><td>—</td><td>Ownership</td></tr><tr><td><strong>20</strong></td><td><a href=\"#/m20\" data-nav=\"m20\"><strong>Sailing with your family</strong></a></td><td>2.5 h</td><td>ongoing</td><td>Family safety</td></tr></tbody></table></div><p><strong>Total shore study: ~50 hours. Minimum water time to be genuinely competent: 100+ hours.</strong></p><p data-lang=\"ua\"><strong>Загалом теорії на берегі: ~50 годин. Мінімум часу на воді, щоб бути справді компетентним: 100+ годин.</strong></p><hr><h3><span data-lang=\"en\">Part 3 — Your dated Halifax season plan</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Частина 3 — Ваш датований план сезону в Галіфаксі</span></h3><p data-lang=\"en\">The Halifax sailing season runs roughly <strong>May (launch) to late October (haul-out)</strong>. This course is being written in <strong>late July 2026</strong>, which is excellent timing: August and September are arguably the <em>best</em> sailing months here — the dense June/July sea fog has usually eased, the water is at its warmest (roughly 12–18 °C), and the southwesterly sea breeze is reliable. You have about <strong>three months of usable season left this year.</strong> Use them. Do not sit indoors studying theory while the season burns.</p><p data-lang=\"ua\">Вітрильний сезон у Галіфаксі триває приблизно з <strong>травня (спуск на воду) до кінця жовтня (підйом на берег)</strong>. Цей курс створено в <strong>кінці липня 2026 року</strong>, і це відмінний час: серпень і вересень — імовірно, <em>найкращі</em> місяці для вітрильного спорту тут: густий морський туман червня/липня зазвичай спадає, вода найтепліша (приблизно 12–18 °C), а південно-західний морський бриз надійний. У вас залишилося приблизно <strong>три місяці придатного сезону цього року.</strong> Використайте їх. Не сидіть удома за теорією, поки сезон згорає.</p><h4><span data-lang=\"en\">Phase A — This week (late July 2026)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фаза A — Цього тижня</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Action</th><th>Why</th><th>Where</th></tr></thead><tbody><tr><td>☐ Buy and complete the <strong>PCOC</strong> online course + exam</td><td>3–6 hours, done in one evening. It is the legal card and it never expires. Do it now so it's never a blocker.</td><td>Any Transport Canada accredited provider</td></tr><tr><td>☐ Read <strong>Module 01 (Safety &amp; Cold Water)</strong></td><td>Halifax water is cold enough to kill you in the middle of summer. This is the one module you must not defer.</td><td>This repo</td></tr><tr><td>☐ Book a <strong>\"Try Sailing\" / intro session</strong></td><td>Get on the water within days. Confirms you actually like it before you spend money.</td><td>RNSYS runs short intro sails on the Northwest Arm</td></tr><tr><td>☐ Email 3 schools asking about <strong>August/September adult keelboat courses and cancellations</strong></td><td>Late-season spots open up. Ask to be put on a waitlist.</td><td>AYC Sailing School, RNSYS, Dartmouth YC, Nova Sail</td></tr><tr><td>☐ Show up at a <strong>Wednesday night race</strong> as crew</td><td>Free, and the fastest way to accumulate hours. Skippers are chronically short of crew. Say: <em>\"I'm brand new, I'll do whatever you tell me, I just want to learn.\"</em></td><td>Dartmouth YC (Bedford Basin) races Wed evenings into October</td></tr></tbody></table></div><h4><span data-lang=\"en\">Phase B — August–October 2026</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фаза B — Серпень–жовтень 2026</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Complete <strong>Start Keelboating</strong> (or the club's adult keelboat intro).</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Crew every single weekend you can. Target <strong>25+ hours on the water</strong> before haul-out.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Work through Modules 02–06 (boat, sails, trim, manoeuvres, knots) — these make sense far better <em>while</em> you are sailing.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Practise knots every evening. 10 minutes a day beats 2 hours a week.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Volunteer to help with <strong>autumn haul-out</strong> in October. You will learn more about boat systems in one haul-out day than in a month of reading — engine, seacocks, rigging, anti-fouling, winterising.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Start your <strong>logbook</strong> (see <a href=\"#/drills\" data-nav=\"drills\">appendix</a>). Every certification later will ask for logged hours and days.</span></label></li></ul><h4><span data-lang=\"en\">Phase C — Winter 2026/27 (November–April)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фаза C — Зима 2026/27</span></h4><p data-lang=\"en\">The boats come out of the water, and Halifax clubs move indoors. This is the classroom season and it is when the serious sailors get ahead.</p><p data-lang=\"ua\">Човни виходять з води, і клуби Галіфаксу переходять у приміщення. Це сезон теорії, і саме тоді серйозні яхтсмени вириваються вперед.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>ROC(M)</strong> VHF radio certificate — usually offered in winter by CPS‑ECP. Do it now, not in summer.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Coastal Navigation</strong> shore-based course — the best winter investment you can make.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Modules 07–12: COLREGs, buoys, weather, charts, radio.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Read one classic properly, not skimmed. Suggested: <em>The Annapolis Book of Seamanship</em> (Rousmaniere).</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Book your <strong>Basic Cruising course for spring 2027 in January</strong> — good courses fill by February.</span></label></li></ul><h4><span data-lang=\"en\">Phase D — Season 2027 (May–October)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фаза D — Сезон 2027</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Basic Cruising certification</strong> — early season, May/June.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Log <strong>50+ hours</strong>, in a variety of conditions. Deliberately sail in 15–20 kt once you have an instructor's supervision — comfort in fresh breeze is what separates skippers from passengers.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Day-sail destinations: McNabs Island, out to Chebucto Head, then a full day to St. Margaret's Bay.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Intermediate Cruising</strong> late season if you have the hours — this is the bareboat charter level.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Consider joining a club properly, or a <strong>sailing co-op / fractional share</strong> — far cheaper than ownership.</span></label></li></ul><h4><span data-lang=\"en\">Phase E — 2028 and beyond</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Фаза E — 2028 і далі</span></h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>First multi-day cruise: Halifax → Chester → Mahone Bay → Lunenburg. This is world-class cruising ground and it is on your doorstep.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Advanced Cruising</strong> (includes night sailing).</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>ICC or IYT Bareboat Skipper if chartering abroad.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Race seriously for one season — racing teaches sail trim better than any course.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Consider buying a boat (see <a href=\"#/m18\" data-nav=\"m18\">Module 18</a>) — or deliberately <em>not</em> buying one.</span></label></li></ul><hr><h3><span data-lang=\"en\">Part 4 — Realistic budget</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Частина 4 — Реалістичний бюджет</span></h3><p data-lang=\"en\">Approximate 2026 Canadian dollars. Verify all prices directly — these are planning estimates only, and club fees in particular vary a lot.</p><p data-lang=\"ua\">Приблизні канадські долари 2026 року. Перевіряйте всі ціни безпосередньо — це лише оцінки для планування, а клубні внески особливо сильно різняться.</p><div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Estimate</th><th>Notes</th></tr></thead><tbody><tr><td>PCOC online course + card</td><td>$40–70</td><td>One-time, lifetime</td></tr><tr><td>Try Sailing / intro session</td><td>$50–100</td><td>Worth it</td></tr><tr><td>Start Keelboating course</td><td>$400–700</td><td>2–4 days</td></tr><tr><td>Basic Cruising course</td><td>$700–1,200</td><td>4–5 days</td></tr><tr><td>Intermediate Cruising</td><td>$1,200–2,000</td><td>Often live-aboard</td></tr><tr><td>ROC(M) VHF certificate</td><td>$75–150</td><td>One-time, lifetime</td></tr><tr><td>Coastal Navigation course</td><td>$250–450</td><td>Winter</td></tr><tr><td>Club membership (associate/crew)</td><td>$200–600/yr</td><td>Crew memberships are much cheaper than full</td></tr><tr><td>Personal gear (see below)</td><td>$400–900</td><td>Spread over time</td></tr><tr><td><strong>Realistic Year 1 total</strong></td><td><strong>$1,500–2,500</strong></td><td>Excluding boat ownership</td></tr></tbody></table></div><h4><span data-lang=\"en\">Personal gear, in priority order</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Особисте спорядження, за пріоритетом</span></h4><p data-lang=\"en\">Buy in this order. Do not buy foul-weather gear first; borrow that at the start.</p><ol><li data-lang=\"en\"><strong>PFD / inflatable lifejacket that you will actually wear</strong> — the single most important purchase. Canadian-approved. An inflatable belt-pack or braces style is comfortable enough that you'll keep it on.</li><li data-lang=\"en\"><strong>Non-marking deck shoes or boots with grip</strong> — no black soles, they mark decks.</li><li data-lang=\"en\"><strong>Sailing gloves</strong> — ropes under load destroy soft hands fast.</li><li data-lang=\"en\"><strong>Warm layers: wool or synthetic, never cotton</strong> — cotton kills in cold wet conditions.</li><li data-lang=\"en\"><strong>Waterproof jacket and salopettes (foul-weather gear)</strong> — Halifax fog is wet even without rain.</li><li data-lang=\"en\"><strong>Sunglasses with a retainer, and real sunscreen</strong> — glare off water is brutal.</li><li data-lang=\"en\"><strong>A knife and a whistle on your PFD.</strong></li><li data-lang=\"en\"><strong>Headlamp with a red mode</strong> — for night sailing later.</li></ol><p data-lang=\"ua\">Купуйте в такому порядку. Не купуйте штормовий костюм першим; на початку позичте його.</p><ol><li data-lang=\"ua\"><strong>Рятувальний жилет / надувний жилет, який ви реально будете носити</strong> — найважливіша покупка. Схвалений у Канаді. Надувний пояс або на кшталт підтяжок достатньо комфортний, щоб ви його не знімали.</li><li data-lang=\"ua\"><strong>Палубне взуття або боти з нековзкою підошвою, що не залишає слідів</strong> — жодних чорних підошв, вони залишають смуги на палубі.</li><li data-lang=\"ua\"><strong>Вітрильні рукавички</strong> — троси під навантаженням швидко руйнують незвиклі руки.</li><li data-lang=\"ua\"><strong>Теплі шари: вовна або синтетика, ніколи бавовна</strong> — бавовна вбиває в холодних вологих умовах.</li><li data-lang=\"ua\"><strong>Водонепроникна куртка та штани (штормовий костюм)</strong> — туман Галіфаксу вологий навіть без дощу.</li><li data-lang=\"ua\"><strong>Сонцезахисні окуляри з ремінцем і справжній сонцезахисний крем</strong> — відблиск від води жорстокий.</li><li data-lang=\"ua\"><strong>Ніж і свисток на жилеті.</strong></li><li data-lang=\"ua\"><strong>Наголовний ліхтар з червоним режимом</strong> — для нічних переходів згодом.</li></ol><hr><h3><span data-lang=\"en\">Part 5 — How to study</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Частина 5 — Як вчитися</span></h3><p data-lang=\"en\"></p><ol><li data-lang=\"en\"><strong>Water time beats reading time, always.</strong> A module read <em>after</em> you have experienced the thing it describes will stick ten times better. If you have to choose between finishing a module and going sailing, go sailing.</li><li data-lang=\"en\"><strong>Learn the English terms first, Ukrainian second.</strong> Use Ukrainian to <em>check your understanding</em>, not as your primary language for the sport. When someone shouts \"ease the jib sheet!\" you need zero translation lag.</li><li data-lang=\"en\"><strong>Say things out loud.</strong> Sailing vocabulary is spoken, fast, and under pressure. Practise saying \"starboard tack\", \"ready to gybe\", \"helm's a-lee\" until they're automatic.</li><li data-lang=\"en\"><strong>Knots need repetition, not understanding.</strong> You must be able to tie a bowline behind your back, in the dark, cold and wet. That is muscle memory, and muscle memory needs daily reps.</li><li data-lang=\"en\"><strong>Keep a logbook from day one.</strong> Date, boat, crew, hours, wind, what you did, what went wrong. Certifications ask for it, and it's how you spot your own progress.</li></ol><p data-lang=\"ua\"></p><ol><li data-lang=\"ua\"><strong>Час на воді завжди важливіший за час читання.</strong> Модуль, прочитаний <em>після</em> того, як ви пережили описане, засвоюється в десять разів краще. Якщо треба вибирати між дочитуванням модуля і виходом під вітрилами — йдіть під вітрила.</li><li data-lang=\"ua\"><strong>Спочатку вивчайте англійські терміни, потім українські.</strong> Використовуйте українську, щоб <em>перевірити своє розуміння</em>, а не як основну мову для цього спорту. Коли хтось кричить «ease the jib sheet!», вам потрібна нульова затримка на переклад.</li><li data-lang=\"ua\"><strong>Промовляйте вголос.</strong> Вітрильна лексика вимовляється швидко і під тиском. Тренуйтеся казати «starboard tack», «ready to gybe», «helm's a-lee», доки це не стане автоматичним.</li><li data-lang=\"ua\"><strong>Вузли потребують повторення, а не розуміння.</strong> Ви повинні вміти зав'язати боулінь за спиною, в темряві, замерзлими мокрими руками. Це м'язова пам'ять, а вона вимагає щоденних повторів.</li><li data-lang=\"ua\"><strong>Ведіть судновий журнал з першого дня.</strong> Дата, судно, екіпаж, години, вітер, що робили, що пішло не так. Сертифікації це вимагають, і саме так ви бачите власний прогрес.</li></ol>"}, "m00": {"t_en": "00 · Orientation", "t_ua": "Орієнтація", "html": "<h2>Module 00 — Orientation: What You Are Actually Signing Up For</h2><h2 data-lang=\"ua\">Модуль 00 — Орієнтація: на що ви насправді підписуєтесь</h2><p><strong>Study time / Час: ~30 minutes</strong></p><hr><h3><span data-lang=\"en\">0.1 What sailing actually is</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що таке вітрильний спорт насправді</span></h3><p data-lang=\"en\">Let me set expectations honestly, because a lot of beginner material oversells this.</p><p data-lang=\"en\">Sailing a small keelboat on a pleasant August afternoon on the Northwest Arm is genuinely one of the most peaceful things a person can do. It is quiet, you are moving without an engine, and it feels like magic the first time the boat heels over and accelerates.</p><p data-lang=\"en\">Sailing is also: physically demanding, occasionally frightening, expensive, weather-dependent, and involves a large amount of unglamorous maintenance. In Nova Scotia it additionally involves cold water, dense fog, and a hurricane season. Roughly one in three people who try it decide it isn't for them, and that's a fine outcome.</p><p data-lang=\"en\">The skill itself has a distinctive learning curve: <strong>the first ten hours feel overwhelming</strong>, because you're absorbing a new vocabulary, a new set of physical reflexes, and a genuinely counter-intuitive physics all at once. Then something clicks around hour 15–20 and it starts to feel obvious. Almost everyone who quits, quits in the first ten hours. Push through that.</p><p data-lang=\"ua\">Дозвольте чесно окреслити очікування, бо багато матеріалів для новачків це перебільшують.</p><p data-lang=\"ua\">Плавання на невеликій кільовій яхті приємного серпневого дня на Northwest Arm — справді одна з найспокійніших речей, які може робити людина. Тихо, ви рухаєтесь без двигуна, і це відчувається як магія, коли човен уперше кренується і розганяється.</p><p data-lang=\"ua\">Вітрильний спорт також: фізично важкий, іноді страшний, дорогий, залежний від погоди, і включає багато неромантичного обслуговування. У Новій Шотландії до цього додаються холодна вода, густий туман і сезон ураганів. Приблизно один з трьох людей, які пробують, вирішують, що це не для них, і це нормальний результат.</p><p data-lang=\"ua\">Сам навик має характерну криву навчання: <strong>перші десять годин відчуваються як перевантаження</strong>, бо ви одночасно засвоюєте нову лексику, новий набір фізичних рефлексів і справді контрінтуїтивну фізику. Потім щось «клікає» приблизно на 15–20-й годині, і все починає здаватися очевидним. Майже всі, хто кидає, кидають у перші десять годин. Пройдіть цей етап.</p><hr><h3><span data-lang=\"en\">0.2 Dinghy or keelboat?</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Дінгі чи кільова яхта?</span></h3><p data-lang=\"en\">This is the first real decision, and most beginners get it wrong by skipping the dinghy.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th><strong>Dinghy</strong> (small open boat, centreboard)</th><th><strong>Keelboat</strong> (heavy boat, fixed ballasted keel)</th></tr></thead><tbody><tr><td>Size</td><td>2.5–5 m</td><td>6–12 m+</td></tr><tr><td>Crew</td><td>1–2</td><td>2–6</td></tr><tr><td>If overpowered</td><td><strong>Capsizes.</strong> You get wet, right it, carry on.</td><td><strong>Heels a lot but rights itself.</strong> Very hard to capsize.</td></tr><tr><td>Feedback</td><td>Instant. You feel every mistake immediately.</td><td>Slow and damped. Mistakes are forgiving but invisible.</td></tr><tr><td>Cost</td><td>Low</td><td>High</td></tr><tr><td>Teaches</td><td>Boat feel, wind awareness, reflexes</td><td>Systems, navigation, seamanship, crew management</td></tr><tr><td>Halifax program</td><td>CANSail 1–6</td><td>Start Keelboating → Basic Cruising → …</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The right answer for you: both, in this order — dinghy first, or at least concurrently.</strong></p><p data-lang=\"en\">Here's why. A keelboat is so heavy and stable that a beginner can sail one badly for two full seasons without ever discovering they don't understand wind direction. A dinghy tips you into the water the moment you misjudge a gust. That immediate, physical, unambiguous feedback is the fastest teacher in the sport. Two weekends in a dinghy will make you a visibly better keelboat sailor.</p><p data-lang=\"en\">But your stated goal is to be a <strong>licensed skipper of a sailboat</strong>, and that means keelboats — cruising boats with engines, cabins, and navigation gear. So keelboat certification is the spine of this course. Treat dinghy sailing as the accelerator.</p><p data-lang=\"ua\">Це перше справжнє рішення, і більшість новачків помиляються, пропускаючи дінгі.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th></th><th><strong>Дінгі</strong> (малий відкритий човен, шверт)</th><th><strong>Кільова яхта</strong> (важке судно, фіксований баластний кіль)</th></tr></thead><tbody><tr><td>Розмір</td><td>2,5–5 м</td><td>6–12 м+</td></tr><tr><td>Екіпаж</td><td>1–2</td><td>2–6</td></tr><tr><td>Якщо перевантажений вітром</td><td><strong>Перевертається.</strong> Ви мокрі, ставите назад, продовжуєте.</td><td><strong>Сильно кренується, але сама вирівнюється.</strong> Перевернути дуже важко.</td></tr><tr><td>Зворотний зв'язок</td><td>Миттєвий. Ви відчуваєте кожну помилку відразу.</td><td>Повільний і згладжений. Помилки прощаються, але невидимі.</td></tr><tr><td>Вартість</td><td>Низька</td><td>Висока</td></tr><tr><td>Чому вчить</td><td>Відчуття судна, усвідомлення вітру, рефлекси</td><td>Системи, навігація, морська справа, керування екіпажем</td></tr><tr><td>Програма в Галіфаксі</td><td>CANSail 1–6</td><td>Start Keelboating → Basic Cruising → …</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Правильна відповідь для вас: обидва, у такому порядку — спочатку дінгі, або хоча б паралельно.</strong></p><p data-lang=\"ua\">Ось чому. Кільова яхта настільки важка і стабільна, що новачок може погано керувати нею два повні сезони і ніколи не виявити, що не розуміє напрямку вітру. Дінгі скидає вас у воду в момент, коли ви неправильно оцінили порив. Цей миттєвий, фізичний, однозначний зворотний зв'язок — найшвидший учитель у цьому спорті. Два вихідних на дінгі зроблять вас помітно кращим яхтсменом на кільовій яхті.</p><p data-lang=\"ua\">Але ваша заявлена мета — бути <strong>ліцензованим шкіпером вітрильника</strong>, а це означає кільові яхти — круїзні судна з двигунами, каютами та навігаційним обладнанням. Тож сертифікація на кільових яхтах — це хребет цього курсу. Дінгі розглядайте як прискорювач.</p><hr><h3><span data-lang=\"en\">0.3 The Halifax advantage</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перевага Галіфаксу</span></h3><p data-lang=\"en\">You have landed in a genuinely excellent place to learn to sail, and you should know why:</p><ol><li data-lang=\"en\"><strong>The Northwest Arm</strong> is a 3.5 km long, roughly 0.5 km wide, deep, sheltered inlet running right into the city. It is almost perfectly protected from ocean swell, has steady wind, and is where two major yacht clubs teach. It is close to an ideal beginner's classroom.</li><li data-lang=\"en\"><strong>Bedford Basin</strong> is a huge, deep, enclosed basin at the top of the harbour — again sheltered, and home to Wednesday-night club racing.</li><li data-lang=\"en\"><strong>Real ocean is 30 minutes away.</strong> Once you're ready, you sail past McNabs Island and you are in the open Atlantic. Most inland sailors never get this.</li><li data-lang=\"en\"><strong>The South Shore — St. Margaret's Bay, Chester, Mahone Bay, Lunenburg — is world-class cruising ground</strong>, and it starts a day-sail from your home port. Sailors fly from Europe to cruise where you live.</li><li data-lang=\"en\"><strong>Deep sailing culture.</strong> The Royal Nova Scotia Yacht Squadron is one of the oldest yacht clubs in North America. There is a large, active, welcoming community, and Sail Nova Scotia is the provincial governing body coordinating training.</li></ol><p data-lang=\"ua\">Ви опинилися в справді відмінному місці, щоб навчитися вітрильному спорту, і варто знати, чому:</p><ol><li data-lang=\"ua\"><strong>Northwest Arm</strong> — глибока захищена затока довжиною 3,5 км і шириною близько 0,5 км, що входить прямо в місто. Вона майже ідеально захищена від океанської хвилі, має стабільний вітер, і саме там навчають два великі яхт-клуби. Це близько до ідеального класу для новачка.</li><li data-lang=\"ua\"><strong>Bedford Basin</strong> — величезний глибокий закритий басейн у верхній частині гавані — також захищений, і місце вечірніх клубних гонок по середах.</li><li data-lang=\"ua\"><strong>Справжній океан за 30 хвилин.</strong> Коли ви будете готові, ви проходите McNabs Island і опиняєтесь у відкритій Атлантиці. Більшість «внутрішніх» яхтсменів цього ніколи не мають.</li><li data-lang=\"ua\"><strong>Південне узбережжя — St. Margaret's Bay, Chester, Mahone Bay, Lunenburg — це круїзний район світового класу</strong>, і він починається за один денний перехід від вашого порту. Яхтсмени летять з Європи, щоб плавати там, де ви живете.</li><li data-lang=\"ua\"><strong>Глибока вітрильна культура.</strong> Royal Nova Scotia Yacht Squadron — один з найстаріших яхт-клубів Північної Америки. Тут велика, активна, гостинна спільнота, а Sail Nova Scotia — провінційний керівний орган, що координує навчання.</li></ol><hr><h3><span data-lang=\"en\">0.4 The Halifax disadvantages — know them now</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Недоліки Галіфаксу — знайте їх зараз</span></h3><p data-lang=\"en\">Being honest about the local hazards is part of the training, not a discouragement.</p><div class=\"table-wrap\"><table><thead><tr><th>Hazard</th><th>Reality</th><th>Covered in</th></tr></thead><tbody><tr><td><strong>Cold water</strong></td><td>Even in August the harbour is roughly 12–18 °C. That is cold enough to cause cold-water shock and to disable you in under an hour. This is the number one killer of Nova Scotia boaters, not storms.</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01</a></td></tr><tr><td><strong>Fog</strong></td><td>Halifax gets over 100 days a year of fog or mist, worst in June and July, caused by warm air over the cold Labrador Current. Visibility can drop to under 100 m in minutes.</td><td><a href=\"#/m09\" data-nav=\"m09\">Module 09</a></td></tr><tr><td><strong>Commercial shipping</strong></td><td>Halifax is a major container and naval port. A loaded container ship in the Narrows cannot stop, cannot easily turn, and may not see you. Sailing rights of way <strong>do not</strong> protect you here.</td><td><a href=\"#/m07\" data-nav=\"m07\">Module 07</a></td></tr><tr><td><strong>Hurricanes &amp; post-tropical storms</strong></td><td>August to October. They usually arrive weakened by the cold sea, but still bring destructive winds. Boats must be secured or hauled.</td><td><a href=\"#/m09\" data-nav=\"m09\">Module 09</a></td></tr><tr><td><strong>Short season</strong></td><td>Roughly May to late October. About 5.5 usable months. You must be deliberate about using them.</td><td><a href=\"#/map\" data-nav=\"map\">COURSE_MAP</a></td></tr><tr><td><strong>Rock &amp; shoal-strewn coast</strong></td><td>The Nova Scotia coast is beautiful and littered with unmarked rocks. Chart discipline is not optional here.</td><td><a href=\"#/m10\" data-nav=\"m10\">Module 10</a></td></tr></tbody></table></div><p data-lang=\"ua\">Честність щодо локальних небезпек — частина навчання, а не спроба відлякати.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Небезпека</th><th>Реальність</th><th>Розглянуто в</th></tr></thead><tbody><tr><td><strong>Холодна вода</strong></td><td>Навіть у серпні гавань має приблизно 12–18 °C. Цього достатньо, щоб викликати холодовий шок і позбавити вас дієздатності менш ніж за годину. Це вбивця №1 для яхтсменів Нової Шотландії, а не шторми.</td><td><a href=\"#/m01\" data-nav=\"m01\">Модуль 01</a></td></tr><tr><td><strong>Туман</strong></td><td>У Галіфаксі понад 100 днів на рік туману або мли, найгірше в червні та липні, через тепле повітря над холодною Лабрадорською течією. Видимість може впасти до менш ніж 100 м за хвилини.</td><td><a href=\"#/m09\" data-nav=\"m09\">Модуль 09</a></td></tr><tr><td><strong>Комерційне судноплавство</strong></td><td>Галіфакс — великий контейнерний і військово-морський порт. Завантажене контейнерне судно в Narrows не може зупинитися, не може легко повернути і може вас не бачити. Правила переваги вітрильників <strong>не</strong> захищають вас тут.</td><td><a href=\"#/m07\" data-nav=\"m07\">Модуль 07</a></td></tr><tr><td><strong>Урагани та пост-тропічні шторми</strong></td><td>Серпень–жовтень. Зазвичай приходять ослабленими через холодне море, але все ще приносять руйнівні вітри. Човни треба закріпити або підняти на берег.</td><td><a href=\"#/m09\" data-nav=\"m09\">Модуль 09</a></td></tr><tr><td><strong>Короткий сезон</strong></td><td>Приблизно з травня до кінця жовтня. Близько 5,5 придатних місяців. Треба свідомо їх використовувати.</td><td><a href=\"#/map\" data-nav=\"map\">COURSE_MAP</a></td></tr><tr><td><strong>Берег, засіяний скелями та мілинами</strong></td><td>Узбережжя Нової Шотландії красиве і всіяне непозначеними скелями. Дисциплінована робота з картою тут не опційна.</td><td><a href=\"#/m10\" data-nav=\"m10\">Модуль 10</a></td></tr></tbody></table></div><hr><h3><span data-lang=\"en\">0.5 Your first week — exact actions</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Ваш перший тиждень — точні дії</span></h3><p data-lang=\"en\">Do these five things. Nothing else matters yet.</p><ol><li data-lang=\"en\"><strong>Tonight: start the PCOC course.</strong> Pick any Transport Canada accredited provider, pay $40–70, and complete the study modules and exam. It requires a minimum of 3 hours' study by regulation, and most people finish in one evening. The card is valid for life. Getting this out of the way immediately means it is never the thing blocking you from a boat. See <a href=\"#/m12\" data-nav=\"m12\">Module 12</a> for exam preparation.</li><li data-lang=\"en\"><strong>Tomorrow: read <a href=\"#/m01\" data-nav=\"m01\">Module 01 — Safety &amp; Cold Water</a>.</strong> This is the only module in the course that could save your life this month. Do not defer it.</li><li data-lang=\"en\"><strong>This week: email or call three schools.</strong> Ask specifically: <em>\"Do you have any adult keelboat course spots or cancellations remaining for August or September? Can I be put on your waitlist, and do you have any intro sessions?\"</em> Contacts are in <a href=\"#/resources\" data-nav=\"resources\">appendix/halifax-resources.md</a>. Late-season cancellations are common and go to whoever asked.</li><li data-lang=\"en\"><strong>This week: book a Try Sailing / intro session.</strong> Two hours on the water, low cost, no commitment. It converts abstract interest into a real decision.</li><li data-lang=\"en\"><strong>This Wednesday: go to a club race night and offer to crew.</strong> Arrive an hour early, find the dock, and ask around. Be direct: <em>\"I'm completely new, I have no skills yet, but I'll show up on time, do exactly what I'm told, and I want to learn.\"</em> This is how nearly every sailor actually started, and it is free.</li></ol><p data-lang=\"ua\">Зробіть ці п'ять речей. Більше поки що не має значення.</p><ol><li data-lang=\"ua\"><strong>Сьогодні ввечері: почніть курс PCOC.</strong> Виберіть будь-якого провайдера, акредитованого Transport Canada, заплатіть $40–70, пройдіть навчальні модулі та екзамен. За регламентом потрібно мінімум 3 години навчання, і більшість завершує за один вечір. Картка дійсна пожиттєво. Зробивши це відразу, ви гарантуєте, що вона ніколи не стане перешкодою для виходу на човні. Підготовка до екзамену — <a href=\"#/m12\" data-nav=\"m12\">Модуль 12</a>.</li><li data-lang=\"ua\"><strong>Завтра: прочитайте <a href=\"#/m01\" data-nav=\"m01\">Модуль 01 — Безпека та холодна вода</a>.</strong> Це єдиний модуль курсу, який може врятувати вам життя цього місяця. Не відкладайте.</li>
