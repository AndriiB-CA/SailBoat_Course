    { lo: 155, max: 181, en: "Running",      ua: "Фордевінд",         trim: "all the way out",
      note_en: "Dead downwind. Feels calm because your speed subtracts from the true wind — which is exactly why it is deceptive and dangerous. The least stable point of sail: a small steering error can flip the wind to the other side of the mainsail and slam the boom across. Rig a preventer.",
      note_ua: "Чистий фордевінд. Відчувається спокійно, бо ваша швидкість віднімається від справжнього вітру — саме тому це оманливо й небезпечно. Найменш стабільний курс: мала помилка керування може перекинути вітер на інший бік грота і кинути ґік через судно. Заведіть завал-таль." }
  ];

  function zoneFor(a) {
    a = Math.abs(a);
    for (let i = 0; i < POS_ZONES.length; i++) if (a < POS_ZONES[i].max) return POS_ZONES[i];
    return POS_ZONES[POS_ZONES.length - 1];
  }
  function trimAngle(a) {
    a = Math.abs(a);
    if (a < 35) return 0;
    return Math.max(0, Math.min(85, (a - 30) * 0.62));
  }

  let posAngle = 90;   // signed: + = starboard tack (wind from starboard)

  function renderPOS() {
    docTitle.textContent = "Points of sail explorer";
    content.innerHTML =
      toolHead("Points of sail explorer", "Курси відносно вітру",
        "Drag the boat around the circle, or use the slider and the arrow keys. The wind always " +
        "blows from the top. Watch the sail ease out as you turn away from the wind — that " +
        "relationship is 80% of sail trim.",
        "Тягніть судно по колу або використовуйте повзунок і стрілки. Вітер завжди дме зверху. " +
        "Дивіться, як вітрило витравлюється, коли ви відвертаєте від вітру — це співвідношення " +
        "і є 80% налаштування вітрил.") +
      '<div class="card"><div class="pos-wrap">' +
        '<div><svg class="pos-svg" id="posSvg" viewBox="0 0 400 406" role="img" ' +
          'aria-label="Interactive points of sail diagram"></svg>' +
          '<label class="field" style="margin-top:.8rem">' +
            '<span style="font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;' +
            'text-transform:uppercase;color:var(--ink-faint)">Angle off the wind</span>' +
            '<input type="range" id="posRange" min="-180" max="180" step="1" value="90" ' +
            'aria-label="Angle off the wind in degrees">' +
          "</label>" +
          '<div class="pos-presets" id="posPresets"></div>' +
        "</div>" +
        '<div class="pos-readout" id="posOut"></div>' +
      "</div></div>";

    const presets = [
      ["In irons", 0], ["Close-hauled", 45], ["Close reach", 65],
      ["Beam reach", 90], ["Broad reach", 135], ["Running", 180]
    ];
    $("#posPresets").innerHTML = presets.map(p =>
      '<button type="button" data-a="' + p[1] + '">' + esc(p[0]) + "</button>").join("");
    $("#posPresets").addEventListener("click", e => {
      const b = e.target.closest("[data-a]");
      if (b) setPOS(Number(b.dataset.a) * (posAngle < 0 ? -1 : 1));
    });

    const range = $("#posRange");
    range.addEventListener("input", () => setPOS(Number(range.value)));

    const svg = $("#posSvg");
    let dragging = false;
    function fromEvent(ev) {
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width * 400 - 200;
      const y = (ev.clientY - r.top) / r.height * 400 - 200;
      // 0° = pointing at the wind (up); positive = clockwise (starboard tack)
      let a = Math.atan2(x, -y) * 180 / Math.PI;
      setPOS(Math.round(a));
    }
    svg.addEventListener("pointerdown", e => {
      dragging = true; svg.setPointerCapture(e.pointerId); fromEvent(e); e.preventDefault();
    });
    svg.addEventListener("pointermove", e => { if (dragging) fromEvent(e); });
    svg.addEventListener("pointerup",     () => { dragging = false; });
    svg.addEventListener("pointercancel", () => { dragging = false; });
    svg.setAttribute("tabindex", "0");
    svg.addEventListener("keydown", e => {
      const step = e.shiftKey ? 15 : 5;
      if (e.key === "ArrowRight" || e.key === "ArrowUp")   { setPOS(posAngle + step); e.preventDefault(); }
      if (e.key === "ArrowLeft"  || e.key === "ArrowDown") { setPOS(posAngle - step); e.preventDefault(); }
    });

    setPOS(posAngle);
  }

  function setPOS(a) {
    while (a > 180) a -= 360;
    while (a < -180) a += 360;
    posAngle = a;
    const range = $("#posRange");
    if (range) range.value = String(a);
    drawPOS();
  }

  function drawPOS() {
    const svg = $("#posSvg");
    if (!svg) return;
    const cx = 200, cy = 210, R = 132;
    const a = posAngle, abs = Math.abs(a), sign = a < 0 ? -1 : 1;
    const z = zoneFor(a), tr = trimAngle(a);
    const rad = a * Math.PI / 180;
    const bx = cx + Math.sin(rad) * R, by = cy - Math.cos(rad) * R;

    // hull: bow up in local space, rotated to the heading
    const hull =
      '<g transform="translate(' + cx + ',' + cy + ') rotate(' + a + ')">' +
        '<path class="hull" d="M0,-34 C11,-16 13,6 10,30 L-10,30 C-13,6 -11,-16 0,-34 Z"/>' +
        (z.trim === null
          ? '<line class="boomline" x1="0" y1="-14" x2="0" y2="26" stroke-dasharray="3 3"/>'
          : '<g transform="rotate(' + (-sign * tr) + ')">' +
              '<path class="sail" d="M0,-14 Q' + (-sign * 13) + ',6 0,26 Z"/>' +
              '<line class="boomline" x1="0" y1="-14" x2="0" y2="26"/>' +
            "</g>") +
        '<circle cx="0" cy="-14" r="1.9" fill="var(--ink)"/>' +
      "</g>";

    // no-go wedge, 35° either side of the wind
    const w = 35 * Math.PI / 180;
    const zx1 = cx + Math.sin(-w) * R, zy1 = cy - Math.cos(-w) * R;
    const zx2 = cx + Math.sin(w) * R,  zy2 = cy - Math.cos(w) * R;

    let ticks = "";
    for (let d = 0; d <= 180; d += 45) {
      [d, -d].forEach(dd => {
        const r2 = dd * Math.PI / 180;
        ticks += '<line class="tick" x1="' + (cx + Math.sin(r2) * (R - 7)) + '" y1="' + (cy - Math.cos(r2) * (R - 7)) +
                 '" x2="' + (cx + Math.sin(r2) * R) + '" y2="' + (cy - Math.cos(r2) * R) + '"/>';
      });
    }

    // arc along the rim marking the band the boat is currently in
    const zLo = z.lo * sign, zHi = Math.min(z.max, 180) * sign;
    const p1 = [cx + Math.sin(zLo * Math.PI / 180) * R, cy - Math.cos(zLo * Math.PI / 180) * R];
    const p2 = [cx + Math.sin(zHi * Math.PI / 180) * R, cy - Math.cos(zHi * Math.PI / 180) * R];
    const sweep = sign > 0 ? 1 : 0;
    const bandArc = '<path class="arc" d="M' + p1[0] + ',' + p1[1] + ' A' + R + ',' + R +
                    ' 0 0,' + sweep + ' ' + p2[0] + ',' + p2[1] + '"/>';

    const LR = R + 17;   // degree labels sit clear of the drag handle
    svg.innerHTML =
      '<line class="wind" x1="200" y1="14" x2="200" y2="48"/>' +
      '<polygon class="windfill" points="200,58 195,44 205,44"/>' +
      '<text class="lbl-wind" x="212" y="36">WIND · ВІТЕР</text>' +
      '<path class="zone" d="M' + cx + ',' + cy + ' L' + zx1 + ',' + zy1 +
        ' A' + R + ',' + R + ' 0 0,1 ' + zx2 + ',' + zy2 + ' Z"/>' +
      '<circle class="rim" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>' +
      ticks + bandArc +
      '<text class="lbl" x="' + cx + '" y="' + (cy - R + 30) + '" text-anchor="middle">NO-GO</text>' +
      '<text class="lbl" x="' + (cx - LR) + '" y="' + (cy + 4) + '" text-anchor="end">90°</text>' +
      '<text class="lbl" x="' + (cx + LR) + '" y="' + (cy + 4) + '">90°</text>' +
      '<text class="lbl" x="' + cx + '" y="' + (cy + LR + 6) + '" text-anchor="middle">180°</text>' +
      hull +
      '<circle class="handle" cx="' + bx + '" cy="' + by + '" r="7"/>';

    const tack = abs < 3 || abs > 177 ? "—" : (sign > 0 ? "Starboard" : "Port");
    const tackUa = abs < 3 || abs > 177 ? "—" : (sign > 0 ? "Правий" : "Лівий");
    const boom = z.trim === null ? "centred" : (sign > 0 ? "to port" : "to starboard");
    const boomUa = z.trim === null ? "по центру" : (sign > 0 ? "на лівий борт" : "на правий борт");

    $("#posOut").innerHTML =
      '<h3 class="pos-name">' + esc(z.en) + "<em>" + esc(z.ua) + "</em></h3>" +
      '<dl class="facts">' +
        "<div><dt>Angle off wind</dt><dd>" + Math.round(abs) + "°</dd></div>" +
        "<div><dt>Tack</dt><dd>" + pair(tack, tackUa) + "</dd></div>" +
        "<div><dt>Boom</dt><dd>" + pair(boom, boomUa) + "</dd></div>" +
        "<div><dt>Sail trim</dt><dd>" + (z.trim === null ? "flapping" : Math.round(tr) + "° out") + "</dd></div>" +
      "</dl>" +
      '<div class="pos-note"><p data-lang="en">' + z.note_en + "</p>" +
        '<p data-lang="ua">' + z.note_ua + "</p></div>";

    $$("#posPresets button").forEach(b => {
      b.setAttribute("aria-pressed", String(Math.abs(Number(b.dataset.a) - abs) < 3));
    });
  }

  function startQuiz() {
    qOrder = QUIZ.map((_, i) => i);
    for (let i = qOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = qOrder[i]; qOrder[i] = qOrder[j]; qOrder[j] = t;

    docTitle.textContent = "PCOC practice exam";
    const best = S.quiz.best;
    content.innerHTML =
      toolHead("PCOC practice exam", "Пробний екзамен PCOC",
        QUIZ.length + " questions in the style of the real Pleasure Craft Operator Card exam, " +
        "drawn from the course. Answer in your head, reveal, and mark yourself honestly.",
        QUIZ.length + " питань у стилі справжнього екзамену PCOC, узятих з курсу. " +

      "</div>" +

  function drawQuiz() {
    const card = $("#qCard");
    if (!card) return;
    if (qIdx >= qOrder.length) {
      const total = qRight + qWrong;
      const pct = total ? Math.round(qRight / total * 100) : 0;
      if (S.quiz.best === undefined || pct > S.quiz.best) { S.quiz.best = pct; save(); }
      card.innerHTML =
        '<p class="card-label">Result · Результат</p>' +
        '<p class="q-final">' + qRight + " / " + total + " — " + pct + "%</p>" +
        "<p>" + (pct >= 75
          ? '<span data-lang="en">That is above the typical 75% pass mark. Book the real thing.</span>' +
            '<span data-lang="ua">Це вище типового прохідного балу 75%. Бронюйте справжній екзамен.</span>'
          : '<span data-lang="en">Below the typical 75% pass mark. Review modules 07, 08 and 12, then try again.</span>' +
            '<span data-lang="ua">Нижче типового прохідного балу 75%. Перегляньте модулі 07, 08 і 12, потім спробуйте знову.</span>') +
        "</p>" +
        '<div class="btn-row" style="margin-top:1rem">' +
          '<button class="btn primary" id="qAgain">Try again</button>' +
          '<button class="btn" data-go="m12">Review Module 12</button>' +
        "</div>";
      $("#qAgain").addEventListener("click", startQuiz);
      card.addEventListener("click", navDelegate);
      return;
    }
    const q = QUIZ[qOrder[qIdx]];
    let h = '<p class="q-progress">Question ' + (qIdx + 1) + " of " + qOrder.length +
            ' · <span class="q-score">' + qRight + " right, " + qWrong + " wrong</span></p>" +
            '<p class="q-text">' + q.q + "</p>";
    if (qShown) {
      h += '<div class="q-answer"><strong>Answer.</strong> ' + q.a + "</div>" +
           '<div class="btn-row">' +
             '<button class="btn" id="qRight">✓ I had it right</button>' +
             '<button class="btn" id="qWrong">✗ I had it wrong</button>' +
           "</div>";
    } else {
      h += '<div class="btn-row"><button class="btn primary" id="qShow">Reveal answer</button>' +
           '<button class="btn" id="qSkip">Skip</button></div>';
    }
    card.innerHTML = h;
    if (qShown) {
      $("#qRight").addEventListener("click", () => { qRight++; qIdx++; qShown = false; drawQuiz(); });
      $("#qWrong").addEventListener("click", () => { qWrong++; qIdx++; qShown = false; drawQuiz(); });
    } else {
      $("#qShow").addEventListener("click", () => { qShown = true; drawQuiz(); });
      $("#qSkip").addEventListener("click", () => { qIdx++; qShown = false; drawQuiz(); });
    }
  }

  /* ================= TOOL: flashcards ================= */
  let fcPool = [], fcIdx = 0, fcFlipped = false, fcDir = "en2ua", fcTopic = "all";
  let fcRight = 0, fcSeen = 0;

  function renderCards() {
    docTitle.textContent = "Glossary flashcards";
    const topics = [];
    GLOSSARY.forEach(t => { if (t.topic && topics.indexOf(t.topic) < 0) topics.push(t.topic); });
    content.innerHTML =
      toolHead("Glossary flashcards", "Картки глосарія",
        GLOSSARY.length + " terms. Tap the card to flip, then say whether you knew it. Your " +

        "no translation lag.",
        GLOSSARY.length + " термінів. Натисніть картку, щоб перевернути. Ваш інструктор " +
        "викладає англійською, тому тренуйте EN → UA, доки англійське слово не приходитиме " +
        "без затримки на переклад.") +
      '<div class="card">' +
        '<div class="fc-controls" style="margin:0 0 1rem">' +
          '<select id="fcTopic" aria-label="Topic"><option value="all">All topics (' + GLOSSARY.length + ")</option>" +
            topics.map(t => '<option value="' + esc(t) + '">' + esc(t) + "</option>").join("") + "</select>" +
          '<select id="fcDir" aria-label="Direction">' +
            '<option value="en2ua">English → Українська</option>' +
            '<option value="ua2en">Українська → English</option></select>' +
          '<button class="btn" id="fcShuffle">Shuffle</button>' +
        "</div>" +
        '<div class="fc" id="fcCard" tabindex="0" role="button" aria-label="Flashcard, activate to flip"></div>' +
        '<div class="fc-controls" id="fcBtns"></div>' +
        '<p class="q-score" id="fcScore" style="margin:.9rem 0 0"></p>' +
      "</div>";
    $("#fcTopic").addEventListener("change", e => { fcTopic = e.target.value; buildPool(); });
    $("#fcDir").addEventListener("change", e => { fcDir = e.target.value; drawCard(); });
    $("#fcShuffle").addEventListener("click", buildPool);
    const c = $("#fcCard");
    c.addEventListener("click", flip);
    c.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    });
    buildPool();
  }

  function buildPool() {
    fcPool = GLOSSARY.filter(t => fcTopic === "all" || t.topic === fcTopic);
    for (let i = fcPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = fcPool[i]; fcPool[i] = fcPool[j]; fcPool[j] = t;
    }
    fcIdx = 0; fcFlipped = false; fcRight = 0; fcSeen = 0;
    drawCard();
  }

  function flip() { fcFlipped = !fcFlipped; drawCard(); }

  function drawCard() {
    const card = $("#fcCard");
    if (!card || !fcPool.length) { if (card) card.innerHTML = '<p class="empty">No terms in this topic.</p>'; return; }
    const t = fcPool[fcIdx % fcPool.length];
    const front = fcDir === "en2ua" ? t.en : t.ua;
    const back  = fcDir === "en2ua" ? t.ua : t.en;
    card.innerHTML = fcFlipped
      ? '<div class="topic">' + esc(t.topic) + "</div>" +
        '<div class="term">' + esc(back) + "</div>" +
        (t.say && fcDir === "ua2en" ? '<div class="say">' + esc(t.say) + "</div>" : "") +
        '<div class="hint">' + esc(front) + "</div>"
      : '<div class="topic">' + esc(t.topic) + "</div>" +
        '<div class="term">' + esc(front) + "</div>" +
        (t.say && fcDir === "en2ua" ? '<div class="say">' + esc(t.say) + "</div>" : "") +
        '<div class="hint">tap to flip</div>';
    $("#fcBtns").innerHTML = fcFlipped
      ? '<button class="btn" id="fcYes">✓ Knew it</button><button class="btn" id="fcNo">✗ Didn\'t</button>'
      : '<button class="btn primary" id="fcFlip">Flip</button>' +
        '<button class="btn" id="fcNext">Skip</button>';
    if (fcFlipped) {
      $("#fcYes").addEventListener("click", () => { fcRight++; fcSeen++; next(); });
      $("#fcNo").addEventListener("click",  () => { fcSeen++; next(); });
    } else {
      $("#fcFlip").addEventListener("click", flip);
      $("#fcNext").addEventListener("click", next);
    }
    $("#fcScore").textContent = fcSeen
      ? fcRight + " of " + fcSeen + " known (" + Math.round(fcRight / fcSeen * 100) + "%) · " +
        fcPool.length + " in deck"
      : fcPool.length + " terms in this deck";
    function next() { fcIdx++; fcFlipped = false; drawCard(); }
  }

    const dodger = $("#cDodger").checked;
    const diy = $("#cDiy").checked;

      ["Club membership",              600,            1800],
      ["Mooring or slip",              ft * 40,        ft * 115],
      ["Winter storage ashore",        ft * 25,        ft * 65],
      ["Haul-out and launch",          ft * 18 * diyF, ft * 40 * diyF],
      ["Insurance",                    Math.max(300, price * 0.0075), Math.max(450, price * 0.015)],
      ["Antifouling, anodes, consumables", ft * 12,    ft * 26],
      ["Engine service",               200 * diyF,     600 * diyF],
      ["Maintenance / repair fund",    Math.max(1500, price * 0.05), Math.max(3000, price * 0.10)],
      ["Fuel",                         150,            400],
      ["Safety gear renewal",          100,            300]
    ];
    const once = [
      ["Purchase price",               price,          price],
      ["Marine survey",                ft * 15,        ft * 30],
      ["Haul-out for the survey",      200,            600],
      ["Engine survey",                300,            700],
      ["Immediate must-fix items",     price * 0.07,   price * 0.25],
      ["Safety equipment + grab bag",  600,            1500],
      ["Ground tackle upgrade",        500,            1500],
      ["Personal gear for three",      1200,           2500]
    ];
    if (dodger) once.push(["Dodger", 1500, 3500]);

    const sum = rows => rows.reduce((a, r) => [a[0] + r[1], a[1] + r[2]], [0, 0]);
    const aT = sum(annual), oT = sum(once);
    const pctLow = price ? Math.round(aT[0] / price * 100) : 0;
    const pctHigh = price ? Math.round(aT[1] / price * 100) : 0;

    const table = (label, rows, total, totalLabel) =>
      '<p class="card-label">' + label + "</p>" +
      '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Low</th><th>High</th></tr></thead><tbody>' +
      rows.map(r => "<tr><td>" + esc(r[0]) + '</td><td class="tabular">' + money(r[1]) +
                    '</td><td class="tabular">' + money(r[2]) + "</td></tr>").join("") +
      '<tr class="total-row"><td>' + totalLabel + '</td><td class="tabular">' + money(total[0]) +
      '</td><td class="tabular">' + money(total[1]) + "</td></tr>" +
      "</tbody></table></div>";

    $("#calcOut").innerHTML =
      table("Annual running cost · Щорічні витрати", annual, aT, "Total per year") +
      '<p class="calc-note"><span data-lang="en">That is <strong>' + pctLow + "–" + pctHigh +
        "% of the boat's value every year</strong>, before anything unexpected. The line people leave out is the " +
        "maintenance fund — something fails every season.</span>" +
        '<span data-lang="ua">Це <strong>' + pctLow + "–" + pctHigh +
        "% вартості судна щороку</strong>, до будь-яких несподіванок. Рядок, який пропускають, — фонд ремонту.</span></p>" +
      '<div style="height:1.6rem"></div>' +
      table("First year, all in · Перший рік разом", once, oT, "Total one-time") +
      '<div class="warn-box" style="margin-top:1.2rem">' +
        '<p data-lang="en"><strong>Realistic first-year total: ' + money(oT[0] + aT[0]) + " – " +
          money(oT[1] + aT[1]) + "</strong> on a " + money(price) + " boat — purchase, commissioning and " +
          "one season of running costs together. Plan against this number, not the asking price.</p>" +
        '<p data-lang="ua"><strong>Реалістичний підсумок першого року: ' + money(oT[0] + aT[0]) + " – " +
          money(oT[1] + aT[1]) + "</strong> для судна за " + money(price) +
          ". Плануйте під це число, а не під ціну в оголошенні.</p>" +
      "</div>";
  }

  /* ================= TOOL: logbook ================= */
  function renderLog() {
    docTitle.textContent = "Logbook";
    content.innerHTML =
      toolHead("Logbook", "Судновий журнал",
        "Certifications, insurers and charter companies all ask for logged hours — and a log " +
        "is evidence where memory is not. Track hours as skipper separately: it is a different " +
        "skill from crewing, and it is what the next certification actually assesses.",
        "Сертифікації, страховики й чартерні компанії питають про записані години — журнал це " +
        "доказ, а пам'ять ні. Відстежуйте години як шкіпер окремо: це інший навик, ніж робота " +
        "в екіпажі.") +
      '<div class="card">' +
        '<p class="card-label">New entry · Новий запис</p>' +
        '<div class="log-form">' +
          '<input type="date" id="lgDate" aria-label="Date">' +
          '<input type="text" id="lgBoat" placeholder="Boat" aria-label="Boat">' +
          '<input type="text" id="lgRoute" placeholder="From → to" aria-label="Route">' +
          '<input type="number" id="lgHours" placeholder="Hours" step="0.5" min="0" aria-label="Hours">' +
          '<input type="text" id="lgWind" placeholder="Wind (e.g. SW 12 kt)" aria-label="Wind">' +
          '<label class="opt"><input type="checkbox" id="lgSkip"> I was skipper</label>' +
          '<textarea id="lgNotes" placeholder="What went well, what went wrong and why, what I&#39;ll do differently…" aria-label="Notes"></textarea>' +
        "</div>" +
        '<div class="btn-row"><button class="btn primary" id="lgAdd">Add entry</button>' +
        '<button class="btn" id="lgExport">Export as Markdown</button></div>' +
      "</div>" +
      '<div class="card"><p class="card-label">Totals · Підсумки</p><div id="lgTotals"></div></div>' +
      '<div class="card"><p class="card-label">Entries · Записи</p><div id="lgList"></div></div>';
    $("#lgDate").value = new Date().toISOString().slice(0, 10);
    $("#lgAdd").addEventListener("click", addLog);
    $("#lgExport").addEventListener("click", exportLog);
    drawLog();
  }

  function addLog() {
    const e = {
      date:  $("#lgDate").value,
      boat:  $("#lgBoat").value.trim(),
      route: $("#lgRoute").value.trim(),
      hours: Number($("#lgHours").value) || 0,
      wind:  $("#lgWind").value.trim(),
      skip:  $("#lgSkip").checked,
      notes: $("#lgNotes").value.trim()
    };
    if (!e.date && !e.boat && !e.hours) { toast("Add a date, boat or hours first"); return; }
    S.log.unshift(e); save();
    ["lgBoat", "lgRoute", "lgHours", "lgWind", "lgNotes"].forEach(id => { $("#" + id).value = ""; });
    $("#lgSkip").checked = false;
    drawLog();
    toast("Entry added");
  }

  function drawLog() {
    const total = S.log.reduce((a, e) => a + (e.hours || 0), 0);
    const skipper = S.log.reduce((a, e) => a + (e.skip ? (e.hours || 0) : 0), 0);
    $("#lgTotals").innerHTML =
      '<dl class="facts">' +
        "<div><dt>Entries</dt><dd>" + S.log.length + "</dd></div>" +
        "<div><dt>Total hours</dt><dd>" + total.toFixed(1) + "</dd></div>" +
        "<div><dt>Hours as skipper</dt><dd>" + skipper.toFixed(1) + "</dd></div>" +
        "<div><dt>Hours as crew</dt><dd>" + (total - skipper).toFixed(1) + "</dd></div>" +
      "</dl>";
    const list = $("#lgList");
    if (!S.log.length) {
      list.innerHTML = '<p class="empty">No entries yet. Add one after your next sail — the same day, ' +
                       "while you still remember what went wrong.</p>";
      return;
    }
    list.innerHTML =
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Boat</th><th>Route</th>' +
      "<th>Hrs</th><th>Role</th><th>Wind</th><th>Notes</th><th></th></tr></thead><tbody>" +
      S.log.map((e, i) =>
        '<tr><td class="tabular">' + esc(e.date || "") + "</td><td>" + esc(e.boat || "") +
        "</td><td>" + esc(e.route || "") + '</td><td class="tabular">' + (e.hours || 0) +
        "</td><td>" + (e.skip ? "Skipper" : "Crew") + "</td><td>" + esc(e.wind || "") +
        "</td><td>" + esc(e.notes || "") +
        '</td><td><button class="btn" data-del="' + i + '" aria-label="Delete entry">✕</button></td></tr>'
      ).join("") + "</tbody></table></div>";
    list.addEventListener("click", e => {
      const b = e.target.closest("[data-del]");
      if (!b) return;
      S.log.splice(Number(b.dataset.del), 1); save(); drawLog(); toast("Entry deleted");
    });
  }

  function exportLog() {
    if (!S.log.length) { toast("Nothing to export yet"); return; }
    let md = "# Sailing logbook\n\n";
    const total = S.log.reduce((a, e) => a + (e.hours || 0), 0);
    const skipper = S.log.reduce((a, e) => a + (e.skip ? (e.hours || 0) : 0), 0);
    md += "Total hours: " + total.toFixed(1) + "  \nHours as skipper: " + skipper.toFixed(1) +
          "  \nEntries: " + S.log.length + "\n\n---\n\n";
    S.log.forEach(e => {
      md += "## " + (e.date || "(no date)") + " — " + (e.boat || "(boat)") + "\n\n";
      md += "- Route: " + (e.route || "—") + "\n- Hours: " + (e.hours || 0) +
            "\n- Role: " + (e.skip ? "Skipper" : "Crew") + "\n- Wind: " + (e.wind || "—") + "\n\n";
      if (e.notes) md += e.notes + "\n\n";
    });
    if (!window.claude || !window.claude.downloads) {
      toast("Saving isn't available in this view");
      return;
    }
    window.claude.downloads.save({ filename: "sailing-logbook.md", data: md })
      .then(() => toast("Logbook saved"))
      .catch(err => {
        const code = err && err.code;
        if (code === "declined")          toast("Save cancelled");
        else if (code === "rate_limited") toast("Try again in a moment");
        else                              toast("Couldn't save the file");
      });
  }

  /* ---------------- tool router ---------------- */
  function renderTool(id) {
    if (id === "t-pos")   return renderPOS();
    if (id === "t-quiz")  return renderQuiz();
    if (id === "t-cards") return renderCards();
    if (id === "t-calc")  return renderCalc();
    if (id === "t-log")   return renderLog();
  }

  /* ---------------- boot ---------------- */
  buildNav();

  $$("[data-lang-set]").forEach(b => b.addEventListener("click", () => {
    app.setAttribute("data-lang", b.dataset.langSet);
    $$("[data-lang-set]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    S.lang = b.dataset.langSet; save();
  }));
  if (S.lang) {
    const b = $('[data-lang-set="' + S.lang + '"]');
    if (b) b.click();
  }

  let searchT;
  $("#search").addEventListener("input", e => {
    clearTimeout(searchT);
    const v = e.target.value;
    searchT = setTimeout(() => runSearch(v), 160);
  });

  $("#burger").addEventListener("click", () => {
    const open = app.classList.toggle("nav-open");
    $("#burger").setAttribute("aria-expanded", String(open));
  });
  $("#scrim").addEventListener("click", closeNav);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeNav(); });

  const start = (location.hash || "").replace(/^#\//, "");
  const valid = !!DOCS[start] || TOOLS.some(t => t.id === start);
  go(valid ? start : "readme");
})();
</script>
</body>
</html>
