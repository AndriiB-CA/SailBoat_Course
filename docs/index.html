ta-lang=\"en\"><strong>Judging your stopping distance is a real skill</strong>, and it's the thing you'll get wrong when picking up a mooring or coming alongside. A 9 m keelboat under sail at 5 knots takes several boat lengths to stop. Practise the approach to a mooring buoy or a floating fender ten times in open water before you try it for real.</p><p data-lang=\"ua\">У вітрильника немає гальм. Ви зупиняєтесь, забираючи тягу:</p><ul><li data-lang=\"ua\"><strong>Вийти до вітру</strong> — найшвидший спосіб зупинитися. Вітрила заполіскують, судно гальмує і стає за одну-дві довжини корпусу.</li><li data-lang=\"ua\"><strong>Повністю потравити всі шкоти</strong> — вітрила лопотять, судно котиться до зупинки. Шумно і шкідливо для вітрил, але дієво.</li><li data-lang=\"ua\"><strong>Лягти в дрейф</strong> (§5.4) — контрольована стійка зупинка.</li><li data-lang=\"ua\"><strong>Спустити вітрила і використати двигун</strong> — практична відповідь біля причалів.</li></ul><p data-lang=\"ua\"><strong>Оцінка гальмівного шляху — це справжній навик</strong>, і саме тут ви помилитесь, коли будете брати швартовий буй або підходити лагом. Кільова яхта 9 м під вітрилами на 5 вузлах гальмує кілька довжин корпусу. Потренуйтесь підходити до швартового буя або плавучого кранця десять разів у чистій воді, перш ніж робити це по-справжньому.</p><h4><span data-lang=\"en\">Hoisting and dropping sails</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Підйом і спуск вітрил</span></h4><p data-lang=\"en\"></p><ul><li data-lang=\"en\"><strong>Hoist the mainsail head to wind</strong> (or nearly), so it isn't pressed against the rigging. Ease the mainsheet fully first, and take up the topping lift.</li><li data-lang=\"en\"><strong>Hoist the headsail after the main</strong>, usually once you're clear and settled.</li><li data-lang=\"en\"><strong>Drop in the reverse order</strong> — headsail first, main last. This keeps the boat controllable and keeps steerage.</li><li data-lang=\"en\"><strong>Never leave a halyard loose to fly</strong> — it wraps around the masthead and someone has to go up the mast.</li><li data-lang=\"en\"><strong>Watch for people on the foredeck.</strong> Anyone forward of the mast should be clipped on in anything but flat calm.</li></ul><p data-lang=\"ua\"></p><ul><li data-lang=\"ua\"><strong>Піднімайте грот носом до вітру</strong> (або майже), щоб він не тиснув на такелаж. Спочатку повністю потравіть гика-шкот і підберіть топенант.</li><li data-lang=\"ua\"><strong>Піднімайте переднє вітрило після грота</strong>, зазвичай коли вийшли на чисту воду і встановились.</li><li data-lang=\"ua\"><strong>Спускайте у зворотному порядку</strong> — спочатку переднє, грот останнім. Це зберігає керованість.</li><li data-lang=\"ua\"><strong>Ніколи не залишайте фал вільно летіти</strong> — він обмотається навколо топа мачти, і комусь доведеться лізти на мачту.</li><li data-lang=\"ua\"><strong>Слідкуйте за людьми на баку.</strong> Будь-хто перед мачтою мусить бути пристібнутий у будь-яких умовах, крім повного штилю.</li></ul><hr><h3><span data-lang=\"en\">5.7 Practice progression</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Прогресія тренувань</span></h3><p data-lang=\"en\">Work through these in order. Do each until it is boring, then move on. Boring means competent.</p><div class=\"table-wrap\"><table><thead><tr><th>Level</th><th>Drill</th><th>Target</th></tr></thead><tbody><tr><td>1</td><td>Sail a beam reach in a straight line for 5 minutes</td><td>Steady course, sails trimmed, no wandering</td></tr><tr><td>2</td><td>Head up and bear away smoothly, coordinating sheets</td><td>Sails never luff or over-heel during the turn</td></tr><tr><td>3</td><td>Find and hold the close-hauled groove using telltales</td><td>3 minutes with telltales streaming</td></tr><tr><td>4</td><td>Tack repeatedly, both directions</td><td>10 consecutive tacks without getting stuck in irons</td></tr><tr><td>5</td><td>Deliberately get into irons and get out again</td><td>5 times, confidently</td></tr><tr><td>6</td><td>Controlled gybes with the mainsheet in</td><td>10 gybes, boom never slams</td></tr><tr><td>7</td><td>Heave-to, hold it for 5 minutes, sail away</td><td>5 times, unassisted</td></tr><tr><td>8</td><td>Reef and shake out, under sail, in 12–15 kt</td><td>Under 5 minutes, no drama</td></tr><tr><td>9</td><td>Sail a triangular course: beat, reach, run, back to start</td><td>Complete without engine, hitting each mark</td></tr><tr><td>10</td><td>Approach and stop at a mooring buoy under sail</td><td>3 out of 5 successful pickups</td></tr><tr><td>11</td><td>MOB recovery under sail (see <a href=\"#/m14\" data-nav=\"m14\">Module 14</a>)</td><td>Recover a fender in under 3 minutes, repeatedly</td></tr><tr><td>12</td><td>Sail the whole day without touching the engine</td><td>Including leaving and returning to the mooring</td></tr></tbody></table></div><p data-lang=\"ua\">Проходьте це за порядком. Робіть кожне, доки не стане нудно, потім рухайтесь далі. Нудно означає компетентно.</p><p data-lang=\"ua\">Останній пункт — <strong>пройти цілий день, не торкаючись двигуна, включно з відходом і поверненням до бочки</strong> — це той момент, коли ви вже справді вмієте керувати вітрильником.</p><hr><h3><span data-lang=\"en\">5.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Which part of the boat passes through the wind when tacking? When gybing?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which manoeuvre is dangerous, and exactly why?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give the two-call sequence for a tack, verbatim in English.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give the two-call sequence for a gybe, verbatim in English.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the single most important step in a safe gybe?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is a \"chicken gybe\" and when would you use one?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe how to heave-to in five steps.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name six situations where heaving-to solves your problem.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does \"reef early, reef often\" mean in practice?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name five signs you should already have reefed.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why must you reduce headsail as well as main when reefing?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you get out of irons?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка частина судна проходить через вітер при оверштагу? При фордевінді?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який маневр небезпечний і чому саме?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть послідовність двох команд для оверштага, дослівно англійською.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть послідовність двох команд для фордевінда, дослівно англійською.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який єдиний найважливіший крок безпечного повороту фордевінд?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке «chicken gybe» і коли його застосовувати?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть, як лягти в дрейф, у п'ять кроків.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть шість ситуацій, де лежання в дрейфі вирішує проблему.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає «беріть риф рано, беріть риф часто» на практиці?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять ознак, що риф уже давно треба було взяти.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому при взятті рифа треба зменшувати і переднє вітрило, а не лише грот?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як вийти з левентика?</span></label></li></ul><hr>"}, "m06": {"t_en": "06 · Knots & ropework", "t_ua": "Вузли", "html": "<h2>Module 06 — Knots &amp; Ropework</h2><h2 data-lang=\"ua\">Модуль 06 — Вузли та робота з тросами</h2><p><strong>Study time / Час: ~2 hours + 10 minutes daily practice</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">You need about eight knots to sail competently, and you need them as <strong>reflexes, not knowledge</strong>. The test is not \"can I tie a bowline?\" — it is \"can I tie a bowline in the dark, with cold wet hands, behind my back, while someone is shouting, in under five seconds?\" That only comes from daily repetition. Buy 2 metres of 8–10 mm rope, keep it by your couch, and tie knots while watching television. Two weeks of that and you're done for life.</p><p data-lang=\"ua\">Для компетентного плавання потрібно близько восьми вузлів, і потрібні вони як <strong>рефлекси, а не знання</strong>. Тест не «чи можу я зав'язати боулінь?», а «чи можу я зав'язати боулінь у темряві, замерзлими мокрими руками, за спиною, коли на мене кричать, менш ніж за п'ять секунд?» Це дає лише щоденне повторення. Купіть 2 метри троса 8–10 мм, тримайте біля дивана і в'яжіть вузли, дивлячись телевізор. Два тижні — і це з вами на все життя.</p></blockquote><hr><h3><span data-lang=\"en\">6.1 Rope vocabulary</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Лексика троса</span></h3><p data-lang=\"en\">You cannot follow knot instructions without these five words.</p><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Working end</strong></td><td>The end you are actively tying with</td><td>робочий кінець</td></tr><tr><td><strong>Standing part</strong></td><td>The long, loaded, \"rest of the rope\" part</td><td>коренний кінець</td></tr><tr><td><strong>Bitter end</strong></td><td>The very end of the rope</td><td>ходовий кінець</td></tr><tr><td><strong>Bight</strong></td><td>A U-shaped bend in the rope, ends not crossed</td><td>петля (незамкнена)</td></tr><tr><td><strong>Loop</strong></td><td>A bight where the rope crosses itself</td><td>замкнена петля</td></tr><tr><td><strong>Hitch</strong></td><td>A knot tying a rope <strong>to an object</strong></td><td>штик / вузол до предмета</td></tr><tr><td><strong>Bend</strong></td><td>A knot tying <strong>two ropes together</strong></td><td>зв'язуючий вузол</td></tr><tr><td><strong>Standing / running</strong></td><td>Fixed rigging / rope you pull</td><td>стоячий / бігучий</td></tr><tr><td><strong>Whipping</strong></td><td>Binding the end of a rope to stop it fraying</td><td>марка</td></tr><tr><td><strong>Chafe</strong></td><td>Wear from rubbing</td><td>протирання / чейф</td></tr></tbody></table></div><p data-lang=\"ua\">Без цих п'яти слів неможливо слідувати інструкціям з в'язання вузлів.</p><hr><h3><span data-lang=\"en\">6.2 The eight knots you need</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вісім вузлів, які вам потрібні</span></h3><h4><span data-lang=\"en\">1. Figure-eight knot (stopper knot)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вісімка (стопорний вузол)</span></h4><p><strong>Use / Застосування:</strong> A stopper at the end of every sheet and halyard, so the line cannot run out through a block and escape. <strong>This is the most-used knot on a boat</strong>, and the reason you never lose a sheet overboard.</p><div class=\"pre-wrap\"><pre>   Make a loop, pass the working end BEHIND the standing part,\n   then down through the loop.\n\n        standing part\n             │\n             │   ╭─────╮\n             │  ╱       ╲\n             ╰─┤    ○    │      ← the end goes around behind,\n               │╲       ╱          then down through the loop\n               │ ╰─────╯\n            working end</pre></div><p data-lang=\"en\"><strong>Why not a simple overhand knot?</strong> A figure-eight is bulkier (so it jams in a block more reliably), and crucially it does <em>not</em> jam solid under load — you can always untie it. An overhand knot under heavy load may have to be cut off.</p><p data-lang=\"ua\"><strong>Чому не простий вузол?</strong> Вісімка об'ємніша (тому надійніше застрягає в блоці), і головне — вона <em>не</em> затягується намертво під навантаженням: її завжди можна розв'язати. Простий вузол під великим навантаженням часто доводиться зрізати.</p><hr><h4 data-lang=\"ua\"><span data-lang=\"en\">2. Bowline</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Боулінь (беседковий вузол)</span></h4><p><strong>Use / Застосування:</strong> Puts a <strong>fixed loop</strong> at the end of a rope that will not slip and will not tighten. Used for sheets to a sail clew, attaching a line to a ring, putting a loop around a post, tying a line around a person. <strong>The single most important knot in sailing</strong> — and the one to master first.</p><p><strong>Traditional teaching rhyme:</strong></p><blockquote class=\"callout\"><p><em>\"The rabbit comes up out of the hole, around the tree, and back down the hole.\"</em></p><p data-lang=\"ua\"><em>«Кролик виходить з нори, обходить дерево і повертається назад у нору.»</em></p></blockquote><div class=\"pre-wrap\"><pre>   1. Make a small loop (\"the hole\") in the standing part,\n      leaving a long working end.\n\n           ╭───╮  ← the hole\n      ─────┤   │\n           ╰───╯\n              │\n        working end (the rabbit)\n\n   2. Pass the working end UP through the hole (rabbit comes out)\n   3. Around BEHIND the standing part (around the tree)\n   4. Back DOWN through the hole (back down the hole)\n   5. Pull tight, holding both the loop and the standing part.</pre></div><p data-lang=\"en\"><strong>Critical points:</strong></p><ul><li data-lang=\"en\"><strong>Practise until you can do it behind your back.</strong> Genuinely. This is a standard test and it's a fair one.</li><li data-lang=\"en\">The finished knot has the working end <strong>inside</strong> the loop, not outside. If your end is outside, you've tied a slip knot that will fail. Check every time.</li><li data-lang=\"en\">A bowline can <strong>shake loose when not under load</strong> — under repeated flogging it can work itself undone. For critical unloaded applications, finish with a <strong>half hitch</strong> around the loop, or use a <strong>double bowline</strong>.</li><li data-lang=\"en\">A bowline reduces rope strength by roughly 40%. That's normal for knots and it's designed into rope specs.</li><li data-lang=\"en\"><strong>You can untie a bowline after any load.</strong> Push the collar back over the standing part and it falls apart. That is why it's the standard.</li></ul><p data-lang=\"ua\"><strong>Критичні моменти:</strong></p><ul><li data-lang=\"ua\"><strong>Тренуйтеся, доки не зав'яжете за спиною.</strong> Серйозно. Це стандартний і справедливий тест.</li><li data-lang=\"ua\">У готовому вузлі робочий кінець <strong>всередині</strong> петлі, не зовні. Якщо кінець зовні — ви зав'язали ковзаючий вузол, який підведе. Перевіряйте щоразу.</li><li data-lang=\"ua\">Боулінь може <strong>розхитатися, коли не навантажений</strong> — при повторному лопотінні він може сам розв'язатися. Для критичних ненавантажених застосувань закінчіть <strong>напівштиком</strong> навколо петлі, або в'яжіть <strong>подвійний боулінь</strong>.</li><li data-lang=\"ua\">Боулінь зменшує міцність троса приблизно на 40%. Це нормально для вузлів і враховано у специфікаціях тросів.</li><li data-lang=\"ua\"><strong>Боулінь можна розв'язати після будь-якого навантаження.</strong> Зсуньте «комірець» назад через коренний кінець — і він розпадеться. Саме тому він стандарт.</li></ul><hr><h4><span data-lang=\"en\">3. Cleat hitch</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Кріплення на утці</span></h4><p><strong>Use / Застосування:</strong> Securing a docking line, halyard, or any line to a cleat. Simple, and almost universally done wrong by beginners.</p><div class=\"pre-wrap\"><pre>        ╱─────────╲          The cleat, seen from above\n       │           │\n   ════╧═══════════╧════\n\n   1. FULL TURN around the base of the cleat first\n      (this takes the load — it's the most important part)\n   2. Then a figure-eight over the horns: over one horn,\n      under and across, over the other horn\n   3. Finish with ONE locking hitch (a half hitch with the\n      working end tucked under itself)\n   4. Stop. That's it.</pre></div><p data-lang=\"en\"><strong>The three beginner errors:</strong></p><ol><li data-lang=\"en\"><strong>Skipping the first full turn around the base.</strong> That turn takes the load through friction. Without it, the figure-eights carry everything and jam solid.</li><li data-lang=\"en\"><strong>Too many figure-eights.</strong> Two is right. Six looks impressive and cannot be released quickly — and being able to release a dockline <em>instantly</em> under load is a safety requirement, not a nicety.</li><li data-lang=\"en\"><strong>More than one locking hitch, or no locking hitch.</strong> Exactly one.</li></ol><p data-lang=\"en\"><strong>Test:</strong> a correct cleat hitch can be released in about two seconds, even loaded. If you have to pick at it, it's wrong.</p><p data-lang=\"ua\"><strong>Три помилки новачків:</strong></p><ol><li data-lang=\"ua\"><strong>Пропуск першого повного оберту навколо основи.</strong> Цей оберт бере навантаження на тертя. Без нього все тримають вісімки, і вони затягуються намертво.</li><li data-lang=\"ua\"><strong>Занадто багато вісімок.</strong> Дві — правильно. Шість виглядають вражаюче і не можуть бути швидко віддані — а можливість <em>миттєво</em> віддати швартовий під навантаженням це вимога безпеки, а не примха.</li><li data-lang=\"ua\"><strong>Більше одного фіксуючого напівштика, або жодного.</strong> Рівно один.</li></ol><p data-lang=\"ua\"><strong>Тест:</strong> правильне кріплення на утці віддається приблизно за дві секунди, навіть під навантаженням. Якщо доводиться його розковирювати — воно неправильне.</p><hr><h4 data-lang=\"ua\"><span data-lang=\"en\">4. Clove hitch</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вибленковий вузол</span></h4><p><strong>Use / Застосування:</strong> Fast attachment to a rail, post, or ring — classically for hanging <strong>fenders</strong> on a lifeline. Quick to tie, quick to adjust, quick to release.</p><div class=\"pre-wrap\"><pre>   Two identical turns around the rail, the second\n   crossing over the first, both ends emerging in\n   opposite directions and pinning each other.\n\n     ════╪════╪════  rail\n         │╲  ╱│\n         │ ╳╱ │\n         │╱ ╲ │</pre></div><p data-lang=\"en\">Fast and convenient, but note it can <strong>slip under varying or shock loads</strong> and can <strong>jam under heavy load</strong>. Perfect for fenders. Not for anything that matters. Add a half hitch if you want it to stay.</p><p data-lang=\"ua\">Швидкий і зручний, але зауважте: він може <strong>ковзати при змінному або ударному навантаженні</strong> і <strong>затягуватися намертво</strong> під великим. Ідеальний для кранців. Не для чогось важливого. Додайте напівштик, якщо хочете, щоб тримався.</p><hr><h4><span data-lang=\"en\">5. Round turn and two half hitches</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Обнос і два напівштики</span></h4><p><strong>Use / Застосування:</strong> The workhorse for tying a line to a ring, post, or mooring bollard <strong>under load</strong>. More secure than a clove hitch, and it can be tied and untied while loaded.</p><div class=\"pre-wrap\"><pre>   1. Take a FULL round turn around the object (all the way around)\n   2. Then two half hitches around the standing part,\n      both in the same direction</pre></div><p data-lang=\"en\">The round turn is what makes this good: friction on the object takes most of the load, so the hitches themselves are barely stressed and stay easy to undo. This is the knot for tying up to a ring on a wall or a mooring buoy.</p><p data-lang=\"ua\">Саме повний обнос робить цей вузол добрим: тертя об предмет бере більшу частину навантаження, тому самі напівштики майже не напружені і легко розв'язуються. Це вузол для швартування до рима на стіні або до швартового буя.</p><hr><h4><span data-lang=\"en\">6. Reef knot (square knot)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Прямий (рифовий) вузол</span></h4><p><strong>Use / Застосування:</strong> Tying <strong>reef ties</strong> around gathered sail, and tying together the two ends of the <em>same</em> line around a bundle. Flat, neat, and easy to release.</p><div class=\"pre-wrap\"><pre>   Left over right and under, then right over left and under.\n   \"Left over right, right over left.\"</pre></div><p data-lang=\"en\"><strong>Important safety limitation:</strong> a reef knot is <strong>NOT a knot for joining two ropes that will be loaded.</strong> It capsizes and slips, especially with ropes of different diameter or slippery modern rope. People have died relying on it. To join two ropes, use a <strong>sheet bend</strong> (next).</p><p data-lang=\"en\">Its legitimate uses are: reef ties on a sail, tying a sail bag shut, bandages, and bundling. That's all.</p><p data-lang=\"ua\"><strong>Важливе обмеження безпеки:</strong> прямий вузол — це <strong>НЕ вузол для з'єднання двох тросів, які будуть навантажені.</strong> Він перевертається і ковзає, особливо на тросах різного діаметра або на слизькому сучасному тросі. Люди гинули, покладаючись на нього. Щоб з'єднати два троси, використовуйте <strong>шкотовий вузол</strong> (далі).</p><p data-lang=\"ua\">Його законні застосування: риф-штерти на вітрилі, зав'язування мішка для вітрил, бинти і зв'язування пакунків. Усе.</p><hr><h4><span data-lang=\"en\">7. Sheet bend</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Шкотовий вузол</span></h4><p><strong>Use / Застосування:</strong> Joining <strong>two ropes</strong>, including ropes of <strong>different thickness</strong> — which is where the reef knot fails and this one doesn't.</p><div class=\"pre-wrap\"><pre>   1. Make a bight in the THICKER rope\n   2. Pass the thinner rope's end up through the bight\n   3. Around BEHIND both legs of the bight\n   4. Back under itself (tucked beneath where it came through)\n\n        thicker rope ──╮\n                       │  ╭──╮\n                    ═══╪══╪  │\n                       │  ╰──┼── thinner rope\n                       ╰─────╯</pre></div><p data-lang=\"en\">For a more secure version (and always with slippery or very different-sized ropes), use a <strong>double sheet bend</strong> — take two turns around the bight instead of one.</p><p data-lang=\"ua\">Для надійнішої версії (і завжди зі слизькими тросами або тросами дуже різного розміру) використовуйте <strong>подвійний шкотовий вузол</strong> — зробіть два оберти навколо петлі замість одного.</p><hr><h4 data-lang=\"ua\"><span data-lang=\"en\">8. Rolling hitch</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Стопорний штик (схватуючий вузол)</span></h4><p><strong>Use / Застосування:</strong> Grips a rope or spar <strong>along its length</strong> and resists sliding lengthwise. The knot that solves the \"winch override\" emergency — you tie a rolling hitch onto the jammed sheet with a spare line, take the load on another winch, and free the override.</p><p data-lang=\"en\">This is the knot that separates people who can solve problems from people who need rescuing. Two specific situations where it saves the day:</p><ol><li data-lang=\"en\"><strong>Winch override.</strong> A jammed sheet you cannot release. Rolling hitch a spare line onto the sheet forward of the jam, load it on another winch, and the override goes slack.</li><li data-lang=\"en\"><strong>Taking load off anything</strong> — a jammed furling line, a snubber on an anchor chain, a temporary preventer, a stuck halyard.</li></ol><p data-lang=\"ua\">Це вузол, який відрізняє людей, здатних вирішувати проблеми, від тих, кого треба рятувати. Дві конкретні ситуації, де він виручає:</p><ol><li data-lang=\"ua\"><strong>Накладання на лебідці (override).</strong> Заклинений шкот, який не віддається. Зав'яжіть стопорний штик запасним кінцем на шкоті перед заклинюванням, навантажте на іншу лебідку — і накладання ослабне.</li><li data-lang=\"ua\"><strong>Знімання навантаження з будь-чого</strong> — заклинена закрутка, амортизатор на якірному ланцюгу, тимчасова завал-таль, застряглий фал.</li></ol><hr><h3><span data-lang=\"en\">6.3 Coiling and stowing</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Бухтування і укладка</span></h3><p data-lang=\"en\">Neatness on a boat is safety, not aesthetics. A tangled line is a line that jams at the moment you need it to run free — and the moment you need a sheet to run free is usually the moment something has gone wrong.</p><p data-lang=\"en\"><strong>Rules:</strong></p><ul><li data-lang=\"en\"><strong>Coil clockwise</strong> with a slight twist of the wrist for each loop, laying the coils flat. Three-strand rope has a natural lay — follow it.</li><li data-lang=\"en\"><strong>Every line has a home</strong> and always returns to it. In an emergency, in the dark, you must be able to find the right line by feel.</li><li data-lang=\"en\"><strong>\"Flake\" a line you need to run freely</strong> — lay it in loose figure-eight folds on deck rather than a coil. Coils tangle when they run out fast; flakes don't.</li><li data-lang=\"en\"><strong>Never leave a line dangling in the water.</strong> It will wrap the propeller, and then your engine is gone at the exact moment you need it. This is one of the most common causes of tow-ins.</li><li data-lang=\"en\"><strong>Keep the cockpit clear.</strong> Sheet tails underfoot trip crew and jam blocks.</li><li data-lang=\"en\"><strong>Whip or heat-seal every rope end.</strong> A frayed end will not pass through a block and will not take a knot.</li><li data-lang=\"en\"><strong>Watch for chafe.</strong> Anywhere a rope crosses an edge under load, it is wearing. Inspect docklines at fairleads, halyards at the masthead, and sheets at fairleads. Chafe is how expensive things fail quietly.</li></ul><p data-lang=\"ua\">Порядок на судні — це безпека, а не естетика. Заплутаний трос — це трос, який заклинить у момент, коли він мусить піти вільно; а цей момент зазвичай той, коли щось уже пішло не так.</p><p data-lang=\"ua\"><strong>Правила:</strong></p><ul><li data-lang=\"ua\"><strong>Бухтуйте за годинниковою стрілкою</strong>, з легким поворотом кисті на кожній петлі, укладаючи витки рівно. Трипрядний трос має природний звив — слідуйте йому.</li><li data-lang=\"ua\"><strong>Кожен трос має своє місце</strong> і завжди туди повертається. В аварійній ситуації, у темряві, ви мусите знайти потрібний кінець на дотик.</li><li data-lang=\"ua\"><strong>Трос, який мусить піти вільно, укладайте «вісімками»</strong> на палубі, а не в бухту. Бухти заплутуються при швидкому виході; вісімки — ні.</li><li data-lang=\"ua\"><strong>Ніколи не залишайте кінець, що висить у воді.</strong> Він намотається на гребний винт, і двигуна не стане саме тоді, коли він потрібен. Це одна з найпоширеніших причин буксирування.</li><li data-lang=\"ua\"><strong>Тримайте кокпіт чистим.</strong> Кінці шкотів під ногами збивають екіпаж і заклинюють блоки.</li><li data-lang=\"ua\"><strong>Робіть марку або запаюйте кожен кінець троса.</strong> Розтріпаний кінець не пройде через блок і не тримає вузол.</li><li data-lang=\"ua\"><strong>Слідкуйте за протиранням (chafe).</strong> Усюди, де трос перетинає кромку під навантаженням, він зношується. Оглядайте швартові в напрямних, фали на топі мачти, шкоти в блоках. Протирання — це те, як дорогі речі тихо руйнуються.</li></ul><hr><h3><span data-lang=\"en\">6.4 Docklines and springs</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Швартові та шпринги</span></h3><p data-lang=\"en\">Tying up properly is a skill in itself, and doing it badly damages boats.</p><div class=\"pre-wrap\"><pre>     bow                                          stern\n      │                                             │\n   ╔══╪═════════════════════════════════════════════╪══╗\n   ║  BOW LINE                          STERN LINE     ║  ← boat\n   ╚══╪═════════════════════════════════════════════╪══╝\n      │╲                                         ╱ │\n      │  ╲  AFT SPRING          FORWARD SPRING ╱   │\n      │    ╲                                 ╱     │\n   ═══╧══════╲═════════════════════════════╱═══════╧═══  ← dock</pre></div><div class=\"table-wrap\"><table><thead><tr><th>Line</th><th>Runs from</th><th>Stops the boat from</th></tr></thead><tbody><tr><td><strong>Bow line</strong></td><td>Bow forward to the dock</td><td>Drifting aft and off</td></tr><tr><td><strong>Stern line</strong></td><td>Stern aft to the dock</td><td>Drifting forward and off</td></tr><tr><td><strong>Forward spring</strong></td><td>Amidships or bow, angled <strong>aft</strong> on the dock</td><td>Moving <strong>forward</strong></td></tr><tr><td><strong>Aft spring</strong></td><td>Amidships or stern, angled <strong>forward</strong> on the dock</td><td>Moving <strong>aft</strong></td></tr><tr><td><strong>Breast line</strong></td><td>Straight out at 90°</td><td>Moving away from the dock (short-term only)</td></tr></tbody></table></div><p data-lang=\"en\"></p><ul><li data-lang=\"en\"><strong>Springs are what actually stop the boat surging</strong> back and forth along the dock. Bow and stern lines alone let a boat move a metre either way with every wake, which chafes lines and pounds fenders. Beginners forget springs; experienced sailors rig them first.</li><li data-lang=\"en\"><strong>Allow for tide.</strong> Halifax has a modest tidal range (roughly 1.4–2 m), but on a fixed pier your lines must be long enough for low water and not so long that the boat wanders at high water. On a floating dock this doesn't apply — the dock moves with the boat.</li><li data-lang=\"en\"><strong>Long lines are gentle lines.</strong> A longer, shallower-angled line stretches and absorbs shock. A short tight line transmits every jolt to a cleat.</li><li data-lang=\"en\"><strong>Fenders at the widest point of contact</strong>, adjusted for the actual dock height, tied with clove hitches so you can move them fast.</li><li data-lang=\"en\"><strong>Doubling up before a storm:</strong> two of everything, from different cleats, plus chafe protection at every fairlead. In hurricane season in Nova Scotia this is a routine autumn activity, not paranoia.</li></ul><p data-lang=\"ua\"></p><ul><li data-lang=\"ua\"><strong>Саме шпринги зупиняють рискання судна</strong> вперед-назад уздовж причалу. Носовий і кормовий швартові самі по собі дозволяють судну рухатись на метр у кожен бік з кожною хвилею, що протирає троси і розбиває кранці. Новачки забувають шпринги; досвідчені яхтсмени заводять їх першими.</li><li data-lang=\"ua\"><strong>Врахуйте приплив.</strong> У Галіфаксі помірна амплітуда припливу (приблизно 1,4–2 м), але на нерухомому пірсі ваші швартові мусять бути достатньо довгими для малої води і не такими довгими, щоб судно блукало на повній. На плавучому причалі це не стосується — причал рухається разом з судном.</li><li data-lang=\"ua\"><strong>Довгі швартові — м'які швартові.</strong> Довший трос під меншим кутом розтягується і поглинає ривки. Короткий натягнутий передає кожен удар на утку.</li><li data-lang=\"ua\"><strong>Кранці в найширшій точці контакту</strong>, підігнані під фактичну висоту причалу, зав'язані вибленковими вузлами, щоб можна було швидко переставити.</li><li data-lang=\"ua\"><strong>Подвоєння перед штормом:</strong> по два всього, з різних уток, плюс захист від протирання в кожній напрямній. У сезон ураганів у Новій Шотландії це рутинна осіння дія, а не паранойя.</li></ul><hr><h3><span data-lang=\"en\">6.5 Practice plan</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">План тренувань</span></h3><p data-lang=\"en\">Two weeks, 10 minutes a day. That's the whole investment.</p><div class=\"table-wrap\"><table><thead><tr><th>Days</th><th>Focus</th><th>Target</th></tr></thead><tbody><tr><td>1–2</td><td>Figure-eight, bowline</td><td>20 bowlines per session</td></tr><tr><td>3–4</td><td>Add cleat hitch</td><td>Correct cleat hitch in under 5 seconds</td></tr><tr><td>5–6</td><td>Add clove hitch, round turn + two half hitches</td><td>Fast and correct</td></tr><tr><td>7</td><td>Review all five</td><td>Each in under 10 seconds</td></tr><tr><td>8–9</td><td>Add reef knot, sheet bend</td><td>Know when NOT to use a reef knot</td></tr><tr><td>10</td><td>Add rolling hitch</td><td>Understand the winch-override use</td></tr><tr><td>11–12</td><td><strong>Eyes closed</strong></td><td>All eight, blindfolded</td></tr><tr><td>13–14</td><td><strong>Behind your back, and with cold wet hands</strong></td><td>Bowline behind the back is the graduation test</td></tr></tbody></table></div><p data-lang=\"ua\">Два тижні, 10 хвилин на день. Це вся інвестиція.</p><p data-lang=\"ua\">Останній тест — <strong>боулінь за спиною, замерзлими мокрими руками</strong> — це і є випускний екзамен.</p><hr><h3><span data-lang=\"en\">6.6 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Tie all eight knots without reference.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Tie a bowline behind your back.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain why a figure-eight is used as a stopper rather than an overhand knot.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain why you must never join two loaded ropes with a reef knot.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the three most common cleat hitch errors.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain what a rolling hitch does in a winch override.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain what springs do, and why bow and stern lines alone are insufficient.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain the difference between coiling and flaking, and when to use each.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Explain why a line trailing in the water is a serious hazard.</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Зав'яжіть усі вісім вузлів без підказок.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Зав'яжіть боулінь за спиною.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, чому як стопор використовують вісімку, а не простий вузол.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, чому ніколи не можна з'єднувати два навантажені троси прямим вузлом.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три найпоширеніші помилки при кріпленні на утці.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, що робить стопорний штик при накладанні на лебідці.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, що роблять шпринги і чому носового з кормовим недостатньо.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть різницю між бухтуванням і укладкою «вісімками» і коли що застосовувати.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Поясніть, чому кінець, що тягнеться у воді, — серйозна небезпека.</span></label></li></ul><hr>"}, "m07": {"t_en": "07 · Rules of the road", "t_ua": "Правила розходження", "html": "<h2>Module 07 — Rules of the Road (COLREGs)</h2><h2 data-lang=\"ua\">Модуль 07 — Правила запобігання стиканням (COLREGs)</h2><p><strong>Study time / Час: ~3 hours</strong> · <strong>Heavily examined on the PCOC</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">These are the <strong>International Regulations for Preventing Collisions at Sea (COLREGs)</strong>. They are law, they apply worldwide, and they are the largest single topic on the PCOC exam. They are also the rules that will keep you from being run down by a container ship in Halifax Harbour — which is a real and specific risk where you live.</p><p data-lang=\"ua\">Це <strong>Міжнародні правила запобігання стиканням суден у морі (COLREGs)</strong>. Це закон, вони діють у всьому світі, і це найбільша окрема тема екзамену PCOC. Це також правила, які не дадуть контейнеровозу розтоптати вас у гавані Галіфаксу — а це реальний і конкретний риск там, де ви живете.</p></blockquote><hr><h3><span data-lang=\"en\">7.1 The three rules that override everything</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Три правила, що переважають усе</span></h3><p data-lang=\"en\">Before any right-of-way rule, learn these three. They are the foundation, and examiners love them.</p><h4>Rule 5 — Look-out</h4><blockquote class=\"callout\"><p><em>\"Every vessel shall at all times maintain a proper look-out by sight and hearing as well as by all available means appropriate in the prevailing circumstances.\"</em></p></blockquote><p><strong>In practice:</strong> someone must actually be watching, all the time, in every direction — including <strong>behind you</strong> and <strong>under the sails</strong>. A headsail creates a blind spot to leeward that will hide an entire ship. Duck down and look under it regularly, or send crew to look. In fog, \"by hearing\" becomes literal: stop the engine periodically and listen.</p><h4>Rule 6 — Safe speed</h4><blockquote class=\"callout\"><p><em>\"Every vessel shall at all times proceed at a safe speed so that she can take proper and effective action to avoid collision and be stopped within a distance appropriate to the prevailing circumstances and conditions.\"</em></p></blockquote><p><strong>In practice:</strong> \"safe speed\" is not a number. It depends on visibility, traffic, your manoeuvrability, background lights at night, sea state, draft versus depth, and your radar. In Halifax fog, safe speed may be 3 knots. Your legal speed limit is whatever lets you stop in time given what you can see.</p><h4>Rule 2 — Responsibility (the \"general prudential rule\")</h4><blockquote class=\"callout\"><p>Nothing in the rules exonerates any vessel from the consequences of neglecting ordinary good seamanship — and a departure from the rules is permitted where necessary to avoid immediate danger.</p></blockquote><p><strong>In practice, and this is the important one:</strong> <strong>being \"in the right\" is not a defence if you collide.</strong> If holding your course leads to a collision, you are required to take action regardless of who had right of way. You cannot stand on your rights into a wreck. Every rule below is subordinate to \"don't crash.\"</p><p data-lang=\"ua\">Перед будь-яким правилом переваги вивчіть ці три. Це фундамент, і екзаменатори їх люблять.</p><h4 data-lang=\"ua\">Правило 5 — Спостереження</h4><p data-lang=\"ua\">Кожне судно повинно постійно вести належне спостереження зором і слухом, а також усіма доступними засобами.</p><p data-lang=\"ua\"><strong>На практиці:</strong> хтось мусить справді дивитися, постійно, в усіх напрямках — включно <strong>за собою</strong> і <strong>під вітрилами</strong>. Переднє вітрило створює «сліпу зону» під вітром, яка сховає ціле судно. Регулярно пригинайтесь і дивіться під нього, або посилайте екіпаж дивитися. У тумані «слухом» стає буквальним: періодично зупиняйте двигун і слухайте.</p><h4 data-lang=\"ua\">Правило 6 — Безпечна швидкість</h4><p data-lang=\"ua\">Кожне судно повинно завжди йти з безпечною швидкістю, щоб мати можливість вжити належних дій для запобігання столкненню і зупинитися на відстані, відповідній обставинам.</p><p data-lang=\"ua\"><strong>На практиці:</strong> «безпечна швидкість» — це не число. Вона залежить від видимості, руху суден, вашої керованості, берегових вогнів уночі, стану моря, осадки відносно глибини і наявності радара. У тумані Галіфаксу безпечна швидкість може бути 3 вузли.</p><h4 data-lang=\"ua\">Правило 2 — Відповідальність (загальне правило розсудливості)</h4><p data-lang=\"ua\">Ніщо в правилах не звільняє судно від наслідків нехтування звичайною доброю морською практикою — і відступ від правил допускається, коли це необхідно для уникнення безпосередньої небезпеки.</p><p data-lang=\"ua\"><strong>На практиці, і це головне:</strong> <strong>бути «в своєму праві» не є захистом, якщо ви зіткнулися.</strong> Якщо збереження курсу веде до стикання, ви зобов'язані діяти, незалежно від того, хто мав перевагу. Ви не можете відстоювати свої права до аварії. Усі правила нижче підпорядковані принципу «не зіткнись».</p><hr><h3><span data-lang=\"en\">7.2 The pecking order</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Ієрархія переваг</span></h3><p data-lang=\"en\">Rule 18 sets out who gives way to whom. Learn this order from <strong>most privileged (top) to least (bottom)</strong>.</p><div class=\"table-wrap\"><table><thead><tr><th>Rank</th><th>Vessel type</th><th>Ukrainian</th></tr></thead><tbody><tr><td>1</td><td><strong>Vessel not under command</strong> (NUC) — broken down, unable to manoeuvre</td><td>судно, що не керується</td></tr><tr><td>2</td><td><strong>Vessel restricted in ability to manoeuvre</strong> (RAM) — dredging, cable-laying, towing, replenishing</td><td>судно, обмежене в можливості маневрувати</td></tr><tr><td>3</td><td><strong>Vessel constrained by draught</strong> — a deep-draught ship in a narrow deep channel</td><td>судно, обмежене своєю осадкою</td></tr><tr><td>4</td><td><strong>Vessel engaged in fishing</strong> (with nets/lines out, not trolling)</td><td>судно, зайняте ловом риби</td></tr><tr><td>5</td><td><strong>Sailing vessel</strong></td><td>вітрильне судно</td></tr><tr><td>6</td><td><strong>Power-driven vessel</strong></td><td>судно з механічним двигуном</td></tr><tr><td>7</td><td><em>(By convention/courtesy)</em> seaplanes, WIG craft</td><td>—</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Memory aid:</strong> <em>\"<strong>N</strong>ew <strong>R</strong>eels <strong>C</strong>atch <strong>F</strong>ish <strong>S</strong>o <strong>P</strong>urchase <strong>S</strong>ome\"</em> — NUC, RAM, Constrained by draught, Fishing, Sailing, Power, Seaplane.</p><p data-lang=\"en\"><strong>The critical caveats that beginners miss.</strong> \"Sail beats power\" is a dangerous half-truth:</p><ol><li data-lang=\"en\"><strong>A sailboat under engine is a power-driven vessel.</strong> Full stop. If your engine is running and in gear, you have no sailing privileges <em>even with sails up</em>. And there's a legal requirement attached: a sailing vessel motoring in daylight should display a <strong>black cone, point down</strong>, forward. Almost nobody does, but you should know it — it's exam material.</li><li data-lang=\"en\"><strong>Rule 9(b) — narrow channels.</strong> A vessel under 20 m <em>or</em> a sailing vessel <strong>shall not impede</strong> a vessel that can only safely navigate within a narrow channel. In Halifax's Narrows, this means the container ship has the practical right of way over you regardless of the sail/power hierarchy.</li><li data-lang=\"en\"><strong>Rule 10 — traffic separation schemes.</strong> Sailing vessels and vessels under 20 m shall not impede the safe passage of power-driven vessels following a traffic lane.</li><li data-lang=\"en\"><strong>Rule 13 — overtaking.</strong> An overtaking vessel keeps clear of the vessel being overtaken, <strong>regardless of sail or power</strong>. If you are a sailboat overtaking another sailboat, you keep clear.</li><li data-lang=\"en\"><strong>\"Shall not impede\" is different from \"give way\".</strong> It means you must not put yourself in a position where the other vessel <em>has to</em> alter course. You must plan early to stay out of the way entirely.</li></ol><p data-lang=\"ua\">Правило 18 визначає, хто кому уступає. Вивчіть цей порядок від <strong>найпривілейованішого (верх) до найменш (низ)</strong>.</p><p data-lang=\"ua\"><strong>Критичні застереження, які новачки пропускають.</strong> «Вітрило переважає двигун» — небезпечна напівправда:</p><ol><li data-lang=\"ua\"><strong>Вітрильник під двигуном — це судно з механічним двигуном.</strong> Точка. Якщо двигун працює і включений, ви не маєте привілеїв вітрильника <em>навіть з піднятими вітрилами</em>. І з цим пов'язана юридична вимога: вітрильне судно, що йде під двигуном вдень, повинно виставляти <strong>чорний конус вершиною вниз</strong> у передній частині. Майже ніхто цього не робить, але ви мусите це знати — це екзаменаційний матеріал.</li><li data-lang=\"ua\"><strong>Правило 9(b) — вузькі проходи.</strong> Судно менше 20 м <em>або</em> вітрильне судно <strong>не повинно перешкоджати</strong> судну, яке може безпечно йти лише у вузькому проході. У Narrows Галіфаксу це означає, що контейнеровоз має практичну перевагу над вами незалежно від ієрархії вітрило/двигун.</li><li data-lang=\"ua\"><strong>Правило 10 — системи розділення руху.</strong> Вітрильні судна і судна менше 20 м не повинні перешкоджати безпечному проходу суден з механічним двигуном, що йдуть смугою руху.</li><li data-lang=\"ua\"><strong>Правило 13 — обгін.</strong> Судно, що обганяє, тримається чисто від судна, яке обганяють, <strong>незалежно від вітрила чи двигуна</strong>.</li><li data-lang=\"ua\"><strong>«Не перешкоджати» відрізняється від «уступити дорогу».</strong> Це означає, що ви не повинні ставити себе в положення, у якому інше судно <em>змушене</em> змінювати курс. Ви мусите планувати заздалегідь, щоб узагалі не бути на шляху.</li></ol><hr><h3><span data-lang=\"en\">7.3 Sailboat meets sailboat</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вітрильник зустрічає вітрильник</span></h3><p data-lang=\"en\">Rule 12. Three sub-rules, in order of application. This is the rule you will use most often on a Wednesday night race.</p><h4>(a) Different tacks → <strong>the vessel on port tack gives way</strong></h4><div class=\"pre-wrap\"><pre>        ↓ WIND\n        ↓\n   PORT TACK               STARBOARD TACK\n   (wind from port)        (wind from starboard)\n   boom out to starboard   boom out to port\n\n      ╲                          ╱\n       ╲__                    __╱\n        GIVES WAY  ←──→  STANDS ON\n        (must alter)      (holds course)</pre></div><h4>(b) Same tack → <strong>the windward vessel gives way</strong></h4><div class=\"pre-wrap\"><pre>        ↓ WIND\n        ↓\n      WINDWARD boat  ← GIVES WAY (she's stealing the other's wind\n        ╲                          and can bear away easily)\n         ╲\n          ╲\n       LEEWARD boat  ← STANDS ON</pre></div><h4>(c) Port tack, cannot tell the other's tack → <strong>give way anyway</strong></h4><p>If you are on port tack, you see a vessel to windward, and you cannot determine whether she is on port or starboard tack, you <strong>must keep out of the way</strong>. Uncertainty resolves against you.</p><p data-lang=\"en\"><strong>Practical shorthand for the racing dock:</strong></p><ul><li data-lang=\"en\"><em>\"Starboard!\"</em> is the shout you'll hear (and give). It means \"I am on starboard tack, I have right of way, get out of my way.\" It is a legitimate hail, not aggression.</li><li data-lang=\"en\"><em>\"Windward boat keeps clear\"</em> on the same tack.</li><li data-lang=\"en\"><strong>Both rules together, in one sentence:</strong> <em>starboard tack over port tack; if same tack, leeward over windward.</em></li></ul><p data-lang=\"ua\">Правило 12. Три підправила, за порядком застосування. Це правило ви будете використовувати найчастіше на клубній гонці в середу.</p><h4 data-lang=\"ua\">(a) Різні галси → <strong>судно на лівому галсі уступає дорогу</strong></h4><h4 data-lang=\"ua\">(b) Однаковий галс → <strong>навітряне судно уступає дорогу</strong></h4><p data-lang=\"ua\">(Навітряне судно «краде» вітер в іншого і легко може відійти від вітру.)</p><h4 data-lang=\"ua\">(c) Лівий галс, не можете визначити галс іншого → <strong>уступайте все одно</strong></h4><p data-lang=\"ua\">Якщо ви на лівому галсі, бачите судно з навітряного боку і не можете визначити, на якому воно галсі, ви <strong>мусите триматися чисто</strong>. Невизначеність трактується проти вас.</p><p data-lang=\"ua\"><strong>Практично, одним реченням:</strong> <em>правий галс переважає лівий; при однаковому галсі підвітряне переважає навітряне.</em></p><hr><h3><span data-lang=\"en\">7.4 Power meets power</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Двигун зустрічає двигун</span></h3><p data-lang=\"en\">These apply to you whenever your engine is on, and they're heavily examined.</p><h4><span data-lang=\"en\">Head-on (Rule 14)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Зустрічні курси</span></h4><p><strong>Both vessels alter course to starboard</strong> and pass port-to-port. Like driving on the right, which is convenient in Canada.</p><div class=\"pre-wrap\"><pre>     ▲                ▲              ▲    ▲\n     │                │               ╲  ╱\n     │                │      →         ╲╱     both turn to\n     │                │                ╱╲     STARBOARD,\n     ▼                ▼               ╱  ╲    pass port-to-port</pre></div><h4><span data-lang=\"en\">Crossing (Rule 15)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перетинні курси</span></h4><p><strong>The vessel that has the other on her own starboard side gives way.</strong> She should alter course to starboard and pass behind (astern of) the other vessel.</p><p><strong>Memory aid: \"if it's on your right, it's in the right.\"</strong> Or think of the navigation lights: if you see the other vessel's <strong>red</strong> light, you are looking at <em>her</em> port side, meaning she is crossing from your starboard — <strong>red means stop, you give way</strong>. If you see her <strong>green</strong>, you are the stand-on vessel — <strong>green means go</strong>. This lights-based version is extremely useful at night and appears on exams.</p><h4><span data-lang=\"en\">Overtaking (Rule 13)</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Обгін</span></h4><p><strong>The overtaking vessel keeps clear.</strong> She stays clear until she is finally past and clear. This applies regardless of vessel type.</p><h4>Give-way and stand-on duties (Rules 16 &amp; 17)</h4><ul><li><strong>Give-way vessel:</strong> take <strong>early and substantial</strong> action to keep well clear. A small late alteration is a rule violation — the other skipper must be able to <em>see</em> that you're giving way.</li><li><strong>Stand-on vessel:</strong> <strong>maintain your course and speed</strong> so the give-way vessel can predict you. But if it becomes clear the other vessel isn't acting, you must then take action yourself — and if you must act alone, <strong>avoid altering to port</strong> for a vessel on your own port side.</li></ul><p data-lang=\"ua\"></p><h4 data-lang=\"ua\">Зустрічні курси (Правило 14)</h4><p data-lang=\"ua\"><strong>Обидва судна змінюють курс праворуч</strong> і проходять лівими бортами. Як правий рух на дорозі, що зручно в Канаді.</p><h4 data-lang=\"ua\">Перетинні курси (Правило 15)</h4><p data-lang=\"ua\"><strong>Судно, яке має інше зі свого правого борту, уступає дорогу.</strong> Воно повинно змінити курс праворуч і пройти за кормою іншого.</p><p data-lang=\"ua\"><strong>Мнемоніка через вогні:</strong> якщо ви бачите <strong>червоний</strong> вогонь іншого судна — ви дивитесь на його лівий борт, отже воно перетинає з вашого правого борту — <strong>червоний означає стій, ви уступаєте</strong>. Якщо бачите <strong>зелений</strong> — ви судно, що зберігає курс — <strong>зелений означає йди</strong>. Ця версія через вогні надзвичайно корисна вночі і з'являється на екзаменах.</p><h4 data-lang=\"ua\">Обгін (Правило 13)</h4><p data-lang=\"ua\"><strong>Судно, що обганяє, тримається чисто.</strong> Воно тримається чисто, доки остаточно не пройде і не розійдеться.</p><h4 data-lang=\"ua\">Обов'язки (Правила 16 і 17)</h4><ul><li data-lang=\"ua\"><strong>Судно, що уступає:</strong> вживайте <strong>завчасних і рішучих</strong> дій, щоб розійтися з великим запасом. Мала запізніла зміна курсу — це порушення правил: інший шкіпер мусить <em>бачити</em>, що ви уступаєте.</li><li data-lang=\"ua\"><strong>Судно, що зберігає курс:</strong> <strong>тримайте курс і швидкість</strong>, щоб інше судно могло вас прогнозувати. Але якщо стає ясно, що інше судно не діє, ви мусите діяти самі — і якщо діяти доводиться самому, <strong>уникайте повороту ліворуч</strong> для судна з вашого лівого борту.</li></ul><hr><h3><span data-lang=\"en\">7.5 Halifax Harbour: the reality check</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Гавань Галіфаксу: перевірка реальністю</span></h3><p data-lang=\"en\">This section is specific to where you sail, and it matters more than any abstract rule.</p><p data-lang=\"en\">Halifax is a <strong>major commercial and naval port</strong>. It handles large container ships, tankers, bulk carriers, cruise ships, Royal Canadian Navy vessels, ferries, tugs, and pilot boats. The <strong>Halifax Port Authority</strong> has authority over all vessels within the port, commercial and recreational alike, and the port's practices and procedures apply to pleasure craft as much as to ships.</p><p data-lang=\"en\"><strong>Understand the physics you're up against:</strong></p><ul><li data-lang=\"en\">A loaded container ship may need <strong>more than a mile</strong> to stop.</li><li data-lang=\"en\">She may need <strong>half a mile or more</strong> to complete a significant turn.</li><li data-lang=\"en\">From the bridge, there is a <strong>blind zone extending hundreds of metres ahead</strong> of the bow. A sailboat there is invisible.</li><li data-lang=\"en\">On radar, a fibreglass sailboat is a <strong>weak target</strong>, often lost in sea clutter — which is exactly why a <strong>radar reflector</strong> matters in Halifax fog.</li><li data-lang=\"en\">In a channel, she physically <strong>cannot leave the dredged water</strong> without grounding. Her \"right of way\" is not a preference, it's a physical constraint.</li></ul><p data-lang=\"en\"><strong>The practical Halifax rules that experienced local sailors follow:</strong></p><ol><li data-lang=\"en\"><strong>Never assume you have been seen.</strong> Assume you have not.</li><li data-lang=\"en\"><strong>Stay out of the shipping channel.</strong> Sail along the edges, not down the middle. The Narrows (between the MacKay and Macdonald bridges) is the highest-risk area — it is constricted, has strong tidal current, and is where big ships have the least room.</li><li data-lang=\"en\"><strong>Cross channels at right angles, quickly, and behind ships, never ahead.</strong> Crossing astern is always the right answer.</li><li data-lang=\"en\"><strong>Monitor VHF Channel 16, and know the VTS working channels.</strong> Halifax Traffic (MCTS) coordinates vessel movements — commonly on Ch 12 and Ch 14; verify the current assignments locally. Listening tells you what large vessels are moving and when, which is genuinely the best collision avoidance available to you.</li><li data-lang=\"en\"><strong>Carry and use a radar reflector</strong>, especially in fog.</li><li data-lang=\"en\"><strong>Know the exclusion zones.</strong> The port may establish permanent or temporary exclusion or protection zones around naval facilities, cruise berths, or specific operations. These are promulgated as Notices to Shipping and broadcast on VHF. Naval security zones are enforced seriously — do not test them.</li><li data-lang=\"en\"><strong>In fog, stay out of the harbour entirely</strong> until you have radar, AIS, and the experience to use both. This is the correct beginner answer and there is no shame in it.</li><li data-lang=\"en\"><strong>Watch for ferries.</strong> The Halifax–Dartmouth ferries run frequent fixed crossings and they will not deviate for you.</li><li data-lang=\"en\"><strong>Learn the sound signals</strong> (§7.6) — five short blasts from a ship means <em>\"I do not understand your intentions / danger\"</em> and it is directed at you.</li></ol><p data-lang=\"ua\">Цей розділ конкретно про те, де ви ходите під вітрилами, і він важливіший за будь-яке абстрактне правило.</p><p data-lang=\"ua\">Галіфакс — <strong>великий комерційний і військово-морський порт</strong>. Тут ходять великі контейнеровози, танкери, балкери, круїзні судна, судна Королівського канадського флоту, пароми, буксири і лоцманські катери. <strong>Halifax Port Authority</strong> має владу над усіма суднами в порту, комерційними і прогулянковими однаково.</p><p data-lang=\"ua\"><strong>Зрозумійте фізику, проти якої ви стоїте:</strong></p><ul><li data-lang=\"ua\">Завантаженому контейнеровозу може знадобитися <strong>понад милю</strong>, щоб зупинитися.</li><li data-lang=\"ua\">Йому може знадобитися <strong>пів милі або більше</strong>, щоб завершити значний поворот.</li><li data-lang=\"ua\">З мосту існує <strong>сліпа зона на сотні метрів попереду</strong> носа. Вітрильник там невидимий.</li><li data-lang=\"ua\">На радарі скловолоконний вітрильник — <strong>слабка мета</strong>, часто втрачена в морських завадах. Саме тому <strong>радарний відбивач</strong> важливий у тумані Галіфаксу.</li><li data-lang=\"ua\">У каналі він фізично <strong>не може вийти з протраленої води</strong> без посадки на мілину.</li></ul><p data-lang=\"ua\"><strong>Практичні правила Галіфаксу, яких дотримуються досвідчені місцеві яхтсмени:</strong></p><ol><li data-lang=\"ua\"><strong>Ніколи не припускайте, що вас побачили.</strong> Припускайте, що ні.</li><li data-lang=\"ua\"><strong>Тримайтеся поза судновим ходом.</strong> Ідіть по краях, а не серединою. Narrows (між мостами MacKay і Macdonald) — зона найвищого риску: вона звужена, має сильну припливну течію, і саме там великі судна мають найменше місця.</li><li data-lang=\"ua\"><strong>Перетинайте канали під прямим кутом, швидко, і за кормою суден, ніколи перед носом.</strong> Прохід за кормою — завжди правильна відповідь.</li><li data-lang=\"ua\"><strong>Слухайте VHF канал 16 і знайте робочі канали VTS.</strong> Halifax Traffic (MCTS) координує рух суден — зазвичай на каналах 12 і 14; перевірте актуальні призначення локально. Прослуховування каже вам, які великі судна рухаються і коли — і це справді найкращий доступний вам засіб уникнення стикання.</li><li data-lang=\"ua\"><strong>Майте і використовуйте радарний відбивач</strong>, особливо в тумані.</li><li data-lang=\"ua\"><strong>Знайте зони заборони.</strong> Порт може встановлювати постійні або тимчасові зони заборони чи захисту навколо військово-морських об'єктів, круїзних причалів або окремих операцій. Вони публікуються як Notices to Shipping і передаються по VHF. Зони безпеки флоту забезпечуються серйозно — не перевіряйте їх.</li><li data-lang=\"ua\"><strong>У тумані взагалі не заходьте в гавань</strong>, доки не маєте радара, AIS і досвіду користуватися обома. Це правильна відповідь для новачка, і в ній немає сорому.</li><li data-lang=\"ua\"><strong>Слідкуйте за паромами.</strong> Пароми Галіфакс–Дартмут ходять частими фіксованими рейсами і не будуть відхилятися для вас.</li><li data-lang=\"ua\"><strong>Вивчіть звукові сигнали</strong> (§7.6) — п'ять коротких гудків від судна означають <em>«я не розумію ваших намірів / небезпека»</em>, і вони адресовані вам.</li></ol><hr><h3><span data-lang=\"en\">7.6 Sound signals</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Звукові сигнали</span></h3><p data-lang=\"en\">Short blast = about 1 second. Prolonged blast = 4–6 seconds. Memorise the manoeuvring signals and the fog signals; both are on the PCOC.</p><h4>Manoeuvring and warning signals (in sight of one another)</h4><div class=\"table-wrap\"><table><thead><tr><th>Signal</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>1 short</strong> ( • )</td><td>\"I am altering course to <strong>starboard</strong>\"</td></tr><tr><td><strong>2 short</strong> ( • • )</td><td>\"I am altering course to <strong>port</strong>\"</td></tr><tr><td><strong>3 short</strong> ( • • • )</td><td>\"I am operating <strong>astern propulsion</strong>\" (engines in reverse)</td></tr><tr><td><strong>5 or more short and rapid</strong> ( • • • • • )</td><td><strong>\"Danger / I do not understand your intentions.\"</strong> If a ship blasts this at you, act immediately.</td></tr><tr><td><strong>1 prolonged</strong> ( — )</td><td>\"I am approaching a blind bend / leaving a berth\"</td></tr></tbody></table></div><h4>Overtaking in a narrow channel</h4><div class=\"table-wrap\"><table><thead><tr><th>Signal</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>2 prolonged + 1 short</strong> ( — — • )</td><td>\"I intend to overtake you on <strong>your starboard</strong> side\"</td></tr><tr><td><strong>2 prolonged + 2 short</strong> ( — — • • )</td><td>\"I intend to overtake you on <strong>your port</strong> side\"</td></tr><tr><td><strong>1 prolonged, 1 short, 1 prolonged, 1 short</strong> ( — • — • )</td><td>\"Agreed\"</td></tr></tbody></table></div><h4>Restricted visibility (fog) — sounded every 2 minutes or less</h4><div class=\"table-wrap\"><table><thead><tr><th>Vessel</th><th>Signal</th></tr></thead><tbody><tr><td><strong>Power-driven, making way</strong></td><td><strong>1 prolonged</strong> ( — )</td></tr><tr><td><strong>Power-driven, underway but stopped</strong></td><td><strong>2 prolonged</strong> ( — — )</td></tr><tr><td><strong>Sailing vessel</strong> (also NUC, RAM, fishing, towing)</td><td><strong>1 prolonged + 2 short</strong> ( — • • )</td></tr><tr><td><strong>Vessel at anchor</strong></td><td>Rapid ringing of a bell for ~5 seconds every minute</td></tr><tr><td><strong>Vessel aground</strong></td><td>3 bell strokes, rapid bell ringing, 3 bell strokes</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Memorise your own signal.</strong> As a sailing vessel in fog you sound <strong>one prolonged followed by two short</strong>, at intervals of not more than two minutes. Halifax fog is not hypothetical — you will use this. A hand-held aerosol horn is cheap; carry one and know the rhythm.</p><p data-lang=\"ua\">Короткий гудок ≈ 1 секунда. Продовжений гудок = 4–6 секунд. Запам'ятайте сигнали маневрування і туманні сигнали; обидві групи є в PCOC.</p><p data-lang=\"ua\"><strong>Запам'ятайте свій власний сигнал.</strong> Як вітрильне судно в тумані ви подаєте <strong>один продовжений і два короткі</strong>, з інтервалом не більше двох хвилин. Туман Галіфаксу — не гіпотеза, ви це використаєте. Ручний аерозольний гудок недорогий; майте його і знайте ритм.</p><hr><h3><span data-lang=\"en\">7.7 Collision avoidance in practice</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Уникнення стикання на практиці</span></h3><p data-lang=\"en\">Rules tell you who should do what. This tells you how to actually not crash.</p><p data-lang=\"en\"><strong>How to know if you're on a collision course — the constant bearing test:</strong></p><ol><li data-lang=\"en\">Sight the other vessel over a fixed part of your boat — a stanchion, a shroud, a compass bearing.</li><li data-lang=\"en\">Watch for a minute or two.</li><li data-lang=\"en\"><strong>If the bearing does not change, you are on a collision course.</strong> It doesn't matter how far away they are.</li><li data-lang=\"en\">If the bearing moves <strong>forward</strong> (towards your bow), they will pass ahead of you.</li><li data-lang=\"en\">If the bearing moves <strong>aft</strong> (towards your stern), they will pass behind you.</li></ol><p data-lang=\"en\">This works at night, in poor visibility, and at any range. It is the single most useful practical skill in this module, and it takes ten seconds.</p><p data-lang=\"en\"><strong>Actions that actually work:</strong></p><ul><li data-lang=\"en\"><strong>Act early.</strong> A 20° course change made 2 miles out is easy, obvious to the other vessel, and costs you nothing. The same change at 200 m is an emergency.</li><li data-lang=\"en\"><strong>Make your action obvious and large.</strong> Both a legal requirement and common sense.</li><li data-lang=\"en\"><strong>Alter course to pass astern.</strong> Always the safer choice. Never try to squeeze ahead of a ship — it is the classic fatal error, because you cannot judge a large ship's speed accurately and she is going faster than she looks.</li><li data-lang=\"en\"><strong>Slow down.</strong> It's an option beginners forget, and it's the easiest way to let a situation resolve itself.</li><li data-lang=\"en\"><strong>When in doubt, get on the radio.</strong> A VHF call on Ch 16 to identify yourself and state your intentions is legitimate and often welcomed. See <a href=\"#/m11\" data-nav=\"m11\">Module 11</a>.</li><li data-lang=\"en\"><strong>Assume the other vessel will do the wrong thing.</strong> Many recreational boaters do not know these rules. Plan for their error, not their compliance.</li></ul><p data-lang=\"ua\">Правила кажуть, хто що мусить робити. Це — про те, як насправді не зіткнутися.</p><p data-lang=\"ua\"><strong>Як зрозуміти, що ви на курсі стикання — тест постійного пеленга:</strong></p><ol><li data-lang=\"ua\">Візьміть інше судно на приціл через нерухому частину свого судна — стійку леєра, ванту, або компасний пеленг.</li><li data-lang=\"ua\">Спостерігайте хвилину-дві.</li><li data-lang=\"ua\"><strong>Якщо пеленг не змінюється — ви на курсі стикання.</strong> Не має значення, як далеко воно.</li><li data-lang=\"ua\">Якщо пеленг рухається <strong>вперед</strong> (до вашого носа) — вони пройдуть перед вами.</li><li data-lang=\"ua\">Якщо пеленг рухається <strong>назад</strong> (до вашої корми) — вони пройдуть за вами.</li></ol><p data-lang=\"ua\">Це працює вночі, при поганій видимості і на будь-якій дистанції. Це найкорисніший практичний навик у цьому модулі, і він займає десять секунд.</p><p data-lang=\"ua\"><strong>Дії, які справді працюють:</strong></p><ul><li data-lang=\"ua\"><strong>Дійте завчасно.</strong> Зміна курсу на 20°, зроблена за 2 милі, легка, очевидна для іншого судна і нічого вам не коштує. Та сама зміна на 200 м — це аварійна ситуація.</li><li data-lang=\"ua\"><strong>Робіть свою дію очевидною і великою.</strong> Це і юридична вимога, і здоровий сенс.</li><li data-lang=\"ua\"><strong>Змінюйте курс, щоб пройти за кормою.</strong> Завжди безпечніший вибір. Ніколи не намагайтесь протиснутися перед носом судна — це класична фатальна помилка, бо ви не можете точно оцінити швидкість великого судна, а воно йде швидше, ніж виглядає.</li><li data-lang=\"ua\"><strong>Зменште швидкість.</strong> Це варіант, про який новачки забувають, і найлегший спосіб дати ситуації розв'язатися.</li><li data-lang=\"ua\"><strong>Коли сумніваєтесь — беріть рацію.</strong> Виклик по VHF на каналі 16, щоб назвати себе і повідомити свої наміри, це законно і часто вітається. Див. <a href=\"#/m11\" data-nav=\"m11\">Модуль 11</a>.</li><li data-lang=\"ua\"><strong>Припускайте, що інше судно зробить неправильну річ.</strong> Багато прогулянкових яхтсменів не знають цих правил. Плануйте на їхню помилку, а не на дотримання.</li></ul><hr><h3><span data-lang=\"en\">7.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\">These are PCOC-style questions. Answer without looking.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>State Rule 5, Rule 6, and the practical meaning of Rule 2.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>List the Rule 18 pecking order from most to least privileged.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You are sailing with sails up and the engine running in gear. What are you, legally?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Two sailboats, one on port tack and one on starboard. Who gives way?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Two sailboats on the same tack. Who gives way?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You are on port tack and cannot tell the other boat's tack. What must you do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Two power vessels head-on. What does each do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>You are under power and see a vessel on your starboard side crossing. Who gives way?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>At night you see only a red light crossing ahead. Do you give way or stand on?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does five short blasts mean, and what should you do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the fog signal for a sailing vessel, and how often?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe the constant bearing test.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you never cross ahead of a container ship in the Narrows?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which two VHF channels commonly carry Halifax vessel traffic services?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does \"shall not impede\" mean, and how does it differ from \"give way\"?</span></label></li></ul><p data-lang=\"ua\">Це питання у стилі PCOC. Відповідайте, не підглядаючи.</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте Правило 5, Правило 6 і практичне значення Правила 2.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Перелічіть ієрархію Правила 18 від найпривілейованішого до найменш.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви йдете з піднятими вітрилами і працюючим включеним двигуном. Хто ви юридично?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Два вітрильники, один на лівому галсі, інший на правому. Хто уступає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Два вітрильники на однаковому галсі. Хто уступає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви на лівому галсі і не можете визначити галс іншого судна. Що ви мусите робити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Два судна з двигунами на зустрічних курсах. Що робить кожне?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Ви під двигуном і бачите судно з правого борту на перетинному курсі. Хто уступає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Уночі ви бачите лише червоний вогонь, що перетинає курс попереду. Ви уступаєте чи зберігаєте курс?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означають п'ять коротких гудків і що вам робити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який туманний сигнал вітрильного судна і як часто?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть тест постійного пеленга.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому ніколи не можна перетинати курс перед контейнеровозом у Narrows?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які два канали VHF зазвичай обслуговують рух суден у Галіфаксі?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає «не перешкоджати» і чим це відрізняється від «уступити дорогу»?</span></label></li></ul><hr>"}, "m08": {"t_en": "08 · Buoys & lights", "t_ua": "Буї та вогні", "html": "<h2>Module 08 — Buoys, Lights, Shapes &amp; Signals</h2><h2 data-lang=\"ua\">Модуль 08 — Буї, вогні, знаки та сигнали</h2><p><strong>Study time / Час: ~2.5 hours</strong> · <strong>Heavily examined on the PCOC</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Buoys are road signs and lights are indicators. Both are pure memorisation, and both are worth a lot of PCOC marks. The critical thing to get right: <strong>Canada uses IALA Region B</strong>, which is the <em>opposite</em> colour convention from Europe. If you learned buoyage anywhere in Europe, you must unlearn it.</p><p data-lang=\"ua\">Буї — це дорожні знаки, а вогні — покажчики. Обидві теми — чисте запам'ятовування, і обидві дають багато балів на PCOC. Критично важливо засвоїти: <strong>Канада використовує IALA Регіон B</strong>, а це <em>протилежна</em> колірна конвенція порівняно з Європою. Якщо ви вчили систему буїв будь-де в Європі — вам треба її розучити.</p></blockquote><hr><h3><span data-lang=\"en\">8.1 IALA Region B — the Canadian system</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">IALA Регіон B — канадська система</span></h3><p data-lang=\"en\">The world is divided into two buoyage regions with <strong>inverted red/green conventions</strong>:</p><ul><li data-lang=\"en\"><strong>Region A</strong> — Europe, Africa, most of Asia, Australia, New Zealand. Red to port when entering harbour.</li><li data-lang=\"en\"><strong>Region B</strong> — <strong>the Americas (including Canada)</strong>, Japan, Korea, the Philippines. <strong>Red to starboard when entering harbour.</strong></li></ul><blockquote class=\"callout\"><h4><strong>\"RED RIGHT RETURNING\"</strong></h4><p><strong>Keep RED markers on your RIGHT (starboard) side when RETURNING to harbour — i.e. when proceeding upstream, or from seaward towards land.</strong></p><p data-lang=\"ua\"><strong>«ЧЕРВОНИЙ ПРАВОРУЧ ПРИ ПОВЕРНЕННІ» — тримайте ЧЕРВОНІ знаки з ПРАВОГО борту, коли ПОВЕРТАЄТЕСЬ у гавань, тобто йдете вгору за течією або з моря до берега.</strong></p></blockquote><p>This is the single most important sentence in this module. Memorise the phrase, not the logic.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th><strong>Port-hand buoy</strong></th><th><strong>Starboard-hand buoy</strong></th></tr></thead><tbody><tr><td>Ukrainian</td><td>лівий буй</td><td>правий буй</td></tr><tr><td><strong>Colour</strong></td><td><strong>GREEN</strong></td><td><strong>RED</strong></td></tr><tr><td><strong>Shape</strong> (unlit)</td><td>Can / cylinder (flat top)</td><td>Nun / cone (pointed top)</td></tr><tr><td><strong>Numbers</strong></td><td><strong>ODD</strong> (1, 3, 5, 7...)</td><td><strong>EVEN</strong> (2, 4, 6, 8...)</td></tr><tr><td><strong>Light colour</strong></td><td>Green</td><td>Red</td></tr><tr><td><strong>Keep it on which side when returning?</strong></td><td>Your <strong>port</strong> (left)</td><td>Your <strong>starboard</strong> (right)</td></tr><tr><td><strong>Keep it on which side when leaving harbour?</strong></td><td>Your <strong>starboard</strong></td><td>Your <strong>port</strong></td></tr></tbody></table></div><p><strong>Memory aids that work:</strong></p><ul><li><strong>\"Red Right Returning\"</strong> — the phrase itself.</li><li><strong>Red = Right = Returning = Even numbers = coNe/nun shape.</strong></li><li><strong>Green = Odd = Can shape</strong> (Green, Gerade? no — just: <strong>\"Green cans have odd numbers\"</strong>).</li><li>Numbers <strong>increase</strong> as you proceed upstream / into harbour. So rising numbers means you're heading in.</li></ul><p data-lang=\"en\"><strong>The direction question is everything.</strong> A buoy is only \"port-hand\" relative to the <strong>conventional direction of buoyage</strong>, which is:</p><ol><li data-lang=\"en\">Entering a harbour from seaward, or</li><li data-lang=\"en\">Proceeding upstream in a river, or</li><li data-lang=\"en\">Following the direction marked on the chart (a chart shows the buoyage direction with a special arrow symbol where it isn't obvious).</li></ol><p data-lang=\"en\"><strong>Coming <em>out</em> of Halifax Harbour, everything reverses:</strong> red buoys are now on your <strong>port</strong> side. Beginners get caught by this constantly, because they memorise \"red on the right\" as absolute. It is not — it is relative to direction of travel. When leaving harbour, mentally recite <strong>\"red left leaving\"</strong>.</p><p data-lang=\"ua\">Світ поділений на два регіони буїв з <strong>інвертованими червоно-зеленими конвенціями</strong>:</p><ul><li data-lang=\"ua\"><strong>Регіон A</strong> — Європа, Африка, більша частина Азії, Австралія, Нова Зеландія. Червоний з лівого борту при заході в гавань.</li><li data-lang=\"ua\"><strong>Регіон B</strong> — <strong>Америки (включно з Канадою)</strong>, Японія, Корея, Філіппіни. <strong>Червоний з правого борту при заході в гавань.</strong></li></ul><p data-lang=\"ua\"><strong>Питання напрямку — це все.</strong> Буй є «лівим» лише відносно <strong>умовного напрямку системи буїв</strong>, а це:</p><ol><li data-lang=\"ua\">Захід у гавань з моря, або</li><li data-lang=\"ua\">Рух вгору за течією у річці, або</li><li data-lang=\"ua\">Слідування напрямку, позначеному на карті.</li></ol><p data-lang=\"ua\"><strong>Виходячи <em>з</em> гавані Галіфаксу, усе змінюється навпаки:</strong> червоні буї тепер з вашого <strong>лівого</strong> борту. Новачки постійно на це попадаються, бо запам'ятовують «червоний праворуч» як абсолют. Це не так — це відносно напрямку руху. Виходячи з гавані, повторюйте про себе <strong>«червоний ліворуч при виході»</strong>.</p><hr><h3><span data-lang=\"en\">8.2 The other buoys</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інші буї</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Buoy</th><th>Appearance</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Bifurcation / preferred channel</strong></td><td>Red &amp; green horizontal bands. <strong>Top band colour = the preferred channel side.</strong> Red on top → keep it to starboard for the main channel.</td><td>The channel splits. Either side is navigable; one i
