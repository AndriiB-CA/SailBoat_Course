ичай потрібен для страхування.</li><li data-lang=\"ua\"><strong>Ходові випробування</strong> — походіть під вітрилами і дайте двигуну навантаження на тривалий час.</li><li data-lang=\"ua\"><strong>Перевірте документи:</strong> чистий титул, відсутність застав, передача <strong>Pleasure Craft Licence</strong> або реєстрації, податкові зобов'язання.</li><li data-lang=\"ua\"><strong>Торгуйтеся за результатами сюрвею.</strong></li><li data-lang=\"ua\"><strong>Страхування</strong> до приймання судна. Страховики тут спитають про ваші кваліфікації і досвід — <strong>це ще одна конкретна причина мати сертифікати Sail Canada.</strong></li><li data-lang=\"ua\"><strong>Зареєструйте або ліцензуйте судно.</strong></li></ol><hr><h3><span data-lang=\"en\">18.4 The Nova Scotia annual cycle</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Річний цикл у Новій Шотландії</span></h3><p data-lang=\"en\">Owning a boat here means an annual rhythm that boat owners in warmer places don't have. Plan around it.</p><div class=\"table-wrap\"><table><thead><tr><th>Period</th><th>What happens</th></tr></thead><tbody><tr><td><strong>April–May</strong></td><td><strong>Launch season.</strong> Antifoul the bottom, service seacocks, check and tune the rig, replace anodes, commission the engine, bend on sails, test all systems. Book your yard slot early — everyone wants the same weekend.</td></tr><tr><td><strong>May–June</strong></td><td>Sailing begins. <strong>Fog season peaks.</strong> Shakedown sails to find what broke over winter.</td></tr><tr><td><strong>July–August</strong></td><td><strong>Peak season.</strong> Warmest water, best sailing, cruising month. Also the start of hurricane watch.</td></tr><tr><td><strong>August–October</strong></td><td>Excellent sailing — arguably the best of the year — with <strong>hurricane season</strong> running concurrently. Watch the tropical forecasts.</td></tr><tr><td><strong>September–October</strong></td><td>Late-season sailing, fewer boats, beautiful light, colder.</td></tr><tr><td><strong>October–November</strong></td><td><strong>Haul-out.</strong> Pressure wash, winterise the engine (antifreeze through the raw-water system), drain water systems, remove sails and running rigging, remove electronics and cushions, ventilate, cover, and secure against winter storms.</td></tr><tr><td><strong>November–April</strong></td><td>Boat ashore. <strong>This is the classroom season:</strong> courses, maintenance projects, planning next year's cruise, reading.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Volunteer for other people's launch and haul-out days before you own a boat.</strong> It's the best free education in boat systems available anywhere: you'll see seacocks, anodes, rigging, engines, and antifouling all in one day, with an experienced owner explaining as they go. And it makes you the person people call when they need crew.</p><p data-lang=\"ua\">Володіння судном тут означає річний ритм, якого немає у власників у теплих місцях.</p><p data-lang=\"ua\"><strong>Квітень–травень:</strong> <strong>сезон спуску</strong> — фарбування днища, обслуговування кінгстонів, перевірка й настройка такелажу, заміна анодів, розконсервація двигуна, установка вітрил. Бронюйте місце на майданчику заздалегідь.</p><p data-lang=\"ua\"><strong>Травень–червень:</strong> початок плавання. <strong>Пік сезону туманів.</strong></p><p data-lang=\"ua\"><strong>Липень–серпень:</strong> <strong>пік сезону.</strong> Найтепліша вода, найкраще плавання. Також початок спостереження за ураганами.</p><p data-lang=\"ua\"><strong>Серпень–жовтень:</strong> відмінне плавання — імовірно найкраще за рік — з паралельним <strong>сезоном ураганів</strong>.</p><p data-lang=\"ua\"><strong>Жовтень–листопад:</strong> <strong>підйом на берег.</strong> Мийка під тиском, консервація двигуна (антифриз через систему забортної води), злив водяних систем, зняття вітрил і бігучого такелажу, зняття електроніки, вентиляція, укриття, закріплення проти зимових штормів.</p><p data-lang=\"ua\"><strong>Листопад–квітень:</strong> судно на берегі. <strong>Це сезон навчання:</strong> курси, ремонтні проєкти, планування наступного круїзу, читання.</p><p data-lang=\"ua\"><strong>Ходіть волонтером на дні спуску й підйому інших людей до того, як маєте власне судно.</strong> Це найкраща безкоштовна освіта з систем судна, яку взагалі можна отримати.</p><hr><h3><span data-lang=\"en\">18.5 What mastery actually looks like</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Як насправді виглядає майстерність</span></h3><p data-lang=\"en\">You asked to go \"from zero to master\". Here is an honest description of the destination, because it isn't a certificate.</p><p data-lang=\"en\"><strong>Mastery is not:</strong></p><ul><li data-lang=\"en\">Having the highest certification. Paper is a threshold, not an achievement.</li><li data-lang=\"en\">Owning the biggest boat.</li><li data-lang=\"en\">Never making mistakes.</li><li data-lang=\"en\">Sailing in the worst conditions. Anyone can survive a gale by accident.</li></ul><p data-lang=\"en\"><strong>Mastery is:</strong></p><ol><li data-lang=\"en\"><strong>Judgement.</strong> Consistently making conservative decisions with incomplete information, and being right about when <em>not</em> to go. Every experienced skipper's best decisions are days they stayed in port and nothing happened.</li><li data-lang=\"en\"><strong>Anticipation.</strong> Reefing before you need to. Seeing the gust on the water before it arrives. Knowing what the wind will do at 1600 because you understood the sea breeze at 1000. Preparing for the problem you don't have yet.</li><li data-lang=\"en\"><strong>Calm.</strong> Nothing surprises you into paralysis, because you've rehearsed the important things and you know that most problems can be solved slowly. Being able to <em>heave-to and think</em> is a form of mastery.</li><li data-lang=\"en\"><strong>Economy of effort.</strong> Doing less, earlier, so that violent corrections are never needed. Experienced sailors look slow and lazy and are always ahead of the boat.</li><li data-lang=\"en\"><strong>Crew.</strong> People are safe, informed, useful, and enjoying themselves. Your crew wants to sail with you again, and knows what to do if you're incapacitated. This is the clearest single marker of a good skipper.</li><li data-lang=\"en\"><strong>Sensitivity to the boat.</strong> Feeling weather helm build before you consciously notice it. Hearing a change in the engine. Noticing a sail is 5% wrong. This comes only from hours.</li><li data-lang=\"en\"><strong>Honest self-assessment.</strong> Knowing precisely what you can and cannot do, and not being tempted to find out the hard way with other people aboard.</li><li data-lang=\"en\"><strong>Never stopping learning.</strong> The best sailors are the ones still asking questions after forty years.</li></ol><p data-lang=\"en\"><strong>Roughly how long:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Stage</th><th>Roughly</th><th>What you can do</th></tr></thead><tbody><tr><td><strong>Novice</strong></td><td>0–20 hours</td><td>Useful crew with direction</td></tr><tr><td><strong>Competent crew</strong></td><td>20–60 hours</td><td>Genuinely useful; can take the helm</td></tr><tr><td><strong>Basic skipper</strong></td><td>100+ hours, Basic Cruising</td><td>Skipper a small boat in familiar water by day</td></tr><tr><td><strong>Coastal skipper</strong></td><td>300+ hours, Intermediate</td><td>Multi-day coastal cruises, unfamiliar harbours, charter anywhere</td></tr><tr><td><strong>Experienced skipper</strong></td><td>1,000+ hours, several seasons, Advanced</td><td>Night passages, heavy weather, real self-sufficiency</td></tr><tr><td><strong>Master</strong></td><td>Many thousands of hours, many years, many boats, many coasts</td><td>The judgement above. There is no exam for this.</td></tr></tbody></table></div><p data-lang=\"ua\">Ви просили «від нуля до майстра». Ось чесний опис пункту призначення, бо це не сертифікат.</p><p data-lang=\"ua\"><strong>Майстерність — це не:</strong> мати найвищий сертифікат (папір це порог, а не досягнення) · володіти найбільшим судном · ніколи не помилятися · ходити в найгіршу погоду (будь-хто може випадково пережити шторм).</p><p data-lang=\"ua\"><strong>Майстерність — це:</strong></p><ol><li data-lang=\"ua\"><strong>Судження.</strong> Послідовно приймати консервативні рішення при неповній інформації і бути правим щодо того, коли <em>не</em> йти.</li><li data-lang=\"ua\"><strong>Передбачення.</strong> Брати риф до того, як це стало потрібно. Бачити порив на воді до того, як він прийшов. Знати, що зробить вітер у 16:00, бо ви зрозуміли морський бриз у 10:00.</li><li data-lang=\"ua\"><strong>Спокій.</strong> Ніщо не паралізує вас неочікуваністю, бо ви відрепетирували головне і знаєте, що більшість проблем можна вирішувати повільно. Уміння <strong>лягти в дрейф і подумати</strong> — це форма майстерності.</li><li data-lang=\"ua\"><strong>Економія дій.</strong> Робити менше, раніше, так щоб різкі виправлення ніколи не були потрібні. Досвідчені яхтсмени виглядають повільними і лінивими і завжди на крок попереду судна.</li><li data-lang=\"ua\"><strong>Екіпаж.</strong> Люди в безпеці, поінформовані, корисні й отримують задоволення. Ваш екіпаж хоче ходити з вами знову і знає, що робити, якщо ви недієздатні. Це найясніша ознака доброго шкіпера.</li><li data-lang=\"ua\"><strong>Чутливість до судна.</strong> Відчувати наростання навітряного керма до того, як усвідомили. Чути зміну в двигуні. Помічати, що вітрило на 5% неправильне. Це дають лише години.</li><li data-lang=\"ua\"><strong>Чесна самооцінка.</strong> Точно знати, що ви можете і чого не можете, і не спокушатися дізнатися це важким шляхом з людьми на борту.</li><li data-lang=\"ua\"><strong>Ніколи не припиняти вчитися.</strong> Найкращі яхтсмени — ті, хто все ще задає питання після сорока років.</li></ol><hr><h3><span data-lang=\"en\">18.6 Ten years from now</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Через десять років</span></h3><p data-lang=\"en\">A realistic long arc, if you want one:</p><div class=\"table-wrap\"><table><thead><tr><th>Year</th><th>Milestone</th></tr></thead><tbody><tr><td><strong>2026</strong> (now)</td><td>PCOC. First sails. Crew on Wednesday races. Start Keelboating. ~25 hours.</td></tr><tr><td><strong>2027</strong></td><td>ROC(M) and Coastal Navigation over winter. <strong>Basic Cruising.</strong> First coastal passage. ~75 hours.</td></tr><tr><td><strong>2028</strong></td><td><strong>Intermediate Cruising.</strong> First multi-day cruise to Lunenburg. A racing season. ~200 hours.</td></tr><tr><td><strong>2029</strong></td><td>Advanced Cruising and night sailing. Consider a co-op share or a boat. Charter abroad. ~350 hours.</td></tr><tr><td><strong>2030–2031</strong></td><td>Own or share a boat. Cruise Bras d'Or Lakes. Longer passages. Perhaps teach beginners — teaching is the fastest way to expose the gaps in your own understanding.</td></tr><tr><td><strong>2032+</strong></td><td>Offshore certification. An ocean passage. Or simply: a boat you know completely, a coast you know intimately, and a crew who trust you. <strong>Which is the actual goal.</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The last piece of advice, and the most important one in the whole course:</strong></p><blockquote class=\"callout\"><p><strong>Go sailing. Today, if you can.</strong></p><p>Everything in these eighteen modules is scaffolding around a physical skill that exists only on the water. Reading about sailing has roughly the same relationship to sailing that reading about swimming has to swimming. The single strongest predictor of whether you become a good sailor is not intelligence, money, or study — <strong>it is hours on the water.</strong></p><p>It is late July. The season is at its best right now. Go to a club, find a dock, and ask someone if they need crew.</p></blockquote><p data-lang=\"ua\"><strong>Остання порада, і найважливіша в усьому курсі:</strong></p><blockquote class=\"callout\"><p data-lang=\"ua\"><strong>Ідіть під вітрилами. Сьогодні, якщо можете.</strong></p><p data-lang=\"ua\">Усе в цих вісімнадцяти модулях — це лише каркас навколо фізичного навику, який існує лише на воді. Читання про вітрильний спорт має приблизно те саме відношення до вітрильного спорту, що читання про плавання до плавання. Найсильніший показник того, чи станете ви добрим яхтсменом, — це не розум, не гроші і не навчання. <strong>Це години на воді.</strong></p><p data-lang=\"ua\">Зараз кінець липня. Сезон саме в найкращій формі. Ідіть до клубу, знайдіть причал і спитайте когось, чи не потрібен їм екіпаж.</p></blockquote><hr><h3><span data-lang=\"en\">18.7 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Name four alternatives to ownership, and which is the sweet spot for most people.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly what proportion of a boat's value do annual running costs represent?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name six features that specifically matter for a Nova Scotia cruising boat.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is moderate draft important on this coast?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you never skip a marine survey?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why do insurers care about your Sail Canada certifications?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe the annual haul-out and launch cycle here.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you volunteer for other people's haul-out days?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name five characteristics of genuine mastery.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly how many hours to be a competent coastal skipper?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the single strongest predictor of becoming a good sailor?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What are you doing this week?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть чотири альтернативи володінню і яка з них оптимальна для більшості.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Приблизно яку частку від вартості судна складають щорічні витрати на утримання?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть шість характеристик, що конкретно важливі для круїзного судна в Новій Шотландії.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому помірна осадка важлива на цьому узбережжі?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому ніколи не можна пропускати морський сюрвей?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому страховиків цікавлять ваші сертифікати Sail Canada?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть річний цикл підйому й спуску тут.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому варто ходити волонтером на дні підйому інших людей?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять характеристик справжньої майстерності.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Приблизно скільки годин, щоб бути компетентним прибережним шкіпером?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який найсильніший показник того, що ви станете добрим яхтсменом?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що ви робите цього тижня?</span></label></li></ul><hr><p data-lang=\"en\"><strong>Fair winds.</strong></p>"}, "m19": {"t_en": "19 · Buying a boat", "t_ua": "Купівля судна", "html": "<h2>Module 19 — Buying a Boat in Nova Scotia: A Practical Guide</h2><h2 data-lang=\"ua\">Модуль 19 — Купівля судна в Новій Шотландії: практичний посібник</h2><p><strong>Study time / Час: ~3 hours + a winter of research</strong></p><blockquote class=\"callout\"><p data-lang=\"en\"><strong>⚠️ Every price in this module is a planning estimate in 2026 Canadian dollars, gathered from public listings and published rate cards.</strong> Boat prices vary enormously with condition, and club fees, yard rates, survey rates and insurance premiums all change yearly. <strong>Get quotes.</strong> Treat these numbers as a way to build a realistic budget, not as offers.</p><p data-lang=\"ua\"><strong>⚠️ Кожна ціна в цьому модулі — оцінка для планування в канадських доларах 2026 року</strong>, зібрана з публічних оголошень і опублікованих тарифів. Ціни на судна дуже сильно залежать від стану, а клубні внески, тарифи майданчиків, сюрвеї та страхові премії змінюються щороку. <strong>Беріть комерційні пропозиції.</strong></p></blockquote><hr><h3><span data-lang=\"en\">19.1 First: get the sequence right</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Спочатку: правильна послідовність</span></h3><p data-lang=\"en\">You're planning to buy for next season. Good — that's exactly the right amount of lead time, and it lets you do this in the right order. The single most common expensive mistake is buying before you know what you want.</p><p data-lang=\"en\"><strong>The recommended sequence, and why:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>When</th><th>Do this</th><th>Why this order</th></tr></thead><tbody><tr><td><strong>Aug–Oct 2026</strong></td><td>Sail as much as possible. Crew on other people's boats. Go aboard everything you can.</td><td>You are gathering the only data that matters: what you actually like. Ask every owner \"what would you buy next time, and why?\"</td></tr><tr><td><strong>Oct–Nov 2026</strong></td><td>Volunteer for haul-out days.</td><td><strong>The single best free education in what breaks.</strong> You'll see hulls out of the water, corroded seacocks, tired rigging, and worn cutless bearings — with an owner explaining as they go. After two haul-outs you can spot a neglected boat from the dock.</td></tr><tr><td><strong>Winter 2026/27</strong></td><td>Research and shortlist. ROC(M) and Coastal Navigation courses. Read <em>This Old Boat</em>. Watch listings <strong>without buying</strong> — you're learning the market's price/condition curve.</td><td>Winter is when you become an informed buyer instead of a hopeful one.</td></tr><tr><td><strong>May–Jun 2027</strong></td><td><strong>Do Basic Cruising first.</strong></td><td>This matters practically, not just as advice: insurers ask about your qualifications, and it's much cheaper to discover you dislike sailing 9 m boats on someone else's than on your own.</td></tr><tr><td><strong>Aug–Oct 2027</strong></td><td><strong>Buy in the autumn.</strong></td><td>This is the real tip in this module. Autumn is a <strong>buyer's market</strong> — sellers who didn't sell over summer are facing another winter's storage bill and are far more flexible. You also get the whole winter to fix, learn, and prepare the boat instead of losing sailing weeks to it.</td></tr><tr><td><strong>May 2028</strong></td><td>Launch your own boat, ready.</td><td>You start the season sailing, not sanding.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>If you'd rather buy in spring 2027</strong>, that's a perfectly reasonable choice — you get a full season aboard immediately. Just know the trade: spring is a seller's market with less inventory and firmer prices, and anything the survey turns up has to be fixed <em>now</em>, in the middle of the launch rush when every yard and tradesperson is booked solid.</p><p data-lang=\"ua\">Ви плануєте купити на наступний сезон. Добре — це саме правильний запас часу, і він дозволяє зробити все в правильному порядку. Найпоширеніша дорога помилка — купити, перш ніж ви знаєте, чого хочете.</p><p data-lang=\"ua\"><strong>Рекомендована послідовність:</strong> серпень–жовтень 2026 — ходіть скільки можете на чужих судах → жовтень–листопад — волонтерте на підйомі суден на берег (<strong>найкраща безкоштовна освіта щодо того, що ламається</strong>) → зима 2026/27 — дослідження, короткий список, курси ROC(M) і навігації, спостереження за оголошеннями <strong>без покупки</strong> → травень–червень 2027 — <strong>спочатку зробіть Basic Cruising</strong> (страховики питають про кваліфікації, і дешевше з'ясувати свої смаки на чужому судні) → <strong>серпень–жовтень 2027 — купуйте восени</strong>.</p><p data-lang=\"ua\"><strong>Головна порада цього модуля: купуйте восени.</strong> Осінь — <strong>ринок покупця</strong>: продавці, які не продали за літо, стоять перед ще одним рахунком за зимове зберігання і значно гнучкіші. Плюс ви отримуєте всю зиму на ремонт і підготовку замість того, щоб втрачати тижні сезону.</p><hr><h3><span data-lang=\"en\">19.2 What boat, for this coast</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Яке судно для цього берега</span></h3><p data-lang=\"en\">Nova Scotia is cold, foggy, rocky, has genuine Atlantic swell and a hurricane season. That narrows the field usefully. And since you'll be sailing with your partner and daughter, <strong>ease of handling matters as much as capability</strong> — see <a href=\"#/m20\" data-nav=\"m20\">Module 20</a>.</p><h4>The size question</h4><div class=\"table-wrap\"><table><thead><tr><th>Length</th><th>Rough price band (used, sound)</th><th>Realistic for you?</th></tr></thead><tbody><tr><td><strong>20–24 ft</strong></td><td>$3,000–15,000</td><td>Cheap, simple, trailerable. But cramped for three, minimal shelter, and rough in Atlantic swell. A fine <em>first</em> boat if you want to learn cheaply and sell on.</td></tr><tr><td><strong>26–30 ft</strong></td><td>$12,000–45,000</td><td><strong>The sweet spot for a Halifax family cruiser.</strong> Standing headroom (in most), a real cabin, a head, an enclosed berth for a child, capable of the South Shore, and still handleable by two people. Haul-out and storage costs stay sane.</td></tr><tr><td><strong>31–36 ft</strong></td><td>$35,000–110,000</td><td>More comfort, more speed, more genuine offshore capability — and meaningfully more money in every direction: bigger sails, bigger winches, higher storage and yard fees, more systems to fail.</td></tr><tr><td><strong>37 ft+</strong></td><td>$90,000+</td><td>Not a first boat. Running costs escalate sharply.</td></tr></tbody></table></div><p><strong>Recommendation: look hard at 27–32 ft.</strong> With three of you and a daughter who'll grow, that's the band where the boat is genuinely comfortable for a South Shore cruise without becoming a second job.</p><h4>Canadian and East Coast boats worth shortlisting</h4><p data-lang=\"en\">These come up regularly in Nova Scotia, were often built in Canada, and suit this coast. This is a starting list for research, not a recommendation of any specific hull — condition matters far more than model.</p><div class=\"table-wrap\"><table><thead><tr><th>Boat</th><th>Roughly</th><th>Why it's on the list</th></tr></thead><tbody><tr><td><strong>Nonsuch 26 / 30 / 33</strong></td><td>$25,000–70,000</td><td><strong>Look at these seriously for a family.</strong> Canadian-built (Hinterhoeller, Ontario). A single unstayed mast with one wishbone-boomed sail: <strong>no jib to change, no foredeck work, and nothing to send you forward in a blow.</strong> Enormous interior for the length, very easy for two people to handle. The trade: unconventional, less upwind performance, and a distinctive look you'll either love or not.</td></tr><tr><td><strong>Alberg 30</strong></td><td>$12,000–30,000</td><td>An East Coast classic — narrow, heavy, full keel, famously seakindly in a swell. Slow, small interior, very seaworthy. A cult following for good reason.</td></tr><tr><td><strong>Contessa 26</strong></td><td>$10,000–25,000</td><td>Canadian-built, tiny, and genuinely offshore-capable — this design has crossed oceans. Very small for three people, but superb value and confidence-inspiring.</td></tr><tr><td><strong>CS 27 / 30 / 33 / 36</strong></td><td>$18,000–65,000</td><td>Canadian Sailcraft. Well-built, well-regarded, good balance of performance and cruising comfort. A 1986 CS 30 was recently listed around <strong>$27,500 in Chester</strong>.</td></tr><tr><td><strong>Grampian 26 / 30</strong></td><td>$8,000–25,000</td><td>Canadian-built, plentiful, inexpensive, and all over the Nova Scotia coast. Basic and dated, but honest boats and cheap to get into.</td></tr><tr><td><strong>Tanzer 22 / 26 / 7.5</strong></td><td>$5,000–20,000</td><td>Quebec-built, very common, simple and affordable. Good learner boats.</td></tr><tr><td><strong>C&amp;C 27 / 30 / 34</strong></td><td>$15,000–55,000</td><td>Canadian, more performance-oriented. Fast and fun; generally less interior volume than a comparable cruiser.</td></tr><tr><td><strong>Catalina 27 / 30</strong></td><td>$12,000–40,000</td><td>American, produced in huge numbers, so parts and knowledge are everywhere. Roomy interiors. Less heavily built than an Alberg — fine for coastal work.</td></tr><tr><td><strong>Cape Dory 28 / 30</strong></td><td>$20,000–45,000</td><td>Traditional, heavily built, full keel, very pretty. Seaworthy and slow.</td></tr><tr><td><strong>Bayfield 25 / 29 / 32</strong></td><td>$15,000–45,000</td><td>Canadian-built (Ontario), traditional cutter styling, shallow draft — which is genuinely useful on this coast.</td></tr></tbody></table></div><h4>Features that actually matter here</h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Inboard diesel, and evidence it's been maintained.</strong> Fog, calms, and lee shores make the engine safety equipment. A tired outboard on a 30-footer is a real limitation. <strong>Ask for engine hours and service records; a well-documented old engine beats an undocumented newer one.</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Draft around 1.2–1.6 m.</strong> Deeper closes off South Shore coves.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>A dodger, or the fittings for one.</strong> On a cold, wet, foggy coast this is the difference between your family enjoying it and enduring it. Budget $1,500–3,500 for a new one.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Cabin heating</strong>, or space to fit it. Extends your season at both ends. A diesel or propane heater runs $1,500–4,000 installed.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Wheel or tiller?</strong> Tiller is simpler, cheaper, more feel, and gives more cockpit space when lashed. Wheel is easier for guests and long stints. Either is fine.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>A cockpit three people can actually sit in</strong>, and a companionway a child can go up and down safely.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Oversized ground tackle.</strong> Rocky, weedy bottoms. Go one anchor size up.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>A proper boarding ladder</strong> that works from in the water, not just from a dock.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Simple systems.</strong> Every clever system is a future failure. Fewer, better.</span></label></li></ul><p data-lang=\"ua\"><strong>Розмір:</strong> дивіться уважно на <strong>27–32 фути</strong>. З трьома людьми і дочкою, яка росте, це діапазон, де судно справді комфортне для круїзу по Південному узбережжю, не перетворюючись на другу роботу.</p><p data-lang=\"ua\"><strong>Канадські судна, варті короткого списку:</strong> <strong>Nonsuch 26/30/33</strong> (розгляньте серйозно для родини — одна незакріплена мачта з одним вітрилом: <strong>немає стакселя, немає роботи на баку, нічого не відправляє вас уперед при вітрі</strong>; величезний інтер'єр, дуже легко керувати вдвох) · <strong>Alberg 30</strong> (класика Східного узбережжя, важкий, повний кіль, дуже м'який на хвилі) · <strong>Contessa 26</strong> (канадський, крихітний, справді океанський) · <strong>CS 27/30/33</strong> (Canadian Sailcraft, добре побудовані; CS 30 1986 року нещодавно виставляли близько <strong>$27 500 у Chester</strong>) · <strong>Grampian 26/30</strong> (канадські, численні, недорогі, по всьому берегу НШ) · <strong>Tanzer</strong> (Квебек, прості й доступні) · <strong>C&amp;C</strong> (канадські, швидкіші) · <strong>Catalina 27/30</strong> (величезні тиражі, тому запчастини й знання всюди) · <strong>Bayfield</strong> (мала осадка — справді корисно тут).</p><p data-lang=\"ua\"><strong>Що справді важливо тут:</strong> стаціонарний дизель з історією обслуговування (<strong>запитуйте моточаси й сервісні записи</strong>) · осадка 1,2–1,6 м · <strong>дожер</strong> (на холодному мокрому туманному берегі це різниця між задоволенням і терпінням родини; новий $1 500–3 500) · обігрів каюти ($1 500–4 000 з установкою) · кокпіт, у якому справді сидять троє · збільшений якір · нормальний трап з води · прості системи.</p><hr><h3><span data-lang=\"en\">19.3 Where to look</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Де шукати</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Source</th><th>What it's good for</th></tr></thead><tbody><tr><td><strong>Yacht club noticeboards and word of mouth</strong></td><td><strong>Start here.</strong> Frequently the best boats at the best prices, from members whose maintenance history is <em>knowable</em>. In a community the size of Halifax's, you can ask around about a specific boat and learn things no listing will tell you. This is a genuine advantage of joining a club before you buy.</td></tr><tr><td><strong>Kijiji</strong> (Halifax / Nova Scotia sailboat sections)</td><td>The largest pool of private local listings. Wide range of quality — lots of projects and abandoned dreams alongside good boats.</td></tr><tr><td><strong>BoatDealers.ca</strong></td><td>Aggregates Canadian dealer and private listings.</td></tr><tr><td><strong>YachtWorld</strong> (Nova Scotia filter)</td><td>Broker listings, generally higher-end and higher-priced, but well documented.</td></tr><tr><td><strong>Ocean Yacht Sales</strong></td><td>Brokerage covering Canada's Atlantic provinces.</td></tr><tr><td><strong>Atlantic Yacht Sales</strong></td><td>Nova Scotia brokerage.</td></tr><tr><td><strong>Facebook groups</strong> for Nova Scotia / Maritime sailing</td><td>Where boats get mentioned before they're formally listed.</td></tr><tr><td><strong>Walk the yards in late October</strong></td><td>Boats coming out with \"for sale\" signs, owners who've just decided, and you can see the whole hull. Genuinely the best time and place to shop.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Broker or private sale?</strong> A broker costs the seller a commission (so it's arguably in the price), but handles the paperwork, title search, and lien check — which is real value if you're buying your first boat. A private sale can be cheaper and more transparent about history. Either way, <strong>you</strong> commission the survey.</p><p data-lang=\"ua\"><strong>Де шукати:</strong> <strong>починайте з дошок об'яв у яхт-клубах і сарафанного радіо</strong> (часто найкращі судна за найкращими цінами, від людей, чию історію обслуговування можна дізнатися) · Kijiji (найбільший пул приватних оголошень, дуже різна якість) · BoatDealers.ca · YachtWorld з фільтром Нової Шотландії · Ocean Yacht Sales · Atlantic Yacht Sales · групи у Facebook · <strong>пройдіться майданчиками в кінці жовтня</strong> (судна виходять з води з табличками «продається», і ви бачите весь корпус — справді найкращий час і місце).</p><hr><h3><span data-lang=\"en\">19.4 The survey — never skip it</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сюрвей — ніколи не пропускайте</span></h3><p data-lang=\"en\">A marine surveyor is the best money you will spend in this whole process.</p><div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Typical cost</th></tr></thead><tbody><tr><td><strong>Pre-purchase survey</strong>, 26–32 ft</td><td>Commonly quoted at <strong>$15–30 per foot</strong> → roughly <strong>$450–900</strong> for a 30-footer. Some surveyors bill differently: e.g. <strong>$20/ft LOA + a travel fee + HST</strong>, or a base rate plus a per-foot surcharge that increases for boats over 20 and over 30 years old.</td></tr><tr><td><strong>Haul-out for the survey</strong></td><td><strong>$200–600</strong>, depending on the yard. A survey without hauling the boat is not a full survey.</td></tr><tr><td><strong>Engine survey / oil analysis</strong> (separate specialist)</td><td><strong>$300–700.</strong> Worth it on any boat where the engine is a significant part of the value.</td></tr><tr><td><strong>Rig inspection</strong> (may be extra, or require unstepping the mast)</td><td><strong>$200–600+</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>Note on insurance:</strong> as of mid‑2024 at least one major Canadian marine insurer (Gallagher Skippers' Plan) waives the survey requirement for boats <strong>under 30 ft with a market value under $50,000</strong>. <strong>Do not let that talk you out of a survey.</strong> The insurer is managing <em>their</em> risk on a low-value hull; you are trying to avoid buying a $30,000 problem. Get the survey anyway.</p><h4>What a surveyor is looking for, and what should scare you</h4><div class=\"table-wrap\"><table><thead><tr><th>Finding</th><th>How bad</th></tr></thead><tbody><tr><td><strong>Wet deck core / soft spots</strong> underfoot or around fittings</td><td>🔴 <strong>Serious.</strong> Water in a balsa or plywood deck core. Proper repair is thousands and it's messy. Very common on older boats.</td></tr><tr><td><strong>Structural hull blisters / advanced osmosis</strong></td><td>🔴 <strong>Serious</strong> if extensive. A peel-and-dry job is a five-figure sum. Scattered cosmetic blisters are usually tolerable.</td></tr><tr><td><strong>Corroded or cracked chainplates</strong>, or rust weeping from the deck around them</td><td>🔴 <strong>Serious.</strong> These hold the mast up.</td></tr><tr><td><strong>Rigging over 15–20 years old</strong></td><td>🟠 Budget to replace it. <strong>Standing rigging replacement on a 30-footer: $3,000–8,000.</strong> Insurers increasingly ask about rig age.</td></tr><tr><td><strong>Keel-hull joint cracks, or evidence of a grounding</strong></td><td>🔴 Investigate hard. Keel bolt problems are expensive and serious.</td></tr><tr><td><strong>Engine: hard starting, blue/white smoke, low compression, no service records</strong></td><td>🟠 A repower is <strong>$8,000–20,000+</strong> installed. This single item can invert the economics of a cheap boat.</td></tr><tr><td><strong>Seized or corroded seacocks</strong></td><td>🟠 Each is a sinking risk. Replacement <strong>$150–400 each</strong>, and a boat has many.</td></tr><tr><td><strong>Soft or delaminated bulkheads, rot in a wooden mast step</strong></td><td>🔴 Structural.</td></tr><tr><td><strong>Tired sails</strong> (baggy, blown out, UV-damaged)</td><td>🟠 A new main and headsail for a 30-footer: <strong>$4,000–9,000</strong>. Serviceable used sails, far less.</td></tr><tr><td><strong>Old wiring, no breaker panel, \"creative\" electrical work</strong></td><td>🟠 Fire risk. Rewiring is slow, expensive labour.</td></tr><tr><td><strong>Deferred cosmetics</strong> — faded gelcoat, tired brightwork, ugly cushions</td><td>🟢 <strong>Ignore this, and use it to negotiate.</strong> Cosmetics are the cheapest thing on a boat and they scare other buyers off. <strong>An ugly boat with a good hull, rig and engine is the bargain you want.</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The rule:</strong> buy on <strong>hull, rig, engine and keel</strong>. Everything else is money and weekends. A pretty boat with a wet deck and a dying engine is a trap; a scruffy boat that's structurally sound is an opportunity.</p><p data-lang=\"ua\"><strong>Сюрвей:</strong> <strong>передпродажний сюрвей 26–32 фути</strong> зазвичай <strong>$15–30 за фут</strong> → приблизно <strong>$450–900</strong> для 30-футового. Деякі сюрвейєри рахують як <strong>$20/фут + виїзд + HST</strong>, або базова ставка плюс надбавка за вік (більше для суден понад 20 і понад 30 років). <strong>Підйом на берег для сюрвею $200–600</strong> — сюрвей без підйому це не повний сюрвей. <strong>Сюрвей двигуна $300–700.</strong></p><p data-lang=\"ua\"><strong>Про страхування:</strong> станом на середину 2024 року щонайменше один великий канадський морський страховик знімає вимогу сюрвею для суден <strong>менше 30 футів вартістю менше $50 000</strong>. <strong>Не дозволяйте цьому відмовити вас від сюрвею.</strong> Страховик керує <em>своїм</em> риском; ви намагаєтесь не купити проблему за $30 000.</p><p data-lang=\"ua\"><strong>Правило:</strong> купуйте за <strong>корпусом, такелажем, двигуном і кілем</strong>. Усе інше — це гроші й вихідні. Красиве судно з мокрою палубою і вмираючим двигуном — це пастка; облізле, але конструктивно здорове — це можливість. <strong>Занедбана косметика — це те, чим ви торгуєтесь</strong>: вона відштовхує інших покупців.</p><hr><h3><span data-lang=\"en\">19.5 The real cost of ownership</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Справжня вартість володіння</span></h3><p data-lang=\"en\">Here is a worked annual budget for a <strong>30-foot boat bought at around $30,000</strong> in the Halifax area. This is the number people don't calculate before buying, and it is why boats get abandoned in yards.</p><div class=\"table-wrap\"><table><thead><tr><th>Annual item</th><th>Estimate</th><th>Notes</th></tr></thead><tbody><tr><td><strong>Club membership</strong></td><td>$600–1,800</td><td>Full membership at a Halifax club. Varies a lot — ask each club for its current dues schedule.</td></tr><tr><td><strong>Mooring or slip</strong></td><td>$1,200–3,500</td><td>A mooring ball with tender service is cheaper than an alongside slip. Dartmouth YC, for example, offers both berths (up to 44 ft) and mooring balls. Rates are usually per foot.</td></tr><tr><td><strong>Winter storage ashore</strong></td><td>$700–2,000</td><td>Typically per foot. In-water winter storage in a bubbled marina is an alternative some clubs offer.</td></tr><tr><td><strong>Haul-out and launch</strong></td><td>$500–1,200</td><td>Yard crane time plus labour. AYC publishes yard labour at around <strong>$62/hour</strong> (half-hour minimum) if their crew does the work — doing more yourself saves real money.</td></tr><tr><td><strong>Insurance</strong></td><td>$300–650</td><td>Sailboats commonly run <strong>0.75–1.5% of insured value</strong> per year — on a $30,000 boat that's roughly $225–450, though minimum premiums and your (lack of) experience push it up. <strong>Your Sail Canada certifications directly help here.</strong></td></tr><tr><td><strong>Antifouling paint + anodes + consumables</strong></td><td>$350–800</td><td>A gallon of decent antifoul is $150–350; you'll want anodes, sandpaper, rollers, and rags every spring.</td></tr><tr><td><strong>Engine service</strong></td><td>$200–600</td><td>Oil, filters, impeller, belts. Cheap if you do it yourself — and <a href=\"#/m13\" data-nav=\"m13\">Module 13</a> says you should learn to.</td></tr><tr><td><strong>PCL (boat licence)</strong></td><td><strong>Free</strong></td><td>Required for engines ≥10 hp / 7.5 kW.</td></tr><tr><td><strong>Maintenance / repair fund</strong></td><td><strong>$1,500–3,000</strong></td><td>🔴 <strong>Do not omit this line.</strong> Something fails every year. Sails, rigging, electronics, upholstery, a pump, the head. Budgeting zero here is the mistake.</td></tr><tr><td><strong>Fuel</strong></td><td>$150–400</td><td>Sailboats use remarkably little.</td></tr><tr><td><strong>Safety gear renewal</strong></td><td>$100–300</td><td>Flares expire every four years; inflatable PFDs need servicing.</td></tr><tr><td><strong>TOTAL, annual</strong></td><td><strong>≈ $5,600–14,850</strong></td><td>Commonly lands around <strong>10–20% of the boat's value per year</strong> for an older boat.</td></tr></tbody></table></div><h4>And the one-time costs at purchase</h4><div class=\"table-wrap\"><table><thead><tr><th>Item</th><th>Estimate</th></tr></thead><tbody><tr><td>Purchase price</td><td>$30,000</td></tr><tr><td>Survey + haul for survey + engine survey</td><td>$1,000–2,000</td></tr><tr><td>Tax on the sale</td><td>Verify current provincial rules for a private vs brokered boat sale</td></tr><tr><td>Immediate must-fix items from the survey</td><td><strong>$2,000–8,000</strong> — assume there will be some</td></tr><tr><td>Safety equipment to full legal standard, plus a grab bag</td><td>$600–1,500</td></tr><tr><td>Ground tackle upgrade</td><td>$500–1,500</td></tr><tr><td>Dodger, if not fitted</td><td>$1,500–3,500</td></tr><tr><td>Personal gear for three people</td><td>$1,200–2,500</td></tr><tr><td><strong>Realistic all-in first-year cost</strong></td><td><strong>≈ $40,000–50,000</strong> on a $30,000 boat</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Read that last line twice.</strong> A $30,000 boat costs roughly $40,000–50,000 to get on the water and keep there for a year. That's not a reason not to buy — it's the number to plan against so the boat stays a pleasure rather than a source of financial resentment.</p><p data-lang=\"ua\"><strong>Справжня вартість володіння,</strong> робочий річний бюджет для <strong>30-футового судна за ~$30 000</strong> у районі Галіфаксу: членство в клубі $600–1 800 · бочка або місце в марині $1 200–3 500 · зимове зберігання на берегі $700–2 000 · підйом і спуск $500–1 200 (AYC публікує тариф робіт близько <strong>$62/год</strong>, тож робити більше самому — реальна економія) · страхування $300–650 (<strong>0,75–1,5% від застрахованої вартості</strong> на рік; <strong>ваші сертифікати Sail Canada тут прямо допомагають</strong>) · фарба проти обростання, аноди, розхідники $350–800 · обслуговування двигуна $200–600 · PCL <strong>безкоштовно</strong> · 🔴 <strong>фонд ремонту $1 500–3 000 — не пропускайте цей рядок</strong> · паливо $150–400 · оновлення спорядження безпеки $100–300.</p><p data-lang=\"ua\"><strong>Разом: ≈ $5 600–14 850 на рік</strong>, зазвичай <strong>10–20% вартості судна на рік</strong> для старшого судна. А <strong>разові витрати при покупці</strong> доводять реалістичну суму першого року до <strong>≈ $40 000–50 000 на судні за $30 000</strong>. Це не причина не купувати — це число, під яке треба планувати, щоб судно залишалося задоволенням, а не джерелом фінансової образи.</p><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">19.6 Consider not buying</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Розгляньте варіант не купувати</span></h3><p data-lang=\"en\">Genuinely weigh these before committing, because for a family in your position one of them may be better:</p><div class=\"table-wrap\"><table><thead><tr><th>Option</th><th>Roughly per year</th><th>The honest case for it</th></tr></thead><tbody><tr><td><strong>Club membership + crewing</strong></td><td>$200–600</td><td>Free sailing on other people's boats. Zero maintenance. You'll sail more varied boats than you ever would as an owner. <strong>Never stop doing this even if you buy.</strong></td></tr><tr><td><strong>Sailing co-op / fractional share</strong></td><td>$1,500–4,000</td><td><strong>The strongest alternative for a family.</strong> You get scheduled, regular access and real time in command, someone else handles a share of the maintenance, and the cost is a fraction of ownership. If a co-op exists in Halifax for a boat you like, this may beat buying outright.</td></tr><tr><td><strong>Local charter, day or week</strong></td><td>$300–900/day</td><td>Perfect for \"let's see if the family actually enjoys a weekend aboard\" — before you find out on a boat you own. Requires certification.</td></tr><tr><td><strong>Buy a cheap small boat first</strong> ($5,000–12,000, 22–26 ft)</td><td>$2,500–5,000</td><td>Learn ownership on a boat where mistakes are cheap, then trade up in two years knowing exactly what you want. A genuinely smart path, and the one many experienced owners say they wish they'd taken.</td></tr><tr><td><strong>Own a dinghy, charter a cruiser</strong></td><td>$1,000–3,000</td><td>A small dinghy for you and your daughter to sail together weekly (see <a href=\"#/m20\" data-nav=\"m20\">Module 20</a>), plus a chartered cruiser for the two or three real trips a year. Often the best value of all for a family.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The question to answer honestly:</strong> <em>what do I want to do that these options don't allow?</em> If you have a clear answer — a specific boat, a specific cruise, the pleasure of tinkering, or wanting the boat available on a whim with your family's stuff already aboard — buy. Those are all good reasons. If you don't have a clear answer yet, another season of crewing costs almost nothing and will produce one.</p><p data-lang=\"ua\"><strong>Розгляньте варіант не купувати:</strong> членство в клубі + робота в екіпажі ($200–600/рік, безкоштовне плавання на чужих судах, нуль обслуговування) · <strong>вітрильний кооператив або часткова участь ($1 500–4 000 — найсильніша альтернатива для родини:</strong> регулярний запланований доступ, реальний час у командуванні, частина обслуговування на комусь іншому) · локальний чартер ($300–900/день — ідеально, щоб з'ясувати, чи справді родині подобаються вихідні на борту) · <strong>спочатку купити дешеве мале судно</strong> ($5 000–12 000, 22–26 футів — вчитися володінню там, де помилки дешеві; шлях, про який багато досвідчених власників кажуть, що жалкують, що не пішли ним) · <strong>власний дінгі + чартер круїзера</strong> (часто найкраща вартість для родини).</p><p data-lang=\"ua\"><strong>Питання, на яке треба чесно відповісти:</strong> <em>що я хочу робити, чого ці варіанти не дозволяють?</em> Якщо є чітка відповідь — купуйте. Якщо чіткої відповіді ще немає, ще один сезон у екіпажі коштує майже нічого і цю відповідь дасть.</p><hr><h3><span data-lang=\"en\">19.7 Purchase checklist</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольний список покупки</span></h3><p><strong>Before you look</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Total budget decided, <strong>including</strong> survey, immediate repairs, and the first year's running costs</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Basic Cruising certification in hand (or booked)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Berth or mooring availability confirmed <strong>before</strong> you buy — a boat with nowhere to go is a problem</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Winter storage confirmed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Insurance quoted for the type and size you're considering</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Shortlist of 3–5 models, and a clear list of your must-haves</span></label></li></ul><p><strong>Viewing</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Ask for <strong>engine hours and service records</strong> — documentation is a proxy for how the whole boat was treated</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Ask <strong>\"why are you selling?\"</strong> and listen to the whole answer</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Ask <strong>\"what would you fix next?\"</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Check every locker, lift every floorboard, <strong>smell the bilge</strong> (diesel, sewage, and mildew all tell you something)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Press the deck around every fitting and stanchion base — feel for softness</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Look for rust weeping from chainplates and around keel bolts</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Check sail condition in daylight, unrolled</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Start the engine from cold</strong> yourself, and watch the exhaust</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Count and test the seacocks</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Bring someone experienced. A second pair of eyes finds what you're too excited to see.</span></label></li></ul><p><strong>Committing</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Offer <strong>subject to survey and sea trial</strong>, in writing</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Commission <strong>your own</strong> surveyor — not one the seller or broker recommends</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Attend the survey. <strong>Walk around with the surveyor and ask questions</strong> — this is a paid education in your own boat.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Sea trial: sail it, and run the engine hard for a sustained period at temperature</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Renegotiate on the survey findings</strong> — this is what the survey is for</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Verify clear title and <strong>no liens</strong></span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Confirm the tax position on the sale</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Insurance bound <strong>before</strong> you take delivery</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Transfer or apply for the <strong>Pleasure Craft Licence</strong>; display the number on the bow</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Get the seller to hand over the boat and <strong>walk you through every system</strong> — this is worth asking for explicitly and most sellers are glad to do it</span></label></li></ul><p data-lang=\"ua\"><strong>Контрольний список:</strong> <em>до пошуку</em> — загальний бюджет включно з сюрвеєм і першим роком утримання · сертифікат Basic Cruising · <strong>підтверджене місце стоянки й зимового зберігання до покупки</strong> · страхова пропозиція · короткий список 3–5 моделей. <em>На огляді</em> — <strong>моточаси і сервісні записи</strong> · «чому продаєте?» і «що б ви ремонтували наступним?» · відкрийте кожен рундук, підніміть кожну дошку підлоги, <strong>понюхайте трюм</strong> · натисніть палубу навколо кожного кріплення · іржа з обушків вант і біля кільових болтів · вітрила при денному світлі · <strong>запустіть двигун з холоду самі</strong> · перевірте кінгстони · <strong>візьміть досвідчену людину з собою</strong>. <em>При угоді</em> — пропозиція <strong>за умови сюрвею й ходових випробувань</strong>, письмово · <strong>свій власний</strong> сюрвейєр, не рекомендований продавцем · <strong>будьте присутні на сюрвеї й задавайте питання</strong> · ходові випробування з навантаженням двигуна · <strong>перегляд ціни за результатами сюрвею</strong> · чистий титул, <strong>відсутність застав</strong> · страховка до приймання · передача PCL.</p><hr><h3><span data-lang=\"en\">19.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is autumn a better time to buy than spring?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should you do Basic Cruising before buying?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What's the single best free education in what breaks on a boat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What size band suits a Halifax family cruiser, and why not bigger?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What makes a Nonsuch worth considering for a family?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the four things you should buy a boat on, and the one thing to ignore.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly what does a survey cost for a 30-footer, and why get one even when the insurer doesn't require it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name three survey findings that should seriously worry you.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly what percentage of a boat's value are annual running costs?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What's the realistic all-in first-year cost of a $30,000 boat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which budget line do people most often omit?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name two alternatives to ownership and the case for each.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Whose surveyor should you use, and why?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому осінь кращий час для покупки, ніж весна?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому варто зробити Basic Cruising до покупки?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка найкраща безкоштовна освіта щодо того, що ламається на судні?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який діапазон розміру підходить родинному круїзеру в Галіфаксі і чому не більше?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому Nonsuch варто розглянути для родини?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть чотири речі, за якими купують судно, і одну, яку варто ігнорувати.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Скільки приблизно коштує сюрвей 30-футового судна і чому робити його, навіть коли страховик не вимагає?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три результати сюрвею, які повинні серйозно вас насторожити.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Приблизно який відсоток вартості судна складають щорічні витрати?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка реалістична повна вартість першого року для судна за $30 000?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який рядок бюджету найчастіше пропускають?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть дві альтернативи володінню і аргументи за кожну.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чийого сюрвейєра слід брати і чому?</span></label></li></ul><hr>"}, "m20": {"t_en": "20 · Sailing with family", "t_ua": "Плавання з родиною", "html": "<h2>Module 20 — Sailing With Your Family</h2><h2 data-lang=\"ua\">Модуль 20 — Плавання з родиною</h2><p><strong>Study time / Час: ~2.5 hours</strong> · <strong>Written for a partner and an 8-year-old</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">There is one thing to understand before any technique, and it reframes everything else:</p><p data-lang=\"en\"><strong>The measure of a successful family sail is not distance, speed, or skill. It is whether they want to go again.</strong></p><p data-lang=\"en\">Every decision below follows from that. A three-hour sail that ends with your daughter asking when you're going back is a complete success. A brilliant twenty-mile passage that leaves her cold, frightened and seasick has cost you the whole project, and it can take years to undo.</p><p data-lang=\"ua\">Є одна річ, яку треба зрозуміти перед будь-якою технікою, і вона переосмислює все інше:</p><p data-lang=\"ua\"><strong>Міра успішного родинного виходу — не відстань, не швидкість і не майстерність. А те, чи хочуть вони піти знову.</strong></p><p data-lang=\"ua\">Усі рішення нижче випливають з цього. Тригодинний вихід, після якого дочка питає, коли ви пливете знову, — це повний успіх. Блискучий двадцятимильний перехід, після якого їй холодно, страшно й погано, коштував вам усього проєкту, і на виправлення можуть піти роки.</p></blockquote><hr><h3><span data-lang=\"en\">20.1 Children and cold water — the part that's different</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Діти й холодна вода</span></h3><p data-lang=\"en\">Everything in <a href=\"#/m01\" data-nav=\"m01\">Module 01</a> applies, but <strong>it applies harder to a child</strong>, and this is the single most important section in this module.</p><p data-lang=\"en\">A child has a <strong>larger surface area relative to their body mass</strong>, less insulating body fat, and thinner skin. The practical consequence: <strong>a child loses body heat significantly faster than an adult in the same water.</strong> The 1‑10‑1 numbers — one minute of cold shock, ten minutes of useful movement, one hour to unconsciousness — are the <em>adult</em> figures. <strong>For an 8-year-old in 15 °C Halifax water, assume you have considerably less time than that, in every one of the three phases.</strong></p><p data-lang=\"en\">A child also has less strength to hold on, less reach to grab a ladder, and less ability to reason through panic.</p><p data-lang=\"en\"><strong>Therefore, the rules for a child are not the same as for an adult:</strong></p><blockquote class=\"callout\"><h4><strong>For an adult, wearing a PFD is a judgement call. For a child, it is not. It is always on, on deck, no discussion, no exceptions, every single time — including at the dock and at anchor.</strong></h4><h4 data-lang=\"ua\"><strong>Для дорослого носіння жилета — це рішення. Для дитини — ні. Він завжди надітий на палубі, без обговорень, без винятків, щоразу — включно з причалом і стоянкою на якорі.</strong></h4></blockquote><p data-lang=\"en\"><strong>Why \"including at the dock\":</strong> most child drownings around boats happen not under sail in a gale but at rest — stepping across a gap, leaning over, slipping on a wet finger dock. The moments that feel safest are the ones where nobody's watching.</p><p data-lang=\"en\"><strong>Make it non-negotiable from day one and it never becomes an argument.</strong> If the PFD goes on before she steps aboard, every time, from the very first visit, it's simply what happens on boats. If you're inconsistent about it, you'll be negotiating it forever.</p><p data-lang=\"ua\">Усе з <a href=\"#/m01\" data-nav=\"m01\">Модуля 01</a> діє, але <strong>для дитини діє сильніше</strong>, і це найважливіший розділ модуля.</p><p data-lang=\"ua\">У дитини <strong>більша площа поверхні відносно маси тіла</strong>, менше ізолюючого жиру і тонша шкіра. Практичний наслідок: <strong>дитина втрачає тепло значно швидше за дорослого в тій самій воді.</strong> Числа 1‑10‑1 — це показники для <em>дорослого</em>. <strong>Для 8-річної дитини у воді Галіфаксу 15 °C припускайте, що у вас істотно менше часу, у кожній з трьох фаз.</strong></p><p data-lang=\"ua\">Дитина також має менше сили триматися, коротший розмах, щоб схопитися за трап, і меншу здатність подолати паніку розумом.</p><p data-lang=\"ua\"><strong>Чому «включно з причалом»:</strong> більшість утоплень дітей біля суден трапляється не під вітрилами у шторм, а на стоянці — при переході через щілину, при перевішуванні за борт, при ковзанні на мокрому причалі. Моменти, які відчуваються найбезпечнішими, — це ті, коли ніхто не дивиться.</p><p data-lang=\"ua\"><strong>Зробіть це предметом без обговорення з першого дня, і це ніколи не стане суперечкою.</strong> Якщо жилет надівається до того, як вона зайшла на борт, щоразу, з першого ж візиту — це просто те, що відбувається на судах.</p><hr><h3><span data-lang=\"en\">20.2 Choosing your daughter's PFD</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вибір жилета для дочки</span></h3><p data-lang=\"en\">This is the most important purchase you will make, and there are specific things to get right.</p><div class=\"table-wrap\"><table><thead><tr><th>Requirement</th><th>Why</th></tr></thead><tbody><tr><td><strong>Canadian-approved</strong> — the label must show Transport Canada, Canadian Coast Guard, or Fisheries and Oceans Canada</td><td>Anything else is not legal equipment and may not perform</td></tr><tr><td><strong>Sized by WEIGHT, not by age</strong></td><td>This is the mistake parents make. Check the label's weight range and match it to what she actually weighs. An 8-year-old typically falls in the \"child\" (roughly 18–30 kg) or \"youth\" (over about 30 kg) band — but <strong>read the label, not the age on the packaging</strong></td></tr><tr><td><strong>A large collar / head support behind the neck</strong></td><td>Holds a child's head clear of the water. Children have proportionally heavy heads and weak neck control when cold and exhausted</td></tr><tr><td><strong>A crotch strap between the legs</strong></td><td>🔴 <strong>Essential, and use it.</strong> Without one a child can slip straight down and out of the jacket, or the jacket rides up over their face. A PFD she can fall out of is worse than useless because you'll believe she's protected</td></tr><tr><td><strong>Inherently buoyant foam, not inflatable</strong></td><td>Foam works with no mechanism to fail, needs no action from her, and works if she's unconscious. <strong>Inflatable PFDs are not appropriate for children.</strong></td></tr><tr><td><strong>A whistle attached, and a light</strong></td><td>She can blow a whistle far longer and further than she can shout. Both cost almost nothing</td></tr><tr><td><strong>Bright colour</strong> — yellow, orange, or lime</td><td>You are trying to find a small head in grey Atlantic water, possibly in fog</td></tr><tr><td><strong>Comfortable enough that she'll wear it for six hours</strong></td><td>If it chafes or restricts her arms, it becomes a fight. Take her to the shop and let her choose the colour — ownership matters</td></tr></tbody></table></div><h4><span data-lang=\"en\">The fit test</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Тест посадки</span></h4><p data-lang=\"en\">Do this in the shop, and again at the start of every season because she's growing:</p><ol><li data-lang=\"en\">Fasten everything, including the crotch strap.</li><li data-lang=\"en\">Have her raise her arms straight up.</li><li data-lang=\"en\"><strong>You lift firmly on the shoulders of the PFD.</strong></li><li data-lang=\"en\"><strong>If it rides up so the collar reaches her ears or covers her face, it is too big.</strong> No exceptions, no \"she'll grow into it.\" A too-large PFD floats up while she floats down.</li><li data-lang=\"en\">Then test it <strong>in water</strong> — a pool or a warm shallow beach, in a controlled setting. Check that it turns her face-up and that she's comfortable and confident in it.</li></ol><p data-lang=\"en\"><strong>Do the in-water test deliberately, before the season.</strong> A child who has floated in her PFD, in warm water, with a parent holding her, knows what it feels like and knows it works. A child whose first experience of it is falling in the harbour is a child in a panic. This one afternoon is genuinely the best safety investment in this module.</p><p data-lang=\"ua\"><strong>Вибір жилета:</strong> <strong>схвалений у Канаді</strong> (Transport Canada / Canadian Coast Guard / DFO на етикетці) · <strong>підбір за ВАГОЮ, не за віком</strong> (це помилка батьків — читайте діапазон ваги на етикетці; 8 років зазвичай це «child» ~18–30 кг або «youth» понад ~30 кг) · <strong>великий комір / підголівник</strong> (тримає голову дитини над водою) · 🔴 <strong>пахова стропа — обов'язкова, і застібайте її</strong> (без неї дитина може вислизнути з жилета, або жилет піднімається їй на обличчя) · <strong>пінопластовий, не надувний</strong> (працює без механізму й без дій з її боку, і працює, якщо вона без свідомості; <strong>надувні жилети не підходять для дітей</strong>) · <strong>свисток і вогник</strong> · <strong>яскравий колір</strong> · <strong>зручний настільки, щоб носити шість годин</strong> (візьміть її в магазин обирати колір — відчуття власності має значення).</p><p data-lang=\"ua\"><strong>Тест посадки:</strong> застібнути все включно з паховою стропою → підняти руки вгору → <strong>ви сильно тягнете за плечі жилета</strong> → <strong>якщо він піднімається так, що комір досягає вух або закриває обличчя — він завеликий.</strong> Без винятків, без «вона доросте». Потім <strong>перевірте у воді</strong> — у басейні або на теплому мілководді, у контрольованих умовах.</p><p data-lang=\"ua\"><strong>Зробіть перевірку у воді свідомо, до сезону.</strong> Дитина, яка вже плавала у своєму жилеті в теплій воді, тримаючись за батька, знає, як це відчувається, і знає, що жилет працює. Дитина, для якої перший досвід — це падіння в гавань, — це дитина в паніці. Це найкраща інвестиція в безпеку в цьому модулі.</p><hr><h3><span data-lang=\"en\">20.3 Rules for a child aboard</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Правила для дитини на борту</span></h3><p data-lang=\"en\">Few, clear, absolute, and the same every time. Children handle firm consistent rules easily; it's inconsistency that produces argument and risk.</p><ol><li data-lang=\"en\"><strong>PFD on, always, on deck.</strong> Including at the dock and at anchor.</li><li data-lang=\"en\"><strong>One hand for the boat, always.</strong> Teach her the phrase and use it. Make it a game at first — \"show me your holding hand.\"</li><li data-lang=\"en\"><strong>Nobody goes forward of the mast under sail</strong> without an adult and being clipped on. For an 8-year-old, the simplest version is: <em>the foredeck is not a place you go when we're sailing.</em></li><li data-lang=\"en\"><strong>Clipped on in the cockpit</strong> whenever it's rough, at night, in fog, or whenever you'd clip yourself on. Get her a <strong>properly-sized child harness</strong> — an adult one won't fit or hold. A tether short enough that she cannot reach the water is the point.</li><li data-lang=\"en\"><strong>Below when it gets rough</strong> — but only if she isn't prone to seasickness, since below is much worse for that. Judge which risk you're managing.</li><li data-lang=\"en\"><strong>When the boom moves, heads down.</strong> Teach \"gybe-ho\" as a duck-and-hold reflex, and practise it at the dock as a silly game until it's automatic. <strong>A swinging boom at an 8-year-old's height is genuinely dangerous</strong> — on many boats the boom passes right through where a child's head is when standing in the cockpit. Know exactly where your boom sweeps and make sure she does too.</li><li data-lang=\"en\"><strong>Lifeline netting.</strong> Even at eight, it's worth fitting. It stops dropped gear, gives a real physical barrier at the low guardrail height that trips people overboard, and — this matters — <strong>it visibly signals to her that the boat is set up to keep her safe</strong>, which builds confidence. A few hundred dollars in netting and cable ties.</li><li data-lang=\"en\"><strong>She always knows where the adults are</strong>, and one adult always has eyes on her. <strong>Explicitly assign this.</strong> \"I'm sailing, you're watching her\" — spoken out loud, so it's never assumed and never dropped by both of you at once.</li></ol><p data-lang=\"ua\"><strong>Правила:</strong> небагато, чіткі, абсолютні й однакові щоразу. Діти легко справляються з твердими послідовними правилами; саме непослідовність породжує суперечки й риск.</p><ol><li data-lang=\"ua\"><strong>Жилет надітий завжди на палубі.</strong> Включно з причалом і якірною стоянкою.</li><li data-lang=\"ua\"><strong>Одна рука для судна, завжди.</strong> Спочатку зробіть це грою — «покажи мені свою тримаючу руку».</li><li data-lang=\"ua\"><strong>Ніхто не йде вперед від мачти під вітрилами</strong> без дорослого і без страховки. Для 8-річної простіша версія: <em>бак — не те місце, куди ходять, коли ми йдемо під вітрилами.</em></li><li data-lang=\"ua\"><strong>Пристібнута в кокпіті</strong>, коли качає, вночі, в тумані, або коли ви пристібнулися б самі. Купіть <strong>страховий пояс правильного дитячого розміру</strong> — дорослий не підійде і не втримає. Кінець має бути настільки коротким, щоб вона не могла дістати до води.</li><li data-lang=\"ua\"><strong>Униз, коли починає качати</strong> — але лише якщо її не вкачує, бо внизу від цього значно гірше.</li><li data-lang=\"ua\"><strong>Коли ґік рухається — голови вниз.</strong> Навчіть «gybe-ho» як рефлекс і тренуйте це на причалі як гру, доки не стане автоматичним. <strong>Ґік, що летить на висоті 8-річної дитини, справді небезпечний</strong> — на багатьох суднах він проходить саме там, де голова дитини, що стоїть у кокпіті.</li><li data-lang=\"ua\"><strong>Сітка на леєрах.</strong> Навіть у вісім років варто поставити. Вона зупиняє упущене снаряження, дає реальний фізичний бар'єр — і, що важливо, <strong>наочно показує їй, що судно налаштоване її захищати</strong>, а це будує впевненість.</li><li data-lang=\"ua\"><strong>Вона завжди знає, де дорослі</strong>, і один дорослий завжди має її в полі зору. <strong>Явно призначайте це вголос:</strong> «я керую, ти дивишся за нею» — щоб це ніколи не було припущенням і щоб ви обоє не втратили її одночасно.</li></ol><hr><h3><span data-lang=\"en\">20.4 Boredom is the real enemy</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Нудьга — справжній ворог</span></h3><p data-lang=\"en\">Once the safety is handled, <strong>boredom is what actually ends family sailing.</strong> And a bored child on a boat is harder than a bored child anywhere else, because there is nowhere for anyone to go. Two solutions, and you need both: <strong>real jobs</strong>, and <strong>planned entertainment.</strong></p><h4><span data-lang=\"en\">Give her real jobs</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Дайте їй справжню роботу</span></h4><p data-lang=\"en\">Not pretend jobs. Children can tell instantly, and a real responsibility is what turns a passenger into crew. At eight, she can genuinely do all of these:</p><div class=\"table-wrap\"><table><thead><tr><th>Job</th><th>Why it works</th></tr></thead><tbody><tr><td><strong>Helm, with supervision</strong></td><td>🌟 <strong>The single best one.</strong> An 8-year-old can absolutely steer a boat. Give her a target — a landmark, a compass number, or \"keep the telltales streaming\" — and she has the most important job aboard. Steering also cures seasickness better than anything, because it re-syncs what she sees with what she feels.</td></tr><tr><td><strong>Official lookout</strong></td><td>Real, useful, and it's the job that matters most in a MOB. Have her call out buoys, boats, seals, and other traffic. <strong>Praise the calls, including the wrong ones</strong> — you want her reporting everything, not filtering.</td></tr><tr><td><strong>Buoy spotter and namer</strong></td><td>Turn <a href=\"#/m08\" data-nav=\"m08\">Module 08</a> into a game: she spots the buoy, calls the colour and shape, and says which side you pass it. Children learn buoyage faster than adults this way, and it's genuinely useful.</td></tr><tr><td><strong>Timekeeper / log-keeper</strong></td><td>Give her the logbook and a pencil. Every half hour: time, where we are, wind, what we saw. <strong>She'll produce the family record of the trip</strong>, which becomes the thing she's proud of.</td></tr><tr><td><strong>Tailing a sheet</strong></td><td>Real physical involvement in the boat's actual work. Never near the winch drum — she tails the free end while an adult grinds.</td></tr><tr><td><strong>Fender and dockline duty</strong></td><td>Putting fenders out and coiling lines at the end. A clear beginning-and-end ritual.</td></tr><tr><td><strong>Snack officer</strong></td><td>Genuinely a job, genuinely appreciated, and gives her a reason to move around with purpose.</td></tr></tbody></table></div><h4><span data-lang=\"en\">Then plan the entertainment</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Плануйте розваги</span></h4><ul><li><strong>Snacks, constantly, and her favourites.</strong> Sailing makes children hungry and cold, and both arrive before she complains. Feed her before she's hungry.</li><li><strong>A dedicated boat bag she packs herself</strong> — books, drawing things, a tablet with things downloaded, a favourite toy. Ownership matters.</li><li><strong>Binoculars of her own.</strong> Cheap ones. Enormously popular.</li><li><strong>Fishing line, a crab net, a bucket.</strong> A bucket of harbour water with something alive in it will absorb a child for an hour.</li><li><strong>A camera or old phone for photos.</strong> She documents the trip.</li><li><strong>Something to look forward to at the destination</strong> — see §20.6.</li><li><strong>Music, and the right to choose some of it.</strong></li><li><strong>Accept the tablet.</strong> Some people are precious about screens on boats. Two hours of a downloaded film on a long passage is the difference between a child who'll come back and a child who won't. Choose your battles.</li></ul><p data-lang=\"ua\"><strong>Нудьга — це те, що насправді припиняє родинне плавання.</strong> І знуджена дитина на судні важче, ніж будь-де, бо нікому нікуди піти. Два рішення, і потрібні обидва: <strong>справжня робота</strong> і <strong>заплановані розваги</strong>.</p><p data-lang=\"ua\"><strong>Справжня робота (у вісім років вона справді може все це):</strong> 🌟 <strong>штурвал під наглядом — найкраще з усього</strong> (8-річна дитина цілком може керувати судном; дайте орієнтир — і в неї найважливіша робота на борту; керування також лікує морську хворобу краще за все) · <strong>офіційний спостерігач</strong> (справжня й корисна робота; <strong>хваліть її доповіді, включно з помилковими</strong> — вам потрібно, щоб вона доповідала про все) · <strong>шукач і називач буїв</strong> (перетворіть <a href=\"#/m08\" data-nav=\"m08\">Модуль 08</a> на гру: вона бачить буй, називає колір і форму і каже, з якого боку його проходити; діти вчать систему буїв швидше за дорослих) · <strong>хронометрист і ведення журналу</strong> (дайте їй журнал і олівець — <strong>вона створить родинний літопис походу</strong>) · <strong>тримати вільний кінець шкота</strong> (ніколи біля барабана лебідки) · <strong>кранці й швартові</strong> · <strong>відповідальна за перекуски</strong>.</p><p data-lang=\"ua\"><strong>Розваги:</strong> постійні перекуски, її улюблені (<strong>годуйте до того, як зголодніє</strong>) · <strong>власна сумка на судно, яку вона пакує сама</strong> · <strong>власний бінокль</strong> (дешевий; надзвичайно популярний) · вудка, сачок для крабів, ведро (<strong>відро води з гавані з чимось живим займе дитину на годину</strong>) · фотоапарат або старий телефон · музика і право вибирати частину · <strong>прийміть планшет</strong> (дві години завантаженого фільму на довгому переході — це різниця між дитиною, яка повернеться, і дитиною, яка ні; вибирайте свої битви).</p><hr><h3><span data-lang=\"en\">20.5 CANSail — the single best thing you can do for her</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">CANSail — найкраще, що ви можете для неї зробити</span></h3><p data-lang=\"en\"><strong>This is the most valuable recommendation in this module, and the timing is perfect: eight is exactly the entry age for CANSail.</strong></p><p data-lang=\"en\">Halifax has excellent youth programs, and they teach in <strong>Optimist</strong> dinghies — small, single-handed boats designed specifically for children — and later Club 420s.</p><div class=\"table-wrap\"><table><thead><tr><th>Club</th><th>Youth program</th><th>Ages</th><th>Notes</th></tr></thead><tbody><tr><td><strong>Dartmouth Yacht Club</strong></td><td><strong>CANSail 1–6</strong></td><td><strong>8–18</strong></td><td>Also runs a <strong>\"Wetfeet\" program for ages 5–8</strong>, so she'd fit either. Teaches in an <strong>Optimist and Club 420 fleet</strong>. CANSail 3–6 run Mon–Fri, 9am–4pm — a full summer-camp format. 697 Windmill Rd, Dartmouth. Tel <strong>(902) 468‑6050</strong>, admin@dartmouthyachtclub.ca</td></tr><tr><td><strong>AYC Sailing School</strong> (Armdale Yacht Club)</td><td><strong>Junior Sailing</strong>, CANSail curriculum, certified instructors</td><td><strong>5–18</strong></td><td>On the <strong>Northwest Arm</strong> — very sheltered water, minutes from downtown. <strong>Club membership is not required to participate</strong>, though members get a discount. aycsailing.ca/junior-sailing-programs</td></tr><tr><td><strong>Royal Nova Scotia Yacht Squadron</strong></td><td>Youth sailing programs</td><td>—</td><td>Also on the Northwest Arm. rnsys.com/youthsailingprograms</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Why this matters more than you'd expect. Five reasons:</strong></p><ol><li data-lang=\"en\"><strong>She will get better than you, fast, and that's the point.</strong> A child in a dinghy gets instant physical feedback — misjudge a gust and you capsize, harmlessly, in a boat designed for it. She'll develop genuine boat-feel in one summer that takes keelboat adults three seasons. Expect her to be correcting your sail trim by next autumn. Let her.</li><li data-lang=\"en\"><strong>It becomes <em>her</em> thing, not your hobby she's dragged along to.</strong> This is the difference between a child who sails and a child who is taken sailing. It's the whole game.</li><li data-lang=\"en\"><strong>It solves the family logistics beautifully.</strong> If you and your partner are taking adult keelboat courses at the same club where she's in the junior program, <strong>everyone is sailing at the same place on the same day.</strong> That's a family activity rather than a competition for weekends.</li><li data-lang=\"en\"><strong>She'll make friends who sail</strong>, which is what makes it stick through adolescence.</li><li data-lang=\"en\"><strong>It's structured, supervised, safet
