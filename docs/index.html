<li data-lang=\"ua\"><strong>Цього тижня: напишіть або зателефонуйте трьом школам.</strong> Запитайте конкретно: <em>«Чи є у вас вільні місця або відмови на курси кільових яхт для дорослих у серпні або вересні? Чи можна мене додати до списку очікування, і чи є у вас ознайомчі виходи?»</em> Контакти — в <a href=\"#/resources\" data-nav=\"resources\">appendix/halifax-resources.md</a>. Відмови в кінці сезону трапляються часто і дістаються тому, хто запитав.</li><li data-lang=\"ua\"><strong>Цього тижня: забронюйте ознайомчий вихід (Try Sailing).</strong> Дві години на воді, недорого, без зобов'язань. Це перетворює абстрактний інтерес на справжнє рішення.</li><li data-lang=\"ua\"><strong>Цієї середи: прийдіть на клубну гонку і запропонуйте себе як екіпаж.</strong> Приходьте на годину раніше, знайдіть причал і питайте людей. Будьте прямими: <em>«Я абсолютний новачок, у мене поки немає навичок, але я прийду вчасно, робитиму точно те, що скажуть, і хочу вчитися.»</em> Саме так починав майже кожен яхтсмен, і це безкоштовно.</li></ol><hr><h3><span data-lang=\"en\">0.6 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\">Before moving on, you should be able to answer:</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the difference between a PCOC, a PCL, and a Sail Canada certification?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which of those three is legally required, and why does it apply to a sailboat?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the top cause of death for boaters in Nova Scotia?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the certification level that lets you skipper a 6–10 m sailboat by day.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why should a beginner spend time in a dinghy even if their goal is cruising?</span></label></li></ul><p data-lang=\"ua\">Перед тим як рухатись далі, ви повинні вміти відповісти:</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>У чому різниця між PCOC, PCL і сертифікатом Sail Canada?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який з цих трьох обов'язковий за законом і чому він стосується вітрильника?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка головна причина смерті яхтсменів у Новій Шотландії?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть рівень сертифікації, який дозволяє бути шкіпером вітрильника 6–10 м вдень.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому новачку варто провести час на дінгі, навіть якщо мета — круїзинг?</span></label></li></ul><hr>"}, "m01": {"t_en": "01 · Safety & cold water", "t_ua": "Безпека та холодна вода", "html": "<h2>Module 01 — Safety &amp; Cold Water: Read This Before You Go Sailing</h2><h2 data-lang=\"ua\">Модуль 01 — Безпека та холодна вода: прочитайте перед виходом у море</h2><p><strong>Study time / Час: ~1.5 hours</strong> · <strong>Priority: highest in the course</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">If you read only one module before your first sail, read this one. Everything else in this course makes you a better sailor. This module keeps you alive.</p><p data-lang=\"ua\">Якщо ви прочитаєте лише один модуль перед першим виходом — читайте цей. Усе інше в курсі робить вас кращим яхтсменом. Цей модуль зберігає вам життя.</p></blockquote><hr><h3><span data-lang=\"en\">1.1 The thing that will actually kill you</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Те, що справді може вас убити</span></h3><p data-lang=\"en\">Beginners imagine the danger is a storm, a big wave, or capsizing. In Nova Scotia the overwhelming reality is different and much more mundane:</p><p data-lang=\"en\"><strong>Most boating deaths are people who fell into cold water, were not wearing a lifejacket, and drowned within minutes — in fair weather, close to shore, on a calm day.</strong></p><p data-lang=\"en\">Read that again. Not a storm. Fair weather, close to shore, calm day, no lifejacket. That is the pattern.</p><p data-lang=\"en\">Halifax Harbour water temperature is roughly <strong>8–12 °C in June</strong>, and peaks at roughly <strong>12–18 °C in July and August</strong>. In September and October it drops again. There is <strong>no month of the year</strong> when Halifax water is warm enough to be safe for an unprotected swim after an unexpected fall.</p><p data-lang=\"en\">Water at 15 °C feels shockingly, breathtakingly cold when you hit it unexpectedly. Not \"brisk\". Not \"refreshing\". It triggers an involuntary physiological response you cannot suppress by willpower.</p><p data-lang=\"ua\">Новачки уявляють, що небезпека — це шторм, велика хвиля або перевертання. У Новій Шотландії переважна реальність інша і значно прозаїчніша:</p><p data-lang=\"ua\"><strong>Більшість смертей на воді — це люди, які впали в холодну воду, не мали рятувального жилета і потонули за кілька хвилин — у гарну погоду, біля берега, спокійного дня.</strong></p><p data-lang=\"ua\">Прочитайте ще раз. Не шторм. Гарна погода, біля берега, спокійний день, без жилета. Це і є типовий сценарій.</p><p data-lang=\"ua\">Температура води в гавані Галіфаксу приблизно <strong>8–12 °C у червні</strong> і досягає максимуму приблизно <strong>12–18 °C у липні та серпні</strong>. У вересні та жовтні знову падає. <strong>Немає жодного місяця</strong> на рік, коли вода Галіфаксу достатньо тепла, щоб бути безпечною для незахищеного перебування після несподіваного падіння.</p><p data-lang=\"ua\">Вода 15 °C відчувається шокуюче, до перехоплення дихання, холодною, коли ви потрапляєте в неї несподівано. Не «прохолодно». Не «свіжо». Вона запускає непідконтрольну фізіологічну реакцію, яку неможливо подавити силою волі.</p><hr><h3><span data-lang=\"en\">1.2 The 1‑10‑1 principle — memorise this</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Принцип 1‑10‑1 — запам'ятайте</span></h3><p data-lang=\"en\">This is the single most useful piece of knowledge in cold-water safety. It describes what happens to your body after sudden immersion in cold water, and it is taught by rescue organisations worldwide.</p><h4><strong>1 minute</strong> — Cold Shock</h4><p>You have roughly <strong>one minute to get your breathing under control.</strong> Hitting cold water causes an involuntary gasp reflex followed by hyperventilation — rapid, uncontrollable, panicky breathing. <strong>This is what actually drowns people.</strong> If your head is underwater during that first gasp, you inhale water. If you panic and thrash, you inhale spray.</p><p><strong>What to do:</strong> Do not try to swim. Do not thrash. Get your face out of the water, grab anything that floats, and concentrate on nothing but slowing your breathing. It <em>will</em> come under control in about a minute. Tell yourself: <em>\"One minute. Just breathe. It passes.\"</em></p><h4><strong>10 minutes</strong> — Meaningful Movement</h4><p>You have roughly <strong>ten minutes of useful use of your hands and arms</strong> before cold incapacitation sets in. Your fingers stop working first, then your grip, then your arms. You will still be fully conscious and clear-headed while being physically unable to grasp a ladder or clip a harness.</p><p><strong>What to do:</strong> Use those ten minutes deliberately and in priority order: (1) get out of the water if at all possible, (2) if you cannot, get as much of your body out of the water as possible — onto the overturned hull, a floating cushion, anything, (3) do the thing that requires hands <em>now</em>, while you still have them — clip on, grab the line, blow the whistle.</p><h4><strong>1 hour</strong> — Hypothermia</h4><p>You have roughly <strong>one hour before you lose consciousness</strong> from hypothermia in typical Halifax summer water. That's much longer than most people assume, and it matters: <strong>if you are wearing a lifejacket, you can survive long enough to be rescued.</strong> Without one, you drown long before hypothermia would have killed you.</p><p><strong>What to do:</strong> Conserve heat. Adopt <strong>HELP</strong> — Heat Escape Lessening Posture: knees drawn up to chest, arms crossed and pressed against your sides, body as compact as possible. With multiple people, <strong>huddle</strong> — chests together, arms around each other. Do <em>not</em> swim to keep warm; swimming dumps heat three times faster than floating still. Do not remove clothing — trapped water in clothing insulates.</p><p data-lang=\"ua\">Це найкорисніша одиниця знання в безпеці на холодній воді. Вона описує, що відбувається з вашим тілом після раптового занурення в холодну воду, і її викладають рятувальні організації по всьому світу.</p><h4 data-lang=\"ua\"><strong>1 хвилина</strong> — Холодовий шок</h4><p data-lang=\"ua\">У вас приблизно <strong>одна хвилина, щоб узяти дихання під контроль.</strong> Потрапляння в холодну воду викликає непідконтрольний рефлекс вдиху, а потім гіпервентиляцію — швидке, некероване, панічне дихання. <strong>Саме це й топить людей.</strong> Якщо ваша голова під водою під час того першого вдиху — ви вдихаєте воду. Якщо панікуєте і б'єтеся — вдихаєте бризки.</p><p data-lang=\"ua\"><strong>Що робити:</strong> Не намагайтеся плисти. Не борсайтеся. Витягніть обличчя з води, схопіться за будь-що, що плаває, і зосередьтеся виключно на уповільненні дихання. Воно <em>справді</em> стане під контроль приблизно за хвилину. Скажіть собі: <em>«Одна хвилина. Просто дихай. Це пройде.»</em></p><h4 data-lang=\"ua\"><strong>10 хвилин</strong> — Осмислені рухи</h4><p data-lang=\"ua\">У вас приблизно <strong>десять хвилин корисного використання рук</strong> до настання холодової недієздатності. Спочатку перестають працювати пальці, потім хват, потім руки. Ви будете при повній свідомості й ясній голові, будучи фізично не в змозі схопитися за трап або застібнути страховку.</p><p data-lang=\"ua\"><strong>Що робити:</strong> Використайте ці десять хвилин свідомо і за пріоритетом: (1) вилізьте з води, якщо це взагалі можливо, (2) якщо ні — витягніть з води якнайбільшу частину тіла: на перевернутий корпус, на плавучу подушку, на будь-що, (3) зробіть те, що вимагає рук, <em>зараз</em>, поки вони ще працюють — застібніться, схопіть кінець, дуйте в свисток.</p><h4 data-lang=\"ua\"><strong>1 година</strong> — Гіпотермія</h4><p data-lang=\"ua\">У вас приблизно <strong>одна година до втрати свідомості</strong> від гіпотермії в типовій літній воді Галіфаксу. Це значно довше, ніж більшість припускає, і це важливо: <strong>якщо на вас рятувальний жилет, ви можете протриматися достатньо довго, щоб вас врятували.</strong> Без нього ви потонете задовго до того, як гіпотермія вас убила б.</p><p data-lang=\"ua\"><strong>Що робити:</strong> Зберігайте тепло. Прийміть позу <strong>HELP</strong> (Heat Escape Lessening Posture) — коліна підтягнуті до грудей, руки схрещені й притиснуті до боків, тіло максимально компактне. Якщо людей кілька — <strong>збийтеся в купу</strong>: грудьми один до одного, обійнявшись. <strong>Не</strong> плавайте, щоб зігрітися; плавання втрачає тепло втричі швидше, ніж спокійне лежання на воді. Не знімайте одяг — вода, затримана в одязі, ізолює.</p><hr><h3><span data-lang=\"en\">1.3 Lifejackets and PFDs</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Рятувальні жилети та PFD</span></h3><p data-lang=\"en\">The rule is simple and non-negotiable: <strong>wear it.</strong> Not \"have it aboard.\" Wear it.</p><p data-lang=\"en\">Canadian law requires one Canadian-approved lifejacket or PFD <strong>of appropriate size for each person on board</strong>. It does not, for adults, legally require you to be wearing it. That legal gap is where people die: a PFD in a locker while you are in the water is decoration.</p><h4><span data-lang=\"en\">Types you'll encounter</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Типи, які ви зустрінете</span></h4><div class=\"table-wrap\"><table><thead><tr><th>Type</th><th>Description</th><th>Good for</th></tr></thead><tbody><tr><td><strong>Inherently buoyant PFD</strong> (foam vest)</td><td>Always buoyant, no mechanism to fail. Bulkier.</td><td>Dinghy sailing, beginners, kids, anyone who might be unconscious</td></tr><tr><td><strong>Inflatable PFD — manual</strong></td><td>Slim and comfortable. You pull a toggle to inflate.</td><td>Keelboat cruising, if you are conscious and trained</td></tr><tr><td><strong>Inflatable PFD — automatic (hydrostatic)</strong></td><td>Inflates on immersion. Slim, comfortable.</td><td>Best general choice for cruising adults</td></tr><tr><td><strong>Lifejacket (SOLAS-style)</strong></td><td>Turns an unconscious person face-up. Very bulky.</td><td>Offshore, abandon-ship</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Key points:</strong></p><ul><li data-lang=\"en\"><strong>Comfort determines survival.</strong> The best PFD is the one you will keep on for six hours. An uncomfortable one comes off, and then it isn't a PFD. Spend money here.</li><li data-lang=\"en\"><strong>Inflatables need maintenance.</strong> Check the CO₂ cylinder and the bobbin/cartridge at the start of every season. An un-serviced inflatable is a fabric vest.</li><li data-lang=\"en\"><strong>Inflatables are not for dinghy sailing.</strong> If you're going to capsize repeatedly, use foam.</li><li data-lang=\"en\"><strong>Fit matters.</strong> Do the lift test: put it on, have someone pull firmly up on the shoulders. If it rides up over your ears, it is too loose or too large — in the water it will float up and your head will go down.</li><li data-lang=\"en\"><strong>Crotch strap.</strong> If your inflatable has one, use it. It stops the jacket riding up when it inflates.</li><li data-lang=\"en\"><strong>Add a whistle and a light.</strong> A whistle carries far further than a shout, and costs nothing. In fog or at night, a small strobe is what gets you found.</li></ul><p data-lang=\"ua\">Правило просте і без компромісів: <strong>носіть його.</strong> Не «майте на борту». Носіть.</p><p data-lang=\"ua\">Канадський закон вимагає один схвалений у Канаді рятувальний жилет або PFD <strong>відповідного розміру на кожну особу на борту</strong>. Для дорослих закон не вимагає, щоб він був надітий. Саме в цій юридичній прогалині гинуть люди: жилет у рундуку, поки ви у воді, — це декорація.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Тип</th><th>Опис</th><th>Для чого добре</th></tr></thead><tbody><tr><td><strong>Постійно плавучий PFD</strong> (пінопластовий жилет)</td><td>Завжди плавучий, немає механізму, який може підвести. Об'ємніший.</td><td>Дінгі, новачки, діти, будь-хто, хто може бути без свідомості</td></tr><tr><td><strong>Надувний PFD — ручний</strong></td><td>Тонкий і зручний. Ви тягнете за трос, щоб надути.</td><td>Круїзинг на кільовій яхті, якщо ви при свідомості й навчені</td></tr><tr><td><strong>Надувний PFD — автоматичний (гідростатичний)</strong></td><td>Надувається при заглибленні. Тонкий, зручний.</td><td>Найкращий загальний вибір для дорослих у круїзингу</td></tr><tr><td><strong>Рятувальний жилет (типу SOLAS)</strong></td><td>Перевертає людину без свідомості обличчям догори. Дуже об'ємний.</td><td>Океанські переходи, залишення судна</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Ключові моменти:</strong></p><ul><li data-lang=\"ua\"><strong>Комфорт визначає виживання.</strong> Найкращий PFD — той, який ви не знімете шість годин. Незручний ви знімете, і тоді він уже не PFD. Тут варто витратити гроші.</li><li data-lang=\"ua\"><strong>Надувні потребують обслуговування.</strong> Перевіряйте балон CO₂ і картридж/бобіну на початку кожного сезону. Необслужений надувний жилет — це просто тканинна безрукавка.</li><li data-lang=\"ua\"><strong>Надувні не для дінгі.</strong> Якщо ви збираєтесь перевертатися багато разів — використовуйте пінопластовий.</li><li data-lang=\"ua\"><strong>Посадка має значення.</strong> Зробіть тест на підйом: надіньте, попросіть когось сильно потягнути вгору за плечі. Якщо жилет піднімається вище вух — він завеликий або заслабо затягнутий; у воді він підніметься, а ваша голова опуститься.</li><li data-lang=\"ua\"><strong>Пахова стропа.</strong> Якщо є — використовуйте. Вона не дає жилету зісковзнути вгору при надуванні.</li><li data-lang=\"ua\"><strong>Додайте свисток і ліхтарик.</strong> Свисток чути значно далі, ніж крик, і коштує копійки. У тумані або вночі маленький проблисковий маячок — це те, що дозволить вас знайти.</li></ul><hr><h3><span data-lang=\"en\">1.4 Staying on the boat in the first place</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Найголовніше — не впасти з судна</span></h3><p data-lang=\"en\">Recovering a person from the water is difficult, slow, and often fails. Preventing the fall is vastly easier. The professional maxim is: <strong>\"Stay on the boat.\"</strong></p><ul><li data-lang=\"en\"><strong>\"One hand for the boat, one hand for yourself.\"</strong> Always be holding something. When you move, plan the handhold before you move, not during.</li><li data-lang=\"en\"><strong>Move on the windward (high) side</strong> of a heeled boat. If you slip, you fall <em>into</em> the boat, not over the low side into the water.</li><li data-lang=\"en\"><strong>Stay low.</strong> Crouch or crawl when it's rough. Your centre of gravity is your friend.</li><li data-lang=\"en\"><strong>Never stand on the coachroof or lean out</strong> without being clipped on.</li><li data-lang=\"en\"><strong>Clip on with a harness and tether when:</strong> sailing at night, in fog, in rough water, shorthanded, or any time you go forward of the cockpit in anything other than flat calm.</li><li data-lang=\"en\"><strong>Jackstays (safety lines)</strong> run fore and aft along the deck. Clip your tether to those, not to the guardrail wire — guardrails are not designed to take a shock load.</li><li data-lang=\"en\"><strong>Watch the boom.</strong> A gybing boom carries enough force to break bones and knock you unconscious into the water. When someone calls \"gybe-ho\", get your head down. This is the most common serious injury in sailing.</li><li data-lang=\"en\"><strong>Beware the low lifelines.</strong> Guardrails on small boats are often only knee to thigh height. They will trip you overboard, not catch you.</li></ul><p data-lang=\"ua\">Підняти людину з води складно, повільно, і часто це не вдається. Не дати впасти — незрівнянно легше. Професійна максима: <strong>«Залишайся на судні.»</strong></p><ul><li data-lang=\"ua\"><strong>«Одна рука для судна, одна для себе.»</strong> Завжди тримайтеся за щось. Коли переміщаєтесь, сплануйте, за що триматися, <em>до</em> руху, а не під час.</li><li data-lang=\"ua\"><strong>Рухайтеся навітряним (високим) бортом</strong> накрененого судна. Якщо ковзнете — впадете <em>в</em> човен, а не за низький борт у воду.</li><li data-lang=\"ua\"><strong>Тримайтеся низько.</strong> Присідайте або повзіть, коли хитає. Низький центр ваги — ваш друг.</li><li data-lang=\"ua\"><strong>Ніколи не стійте на рубці й не перевішуйтесь за борт</strong> без застібнутої страховки.</li><li data-lang=\"ua\"><strong>Застібайтеся страховим поясом і карабіном, коли:</strong> йдете вночі, в тумані, в неспокійній воді, малим екіпажем, або щоразу, коли виходите вперед з кокпіту в будь-яких умовах, крім повного штилю.</li><li data-lang=\"ua\"><strong>Штормові леєри (jackstays)</strong> тягнуться вздовж палуби від носа до корми. Пристібайте карабін до них, а не до тросу релінгу — релінги не розраховані на ударне навантаження.</li><li data-lang=\"ua\"><strong>Слідкуйте за ґіком.</strong> Ґік при повороті фордевінд несе достатньо сили, щоб зламати кістки і збити вас без свідомості у воду. Коли хтось кричить «gybe-ho» — опустіть голову. Це найпоширеніша серйозна травма у вітрильному спорті.</li><li data-lang=\"ua\"><strong>Обережно з низькими леєрами.</strong> Релінги на малих човнах часто лише до коліна або стегна. Вони вас перекинуть за борт, а не втримають.</li></ul><hr><h3><span data-lang=\"en\">1.5 Required safety equipment</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Обов'язкове спорядження безпеки</span></h3><p data-lang=\"en\">Canadian law (the <em>Small Vessel Regulations</em>) sets minimum equipment by vessel length and type. Everything must be <strong>Canadian-approved</strong>, in <strong>good working order</strong>, and <strong>immediately accessible</strong> — not buried under sail bags. Fines run to roughly $200 per missing item.</p><p data-lang=\"en\">Here is a typical minimum for a <strong>sailboat up to 6 m</strong> with an engine. <strong>This is a study aid, not the legal text</strong> — requirements vary with your exact boat and change over time:</p><div class=\"table-wrap\"><table><thead><tr><th>Category</th><th>Typical requirement</th></tr></thead><tbody><tr><td><strong>Personal protection</strong></td><td>One Canadian-approved PFD/lifejacket of appropriate size <strong>per person</strong></td></tr><tr><td></td><td>One buoyant heaving line at least 15 m long</td></tr><tr><td></td><td>A reboarding device if freeboard exceeds 0.5 m</td></tr><tr><td><strong>Boat safety</strong></td><td>One bailer <strong>or</strong> one manual bilge pump</td></tr><tr><td></td><td>One manual propelling device (paddle/oars) <strong>or</strong> an anchor with at least 15 m of cable, rope or chain</td></tr><tr><td><strong>Navigation</strong></td><td>A sound-signalling device (whistle or horn)</td></tr><tr><td></td><td>Navigation lights, if operating after sunset, before sunrise, or in restricted visibility</td></tr><tr><td></td><td>A magnetic compass (required for larger vessels, and whenever you operate out of sight of navigation marks)</td></tr><tr><td></td><td>A radar reflector, where warranted by conditions and vessel size</td></tr><tr><td><strong>Distress</strong></td><td>Flares — type and quantity depend on vessel length; a watertight flashlight may substitute in some small-vessel cases</td></tr><tr><td><strong>Fire</strong></td><td>A fire extinguisher, if the vessel has an engine, fuel tank, or cooking/heating appliance</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Critical:</strong> Verify your exact requirements against <strong>Transport Canada's <em>Safe Boating Guide</em> (TP 511)</strong>, which is free. Bigger boats (6–9 m, 9–12 m, and above) require progressively more — notably more flares, a bigger bilge pump, and additional fire extinguishers. Do not take this table as authoritative for your boat.</p><p data-lang=\"en\"><strong>Beyond the legal minimum</strong>, any sensible Halifax sailor also carries: a marine VHF radio (a handheld at minimum — see <a href=\"#/m11\" data-nav=\"m11\">Module 11</a>), a first aid kit, a sharp knife accessible from the cockpit, a hand-bearing compass, charts of the area, a radar reflector, a lifebuoy or horseshoe buoy with a light, a bucket on a lanyard, spare warm dry clothing in a waterproof bag, drinking water, and a fully charged phone in a waterproof case.</p><p data-lang=\"ua\">Канадське законодавство (<em>Small Vessel Regulations</em>) встановлює мінімум спорядження залежно від довжини й типу судна. Усе повинно бути <strong>схвалене в Канаді</strong>, у <strong>робочому стані</strong> та <strong>негайно доступне</strong> — не завалене мішками з вітрилами. Штрафи — приблизно $200 за кожен відсутній предмет.</p><p data-lang=\"ua\">Ось типовий мінімум для <strong>вітрильника до 6 м</strong> з двигуном. <strong>Це навчальний посібник, а не текст закону</strong> — вимоги залежать від конкретного судна і змінюються:</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Категорія</th><th>Типова вимога</th></tr></thead><tbody><tr><td><strong>Захист людини</strong></td><td>Один схвалений у Канаді PFD/жилет відповідного розміру <strong>на кожну особу</strong></td></tr><tr><td></td><td>Один плавучий кидальний кінець довжиною не менше 15 м</td></tr><tr><td></td><td>Пристрій для повторного підняття на борт, якщо висота надводного борту понад 0,5 м</td></tr><tr><td><strong>Безпека судна</strong></td><td>Один черпак <strong>або</strong> один ручний трюмний насос</td></tr><tr><td></td><td>Один засіб ручного руху (весло) <strong>або</strong> якір з не менш ніж 15 м троса, каната чи ланцюга</td></tr><tr><td><strong>Навігація</strong></td><td>Звуковий сигнальний пристрій (свисток або гудок)</td></tr><tr><td></td><td>Навігаційні вогні, якщо йдете після заходу сонця, до сходу, або при обмеженій видимості</td></tr><tr><td></td><td>Магнітний компас (обов'язковий для більших суден і завжди, коли ви поза видимістю навігаційних знаків)</td></tr><tr><td></td><td>Радарний відбивач, коли це виправдано умовами та розміром судна</td></tr><tr><td><strong>Сигнали біди</strong></td><td>Фальшфейєри — тип і кількість залежать від довжини судна; водонепроникний ліхтарик може замінити їх у деяких випадках для малих суден</td></tr><tr><td><strong>Пожежа</strong></td><td>Вогнегасник, якщо на судні є двигун, паливний бак або прилад для приготування їжі/обігріву</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Критично:</strong> Перевірте свої точні вимоги за <strong><em>Safe Boating Guide</em> (TP 511) від Transport Canada</strong>, він безкоштовний. Більші судна (6–9 м, 9–12 м і більше) вимагають прогресивно більше — зокрема більше фальшфейєрів, потужніший трюмний насос і додаткові вогнегасники. Не вважайте цю таблицю остаточною для вашого судна.</p><p data-lang=\"ua\"><strong>Понад юридичний мінімум</strong> будь-який розсудливий яхтсмен у Галіфаксі також бере: морську VHF-радіостанцію (мінімум портативну — див. <a href=\"#/m11\" data-nav=\"m11\">Модуль 11</a>), аптечку, гострий ніж, доступний з кокпіту, ручний пеленгаторний компас, карти району, радарний відбивач, рятувальний круг з вогнем, відро на кінці, запасний теплий сухий одяг у водонепроникному мішку, питну воду і повністю заряджений телефон у водонепроникному чохлі.</p><hr><h3><span data-lang=\"en\">1.6 Before every single departure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перед кожним виходом</span></h3><p data-lang=\"en\">Make this a ritual you never skip, even for a one-hour sail. The full printable version is in <a href=\"#/checklists\" data-nav=\"checklists\">appendix/checklists.md</a>.</p><ol><li data-lang=\"en\"><strong>Check the forecast</strong> — Environment Canada marine forecast for <em>Halifax Harbour and Approaches</em>, issued roughly four times daily (about 0300, 1000, 1530, 2000). Check wind, visibility, and any warnings. See <a href=\"#/m09\" data-nav=\"m09\">Module 09</a>.</li><li data-lang=\"en\"><strong>Check the tide</strong> — for the time you plan to return, not just when you leave.</li><li data-lang=\"en\"><strong>File a sail plan</strong> — tell a person ashore: where you're going, who's aboard, when you expect to be back, and <strong>what to do if you're not</strong>. This is the cheapest piece of safety equipment in existence and it costs nothing.</li><li data-lang=\"en\"><strong>Safety brief the crew</strong> — even experienced ones, even for an hour. Where are the PFDs, flares, fire extinguisher, first aid kit, VHF? How do you call for help? Where's the engine kill switch? What do you do if I fall overboard? <em>Especially</em> that last one — if the skipper goes over, an unbriefed crew is in serious trouble.</li><li data-lang=\"en\"><strong>Check fuel, water, battery.</strong></li><li data-lang=\"en\"><strong>Look at the boat</strong> — rigging attached, no frayed wires, seacocks correct, bilge dry, no lines trailing in the water where they can foul the propeller.</li><li data-lang=\"en\"><strong>Count the crew.</strong> Count them again when you return.</li></ol><p data-lang=\"ua\">Зробіть це ритуалом, який ніколи не пропускаєте, навіть для годинного виходу. Повна версія для друку — в <a href=\"#/checklists\" data-nav=\"checklists\">appendix/checklists.md</a>.</p><ol><li data-lang=\"ua\"><strong>Перевірте прогноз</strong> — морський прогноз Environment Canada для <em>Halifax Harbour and Approaches</em>, виходить приблизно чотири рази на добу (близько 0300, 1000, 1530, 2000). Дивіться вітер, видимість і попередження. Див. <a href=\"#/m09\" data-nav=\"m09\">Модуль 09</a>.</li><li data-lang=\"ua\"><strong>Перевірте приплив</strong> — на час, коли плануєте повернутися, а не лише коли виходите.</li><li data-lang=\"ua\"><strong>Залиште план виходу (sail plan)</strong> — скажіть людині на берегі: куди йдете, хто на борту, коли повернетесь, і <strong>що робити, якщо ви не повернулися</strong>. Це найдешевший елемент спорядження безпеки, який існує, і він безкоштовний.</li><li data-lang=\"ua\"><strong>Проведіть інструктаж екіпажу</strong> — навіть досвідченого, навіть на годину. Де жилети, фальшфейєри, вогнегасник, аптечка, VHF? Як викликати допомогу? Де вимикач двигуна? Що робити, якщо я впаду за борт? <em>Особливо</em> останнє — якщо шкіпер за бортом, неінструктований екіпаж у серйозній біді.</li><li data-lang=\"ua\"><strong>Перевірте паливо, воду, акумулятор.</strong></li><li data-lang=\"ua\"><strong>Огляньте судно</strong> — такелаж закріплений, немає розтріпаних тросів, кінгстони в правильному положенні, трюм сухий, немає кінців, що тягнуться за бортом і можуть намотатися на гребний винт.</li><li data-lang=\"ua\"><strong>Перерахуйте екіпаж.</strong> Перерахуйте знову, коли повернетесь.</li></ol><hr><h3><span data-lang=\"en\">1.7 Alcohol</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Алкоголь</span></h3><p data-lang=\"en\">Operating a vessel while impaired is a criminal offence in Canada, exactly as it is in a car, and it carries the same class of consequences including a driving prohibition. Beyond the law: alcohol accelerates hypothermia, destroys your balance on a moving deck, and impairs the judgement you need for weather decisions. Boating culture is unfortunately relaxed about drinking. Be the skipper who isn't. Drink at the dock, after the boat is tied up.</p><p data-lang=\"ua\">Керування судном у стані сп'яніння — кримінальний злочин у Канаді, так само як за кермом авто, і має ті самі категорії наслідків, включно з забороною керувати транспортом. Крім закону: алкоголь прискорює гіпотермію, руйнує рівновагу на рухомій палубі й погіршує судження, потрібне для рішень щодо погоди. Вітрильна культура, на жаль, розслаблена щодо алкоголю. Будьте шкіпером, який ні. Пийте на причалі, після того як судно пришвартоване.</p><hr><h3><span data-lang=\"en\">1.8 Sun, dehydration and seasickness</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сонце, дегідратація та морська хвороба</span></h3><p data-lang=\"en\"></p><ul><li data-lang=\"en\"><strong>Sun.</strong> Glare reflects off water and doubles your exposure. You burn on a cool overcast Halifax day without noticing. Hat, sunglasses with a retainer, and real sunscreen reapplied.</li><li data-lang=\"en\"><strong>Dehydration.</strong> Wind and sun dehydrate you fast, and you won't feel thirsty because you're cold. Dehydration causes bad decisions. Drink water on a schedule, not on thirst.</li><li data-lang=\"en\"><strong>Seasickness.</strong> Not weakness, not something you can will away, and it hits most people at least once. It degrades judgement severely — a badly seasick skipper is an incapacitated skipper.</li><li data-lang=\"en\"><strong>Prevention beats cure.</strong> Take medication (dimenhydrinate, meclizine, or a scopolamine patch) <em>before</em> you leave the dock — an hour or more ahead. Once you're sick, oral medication won't stay down.</li><li data-lang=\"en\">Stay on deck, look at the horizon, take the helm if you can — steering helps enormously because it re-syncs what you see with what you feel.</li><li data-lang=\"en\">Eat something bland; an empty stomach is worse than a full one.</li><li data-lang=\"en\">Stay warm, stay hydrated, avoid the cabin, avoid reading and screens, avoid diesel fumes.</li><li data-lang=\"en\">If someone is badly sick: get them a PFD and clip them on. Seasick people go to the rail, and people at the rail fall overboard.</li></ul><p data-lang=\"ua\"></p><ul><li data-lang=\"ua\"><strong>Сонце.</strong> Відблиск від води подвоює експозицію. Ви згорите прохолодного похмурого дня в Галіфаксі, не помітивши. Капелюх, окуляри з ремінцем і справжній сонцезахисний крем, повторно нанесений.</li><li data-lang=\"ua\"><strong>Дегідратація.</strong> Вітер і сонце швидко зневоднюють, і ви не відчуватимете спраги, бо вам холодно. Дегідратація призводить до поганих рішень. Пийте воду за графіком, а не за спрагою.</li><li data-lang=\"ua\"><strong>Морська хвороба.</strong> Це не слабкість і не те, що можна подолати волею; вона накриває більшість людей хоча б раз. Вона серйозно погіршує судження — сильно вкачаний шкіпер це недієздатний шкіпер.</li><li data-lang=\"ua\"><strong>Профілактика краща за лікування.</strong> Прийміть препарат (дименгідринат, меклізин або пластир зі скополаміном) <em>до</em> відходу від причалу — за годину або більше. Коли вас уже нудить, таблетка не втримається.</li><li data-lang=\"ua\">Залишайтеся на палубі, дивіться на горизонт, візьміть штурвал, якщо можете — керування дуже допомагає, бо синхронізує те, що ви бачите, з тим, що відчуваєте.</li><li data-lang=\"ua\">З'їжте щось нейтральне; порожній шлунок гірше за повний.</li><li data-lang=\"ua\">Тримайтеся в теплі, пийте воду, уникайте каюти, читання й екранів, уникайте вихлопу дизеля.</li><li data-lang=\"ua\">Якщо комусь дуже погано: надіньте на нього жилет і пристібніть. Люди з морською хворобою йдуть до борту, а люди біля борту падають за борт.</li></ul><hr><h3><span data-lang=\"en\">1.9 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\">You should be able to state from memory:</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>The three numbers of the 1‑10‑1 principle, and what each one means.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What actually drowns most people in cold water (hint: it is not hypothermia).</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why you should not swim to keep warm.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What HELP stands for and how to adopt it.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What the \"lift test\" checks on a PFD.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The three legal conditions all safety equipment must satisfy.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The five things in a crew safety brief.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which side of a heeled boat you should walk on, and why.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Roughly what temperature Halifax Harbour water reaches at its warmest.</span></label></li></ul><p data-lang=\"ua\">Ви повинні вміти сказати з пам'яті:</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Три числа принципу 1‑10‑1 і що означає кожне.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що насправді топить більшість людей у холодній воді (підказка: не гіпотермія).</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому не варто плавати, щоб зігрітися.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає HELP і як прийняти цю позу.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що перевіряє «тест на підйом» жилета.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Три юридичні умови, яким повинно відповідати все спорядження безпеки.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>П'ять пунктів інструктажу екіпажу з безпеки.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яким бортом накрененого судна слід ходити і чому.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Приблизно якої температури досягає вода гавані Галіфаксу в найтеплішу пору.</span></label></li></ul><hr>"}, "m02": {"t_en": "02 · How a sailboat works", "t_ua": "Як працює вітрильник", "html": "<h2>Module 02 — How a Sailboat Actually Works</h2><h2 data-lang=\"ua\">Модуль 02 — Як насправді працює вітрильник</h2><p><strong>Study time / Час: ~2 hours</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">This is the module that makes everything else make sense. Most beginners never properly understand <em>why</em> a boat sails, and they spend years guessing at sail trim as a result. Spend the two hours.</p><p data-lang=\"ua\">Це модуль, який робить усе інше зрозумілим. Більшість новачків так і не розуміють до кінця, <em>чому</em> судно йде під вітрилами, і через це роками вгадують налаштування вітрил. Витратьте ці дві години.</p></blockquote><hr><h3><span data-lang=\"en\">2.1 The counter-intuitive core idea</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрінтуїтивна головна ідея</span></h3><p data-lang=\"en\">Almost everyone starts with the wrong mental model. The wrong model is: <em>\"wind pushes the sail, like it pushes a shopping bag.\"</em></p><p data-lang=\"en\">If that were the whole story, a sailboat could only go where the wind is going. It could never sail towards the wind. But sailboats have sailed against the wind for a thousand years, and that is the whole reason sailing is useful.</p><p data-lang=\"en\"><strong>The correct model: a sail is a wing.</strong> It works exactly like an aircraft wing, just standing up vertically instead of lying flat.</p><p data-lang=\"en\">Air flowing across the curved (leeward, away-from-wind) side of a sail has to travel further and faster, which lowers its pressure. Air on the windward side is at higher pressure. That pressure difference produces a force perpendicular to the sail — <strong>lift</strong>. The sail is not pushed downwind; it is <em>sucked</em> sideways and forwards.</p><p data-lang=\"en\">This is the single most important idea in the sport:</p><blockquote class=\"callout\"><p><strong>A sail generates lift, and lift points mostly sideways. Your keel converts that sideways force into forward motion.</strong></p><p data-lang=\"ua\"><strong>Вітрило створює підйомну силу, і ця сила спрямована переважно вбік. Ваш кіль перетворює цю бокову силу на рух уперед.</strong></p></blockquote><p data-lang=\"ua\">Майже всі починають з неправильної моделі в голові. Неправильна модель: <em>«вітер штовхає вітрило, як він штовхає пакет.»</em></p><p data-lang=\"ua\">Якби це була вся історія, вітрильник міг би йти лише туди, куди йде вітер. Він ніколи не міг би йти проти вітру. Але вітрильники ходять проти вітру вже тисячу років, і саме це робить вітрильний спорт корисним.</p><p data-lang=\"ua\"><strong>Правильна модель: вітрило — це крило.</strong> Воно працює точно як крило літака, лише стоїть вертикально, а не лежить горизонтально.</p><p data-lang=\"ua\">Повітря, що обтікає вигнуту (підвітряну, від вітру) сторону вітрила, мусить пройти більший шлях швидше, що знижує його тиск. Повітря з навітряної сторони має вищий тиск. Ця різниця тисків створює силу, перпендикулярну до вітрила — <strong>підйомну силу (lift)</strong>. Вітрило не штовхають за вітром; його <em>засмоктує</em> вбік і вперед.</p><hr><h3><span data-lang=\"en\">2.2 The force triangle</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Трикутник сил</span></h3><p data-lang=\"en\">Here is the mechanism, step by step. This is worth drawing on paper yourself.</p><div class=\"pre-wrap\"><pre>                    TRUE WIND\n                        ↓\n                        ↓\n        ╔═══════════════════════════════╗\n        ║   The total force on the sail ║\n        ║   points roughly HERE  ──────►║ (mostly sideways,\n        ╚═══════════════════════════════╝  slightly forward)\n                        │\n             Split that force into two parts:\n                        │\n        ┌───────────────┴────────────────┐\n        │                                │\n   FORWARD component              SIDEWAYS component\n   (small — maybe 20%)            (large — maybe 80%)\n        │                                │\n        ▼                                ▼\n   Drives the boat            Would push the boat sideways\n      forward                  ...but the KEEL resists it\n        │                                │\n        │                    ┌───────────┴──────────┐\n        │                    ▼                      ▼\n        │            Small sideways slip      Boat HEELS over\n        │            (\"leeway\", 3–8°)         (ballast rights it)\n        ▼\n   ═══► BOAT SAILS FORWARD</pre></div><p data-lang=\"en\"><strong>The three things doing the work:</strong></p><ol><li data-lang=\"en\"><strong>The sail</strong> produces a large force, mostly sideways, a little forward.</li><li data-lang=\"en\"><strong>The keel</strong> (a heavy fin under the boat) is shaped so that it resists sideways movement through the water enormously, while offering little resistance to forward movement. It converts \"sideways push\" into \"you may not go sideways, so you must go forward.\"</li><li data-lang=\"en\"><strong>The ballast in the keel</strong> — often 30–45% of the boat's total weight, hanging a metre or two below the hull — resists the heeling force, so the boat leans over and then stops leaning, rather than capsizing.</li></ol><p data-lang=\"en\">Remove the keel and a sailboat blows sideways and cannot sail upwind at all. <strong>The keel is what makes a sailboat a sailboat.</strong> A dinghy uses a retractable centreboard for the same purpose, and uses the crew's body weight instead of lead ballast — which is why a dinghy capsizes when you lean the wrong way.</p><p data-lang=\"ua\">Ось механізм, крок за кроком. Варто намалювати це самому на папері.</p><p data-lang=\"ua\"><strong>Три речі, що виконують роботу:</strong></p><ol><li data-lang=\"ua\"><strong>Вітрило</strong> створює велику силу, переважно вбік, трохи вперед.</li><li data-lang=\"ua\"><strong>Кіль</strong> (важкий плавник під корпусом) має таку форму, що надзвичайно сильно опирається боковому руху у воді, майже не опираючись руху вперед. Він перетворює «боковий штовхок» на «вбік не можна, тому доведеться вперед».</li><li data-lang=\"ua\"><strong>Баласт у кілі</strong> — часто 30–45% усієї ваги судна, підвішений на метр-два під корпусом — протидіє силі крену, тому судно нахиляється і потім перестає нахилятися, а не перевертається.</li></ol><p data-lang=\"ua\">Заберіть кіль — і вітрильник знесе вбік, і він взагалі не зможе йти проти вітру. <strong>Кіль — це те, що робить вітрильник вітрильником.</strong> Дінгі використовує висувний шверт для тієї ж мети, а замість свинцевого баласту — вагу тіла екіпажу; саме тому дінгі перевертається, коли ви відкинетесь не в той бік.</p><hr><h3><span data-lang=\"en\">2.3 Why you cannot sail straight into the wind</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чому не можна йти прямо проти вітру</span></h3><p data-lang=\"en\">A wing needs air to flow <em>across</em> it at an angle to generate lift. Point the boat directly into the wind and the sails are edge-on to the airflow — they flap like a flag and generate nothing. This is called being <strong>in irons</strong> or <strong>head to wind</strong>, and the boat stops.</p><p data-lang=\"en\">There is a wedge of roughly <strong>45° either side of the true wind direction — a 90° total \"no-go zone\"</strong> — where a typical cruising boat simply cannot make progress. Racing boats get closer to 35–40°; older heavy cruisers might need 50°.</p><p data-lang=\"en\">So to get somewhere upwind you <strong>zigzag</strong>: sail as close to the wind as the boat will go on one side, then turn through the wind and do the same on the other side. Each leg is a <strong>tack</strong>, and the act of turning is <strong>tacking</strong>. Getting to an upwind destination this way is called <strong>beating</strong> or <strong>working to windward</strong>.</p><div class=\"pre-wrap\"><pre>                  ↑ TRUE WIND (from the north)\n                  ↑\n        ╲    NO-GO ZONE    ╱          ← ~90° total. Sails just flap here.\n          ╲    (in irons)  ╱\n            ╲            ╱\n   close-     ╲        ╱      - close-hauled\n   hauled       ╲    ╱          (~45° off the wind)\n  (port tack)     ╲╱          (starboard tack)\n                   ▲\n                  BOAT\n                   │\n              ┌────┴────┐\n              │  DESTINATION is upwind, so:\n              │\n              │      ╱╲    ╱╲    ╱╲\n              │     ╱  ╲  ╱  ╲  ╱  ╲     ← you zigzag (\"beat\")\n              │    ╱    ╲╱    ╲╱    ╲\n              └───────── START ──────────</pre></div><p data-lang=\"en\"><strong>Important consequence for planning:</strong> getting somewhere directly upwind takes roughly <strong>1.4 times the straight-line distance at minimum</strong>, and in practice often much more. If your destination is 6 nautical miles dead upwind, you will sail 9–12 miles to get there. Beginners routinely underestimate this and end up returning after dark. Always plan the <em>upwind</em> leg of a trip as the long one.</p><p data-lang=\"ua\">Крилу потрібно, щоб повітря обтікало його <em>під кутом</em>, щоб створити підйомну силу. Направте судно прямо проти вітру — і вітрила стануть ребром до потоку: вони лопотять, як прапор, і не створюють нічого. Це називається <strong>in irons</strong> («у залізах») або <strong>head to wind</strong>, і судно зупиняється.</p><p data-lang=\"ua\">Є сектор приблизно <strong>45° з кожної сторони від напрямку справжнього вітру — загалом 90° «мертвої зони» (no-go zone)</strong> — де типова круїзна яхта просто не може рухатися. Гоночні яхти підходять до 35–40°; старі важкі круїзери можуть потребувати 50°.</p><p data-lang=\"ua\">Отже, щоб дістатися куди-небудь проти вітру, ви йдете <strong>зигзагом</strong>: настільки круто до вітру, наскільки судно може, з одного боку, потім розворот через вітер і те саме з іншого боку. Кожен відрізок — це <strong>галс (tack)</strong>, а сам розворот — <strong>поворот оверштаг (tacking)</strong>. Досягнення цілі проти вітру таким способом називається <strong>лавіруванням (beating)</strong>.</p><p data-lang=\"ua\"><strong>Важливий висновок для планування:</strong> щоб дістатися пункту прямо проти вітру, потрібно пройти приблизно <strong>в 1,4 раза більше за пряму відстань як мінімум</strong>, а на практиці часто значно більше. Якщо ваша ціль за 6 морських миль прямо проти вітру — ви пройдете 9–12 миль. Новачки регулярно недооцінюють це і повертаються після темряви. Завжди плануйте <em>навітряний</em> відрізок подорожі як довгий.</p><hr><h3><span data-lang=\"en\">2.4 True wind vs apparent wind</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Справжній вітер проти видимого</span></h3><p data-lang=\"en\">This confuses every beginner, and it matters practically.</p><ul><li data-lang=\"en\"><strong>True wind</strong> — the wind as it actually is over the water. What the forecast tells you. What a flag on shore shows.</li><li data-lang=\"en\"><strong>Apparent wind</strong> — the wind you <em>feel on the moving boat</em>, which is the vector sum of the true wind and the wind created by your own motion.</li></ul><p data-lang=\"en\">Think of putting your hand out of a car window on a still day: you feel a 60 km/h \"wind\" that doesn't exist. That's apparent wind from motion.</p><p data-lang=\"en\"><strong>Consequences you will notice immediately:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Point of sail</th><th>Effect on apparent wind</th><th>What it feels like</th></tr></thead><tbody><tr><td><strong>Upwind (close-hauled)</strong></td><td>True wind + your speed <strong>add</strong></td><td>Feels much windier than it is. Loud, wet, heeled over, exciting. A 12 kt true wind can feel like 18 kt.</td></tr><tr><td><strong>Beam reach</strong></td><td>Partly adds, and shifts forward</td><td>Fast and controlled — usually the fastest and most pleasant point of sail</td></tr><tr><td><strong>Downwind (running)</strong></td><td>Your speed <strong>subtracts</strong> from true wind</td><td>Feels calm and gentle even in strong wind. <strong>This is dangerously deceptive.</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The downwind trap — learn this now.</strong> Sailing downwind in a building breeze feels peaceful. The boat is upright, it's quiet, nothing is straining. Then you turn around to go home, and suddenly you are hard on the wind in 25 knots that you never noticed arriving. Every experienced sailor has been caught by this once. <strong>Judge the wind by the water surface and the forecast, never by how it feels on a downwind leg.</strong></p><p data-lang=\"ua\">Це збиває з пантелику кожного новачка, і це має практичне значення.</p><ul><li data-lang=\"ua\"><strong>Справжній вітер (true wind)</strong> — вітер, який реально є над водою. Те, що показує прогноз. Те, що показує прапор на берегі.</li><li data-lang=\"ua\"><strong>Видимий вітер (apparent wind)</strong> — вітер, який ви <em>відчуваєте на рухомому судні</em>, векторна сума справжнього вітру і вітру, створеного вашим власним рухом.</li></ul><p data-lang=\"ua\">Уявіть, що ви виставили руку з вікна авто в безвітряний день: ви відчуваєте «вітер» 60 км/год, якого не існує. Це видимий вітер від руху.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Курс</th><th>Вплив на видимий вітер</th><th>Як відчувається</th></tr></thead><tbody><tr><td><strong>Проти вітру (крутий бейдевінд)</strong></td><td>Справжній вітер + ваша швидкість <strong>додаються</strong></td><td>Відчувається значно сильнішим, ніж є. Шумно, мокро, з креном, азартно. Справжні 12 вузлів можуть відчуватися як 18.</td></tr><tr><td><strong>Галфвінд (beam reach)</strong></td><td>Частково додається і зсувається вперед</td><td>Швидко й контрольовано — зазвичай найшвидший і найприємніший курс</td></tr><tr><td><strong>За вітром (фордевінд)</strong></td><td>Ваша швидкість <strong>віднімається</strong> від справжнього вітру</td><td>Відчувається спокійно й лагідно навіть при сильному вітрі. <strong>Це небезпечно оманливо.</strong></td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Пастка попутного вітру — засвойте це зараз.</strong> Йти за вітром при наростаючому бризі відчувається мирно. Судно рівне, тихо, ніщо не напружується. Потім ви розвертаєтесь додому — і раптом опиняєтесь у крутому бейдевінді при 25 вузлах, приходу яких ви не помітили. Кожен досвідчений яхтсмен один раз на це попався. <strong>Оцінюйте вітер за поверхнею води і прогнозом, ніколи за відчуттям на попутному курсі.</strong></p><hr><h3><span data-lang=\"en\">2.5 Heeling — why it happens and why it's fine</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Крен — чому він виникає і чому це нормально</span></h3><p data-lang=\"en\">The boat leaning over is the most alarming thing for a new sailor and one of the least dangerous.</p><p data-lang=\"en\">The sideways component of sail force acts high up (at the sail), while the keel's resistance acts low down (under the water). That offset creates a rotating couple — the boat heels. The ballast in the keel, hanging low, creates an opposing <strong>righting moment</strong> that grows as the boat heels further. The boat settles at the angle where the two balance.</p><p data-lang=\"en\"><strong>A properly ballasted keelboat is extremely difficult to capsize.</strong> Heel 30° and the righting moment is far larger than at 10°; the boat resists more the further it goes. Let go of everything in a gust and a keelboat will simply luff up into the wind and stand up. This is genuinely designed behaviour, not luck.</p><p data-lang=\"en\"><strong>But excessive heel is slow and uncomfortable, so it's still wrong:</strong></p><ul><li data-lang=\"en\">The hull shape is designed to move through water upright; heeled far over it drags.</li><li data-lang=\"en\">The rudder starts to lift out of the water and lose grip — you lose steering authority.</li><li data-lang=\"en\">The keel becomes less vertical and generates less lift, so <strong>leeway increases</strong>.</li><li data-lang=\"en\">Crew can't move, work, or eat, and people get seasick and frightened.</li></ul><p data-lang=\"en\"><strong>Typical target: 10–20° of heel.</strong> If you're past 25° in a cruising boat, you are overpowered — you're going <em>slower</em> than you would with less sail. Fix it by easing sails, heading up slightly, or <a href=\"#/m05\" data-nav=\"m05\">reefing</a>.</p><p data-lang=\"ua\">Нахил судна — найтривожніша річ для новачка і одна з найменш небезпечних.</p><p data-lang=\"ua\">Бокова складова сили вітрила діє високо (на вітрилі), а опір кіля — низько (під водою). Це зміщення створює обертальну пару — судно кренується. Баласт у кілі, підвішений низько, створює протилежний <strong>момент, що вирівнює (righting moment)</strong>, який зростає з нахилом. Судно встановлюється під кутом, де ці два врівноважуються.</p><p data-lang=\"ua\"><strong>Правильно збалансовану кільову яхту вкрай важко перевернути.</strong> При крені 30° момент вирівнювання значно більший, ніж при 10°; чим далі, тим сильніший опір. Відпустіть усе в порив — і кільова яхта просто розвернеться до вітру і випрямиться. Це справді закладена конструкцією поведінка, а не везіння.</p><p data-lang=\"ua\"><strong>Але надмірний крен уповільнює і незручний, тому це все одно помилка:</strong></p><ul><li data-lang=\"ua\">Форма корпусу розрахована на рух у воді у вертикальному положенні; сильно накренений, він гальмує.</li><li data-lang=\"ua\">Кермо починає виходити з води і втрачати зачеп — ви втрачаєте керованість.</li><li data-lang=\"ua\">Кіль стає менш вертикальним і створює меншу підйомну силу, тому <strong>дрейф (leeway) зростає</strong>.</li><li data-lang=\"ua\">Екіпаж не може рухатися, працювати чи їсти, людей укачує і вони бояться.</li></ul><p data-lang=\"ua\"><strong>Типова цільова величина: 10–20° крену.</strong> Якщо на круїзній яхті у вас понад 25° — судно перевантажене вітром: ви йдете <em>повільніше</em>, ніж з меншою площею вітрил. Виправте, потравивши вітрила, трохи вийшовши до вітру, або <a href=\"#/m05\" data-nav=\"m05\">взявши риф</a>.</p><hr><h3><span data-lang=\"en\">2.6 Balance: weather helm and lee helm</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Балансування: навітряне й підвітряне кермо</span></h3><p data-lang=\"en\">This is the part almost no beginner course explains properly, and understanding it will make you look like you've sailed for years.</p><p data-lang=\"en\">Every sail plan has a <strong>Centre of Effort (CE)</strong> — the single point where all sail force can be considered to act. Every hull has a <strong>Centre of Lateral Resistance (CLR)</strong> — the single point where all the keel and hull's sideways resistance acts.</p><ul><li data-lang=\"en\">If the <strong>CE is behind the CLR</strong>, the wind pushes the back of the boat downwind, which swings the bow <em>up into the wind</em>. The boat wants to turn towards the wind. This is <strong>weather helm</strong> — you must hold the helm away from the wind to go straight.</li><li data-lang=\"en\">If the <strong>CE is ahead of the CLR</strong>, the bow gets pushed downwind. The boat wants to turn away from the wind. This is <strong>lee helm</strong>.</li></ul><p data-lang=\"en\"><strong>A small amount of weather helm (2–4°) is desirable.</strong> It gives you feel through the tiller, it's a safety feature (let go and the boat luffs up and de-powers itself), and it slightly improves upwind performance.</p><p data-lang=\"en\"><strong>Lee helm is dangerous.</strong> Let go of the helm and the boat bears away, the sails power up further, and it accelerates in the wrong direction. Never sail a boat with lee helm if you can avoid it.</p><p data-lang=\"en\"><strong>Heavy weather helm means you are overpowered.</strong> As the boat heels, the sail plan swings out to leeward, moving the CE sideways, which increases the turning moment. So heel causes weather helm, which causes more rudder drag, which slows you down. Symptoms and fixes:</p><div class=\"table-wrap\"><table><thead><tr><th>Symptom</th><th>Cause</th><th>Fix, in order</th></tr></thead><tbody><tr><td>Heavy pull on the tiller towards the wind; boat fights you</td><td>Too much heel, too much mainsail</td><td><strong>1.</strong> Ease the mainsheet <strong>2.</strong> Move the traveller down to leeward <strong>3.</strong> Flatten the main (tighten outhaul/cunningham) <strong>4.</strong> Reef the main <strong>5.</strong> Move crew weight to windward</td></tr><tr><td>Boat won't turn up into the wind; tiller feels dead</td><td>Lee helm — too much headsail, not enough main</td><td>Reduce headsail, or add mainsail; check mast rake</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The rule of thumb worth remembering:</strong> <em>the mainsail turns the boat towards the wind; the headsail turns it away.</em> So if you can't get the bow up into the wind during a tack, sheet the main harder and ease the jib. If the boat keeps trying to head up when you don't want it to, ease the main.</p><p data-lang=\"ua\">Це те, що майже жоден курс для новачків не пояснює як слід, і розуміння цього зробить вас схожим на людину, яка ходить під вітрилами роками.</p><p data-lang=\"ua\">Кожен вітрильний план має <strong>центр парусності (Centre of Effort, CE)</strong> — точку, у якій можна вважати зосередженою всю силу вітрил. Кожен корпус має <strong>центр бокового опору (Centre of Lateral Resistance, CLR)</strong> — точку, у якій діє весь боковий опір кіля та корпусу.</p><ul><li data-lang=\"ua\">Якщо <strong>CE позаду CLR</strong>, вітер зносить корму під вітер, і ніс повертається <em>до вітру</em>. Судно хоче йти до вітру. Це <strong>навітряне кермо (weather helm)</strong> — ви мусите тримати кермо від вітру, щоб іти прямо.</li><li data-lang=\"ua\">Якщо <strong>CE перед CLR</strong>, ніс зносить під вітер. Судно хоче йти від вітру. Це <strong>підвітряне кермо (lee helm)</strong>.</li></ul><p data-lang=\"ua\"><strong>Невелике навітряне кермо (2–4°) — це бажано.</strong> Воно дає відчуття через румпель, це елемент безпеки (відпустіть — судно вийде до вітру і само знизить тягу), і воно трохи покращує хід проти вітру.</p><p data-lang=\"ua\"><strong>Підвітряне кермо небезпечне.</strong> Відпустіть кермо — і судно піде під вітер, вітрила набирають більшу тягу, і воно розганяється в неправильному напрямку. Ніколи не ходіть з підвітряним кермом, якщо можете цього уникнути.</p><p data-lang=\"ua\"><strong>Сильне навітряне кермо означає перевантаження вітром.</strong> З наростанням крену вітрильний план виноситься під вітер, зсуваючи CE вбік, що збільшує обертальний момент. Отже крен викликає навітряне кермо, яке викликає більший опір керма, що вас уповільнює.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Симптом</th><th>Причина</th><th>Виправлення, за порядком</th></tr></thead><tbody><tr><td>Сильна тяга румпеля до вітру; судно бореться з вами</td><td>Завеликий крен, забагато грота</td><td><strong>1.</strong> Потравіть гика-шкот <strong>2.</strong> Опустіть каретку (traveller) під вітер <strong>3.</strong> Розпряміть грот (натягніть відтяжку шкотового кута/канінгем) <strong>4.</strong> Візьміть риф на гроті <strong>5.</strong> Перемістіть екіпаж на навітряний борт</td></tr><tr><td>Судно не хоче йти до вітру; румпель «мертвий»</td><td>Підвітряне кермо — забагато стакселя, замало грота</td><td>Зменшіть стаксель або додайте грот; перевірте нахил мачти</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Правило, яке варто запам'ятати:</strong> <em>грот повертає судно до вітру; переднє вітрило — від вітру.</em> Тож якщо не можете вивести ніс до вітру під час повороту оверштаг — доберіть грот і потравіть стаксель. Якщо судно постійно намагається йти до вітру, коли ви цього не хочете — потравіть грот.</p><hr><h3><span data-lang=\"en\">2.7 Upwind uses lift; downwind uses drag</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Проти вітру — підйомна сила; за вітром — опір</span></h3><p data-lang=\"en\">The wing model applies from close-hauled through to a broad reach. But once you turn far enough downwind that the wind is coming from behind, the airflow separates and the sail stops working as a wing. Downwind, the sail really is just a bag catching wind — it works by <strong>drag</strong>, exactly as beginners intuitively expect.</p><p data-lang=\"en\">This is why:</p><ul><li data-lang=\"en\"><strong>Downwind sails are shaped differently.</strong> A spinnaker is a huge, deep, balloon-like sail with no attempt at an efficient aerofoil section — it's designed to present the maximum possible area to the wind.</li><li data-lang=\"en\"><strong>You can never sail faster than the wind directly downwind.</strong> With drag, once you match the wind speed there's no relative airflow left. Upwind and reaching, using lift, a good boat <em>can</em> exceed true wind speed — which surprises people.</li><li data-lang=\"en\"><strong>Downwind is often not the fastest way downwind.</strong> Because a beam or broad reach uses lift and generates more apparent wind, sailing a zigzag of broad reaches (\"tacking downwind\") can get you to a downwind destination faster than running dead straight at it. Racers do this constantly.</li><li data-lang=\"en\"><strong>Dead downwind is the least stable, most dangerous point of sail.</strong> The boom is far out, the wind is behind, and a small steering error or wave can flip the wind to the other side of the sail — an <strong>accidental gybe</strong>, where the boom slams across the boat at high speed. See <a href=\"#/m05\" data-nav=\"m05\">Module 05</a> for how to prevent it.</li></ul><p data-lang=\"ua\">Модель крила працює від крутого бейдевінда до бакштага. Але коли ви повернете достатньо далеко за вітер, так що вітер приходить ззаду, потік відривається і вітрило перестає працювати як крило. На попутному курсі вітрило справді просто мішок, що ловить вітер — воно працює за рахунок <strong>опору (drag)</strong>, точно так, як інтуїтивно очікують новачки.</p><p data-lang=\"ua\">Ось чому:</p><ul><li data-lang=\"ua\"><strong>Попутні вітрила мають іншу форму.</strong> Спінакер — велике, глибоке, схоже на повітряну кулю вітрило без спроби зробити ефективний аеродинамічний профіль: воно розраховане на максимальну площу, виставлену вітру.</li><li data-lang=\"ua\"><strong>Прямо за вітром ви ніколи не піде́те швидше за вітер.</strong> З опором: коли ви зрівнялися зі швидкістю вітру, відносного потоку більше не залишається. Проти вітру й у галфвінд, використовуючи підйомну силу, добра яхта <em>може</em> перевищити швидкість справжнього вітру — це людей дивує.</li><li data-lang=\"ua\"><strong>Прямо за вітром часто не найшвидший шлях за вітер.</strong> Оскільки галфвінд і бакштаг використовують підйомну силу і створюють більший видимий вітер, зигзаг бакштагами («лавірування за вітром») може привести до підвітряної цілі швидше, ніж прямий курс фордевінд. Гонщики роблять це постійно.</li><li data-lang=\"ua\"><strong>Чистий фордевінд — найменш стабільний і найнебезпечніший курс.</strong> Ґік винесений далеко, вітер ззаду, і невелика помилка керування або хвиля можуть перекинути вітер на іншу сторону вітрила — <strong>непередбачений поворот фордевінд (accidental gybe)</strong>, коли ґік з великою швидкістю перелітає через судно. Як цьому запобігти — <a href=\"#/m05\" data-nav=\"m05\">Модуль 05</a>.</li></ul><hr><h3><span data-lang=\"en\">2.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\">Explain each of these out loud, in your own words. If you can't, re-read the section.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a sail like a wing rather than a bag? (§2.1)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does the keel actually do, and what happens without one? (§2.2)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why can't a boat sail into the wind, and how wide is the no-go zone? (§2.3)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>If your destination is 5 nm dead upwind, roughly how far will you sail? (§2.3)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the difference between true and apparent wind? (§2.4)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a downwind leg in building wind dangerous? (§2.4)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why does 30° of heel make you <em>slower</em>, not faster? (§2.5)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a little weather helm good and lee helm bad? (§2.6)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which sail turns the boat towards the wind, and which turns it away? (§2.6)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why can't you exceed wind speed sailing dead downwind? (§2.7)</span></label></li></ul><p data-lang=\"ua\">Проговоріть кожне з цього вголос своїми словами. Якщо не виходить — перечитайте розділ.</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому вітрило подібне до крила, а не до мішка? (§2.1)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що насправді робить кіль і що станеться без нього? (§2.2)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому судно не може йти проти вітру і яка ширина мертвої зони? (§2.3)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Якщо ціль за 5 морських миль прямо проти вітру — скільки приблизно ви пройдете? (§2.3)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка різниця між справжнім і видимим вітром? (§2.4)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому попутний курс при наростаючому вітрі небезпечний? (§2.4)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому крен 30° робить вас <em>повільнішими</em>, а не швидшими? (§2.5)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому невелике навітряне кермо добре, а підвітряне погано? (§2.6)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яке вітрило повертає судно до вітру, а яке від вітру? (§2.6)</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому не можна перевищити швидкість вітру на чистому фордевінді? (§2.7)</span></label></li></ul><hr>"}, "m03": {"t_en": "03 · Boat anatomy & rigging", "t_ua": "Будова судна", "html": "<h2>Module 03 — Boat Anatomy &amp; Rigging</h2><h2 data-lang=\"ua\">Модуль 03 — Будова судна та такелаж</h2><p><strong>Study time / Час: ~2 hours + 2 hours at the dock</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Sailing has its own vocabulary, and it is not decoration. When someone shouts \"ease the leeward jib sheet, then take up on the halyard\", there is no time to translate. This module is pure vocabulary — learn it before you're standing on a deck being shouted at. The full bilingual list is in the <a href=\"#/glossary\" data-nav=\"glossary\">Glossary</a>.</p><p data-lang=\"ua\">Вітрильний спорт має власну лексику, і це не декорація. Коли хтось кричить «ease the leeward jib sheet, then take up on the halyard», часу на переклад немає. Цей модуль — чиста лексика. Вивчіть її, доки ви ще не стоїте на палубі під крики. Повний двомовний список — у <a href=\"#/glossary\" data-nav=\"glossary\">Глосарії</a>.</p></blockquote><hr><h3><span data-lang=\"en\">3.1 Directions and orientation</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Напрямки та орієнтація</span></h3><p data-lang=\"en\">There are no \"lefts\" and \"rights\" on a boat, because left and right depend on which way you're facing. Boat directions are absolute.</p><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th><th>Memory aid</th></tr></thead><tbody><tr><td><strong>Bow</strong></td><td>The front</td><td>ніс</td><td>—</td></tr><tr><td><strong>Stern</strong></td><td>The back</td><td>корма</td><td>—</td></tr><tr><td><strong>Port</strong></td><td>Left, facing forward</td><td>лівий борт</td><td>Port and left both have four letters. Port lights are <strong>red</strong> — as in \"port wine is red\"</td></tr><tr><td><strong>Starboard</strong></td><td>Right, facing forward</td><td>правий борт</td><td>Starboard lights are <strong>green</strong></td></tr><tr><td><strong>Amidships</strong></td><td>The middle</td><td>мідель</td><td>—</td></tr><tr><td><strong>Forward / fore</strong></td><td>Towards the bow</td><td>у бік носа</td><td>\"Go forward\"</td></tr><tr><td><strong>Aft / abaft</strong></td><td>Towards the stern</td><td>у бік корми</td><td>—</td></tr><tr><td><strong>Windward</strong></td><td>The side the wind is coming from; the high side when heeled</td><td>навітряний борт</td><td>\"Wind-ward = towards the wind\"</td></tr><tr><td><strong>Leeward</strong> (\"LOO-ard\")</td><td>The side away from the wind; the low side when heeled</td><td>підвітряний борт</td><td>The sheltered side</td></tr><tr><td><strong>To leeward of X</strong></td><td>Downwind of X</td><td>під вітром від X</td><td>—</td></tr><tr><td><strong>Beam</strong></td><td>The width of the boat; also \"abeam\" = 90° to the side</td><td>ширина / траверз</td><td>—</td></tr><tr><td><strong>Aloft</strong></td><td>Up the mast</td><td>на висоті / на мачті</td><td>—</td></tr><tr><td><strong>Below</strong></td><td>Inside the cabin</td><td>у каюті / внизу</td><td>—</td></tr><tr><td><strong>On deck</strong></td><td>Outside, on top</td><td>на палубі</td><td>—</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Critical distinction.</strong> <em>Port and starboard</em> are fixed to the boat and never change. <em>Windward and leeward</em> change every time you tack. Both matter, and beginners mix them up. A \"leeward\" instruction means \"on the low side, away from the wind\", which could be either port or starboard depending on your current tack.</p><p data-lang=\"ua\">На судні немає «лівого» і «правого», бо ліво і право залежать від того, куди ви дивитесь. Напрямки на судні абсолютні.</p><p data-lang=\"ua\"><strong>Критична відмінність.</strong> <em>Port і starboard</em> закріплені за судном і ніколи не змінюються. <em>Windward і leeward</em> змінюються при кожному повороті оверштаг. Обидві пари важливі, і новачки їх плутають. Вказівка «leeward» означає «з низького боку, з боку від вітру», що може бути або лівим, або правим бортом залежно від поточного галсу.</p><hr><h3><span data-lang=\"en\">3.2 The hull</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Корпус</span></h3><div class=\"pre-wrap\"><pre>                  MAST\n                    │\n      bow           │                        stern\n       ╲            │                          ╱\n        ╲___________│_________________________╱   ← deck / палуба\n        │  foredeck │       cockpit           │\n   ─────┤───────────┴─────────────────────────├───── waterline / ватерлінія\n        │                                     │        ↑\n        │            HULL / корпус            │     freeboard\n        │                                     │     (above water)\n        └──────┬────────────────────┬─────────┘\n               │      KEEL          │  ← draft / осадка\n               │   (ballasted)      │     (below water)\n               └────────────────────┘        RUDDER ─┘</pre></div><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Hull</strong></td><td>The body of the boat</td><td>корпус</td></tr><tr><td><strong>Deck</strong></td><td>The walking surface on top</td><td>палуба</td></tr><tr><td><strong>Foredeck</strong></td><td>The deck forward of the mast</td><td>бак / передня палуба</td></tr><tr><td><strong>Cockpit</strong></td><td>The recessed area where you steer and sit</td><td>кокпіт</td></tr><tr><td><strong>Coachroof / cabin top</strong></td><td>The raised roof over the cabin</td><td>рубка</td></tr><tr><td><strong>Cabin / saloon</strong></td><td>The living space below deck</td><td>каюта / салон</td></tr><tr><td><strong>Companionway</strong></td><td>The stairs/hatch from cockpit into the cabin</td><td>вхідний люк / сходи в каюту</td></tr><tr><td><strong>Keel</strong></td><td>Ballasted fin under the hull; provides lateral resistance and righting moment</td><td>кіль</td></tr><tr><td><strong>Rudder</strong></td><td>The steering blade at the stern</td><td>кермо / руль</td></tr><tr><td><strong>Tiller</strong></td><td>A lever attached directly to the rudder (smaller boats)</td><td>румпель</td></tr><tr><td><strong>Wheel</strong></td><td>A steering wheel (larger boats)</td><td>штурвал</td></tr><tr><td><strong>Waterline</strong></td><td>Where the water meets the hull</td><td>ватерлінія</td></tr><tr><td><strong>Draft (draught)</strong></td><td>How deep the boat goes below the water — <strong>the number that determines where you can go</strong></td><td>осадка</td></tr><tr><td><strong>Freeboard</strong></td><td>Height of the deck above the water</td><td>висота надводного борту</td></tr><tr><td><strong>Beam</strong></td><td>Maximum width</td><td>максимальна ширина</td></tr><tr><td><strong>LOA</strong></td><td>Length overall</td><td>загальна довжина</td></tr><tr><td><strong>Bilge</strong></td><td>The lowest inside part of the hull where water collects</td><td>трюм</td></tr><tr><td><strong>Seacock / through-hull</strong></td><td>A valve where a pipe passes through the hull below the waterline</td><td>кінгстон</td></tr><tr><td><strong>Lifelines / guardrails</strong></td><td>Wire fence around the deck</td><td>леєри / релінги</td></tr><tr><td><strong>Stanchion</strong></td><td>The upright post holding the lifelines</td><td>стійка леєра</td></tr><tr><td><strong>Pulpit / pushpit</strong></td><td>The rails at the bow / stern</td><td>носовий / кормовий релінг</td></tr><tr><td><strong>Head</strong></td><td>The toilet</td><td>гальюн</td></tr><tr><td><strong>Galley</strong></td><td>The kitchen</td><td>камбуз</td></tr><tr><td><strong>Berth</strong></td><td>A bed; also a place to moor</td><td>койка; місце стоянки</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Two of these will matter urgently:</strong></p><ul><li data-lang=\"en\"><strong>Draft</strong> determines where you can safely go. A boat with 1.5 m draft cannot cross a 1.2 m shoal, ever. Know your boat's draft as a reflex number, and read it off every chart depth you cross.</li><li data-lang=\"en\"><strong>Seacocks</strong> are the holes in your boat. Every one is a potential sinking. Learn where they all are, learn how to close them, and check them before every departure. A boat sinks at its mooring far more often than at sea.</li></ul><p data-lang=\"ua\"><strong>Дві з цих речей будуть мати нагальне значення:</strong></p><ul><li data-lang=\"ua\"><strong>Осадка</strong> визначає, куди ви можете безпечно зайти. Судно з осадкою 1,5 м ніколи не перейде мілину 1,2 м. Знайте осадку свого судна як рефлекс і зчитуйте її з кожної глибини на карті, яку перетинаєте.</li><li data-lang=\"ua\"><strong>Кінгстони</strong> — це отвори у вашому судні. Кожен — потенційне затоплення. Вивчіть, де вони всі, навчіться їх закривати і перевіряйте перед кожним виходом. Судно тоне на своїй стоянці значно частіше, ніж у морі.</li></ul><hr><h3><span data-lang=\"en\">3.3 The rig — mast, boom, and standing rigging</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Рангоут і стоячий такелаж</span></h3><p data-lang=\"en\"><strong>Standing rigging</strong> is the wire that holds the mast up. It does not move in normal use. If it fails, the mast comes down.</p><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Mast</strong></td><td>The vertical spar</td><td>мачта</td></tr><tr><td><strong>Boom</strong></td><td>The horizontal spar along the bottom of the mainsail</td><td>ґік</td></tr><tr><td><strong>Spreaders</strong></td><td>Horizontal struts partway up the mast that push the shrouds outboard</td><td>краспиці</td></tr><tr><td><strong>Forestay</strong></td><td>Wire from the mast to the bow; the jib hoists on this</td><td>форштаг</td></tr><tr><td><strong>Backstay</strong></td><td>Wire from the mast to the stern</td><td>ахтерштаг</td></tr><tr><td><strong>Shrouds</strong></td><td>Wires from the mast to the sides of the boat</td><td>ванти</td></tr><tr><td><strong>Turnbuckle / bottlescrew</strong></td><td>Threaded fitting that tensions a stay</td><td>талреп</td></tr><tr><td><strong>Chainplate</strong></td><td>The metal fitting bolting a shroud to the hull</td><td>обушок вант</td></tr><tr><td><strong>Masthead</strong></td><td>The top of the mast</td><td>топ мачти</td></tr><tr><td><strong>Gooseneck</strong></td><td>The hinge attaching the boom to the mast</td><td>вертлюг ґіка</td></tr><tr><td><strong>Standing rigging</strong></td><td>All the fixed wire</td><td>стоячий такелаж</td></tr><tr><td><strong>Running rigging</strong></td><td>All the ropes you pull</td><td>бігучий такелаж</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Pre-sail rigging check, every time.</strong> Walk the deck and look at:</p><ul><li data-lang=\"en\">Every <strong>shroud, forestay and backstay</strong> — any broken strands (\"meat hooks\")? Rust? A single broken wire strand is a warning that the whole wire is near failure.</li><li data-lang=\"en\">Every <strong>turnbuckle</strong> — are the locking pins/rings in place? A turnbuckle that unwinds itself drops the mast.</li><li data-lang=\"en\">Every <strong>chainplate</strong> — cracks, movement, or rust weeping from the deck around it?</li><li data-lang=\"en\">The <strong>gooseneck</strong> and boom fittings.</li><li data-lang=\"en\"><strong>Cotter pins taped over</strong> so they don't snag sails or skin.</li></ul><p data-lang=\"en\">This takes 90 seconds and it is the difference between a nice day and a dismasting.</p><p data-lang=\"ua\"><strong>Стоячий такелаж</strong> — це троси, які тримають мачту. У нормальній роботі він не рухається. Якщо він відмовляє — мачта падає.</p><p data-lang=\"ua\"><strong>Перевірка такелажу перед виходом, щоразу.</strong> Пройдіть по палубі й огляньте:</p><ul><li data-lang=\"ua\">Кожну <strong>ванту, форштаг і ахтерштаг</strong> — чи є обірвані дротини («риболовні гачки»)? Іржа? Одна обірвана дротина — попередження, що весь трос близький до руйнування.</li><li data-lang=\"ua\">Кожен
