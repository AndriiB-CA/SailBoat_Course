 the other, you are exactly on the line between them. <strong>A transit is more accurate than any compass bearing</strong> because it involves no instrument and no error.</p><p>Transits are wonderfully practical:</p><ul><li><strong>To stay in a channel:</strong> find a transit along the channel line and steer to keep it aligned.</li><li><strong>To check if you're dragging anchor:</strong> pick any two objects in transit abeam. If they separate, you're moving. This is the best anchor-watch method there is, and it costs nothing.</li><li><strong>To clear a hazard:</strong> a <strong>clearing bearing</strong> — \"as long as the church steeple stays left of the water tower, I am clear of the shoal.\"</li></ul><h4>4. Dead reckoning (DR)</h4><p>Calculating where you must be from your last known position, plus your course steered, speed, and time elapsed — then correcting for <strong>leeway</strong> (sideways slip from wind, typically 3–8° on a sailboat) and <strong>set and drift</strong> (current).</p><p>DR is what keeps you alive when everything else fails, especially in fog. It requires discipline: log your course and speed regularly, and update your DR position on the chart every 15–30 minutes. In Halifax fog this is not academic; it is the actual technique.</p><p data-lang=\"en\"><strong>Depth as a navigation tool.</strong> Your <strong>depth sounder is a position instrument</strong>, not just a grounding alarm. If the chart says you should be in 12 m and you're in 6 m, your position is wrong — right now, before you find out the hard way. Cross-checking depth against the chart continuously is one of the strongest habits a coastal sailor can build, and it's especially valuable on a coast as steep-to and rocky as Nova Scotia's.</p><p data-lang=\"ua\">Чотири методи, від найнадійнішого до найменш — і ви мусите вміти всі чотири.</p><h4>1. GPS</h4><p data-lang=\"ua\">Точність кілька метрів і без жодних зусиль. <strong>Його слабкість — повна залежність від живлення й обладнання.</strong> Записуйте своє місце в журнал щогодини на переході — сама ця звичка перетворює відмову GPS з аварії на незручність.</p><h4 data-lang=\"ua\">2. Візуальні пеленги — трипеленговий фікс</h4><p data-lang=\"ua\">Класика. Візьміть компасні пеленги на <strong>три</strong> розпізнавані об'єкти з карти, приблизно під 60° один від одного, прокладіть кожен лінією на карті — ваше місце там, де вони перетинаються.</p><ul><li data-lang=\"ua\">Три лінії утворять малий трикутник — <strong>«трикутник похибки»</strong>. Ваше місце всередині.</li><li data-lang=\"ua\"><strong>Припускайте, що ви в тому куті трикутника, який найближче до небезпеки.</strong> Це завжди розсудливе припущення.</li><li data-lang=\"ua\">Використовуйте <strong>ручний пеленгаторний компас</strong> — найкорисніший навігаційний прилад після карти.</li></ul><h4 data-lang=\"ua\">3. Створи — найточніше і безкоштовно</h4><p data-lang=\"ua\">Коли два нерухомі об'єкти з карти вирівнюються один за одним, ви точно на лінії між ними. <strong>Створ точніший за будь-який компасний пеленг</strong>, бо не задіює приладу і не має похибки.</p><ul><li data-lang=\"ua\"><strong>Щоб триматися в каналі:</strong> знайдіть створ по лінії каналу і керуйте, тримаючи його вирівняним.</li><li data-lang=\"ua\"><strong>Щоб перевірити, чи не дрейфуєте на якорі:</strong> візьміть будь-які два об'єкти в створі на траверзі. Якщо вони розійшлися — ви рухаєтесь. Це найкращий метод якірної вахти, і він безкоштовний.</li><li data-lang=\"ua\"><strong>Щоб обійти небезпеку:</strong> <strong>очищаючий пеленг</strong> — «поки шпиль церкви залишається лівіше водонапірної башти, я чистий від мілини».</li></ul><h4>4. Прокладка шляху (dead reckoning, DR)</h4><p data-lang=\"ua\">Розрахунок місця від останнього відомого, плюс курс, швидкість і час, з поправкою на <strong>дрейф від вітру (leeway)</strong> (зазвичай 3–8° на вітрильнику) і <strong>течію</strong>.</p><p data-lang=\"ua\">DR — це те, що зберігає вам життя, коли все інше відмовило, особливо в тумані. Вимагає дисципліни: регулярно записуйте курс і швидкість, оновлюйте DR-місце на карті кожні 15–30 хвилин.</p><p data-lang=\"ua\"><strong>Глибина як навігаційний інструмент.</strong> Ваш <strong>ехолот — це прилад визначення місця</strong>, а не лише сигналізація мілини. Якщо карта каже, що ви маєте бути на 12 м, а ви на 6 м — ваше місце визначено неправильно, і ви це знаєте <em>зараз</em>, а не коли з'ясуєте важким шляхом.</p><hr><h3><span data-lang=\"en\">10.5 Passage planning</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Планування переходу</span></h3><p data-lang=\"en\">Even a three-hour day sail deserves a plan. For anything longer it's mandatory, and it's an examined skill at Intermediate Cruising.</p><p data-lang=\"en\"><strong>The steps:</strong></p><ol><li data-lang=\"en\"><strong>Define the trip.</strong> Where from, where to, and why. What's the objective?</li><li data-lang=\"en\"><strong>Study the charts.</strong> Identify every hazard on or near your route: rocks, shoals, wrecks, cables, restricted areas, and areas of heavy traffic.</li><li data-lang=\"en\"><strong>Plan the route as a series of legs</strong>, each with a course and a distance. Keep legs clear of hazards by a real margin — not \"just past the rock\". Note a <strong>clearing bearing</strong> or transit for each hazard.</li><li data-lang=\"en\"><strong>Calculate the timing.</strong> Distance ÷ realistic boat speed. <strong>Be pessimistic:</strong> a 30-foot cruising boat averages 4–5 knots, not its 7-knot hull speed, and if you're beating upwind your progress over the ground may be 3 knots. Add time for tacking, for the manoeuvre at the end, and for things going wrong.</li><li data-lang=\"en\"><strong>Check tides</strong> for depth at the shallowest point at the time you'll be there, and for current in any constriction.</li><li data-lang=\"en\"><strong>Check the weather</strong> for the whole window, not just the start. What's the wind at the end of the day, when you're tired and heading home?</li><li data-lang=\"en\"><strong>Identify boltholes</strong> — safe harbours you could divert to along the route if conditions deteriorate or someone gets hurt. <strong>A passage without an escape plan is not a plan.</strong> Know the entrance to each, and whether you can enter in the dark or in a blow.</li><li data-lang=\"en\"><strong>Note the aids to navigation</strong> you expect to see and when, so you can confirm your progress.</li><li data-lang=\"en\"><strong>Plan the arrival.</strong> Where exactly will you tie up or anchor? Is there room? Is it sheltered from the forecast wind direction? Do you need to call ahead?</li><li data-lang=\"en\"><strong>File the plan ashore.</strong> Route, ETA, crew list, boat description, and what to do if you don't check in.</li><li data-lang=\"en\"><strong>Brief the crew</strong> on the plan, the boltholes, and their jobs.</li></ol><p data-lang=\"en\"><strong>For a Halifax beginner, a good progression of day trips:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>#</th><th>Trip</th><th>Roughly</th><th>Introduces</th></tr></thead><tbody><tr><td>1</td><td>Around the Northwest Arm</td><td>2 h</td><td>Basic handling, sheltered water</td></tr><tr><td>2</td><td>Arm → outer harbour → back</td><td>3 h</td><td>Traffic awareness, more wind</td></tr><tr><td>3</td><td>Across to McNabs Island and back</td><td>4 h</td><td>Crossing a shipping channel, an anchorage</td></tr><tr><td>4</td><td>Out to Chebucto Head and back</td><td>5–6 h</td><td><strong>First ocean swell</strong>, real navigation</td></tr><tr><td>5</td><td>Halifax → St. Margaret's Bay</td><td>Full day</td><td>First coastal passage, headland effects</td></tr><tr><td>6</td><td>Halifax → Chester (overnight)</td><td>2 days</td><td>Overnight, anchoring, provisioning</td></tr><tr><td>7</td><td>Chester → Mahone Bay → Lunenburg</td><td>3–5 days</td><td>Real cruising. The good stuff.</td></tr></tbody></table></div><p data-lang=\"ua\">Навіть тригодинний денний вихід заслуговує на план. Для чогось довшого це обов'язково, і це екзаменований навик на Intermediate Cruising.</p><p data-lang=\"ua\"><strong>Кроки:</strong> визначте похід → вивчіть карти → сплануйте маршрут як послідовність відрізків з курсами й відстанями і реальним запасом від небезпек → розрахуйте час (<strong>будьте песимістами:</strong> 30-футовий круїзер робить у середньому 4–5 вузлів, а на лавіруванні прогрес по дну може бути 3 вузли) → перевірте припливи → перевірте погоду на весь період → визначте <strong>порти-укриття</strong> (перехід без плану відходу — це не план) → відзначте навігаційні знаки → сплануйте прибуття → залиште план на берегі → проінструктуйте екіпаж.</p><hr><h3><span data-lang=\"en\">10.6 Instruments</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Прилади</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Instrument</th><th>What it tells you</th><th>Why it matters</th></tr></thead><tbody><tr><td><strong>Depth sounder</strong></td><td>Water depth under the boat (check whether it reads from the keel or the transducer!)</td><td>Grounding avoidance <em>and</em> position confirmation</td></tr><tr><td><strong>Log / speedometer</strong></td><td>Speed through the water</td><td>Needed for dead reckoning; differs from GPS speed by the current</td></tr><tr><td><strong>GPS / chartplotter</strong></td><td>Position, speed over ground, course over ground</td><td>Primary navigation</td></tr><tr><td><strong>Compass (steering)</strong></td><td>Heading</td><td>The one instrument that never fails</td></tr><tr><td><strong>Hand-bearing compass</strong></td><td>Bearings to objects</td><td>Fixes, collision assessment, clearing bearings</td></tr><tr><td><strong>Wind instruments</strong></td><td>Apparent wind speed and angle</td><td>Trim and safety</td></tr><tr><td><strong>AIS</strong></td><td>Identity, position, course, speed of AIS-equipped vessels — and a transponder makes <em>you</em> visible to ships</td><td><strong>Extremely valuable in Halifax.</strong> Commercial traffic all transmits AIS. A receiver tells you what that ship is doing; a transponder puts you on their screen.</td></tr><tr><td><strong>Radar</strong></td><td>Returns from objects, in fog and darkness</td><td>The fog tool. Requires real training to interpret.</td></tr><tr><td><strong>Barometer</strong></td><td>Air pressure and, crucially, its rate of change</td><td>Weather trend</td></tr></tbody></table></div><p data-lang=\"en\"><strong>If you buy one electronic upgrade for sailing in Halifax, buy AIS.</strong> A receiver tells you the name, course, speed and closest approach of every commercial vessel around you — which addresses your single biggest local risk directly. A transponder (Class B) additionally makes you visible on the bridge of every ship and to Halifax Traffic. Given the fog and the shipping density here, that is better value than almost anything else you could add.</p><p data-lang=\"ua\"><strong>Якщо ви купуєте одне електронне вдосконалення для плавання в Галіфаксі — купуйте AIS.</strong> Приймач каже вам назву, курс, швидкість і найближчу точку підходу кожного комерційного судна навколо — а це прямо адресує ваш найбільший місцевий риск. Транспондер (Class B) додатково робить вас видимими на мосту кожного судна і для Halifax Traffic. З огляду на туман і щільність судноплавства тут, це вигідніше майже за будь-що інше.</p><hr><h3><span data-lang=\"en\">10.7 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>What organisation publishes Canadian charts?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which chart numbers cover Halifax Harbour and its approaches, and why must you verify them?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is chart datum, and how do you get actual depth from a charted depth?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does an underlined depth number mean?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why does seabed type matter, and which types hold an anchor?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Define variation and deviation. What is variation in Nova Scotia, roughly?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Convert 090° True to a compass course with 18° W variation and 2° E deviation.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>State both conversion mnemonics.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is Halifax's approximate tidal range, and where in the harbour does current matter most?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>State the rule of twelfths.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Describe a three-point fix. What is a cocked hat, and where do you assume you are within it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a transit more accurate than a compass bearing?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you use a transit to check for anchor dragging?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is dead reckoning, and what two corrections does it need?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How can a depth sounder tell you your position is wrong?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the eleven steps of a passage plan.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is a bolthole, and why must every passage have one?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is AIS especially valuable in Halifax?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка організація видає канадські карти?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які номери карт охоплюють гавань Галіфаксу та підходи і чому їх треба перевірити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке датум карти і як отримати фактичну глибину з картної?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає підкреслене число глибини?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому тип дна має значення і які типи тримають якір?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Визначте variation і deviation. Яке variation у Новій Шотландії приблизно?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Переведіть 090° істинних у компасний курс при variation 18° W і deviation 2° E.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть обидві мнемоніки переведення.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка приблизна амплітуда припливу в Галіфаксі і де в гавані течія має найбільше значення?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте правило дванадцятих.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Опишіть трипеленговий фікс. Що таке трикутник похибки і де в ньому ви себе припускаєте?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому створ точніший за компасний пеленг?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як за допомогою створу перевірити, чи не дрейфує якір?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке dead reckoning і які дві поправки йому потрібні?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як ехолот може сказати вам, що ваше місце визначено неправильно?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть одинадцять кроків плану переходу.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке порт-укриття і чому кожен перехід мусить його мати?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому AIS особливо цінний у Галіфаксі?</span></label></li></ul><hr>"}, "m11": {"t_en": "11 · VHF radio & ROC(M)", "t_ua": "VHF-радіо", "html": "<h2>Module 11 — VHF Radio &amp; the ROC(M)</h2><h2 data-lang=\"ua\">Модуль 11 — VHF-радіо та сертифікат ROC(M)</h2><p><strong>Study time / Час: ~3 hours</strong> · <strong>Leads to the ROC(M) certificate</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">A marine VHF radio is how you call for help, and it is dramatically better than a mobile phone for that purpose: a VHF distress call is heard by the Coast Guard <strong>and by every vessel within range simultaneously</strong> — and the nearest vessel is usually your fastest rescue. Learn to use it properly. And note the legal requirement: <strong>in Canada you need a Restricted Operator Certificate (Maritime), the ROC(M), to transmit on a marine VHF radio.</strong></p><p data-lang=\"ua\">Морська VHF-станція — це те, чим ви кличете допомогу, і для цього вона значно краща за мобільний телефон: сигнал біди по VHF чують Coast Guard <strong>і всі судна в радіусі одночасно</strong> — а найближче судно зазвичай і є вашим найшвидшим порятунком. Навчіться користуватися нею як слід. І зауважте юридичну вимогу: <strong>у Канаді для передачі по морській VHF потрібен Restricted Operator Certificate (Maritime), ROC(M).</strong></p></blockquote><hr><h3><span data-lang=\"en\">11.1 The ROC(M) certificate</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сертифікат ROC(M)</span></h3><p data-lang=\"en\"></p><div class=\"table-wrap\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>What it is</strong></td><td>The Canadian certificate authorising you to operate a marine radiotelephone</td></tr><tr><td><strong>Who requires it</strong></td><td>ISED Canada (Innovation, Science and Economic Development). Examination and administration are delegated to <strong>CPS‑ECP (Canadian Power and Sail Squadrons)</strong></td></tr><tr><td><strong>Who needs one</strong></td><td><strong>Every person who transmits</strong> on a marine VHF. Not one per boat — one per operator.</td></tr><tr><td><strong>How to get it</strong></td><td>Course + exam through CPS‑ECP or an affiliated instructor/examiner. The exam has a written multiple-choice component plus a practical component.</td></tr><tr><td><strong>Time</strong></td><td>Typically 8–12 hours of study</td></tr><tr><td><strong>Cost</strong></td><td>Roughly $75–150 CAD</td></tr><tr><td><strong>Validity</strong></td><td><strong>For life.</strong> No renewal.</td></tr><tr><td><strong>When to do it</strong></td><td><strong>Winter.</strong> It's a classroom course, and Halifax winters are exactly what it's for.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Important legal note on emergencies:</strong> the certificate requirement is for <em>operating</em> the radio. In a genuine emergency, <strong>anyone may use a radio to call for help</strong> — there is no rule that says an uncertified person must watch a boat sink in silence. Which is exactly why <strong>every person aboard should know how to send a MAYDAY</strong>, certified or not. Brief your crew and tape a MAYDAY card next to the radio.</p><p data-lang=\"ua\"></p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th></th><th></th></tr></thead><tbody><tr><td><strong>Що це</strong></td><td>Канадський сертифікат, що дає право працювати на морському радіотелефоні</td></tr><tr><td><strong>Хто вимагає</strong></td><td>ISED Canada. Екзаменування та адміністрування делеговані <strong>CPS‑ECP (Canadian Power and Sail Squadrons)</strong></td></tr><tr><td><strong>Кому потрібен</strong></td><td><strong>Кожній людині, яка передає</strong> по морській VHF. Не один на судно — один на оператора.</td></tr><tr><td><strong>Як отримати</strong></td><td>Курс + екзамен через CPS‑ECP або асоційованого інструктора/екзаменатора. Екзамен має письмову частину з вибором відповіді плюс практичну.</td></tr><tr><td><strong>Час</strong></td><td>Зазвичай 8–12 годин навчання</td></tr><tr><td><strong>Вартість</strong></td><td>Приблизно $75–150 CAD</td></tr><tr><td><strong>Дійсність</strong></td><td><strong>Пожиттєво.</strong> Без поновлення.</td></tr><tr><td><strong>Коли робити</strong></td><td><strong>Зимою.</strong> Це аудиторний курс, і зими Галіфаксу саме для цього.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Важливе юридичне зауваження про аварійні ситуації:</strong> вимога сертифіката стосується <em>роботи</em> на радіо. У справжній аварійній ситуації <strong>будь-хто може використати радіо, щоб покликати допомогу</strong> — немає правила, що несертифікована людина мусить мовчки дивитись, як судно тоне. Саме тому <strong>кожна людина на борту мусить знати, як передати MAYDAY</strong>, сертифікована чи ні. Проінструктуйте екіпаж і приклейте картку MAYDAY біля станції.</p><hr><h3><span data-lang=\"en\">11.2 How VHF works</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Як працює VHF</span></h3><p data-lang=\"en\">Marine VHF is <strong>line of sight</strong>. Range depends almost entirely on antenna height, not on transmitter power.</p><div class=\"table-wrap\"><table><thead><tr><th>Setup</th><th>Typical range</th></tr></thead><tbody><tr><td>Handheld (5 W, held at chest height)</td><td>5–8 km</td></tr><tr><td>Fixed set with masthead antenna (25 W)</td><td>30–40 km, more to a shore station or a ship's tall antenna</td></tr><tr><td>To a Coast Guard shore station on a high site</td><td>Often much further</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Key properties:</strong></p><ul><li data-lang=\"en\"><strong>It's a shared party line, not a phone.</strong> Everyone on that channel hears you. Only one station can talk at a time — if two transmit simultaneously, both are garbled.</li><li data-lang=\"en\"><strong>Push to talk, release to listen.</strong> You cannot do both. Say your piece, then release.</li><li data-lang=\"en\"><strong>Simplex vs duplex:</strong> most channels are simplex (both stations use the same frequency, take turns). Some are duplex (different transmit/receive frequencies).</li><li data-lang=\"en\"><strong>Power setting:</strong> use <strong>1 W (low)</strong> for nearby conversations to avoid blocking distant users. Use <strong>25 W (high)</strong> for distress, for distance, or when you need to be heard.</li><li data-lang=\"en\"><strong>The mast-top antenna is your range</strong>, and its weakness is that a dismasting removes it. This is a strong argument for also carrying a <strong>handheld VHF as a backup</strong> — ideally a floating, waterproof one, kept in your grab bag.</li></ul><p data-lang=\"ua\">Морська VHF працює в <strong>межах прямої видимості</strong>. Дальність залежить майже виключно від висоти антени, а не від потужності передавача.</p><p data-lang=\"ua\"><strong>Ключові властивості:</strong></p><ul><li data-lang=\"ua\"><strong>Це спільна лінія, а не телефон.</strong> Усі на каналі вас чують. Говорити може лише одна станція за раз.</li><li data-lang=\"ua\"><strong>Натисни, щоб говорити; відпусти, щоб слухати.</strong> Обидва одночасно неможливо.</li><li data-lang=\"ua\"><strong>Потужність:</strong> використовуйте <strong>1 Вт (низьку)</strong> для близьких розмов, щоб не блокувати далеких користувачів. <strong>25 Вт (високу)</strong> — для сигналу біди, для дальності, або коли вас треба почути.</li><li data-lang=\"ua\"><strong>Антена на топі мачти — це ваша дальність</strong>, і її слабкість у тому, що втрата мачти її забирає. Це сильний аргумент, щоб мати ще й <strong>портативну VHF як резерв</strong> — краще плавучу і водонепроникну, у вашій «аварійній сумці».</li></ul><hr><h3><span data-lang=\"en\">11.3 Channels</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Канали</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Channel</th><th>Use</th></tr></thead><tbody><tr><td><strong>16</strong></td><td><strong>DISTRESS, SAFETY AND CALLING.</strong> 156.800 MHz. <strong>Monitor it at all times</strong> when your radio is on. Never use it for conversation.</td></tr><tr><td><strong>70</strong></td><td><strong>DSC (Digital Selective Calling) — data only. Never speak on 70.</strong></td></tr><tr><td><strong>06</strong></td><td>Ship-to-ship safety, and search-and-rescue coordination with aircraft</td></tr><tr><td><strong>09, 68, 69, 71, 72, 73</strong></td><td>Intership and recreational working channels — the channels you'll actually chat on. <strong>Which are available and how they're used varies by area; confirm locally.</strong></td></tr><tr><td><strong>13</strong></td><td>Bridge-to-bridge navigation safety</td></tr><tr><td><strong>21B (WX8), 83B (WX9)</strong></td><td><strong>Continuous Marine Broadcast</strong> — Coast Guard weather and Notices to Shipping</td></tr><tr><td><strong>WX1–WX7</strong></td><td>Weatheradio Canada</td></tr><tr><td><strong>VTS working channels</strong></td><td><strong>In Halifax, vessel traffic is commonly worked on Ch 12 and Ch 14</strong> — verify current assignments locally. Listening here tells you what commercial traffic is doing.</td></tr><tr><td><strong>22A</strong></td><td>Commonly used for Coast Guard liaison in North America</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Practical channel discipline:</strong></p><ul><li data-lang=\"en\"><strong>Channel 16 is for three things only:</strong> distress, urgency and safety traffic; initial calling to establish contact; and listening. Establish contact on 16, then <strong>immediately switch to a working channel</strong> for the actual conversation.</li><li data-lang=\"en\"><strong>Monitor 16 whenever you're underway.</strong> Most sets have dual-watch or tri-watch to monitor 16 plus a working channel.</li><li data-lang=\"en\"><strong>In Halifax, also monitor the VTS channel.</strong> Hearing \"outbound container vessel departing berth 41, proceeding to sea\" is precisely the information that prevents your worst-case day.</li><li data-lang=\"en\"><strong>Never transmit on Ch 70.</strong> It's a data channel for DSC. Voice on 70 blocks digital distress alerts.</li></ul><p data-lang=\"ua\"><strong>Практична дисципліна каналів:</strong></p><ul><li data-lang=\"ua\"><strong>Канал 16 лише для трьох речей:</strong> сигнали біди, терміновості й безпеки; початковий виклик для встановлення зв'язку; і прослуховування. Встановіть контакт на 16, потім <strong>негайно перейдіть на робочий канал</strong>.</li><li data-lang=\"ua\"><strong>Слухайте 16 завжди, коли ви в дорозі.</strong></li><li data-lang=\"ua\"><strong>У Галіфаксі слухайте також канал VTS.</strong> Почути «вихідний контейнеровоз відходить від причалу 41, йде в море» — це саме та інформація, яка запобігає вашому найгіршому дню.</li><li data-lang=\"ua\"><strong>Ніколи не передавайте на каналі 70.</strong> Це канал даних для DSC. Голос на 70 блокує цифрові сигнали біди.</li></ul><hr><h3><span data-lang=\"en\">11.4 Routine calling procedure</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Процедура звичайного виклику</span></h3><p data-lang=\"en\">There is a standard format. Use it; it makes you understood and marks you as competent.</p><p data-lang=\"en\"><strong>Making a call:</strong></p><div class=\"pre-wrap\"><pre>\"SEA BREEZE, SEA BREEZE, this is WINDWALKER, WINDWALKER, over.\"\n (name of station you're calling, twice)   (your name, twice)</pre></div><p data-lang=\"en\"><strong>They reply:</strong></p><div class=\"pre-wrap\"><pre>\"WINDWALKER, this is SEA BREEZE. Channel 68, over.\"</pre></div><p data-lang=\"en\"><strong>You confirm and switch:</strong></p><div class=\"pre-wrap\"><pre>\"SEA BREEZE, this is WINDWALKER. Channel 68, out.\"</pre></div><p data-lang=\"en\">Then both switch to 68 and have the conversation.</p><p data-lang=\"en\"><strong>Procedure words — use them exactly:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Word</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>OVER</strong></td><td>\"I have finished speaking, <strong>I expect you to reply.</strong>\"</td></tr><tr><td><strong>OUT</strong></td><td>\"I have finished speaking, <strong>this conversation is over.</strong>\" Never say \"over and out\" — it's contradictory, and it's the giveaway of someone who learned radio from films.</td></tr><tr><td><strong>ROGER</strong></td><td>\"I have received and understood your message.\" Not \"yes.\"</td></tr><tr><td><strong>AFFIRMATIVE / NEGATIVE</strong></td><td>Yes / No</td></tr><tr><td><strong>WILCO</strong></td><td>\"I understand and I <strong>will comply</strong>.\"</td></tr><tr><td><strong>STANDBY</strong></td><td>\"Wait, I'll come back to you.\"</td></tr><tr><td><strong>SAY AGAIN</strong></td><td>\"Repeat your message.\" <strong>Never say \"repeat\"</strong> — in some services \"repeat\" means something else entirely.</td></tr><tr><td><strong>I SAY AGAIN</strong></td><td>\"I am repeating what I just said.\"</td></tr><tr><td><strong>SPELL / I SPELL</strong></td><td>\"I will spell that phonetically.\"</td></tr><tr><td><strong>CORRECTION</strong></td><td>\"I made an error; the correct version follows.\"</td></tr><tr><td><strong>THIS IS</strong></td><td>Identifies you as the transmitting station.</td></tr><tr><td><strong>RADIO CHECK</strong></td><td>Request for a signal report. <strong>Do this on a working channel, not 16.</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The NATO phonetic alphabet — you must know this.</strong> You will spell your boat's name constantly, and you need it under stress.</p><div class=\"table-wrap\"><table><thead><tr><th>A Alfa</th><th>B Bravo</th><th>C Charlie</th><th>D Delta</th><th>E Echo</th><th>F Foxtrot</th><th>G Golf</th></tr></thead><tbody><tr><td>H Hotel</td><td>I India</td><td>J Juliett</td><td>K Kilo</td><td>L Lima</td><td>M Mike</td><td>N November</td></tr><tr><td>O Oscar</td><td>P Papa</td><td>Q Quebec</td><td>R Romeo</td><td>S Sierra</td><td>T Tango</td><td>U Uniform</td></tr><tr><td>V Victor</td><td>W Whiskey</td><td>X X-ray</td><td>Y Yankee</td><td>Z Zulu</td><td></td><td></td></tr></tbody></table></div><p data-lang=\"en\">Numbers are spoken digit by digit: <strong>\"four four decimal five\"</strong>, not \"forty-four point five\".</p><p data-lang=\"ua\">Є стандартний формат. Використовуйте його; він робить вас зрозумілим і позначає як компетентного.</p><p data-lang=\"ua\"><strong>Процедурні слова — використовуйте точно:</strong></p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Слово</th><th>Значення</th></tr></thead><tbody><tr><td><strong>OVER</strong></td><td>«Я закінчив говорити, <strong>чекаю вашої відповіді.</strong>»</td></tr><tr><td><strong>OUT</strong></td><td>«Я закінчив, <strong>розмова завершена.</strong>» Ніколи не кажіть «over and out» — це суперечність і видає людину, яка вчила радіо з фільмів.</td></tr><tr><td><strong>ROGER</strong></td><td>«Прийнято і зрозуміло.» Не «так».</td></tr><tr><td><strong>SAY AGAIN</strong></td><td>«Повторіть.» <strong>Ніколи не кажіть «repeat»</strong> — у деяких службах це має інше значення.</td></tr><tr><td><strong>STANDBY</strong></td><td>«Чекайте, я повернусь до вас.»</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Фонетичний алфавіт НАТО треба знати.</strong> Ви будете постійно диктувати назву свого судна, і вам це потрібно під стресом. Числа вимовляються по цифрах.</p><hr><h3><span data-lang=\"en\">11.5 Distress: MAYDAY</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Сигнал біди: MAYDAY</span></h3><p data-lang=\"en\"><strong>Print this section and tape it next to your radio.</strong> Then make sure every person who ever sails with you has read it.</p><h4>The three levels of priority</h4><div class=\"table-wrap\"><table><thead><tr><th>Call</th><th>When</th><th>Meaning</th></tr></thead><tbody><tr><td><strong>MAYDAY</strong></td><td><strong>Grave and imminent danger</strong> to a vessel or person, requiring immediate assistance</td><td>Sinking, fire, someone overboard and not recovered, serious medical emergency, dismasting in dangerous conditions</td></tr><tr><td><strong>PAN PAN</strong> (pronounced \"pahn pahn\")</td><td><strong>Urgency</strong> — you have a serious problem but are not in grave and imminent danger</td><td>Engine failure drifting towards rocks, injury that needs advice, lost and disoriented in fog, gear failure you may not resolve</td></tr><tr><td><strong>SÉCURITÉ</strong> (pronounced \"say-cure-ee-tay\")</td><td><strong>Safety</strong> information</td><td>Navigational warning, a hazard you've spotted, a floating container, weather warning</td></tr></tbody></table></div><h4>The MAYDAY format — memorise the structure</h4><div class=\"pre-wrap\"><pre>Switch to Channel 16, HIGH POWER. Then:\n\n  \"MAYDAY, MAYDAY, MAYDAY\"\n\n  \"THIS IS  [boat name], [boat name], [boat name]\"\n\n  \"MAYDAY  [boat name]\"\n\n  \"MY POSITION IS  [latitude and longitude, OR a bearing and\n                     distance from a known landmark]\"\n\n  \"[NATURE OF DISTRESS — e.g. 'WE ARE TAKING ON WATER AND SINKING']\"\n\n  \"[ASSISTANCE REQUIRED — e.g. 'WE REQUIRE IMMEDIATE ASSISTANCE']\"\n\n  \"[NUMBER OF PERSONS ON BOARD — e.g. 'FOUR PERSONS ON BOARD']\"\n\n  \"[ANY OTHER INFORMATION — description of the boat, whether you're\n    abandoning to a liferaft, injuries, what colour your hull is]\"\n\n  \"OVER\"</pre></div><p><strong>Then release the transmit button and listen.</strong> Do not keep talking. If nobody answers within about 30 seconds, repeat the whole call.</p><p data-lang=\"en\"><strong>The critical points:</strong></p><ul><li data-lang=\"en\"><strong>Position first, always.</strong> If you can only say one thing before the radio dies, say where you are. Rescue services can find a boat whose problem they don't know; they cannot find a boat whose position they don't know.</li><li data-lang=\"en\"><strong>If you have a DSC radio, press the distress button first</strong> (lift the cover, hold it down for the required few seconds), <em>then</em> make the voice call. DSC transmits your identity and your GPS position digitally and automatically, to the Coast Guard and every DSC-equipped vessel in range. It is faster and more accurate than anything you can say. <strong>For DSC to send a position, the radio must have a GPS feed and must be programmed with your MMSI number — check both are done before you need them.</strong></li><li data-lang=\"en\"><strong>Speak slowly and clearly.</strong> Everyone rushes. Deliberately slow down; a garbled position is worse than a slow one.</li><li data-lang=\"en\"><strong>You may relay someone else's distress.</strong> If you hear a MAYDAY and the Coast Guard doesn't respond but you can reach them, transmit <strong>\"MAYDAY RELAY\"</strong> and pass on what you heard.</li><li data-lang=\"en\"><strong>Never hesitate to call.</strong> There is no penalty for a MAYDAY made in good faith that turns out to be less serious than you thought. Rescue services would vastly rather come out unnecessarily than arrive too late. Hesitation kills people; embarrassment does not.</li><li data-lang=\"en\"><strong>Cancel it if resolved.</strong> If you sort the problem out, transmit a cancellation on 16 so the search is stood down.</li></ul><p data-lang=\"en\"><strong>In Halifax</strong>, your MAYDAY is heard by <strong>MCTS / Canadian Coast Guard</strong> and by all shipping, ferries, tugs, and pleasure craft in range — which in a busy harbour is a lot of potential help very close by.</p><p data-lang=\"ua\"><strong>Розпечатайте цей розділ і приклейте біля станції.</strong> Потім переконайтесь, що кожен, хто коли-небудь виходить з вами, його прочитав.</p><h4 data-lang=\"ua\">Три рівні пріоритету</h4><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Виклик</th><th>Коли</th><th>Значення</th></tr></thead><tbody><tr><td><strong>MAYDAY</strong></td><td><strong>Серйозна і безпосередня небезпека</strong> для судна або людини, потрібна негайна допомога</td><td>Затоплення, пожежа, людина за бортом і не піднята, серйозна медична аварія</td></tr><tr><td><strong>PAN PAN</strong></td><td><strong>Терміновість</strong> — у вас серйозна проблема, але не безпосередня загроза життю</td><td>Відмова двигуна з дрейфом на камені, травма, що потребує консультації, втрата орієнтації в тумані</td></tr><tr><td><strong>SÉCURITÉ</strong></td><td>Інформація про <strong>безпеку</strong></td><td>Навігаційне попередження, помічена небезпека, плавучий контейнер</td></tr></tbody></table></div><h4>Формат MAYDAY</h4><div class=\"pre-wrap\"><pre>Перейдіть на канал 16, ВИСОКА ПОТУЖНІСТЬ. Потім:\n\n  «MAYDAY, MAYDAY, MAYDAY»\n  «THIS IS  [назва судна × 3]»\n  «MAYDAY  [назва судна]»\n  «MY POSITION IS  [широта і довгота АБО пеленг і відстань від відомого орієнтира]»\n  «[ХАРАКТЕР БІДИ]»\n  «[ЯКА ДОПОМОГА ПОТРІБНА]»\n  «[КІЛЬКІСТЬ ЛЮДЕЙ НА БОРТУ]»\n  «[ІНША ІНФОРМАЦІЯ — опис судна, чи переходите на пліт, травми, колір корпусу]»\n  «OVER»</pre></div><p data-lang=\"ua\"><strong>Потім відпустіть кнопку і слухайте.</strong> Не продовжуйте говорити. Якщо ніхто не відповів приблизно за 30 секунд — повторіть весь виклик.</p><p data-lang=\"ua\"><strong>Критичні моменти:</strong></p><ul><li data-lang=\"ua\"><strong>Спочатку завжди позиція.</strong> Якщо ви можете сказати лише одне, перш ніж станція вимкнеться — скажіть, де ви. Рятувальні служби знайдуть судно, чиєї проблеми вони не знають; вони не знайдуть судно, чиєї позиції не знають.</li><li data-lang=\"ua\"><strong>Якщо у вас DSC-станція, спочатку натисніть кнопку біди</strong> (підніміть кришку, тримайте потрібні кілька секунд), <em>потім</em> робіть голосовий виклик. DSC передає вашу ідентифікацію і GPS-позицію цифрово й автоматично. <strong>Щоб DSC передавав позицію, станція мусить мати підключений GPS і бути запрограмована вашим номером MMSI — перевірте обидва до того, як знадобиться.</strong></li><li data-lang=\"ua\"><strong>Говоріть повільно і чітко.</strong> Усі спішать. Свідомо сповільніться.</li><li data-lang=\"ua\"><strong>Ви можете передати чужий сигнал біди.</strong> Якщо ви чуєте MAYDAY, а Coast Guard не відповідає, але ви їх дістаєте — передайте <strong>«MAYDAY RELAY»</strong>.</li><li data-lang=\"ua\"><strong>Ніколи не вагайтеся викликати.</strong> Немає покарання за MAYDAY, зроблений добросовісно, який виявився менш серйозним, ніж ви думали. Рятувальні служби набагато охочіше вийдуть даремно, ніж прибудуть занадто пізно. Вагання вбиває людей; сором ні.</li><li data-lang=\"ua\"><strong>Скасуйте, якщо вирішилось.</strong> Передайте скасування на 16, щоб пошук згорнули.</li></ul><hr><h3><span data-lang=\"en\">11.6 What to have set up before the season</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Що налаштувати до сезону</span></h3><p data-lang=\"en\">Do all of this at the dock, in calm, with time. None of it can be done in an emergency.</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Get your ROC(M).</strong> Winter course.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Obtain an MMSI number</strong> for your radio (a unique nine-digit identity for DSC) and <strong>program it in.</strong> An unprogrammed DSC radio cannot send a proper distress alert.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Connect a GPS feed to the radio</strong>, so DSC transmits your position. Verify it actually shows a position on the display.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Test the radio</strong> on a working channel — ask for a radio check. Not on 16.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Check the antenna connection and cable</strong> for corrosion. This is the most common cause of poor range.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Carry a handheld backup</strong>, waterproof and floating, charged, in your grab bag.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Tape a MAYDAY card next to the radio</strong> with the format and blanks for position.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Brief every crew member</strong> on where the radio is, how to switch it to 16, how to select high power, and how to send a MAYDAY. Actually walk them through it. Do this on every trip with new crew.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Know your local channels</strong> — Ch 16, the Halifax VTS channels, and the CMB weather channel.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Register your vessel details</strong> with your DSC/MMSI registration so rescuers know what they're looking for.</span></label></li></ul><p data-lang=\"ua\">Зробіть усе це на причалі, у спокої, маючи час. Нічого з цього неможливо зробити в аварійній ситуації.</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Отримайте ROC(M).</strong> Зимовий курс.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Отримайте номер MMSI</strong> для станції і <strong>запрограмуйте його.</strong> Незапрограмована DSC-станція не може передати належний сигнал біди.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Підключіть GPS до станції</strong>, щоб DSC передавав вашу позицію. Перевірте, що позиція справді відображається.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Перевірте станцію</strong> на робочому каналі — попросіть radio check. Не на 16.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Перевірте з'єднання антени й кабель</strong> на корозію. Це найпоширеніша причина поганої дальності.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Майте портативний резерв</strong>, водонепроникний і плавучий, заряджений, в аварійній сумці.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Приклейте картку MAYDAY біля станції</strong> з форматом і пропусками для позиції.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Проінструктуйте кожного члена екіпажу</strong>: де станція, як перейти на 16, як вибрати високу потужність, як передати MAYDAY. Реально проведіть їх через це. Робіть це на кожному виході з новим екіпажем.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Знайте свої місцеві канали</strong> — 16, канали VTS Галіфаксу і погодний канал CMB.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span><strong>Зареєструйте дані свого судна</strong> разом з реєстрацією DSC/MMSI, щоб рятувальники знали, що шукають.</span></label></li></ul><hr><h3><span data-lang=\"en\">11.7 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>What certificate do you need to transmit on marine VHF in Canada, and who administers it?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Is a certificate per boat or per person? What about in a genuine emergency?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a VHF better than a mobile phone for calling for help?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What determines VHF range?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What are the only three uses of Channel 16?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What must you never do on Channel 70, and why?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which channels commonly carry Halifax vessel traffic, and why should you listen?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give the routine calling format for contacting another vessel.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Difference between OVER and OUT? Why is \"over and out\" wrong?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why do you say \"SAY AGAIN\" rather than \"repeat\"?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Spell your own name in the NATO phonetic alphabet.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give the difference between MAYDAY, PAN PAN and SÉCURITÉ, with an example of each.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Recite the MAYDAY format from memory.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the single most important piece of information in a MAYDAY?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What two things must be set up for DSC to send your position?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is a MAYDAY RELAY?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Should you hesitate to call MAYDAY if you're unsure how serious it is? Why?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який сертифікат потрібен для передачі по морській VHF у Канаді і хто його адмініструє?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сертифікат на судно чи на людину? А в справжній аварійній ситуації?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому VHF краще за мобільний телефон для виклику допомоги?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що визначає дальність VHF?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які лише три використання каналу 16?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чого ніколи не можна робити на каналі 70 і чому?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які канали зазвичай обслуговують рух суден у Галіфаксі і чому їх слухати?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть формат звичайного виклику іншого судна.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Різниця між OVER і OUT? Чому «over and out» неправильно?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Чому кажуть «SAY AGAIN», а не «repeat»?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Продиктуйте своє ім'я фонетичним алфавітом НАТО.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Різниця між MAYDAY, PAN PAN і SÉCURITÉ, з прикладом кожного.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Відтворіть формат MAYDAY з пам'яті.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка найважливіша інформація в MAYDAY?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Які дві речі мусять бути налаштовані, щоб DSC передавав вашу позицію?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Що таке MAYDAY RELAY?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чи варто вагатися викликати MAYDAY, якщо не впевнені в серйозності? Чому?</span></label></li></ul><hr>"}, "m12": {"t_en": "12 · PCOC exam prep", "t_ua": "Підготовка до PCOC", "html": "<h2>Module 12 — PCOC Exam Preparation</h2><h2 data-lang=\"ua\">Модуль 12 — Підготовка до екзамену PCOC</h2><p><strong>Study time / Час: ~2 hours</strong> · <strong>This is your legal licence. Do it first.</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">The PCOC is the easiest thing in this whole course, and it is the one piece of paper the law actually requires. Most people complete it in a single evening. Do it this week and stop thinking about it.</p><p data-lang=\"ua\">PCOC — найпростіша річ у всьому цьому курсі, і це єдиний документ, який справді вимагає закон. Більшість людей проходить його за один вечір. Зробіть це цього тижня і забудьте про нього.</p></blockquote><hr><h3><span data-lang=\"en\">12.1 What the PCOC is and isn't</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чим є і чим не є PCOC</span></h3><p data-lang=\"en\"></p><p data-lang=\"en\"><strong>What it is:</strong> the <strong>Pleasure Craft Operator Card</strong>, a Transport Canada proof-of-competency card. It certifies that you have passed a boating safety test.</p><p data-lang=\"en\"><strong>Who needs it:</strong> anyone who operates a <strong>motorised pleasure craft</strong> in Canada. This includes:</p><ul><li data-lang=\"en\">A sailboat with an auxiliary engine — <strong>inboard or outboard, and it applies even when the engine is switched off and you're sailing.</strong> The requirement attaches to the vessel being <em>fitted</em> with a motor, not to the motor being in use.</li><li data-lang=\"en\">Any size of boat, any size of engine, including a small dinghy with an electric trolling motor.</li><li data-lang=\"en\">Personal watercraft.</li></ul><p data-lang=\"en\"><strong>What it is not:</strong></p><ul><li data-lang=\"en\"><strong>It is not a sailing qualification.</strong> It contains almost nothing about how to sail. It's a motorboat-oriented safety and regulations test. Passing it does not make you able to handle a sailboat, and it will not satisfy a yacht club, an insurer, or a charter company.</li><li data-lang=\"en\"><strong>It is not a boat licence.</strong> The <strong>Pleasure Craft Licence (PCL)</strong> is the boat's registration — a free number required for engines of 10 hp (7.5 kW) or more, obtained from Transport Canada. Different document, different purpose.</li><li data-lang=\"en\"><strong>It does not expire and needs no renewal.</strong> It's valid for life, in every province and territory.</li></ul><p data-lang=\"en\"><strong>The consequence of not having it:</strong> roughly a <strong>$250 fine</strong> for failing to produce proof of competency on request. And you must carry it aboard — it does you no good in a drawer at home.</p><p data-lang=\"ua\"></p><p data-lang=\"ua\"><strong>Що це:</strong> <strong>Pleasure Craft Operator Card</strong>, картка підтвердження компетентності від Transport Canada.</p><p data-lang=\"ua\"><strong>Кому потрібна:</strong> будь-кому, хто керує <strong>прогулянковим судном з двигуном</strong> у Канаді. Це включає:</p><ul><li data-lang=\"ua\">Вітрильник з допоміжним двигуном — <strong>стаціонарним чи забортним, і це діє навіть коли двигун вимкнений і ви йдете під вітрилами.</strong> Вимога стосується того, що судно <em>оснащене</em> двигуном, а не того, що двигун працює.</li><li data-lang=\"ua\">Судно будь-якого розміру з двигуном будь-якої потужності.</li><li data-lang=\"ua\">Гідроцикли.</li></ul><p data-lang=\"ua\"><strong>Чим це не є:</strong></p><ul><li data-lang=\"ua\"><strong>Це не вітрильна кваліфікація.</strong> Тут майже нічого про те, як ходити під вітрилами. Це тест з безпеки й правил, орієнтований на моторні човни. Складання його не робить вас здатним керувати вітрильником і не задовольнить яхт-клуб, страховика або чартерну компанію.</li><li data-lang=\"ua\"><strong>Це не ліцензія судна.</strong> <strong>Pleasure Craft Licence (PCL)</strong> — це реєстрація судна, безкоштовний номер, обов'язковий для двигунів від 10 к.с. (7,5 кВт).</li><li data-lang=\"ua\"><strong>Не має терміну дії і не потребує поновлення.</strong></li></ul><p data-lang=\"ua\"><strong>Наслідок відсутності:</strong> приблизно <strong>$250 штрафу</strong> за неможливість підтвердити компетентність на вимогу. І її треба мати з собою на борту.</p><hr><h3><span data-lang=\"en\">12.2 How to get it</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Як її отримати</span></h3><p data-lang=\"en\"></p><ol><li data-lang=\"en\"><strong>Choose a Transport Canada accredited provider.</strong> Several offer the whole thing online. Transport Canada publishes the list of accredited providers, and you can also call the Boating Safety Infoline at <strong>1‑800‑267‑6687</strong>. Costs run roughly <strong>$30–70 CAD</strong> depending on the provider; all fees are set by the providers, not the government.</li><li data-lang=\"en\"><strong>Work through the study material.</strong> Transport Canada requires a <strong>minimum of 3 hours of study time</strong>, and the platform will enforce that — you cannot simply skip to the test.</li><li data-lang=\"en\"><strong>Take the test.</strong> Typically about <strong>50 multiple-choice questions</strong>, with a <strong>pass mark around 75%</strong>, taken online and usually open-book with unlimited or generous time. <strong>Confirm the exact format with your provider</strong> — question counts and pass marks vary between accredited providers.</li><li data-lang=\"en\"><strong>Get your card.</strong> Most providers give you a temporary printable certificate immediately and mail the permanent plastic card. <strong>Carry it aboard.</strong></li></ol><p data-lang=\"en\"><strong>Practical tips:</strong></p><ul><li data-lang=\"en\"><strong>You will almost certainly pass.</strong> The test is designed to confirm you absorbed the safety material, not to fail you. Take it seriously enough to actually learn the content — some of it genuinely matters — but don't be anxious about it.</li><li data-lang=\"en\"><strong>Do it before you need it.</strong> Book it tonight. It's the cheapest and fastest item on your entire path, and having it removes any excuse for delay.</li><li data-lang=\"en\"><strong>Read the study material properly anyway.</strong> The equipment requirements and the buoy systems are things you'll use, not trivia.</li></ul><p data-lang=\"ua\"></p><ol><li data-lang=\"ua\"><strong>Виберіть провайдера, акредитованого Transport Canada.</strong> Кілька пропонують усе онлайн. Transport Canada публікує список акредитованих провайдерів; можна також зателефонувати на Boating Safety Infoline <strong>1‑800‑267‑6687</strong>. Вартість приблизно <strong>$30–70 CAD</strong> залежно від провайдера.</li><li data-lang=\"ua\"><strong>Пройдіть навчальний матеріал.</strong> Transport Canada вимагає <strong>мінімум 3 години навчання</strong>, і платформа це проконтролює.</li><li data-lang=\"ua\"><strong>Складіть тест.</strong> Зазвичай близько <strong>50 питань з вибором відповіді</strong>, проходний бал <strong>близько 75%</strong>, онлайн, зазвичай з доступом до матеріалів і щедрим часом. <strong>Уточніть точний формат у свого провайдера.</strong></li><li data-lang=\"ua\"><strong>Отримайте картку.</strong> Більшість провайдерів дає тимчасовий сертифікат для друку відразу і надсилає пластикову картку поштою. <strong>Носіть її на борту.</strong></li></ol><hr><h3><span data-lang=\"en\">12.3 Everything that's on the exam, and where to study it</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Усе, що є на екзамені, і де це вчити</span></h3><p data-lang=\"en\">The PCOC syllabus maps almost exactly onto modules you've already read.</p><div class=\"table-wrap\"><table><thead><tr><th>Exam topic</th><th>Weight</th><th>Where in this course</th></tr></thead><tbody><tr><td><strong>Required safety equipment by vessel size</strong></td><td>High</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.5</a> — <strong>and read TP 511 directly</strong></td></tr><tr><td><strong>Lifejackets and PFDs — types, fit, legal requirement</strong></td><td>High</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.3</a></td></tr><tr><td><strong>Rules of the road / collision regulations</strong></td><td><strong>Highest</strong></td><td><a href=\"#/m07\" data-nav=\"m07\">Module 07</a></td></tr><tr><td><strong>Buoys and navigation markers, incl. Canadian orange system</strong></td><td><strong>Highest</strong></td><td><a href=\"#/m08\" data-nav=\"m08\">Module 08 §8.1–8.2</a></td></tr><tr><td><strong>Navigation lights</strong></td><td>High</td><td><a href=\"#/m08\" data-nav=\"m08\">Module 08 §8.3</a></td></tr><tr><td><strong>Sound signals</strong></td><td>Medium</td><td><a href=\"#/m07\" data-nav=\"m07\">Module 07 §7.6</a></td></tr><tr><td><strong>Distress signals and flares</strong></td><td>Medium</td><td><a href=\"#/m08\" data-nav=\"m08\">Module 08 §8.5</a></td></tr><tr><td><strong>Emergency procedures: MOB, capsize, fire, hypothermia</strong></td><td>High</td><td><a href=\"#/m14\" data-nav=\"m14\">Module 14</a>, <a href=\"#/m01\" data-nav=\"m01\">Module 01</a></td></tr><tr><td><strong>Cold water survival</strong></td><td>Medium</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.2</a></td></tr><tr><td><strong>Legal responsibilities of the operator; duty to assist</strong></td><td>Medium</td><td>This module §12.4</td></tr><tr><td><strong>Alcohol and impaired operation</strong></td><td>Medium</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.7</a></td></tr><tr><td><strong>Age and horsepower restrictions</strong></td><td>Medium</td><td>This module §12.4</td></tr><tr><td><strong>Speed, wake, and nuisance regulations</strong></td><td>Medium</td><td>This module §12.4</td></tr><tr><td><strong>Pollution: oil, sewage, garbage</strong></td><td>Low–Medium</td><td>This module §12.4</td></tr><tr><td><strong>Weather basics</strong></td><td>Medium</td><td><a href=\"#/m09\" data-nav=\"m09\">Module 09</a></td></tr><tr><td><strong>Pre-departure checks and float plans</strong></td><td>Medium</td><td><a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.6</a></td></tr><tr><td><strong>Fuelling and carbon monoxide safety</strong></td><td>Medium</td><td><a href=\"#/m13\" data-nav=\"m13\">Module 13</a></td></tr><tr><td><strong>Towing, water-skiing rules</strong></td><td>Low</td><td>Provider material</td></tr><tr><td><strong>Locks, restricted areas, shipping channels</strong></td><td>Low</td><td><a href=\"#/m07\" data-nav=\"m07\">Module 07 §7.5</a></td></tr></tbody></table></div><p data-lang=\"ua\">Програма PCOC майже точно відповідає модулям, які ви вже прочитали. Найбільша вага — <strong>правила запобігання стиканням</strong> і <strong>буї та навігаційні знаки</strong>.</p><hr><h3><span data-lang=\"en\">12.4 The Canada-specific regulations you must memorise</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Канадські правила, які треба запам'ятати</span></h3><p data-lang=\"en\">These are the items not covered elsewhere in this course, and they are directly examined. <strong>Verify current values against Transport Canada's <em>Safe Boating Guide</em> (TP 511)</strong> — regulations are amended and this is a study aid.</p><h4>Age and horsepower restrictions (operators without direct supervision)</h4><div class=\"table-wrap\"><table><thead><tr><th>Age</th><th>Maximum engine power</th></tr></thead><tbody><tr><td><strong>Under 12</strong></td><td><strong>Up to 10 hp (7.5 kW)</strong></td></tr><tr><td><strong>12 to under 16</strong></td><td><strong>Up to 40 hp (30 kW)</strong></td></tr><tr><td><strong>16 and over</strong></td><td>No power restriction</td></tr><tr><td><strong>Personal watercraft (PWC)</strong></td><td><strong>Nobody under 16 may operate one</strong>, regardless of supervision</td></tr></tbody></table></div><p>\"Without direct supervision\" means without someone 16 or older in the boat with them.</p><h4>Documents to carry aboard</h4><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Your <strong>PCOC</strong> (or other accepted proof of competency)</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>The vessel's <strong>Pleasure Craft Licence</strong> (PCL) number, displayed on the bow — required for engines ≥10 hp / 7.5 kW</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Registration</strong> documents if the vessel is registered rather than licensed</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>ROC(M)</strong> if you operate the VHF</span></label></li></ul><h4>Duty to assist</h4><p data-lang=\"en\">You have a <strong>legal obligation</strong> to assist any person found at sea in danger of being lost, provided you can do so without serious danger to your own vessel and the people aboard. You must also stop and give assistance after any collision. This is not optional and it is examined.</p><h4>Speed, wake and nuisance</h4><ul><li>Obey posted speed limits. Many Canadian waterways have a <strong>default limit near shore</strong> (commonly 10 km/h within 30 m of shore in many areas) — <strong>check local rules</strong>, as they're set provincially and locally.</li><li><strong>You are legally responsible for damage caused by your wake.</strong> Slow down past moored boats, swimmers, docks, canoes, and shorelines.</li><li>Careless operation, and operating in a manner dangerous to the public, are offences.</li></ul><h4>Impaired operation</h4><p>Operating a vessel while impaired by alcohol or drugs is a <strong>Criminal Code offence</strong>, carrying the same class of penalties as impaired driving, including possible driving prohibitions and a criminal record. Open-liquor rules also apply to boats in many jurisdictions unless the vessel is a legal residence with permanent facilities.</p><h4>Pollution</h4><ul><li><strong>It is illegal to discharge oil, oily waste, or fuel into Canadian waters.</strong> Report spills.</li><li><strong>Do not throw garbage overboard.</strong> Bring everything back.</li><li><strong>Sewage:</strong> discharge of untreated sewage is prohibited in many areas; know your holding tank and use pump-out facilities.</li><li>Report pollution incidents to the Canadian Coast Guard.</li></ul><h4>Carbon monoxide</h4><p data-lang=\"en\">CO is odourless, colourless, and kills. It's produced by engines, generators, and cooking/heating appliances, and it accumulates in enclosed spaces and in the \"station wagon effect\" behind a moving boat. Symptoms mimic seasickness — headache, dizziness, nausea, fatigue — which is exactly why it gets missed on boats. Ventilate, never run an engine or generator with the cabin closed, install a CO detector, and treat unexplained headaches aboard as a CO alarm until proven otherwise.</p><h4>Fuelling safety</h4><ol><li>Everyone off the boat except the person fuelling.</li><li>Engine off, all electrics off, no smoking, no flames.</li><li>Close all hatches, ports and doors.</li><li>Keep the nozzle in contact with the filler to prevent static sparks.</li><li>Do not overfill; fuel expands.</li><li>Wipe up spills.</li><li><strong>Open everything and ventilate the bilge</strong>, then <strong>sniff the bilge</strong> before starting. Gasoline vapour is heavier than air and pools in the bilge — this is how boats explode.</li><li>Run the blower before starting an inboard gasoline engine.</li></ol><p data-lang=\"ua\">Це пункти, не охоплені в інших модулях курсу, і вони прямо екзаменуються. <strong>Перевіряйте актуальні значення за <em>Safe Boating Guide</em> (TP 511) від Transport Canada.</strong></p><h4 data-lang=\"ua\">Обмеження за віком і потужністю (для операторів без прямого нагляду)</h4><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Вік</th><th>Максимальна потужність</th></tr></thead><tbody><tr><td><strong>До 12 років</strong></td><td><strong>До 10 к.с. (7,5 кВт)</strong></td></tr><tr><td><strong>12 до 16</strong></td><td><strong>До 40 к.с. (30 кВт)</strong></td></tr><tr><td><strong>16 і старше</strong></td><td>Без обмежень</td></tr><tr><td><strong>Гідроцикли</strong></td><td><strong>Нікому до 16 не дозволено</strong>, незалежно від нагляду</td></tr></tbody></table></div><h4 data-lang=\"ua\">Обов'язок надати допомогу</h4><p data-lang=\"ua\">Ви маєте <strong>юридичний обов'язок</strong> допомогти будь-якій людині в морі, що перебуває в небезпеці, якщо можете зробити це без серйозної небезпеки для свого судна і людей на борту. Ви також мусите зупинитися і надати допомогу після будь-якого стикання.</p><h4 data-lang=\"ua\">Швидкість, хвиля і створення незручностей</h4><ul><li data-lang=\"ua\">Дотримуйтесь встановлених обмежень швидкості. Багато канадських водних шляхів мають <strong>обмеження біля берега</strong> (часто 10 км/год у межах 30 м від берега) — <strong>перевіряйте місцеві правила</strong>.</li><li data-lang=\"ua\"><strong>Ви юридично відповідаєте за шкоду, завдану вашою хвилею.</strong> Сповільнюйтесь біля пришвартованих суден, плавців, причалів, каное і берегів.</li></ul><h4 data-lang=\"ua\">Забруднення</h4><ul><li data-lang=\"ua\"><strong>Заборонено скидати нафту, нафтові відходи або паливо в канадські води.</strong></li><li data-lang=\"ua\"><strong>Не кидайте сміття за борт.</strong></li><li data-lang=\"ua\"><strong>Стічні води:</strong> скид необроблених стічних вод заборонений у багатьох районах.</li></ul><h4 data-lang=\"ua\">Монооксид вуглероду (CO)</h4><p data-lang=\"ua\">CO без запаху, без кольору, і вбиває. Симптоми імітують морську хворобу — головний біль, запаморочення, нудота, втома — саме тому його пропускають на судах. Вентилюйте, ніколи не тримайте двигун чи генератор працюючим із зачиненою каютою, встановіть детектор CO, і ставтесь до незрозумілого головного болю на борту як до сигналу CO, доки не доведено інше.</p><h4 data-lang=\"ua\">Безпека при заправці</h4><ol><li data-lang=\"ua\">Усі з судна, крім того, хто заправляє.</li><li data-lang=\"ua\">Двигун вимкнений, електрика вимкнена, не курити, без відкритого вогню.</li><li data-lang=\"ua\">Зачиніть усі люки, ілюмінатори і двері.</li><li data-lang=\"ua\">Тримайте пістолет у контакті з заправною горловиною, щоб уникнути статичної іскри.</li><li data-lang=\"ua\">Не переливайте; паливо розширюється.</li><li data-lang=\"ua\">Витріть розливи.</li><li data-lang=\"ua\"><strong>Відкрийте все і провентилюйте трюм</strong>, потім <strong>понюхайте трюм</strong> перед запуском. Пари бензину важчі за повітря і збираються в трюмі — саме так судна вибухають.</li><li data-lang=\"ua\">Запустіть витяжний вентилятор перед пуском стаціонарного бензинового двигуна.</li></ol><hr><h3><span data-lang=\"en\">12.5 Practice questions</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Тренувальні питання</span></h3><p data-lang=\"en\">Answers at the bottom. Cover them.</p><ol><li data-lang=\"en\">You are sailing a 7 m sailboat with an outboard engine that is switched off. Do you need a PCOC?</li><li data-lang=\"en\">Your PCOC expires after how many years?</li><li data-lang=\"en\">A 14-year-old wants to operate a boat alone. What is the maximum engine power?</li><li data-lang=\"en\">Entering Halifax Harbour from seaward, on which side do you keep a red buoy?</li><li data-lang=\"en\">What shape and colour is a starboard-hand buoy in Canada, and are its numbers odd or even?</li><li data-lang=\"en\">What does a white buoy with an orange diamond containing a cross mean?</li><li data-lang=\"en\">Two power-driven vessels approach head-on. What must each do?</li><li data-lang=\"en\">You are under power and another power vessel is crossing from your starboard side. Who gives way?</li><li data-lang=\"en\">A sailing vessel is motoring with sails up. In the collision regulations, what type of vessel is she?</li><li data-lang=\"en\">What day shape should that vessel display?</li><li data-lang=\"en\">You hear five short rapid blasts from a ship. What does it mean?</li><li data-lang=\"en\">What is the fog signal for a sailing vessel underway, and at what interval?</li><li data-lang=\"en\">At night you see a red light and a green light with a white light above them. What is it, and what do you do?</li><li data-lang=\"en\">Name three items of required safety equipment on a small sailboat.</li><li data-lang=\"en\">What are the three numbers of the 1‑10‑1 principle?</li><li data-lang=\"en\">Someone falls overboard in 14 °C water. What is your first concern in the first minute?</li><li data-lang=\"en\">You want to keep warm in the water. Should you swim?</li><li data-lang=\"en\">What must you do after being involved in a collision?</li><li data-lang=\"en\">Where must a PCL number be displayed?</li><li data-lang=\"en\">Before starting an inboard gasoline engine, what must you do?</li><li data-lang=\"en\">What are the symptoms of carbon monoxide poisoning, and what do they resemble?</li><li data-lang=\"en\">What wind speed range triggers a Small Craft Warning?</li><li data-lang=\"en\">Which VHF channel is the distress and calling channel?</li><li data-lang=\"en\">What are the three levels of radio priority calls?</li><li data-lang=\"en\">What is the first piece of information you should give in a MAYDAY after identifying yourself?</li></ol><details><summary><b>Answers / Відповіді</b></summary><ol><li data-lang=\"en\"><strong>Yes.</strong> The requirement applies to any pleasure craft <em>fitted</em> with a motor, even when the motor is off.</li><li data-lang=\"en\"><strong>It never expires.</strong> Valid for life.</li><li data-lang=\"en\"><strong>40 hp (30 kW)</strong> — for ages 12 to under 16 operating without direct supervision.</li><li data-lang=\"en\"><strong>Your starboard (right) side</strong> — \"red right returning\". Canada is IALA Region B.</li><li data-lang=\"en\"><strong>Red, cone/nun shaped, even numbers.</strong></li><li data-lang=\"en\"><strong>Keep out</strong> — entry is prohibited.</li><li data-lang=\"en\"><strong>Both alter course to starboard</strong> and pass port-to-port.</li><li data-lang=\"en\"><strong>You do.</strong> The vessel with the other on her own starboard side gives way.</li><li data-lang=\"en\"><strong>A power-driven vessel.</strong> She has no sailing privileges.</li><li data-lang=\"en\"><strong>A black cone, point down</strong>, displayed forward.</li><li data-lang=\"en\"><strong>Danger / \"I do not understand your intentions.\"</strong> Act immediately.</li><li data-lang=\"en\"><strong>One prolonged blast plus two short blasts</strong>, at intervals of not more than 2 minutes.</li><li data-lang=\"en\"><strong>A power-driven vessel head-on.</strong> Both vessels alter course to starboard.</li><li data-lang=\"en\">Any three of: an approved PFD per person, a buoyant heaving line (≥15 m), a bailer or manual bilge pump, a sound-signalling device, a manual propelling device or anchor with ≥15 m of rode, navigation lights, a fire extinguisher, flares or a watertight flashlight, a reboarding device, a magnetic compass.</li><li data-lang=\"en\"><strong>1 minute</strong> to control your breathing (cold shock), <strong>10 minutes</strong> of meaningful movement before cold incapacitation, <strong>1 hour</strong> before unconsciousness from hypothermia.</li><li data-lang=\"en\"><strong>Getting their breathing under control</strong> and keeping their airway out of the water. Cold shock and the gasp reflex drown people, not hypothermia.</li><li data-lang=\"en\"><strong>No.</strong> Swimming dumps heat about three times faster. Adopt HELP and stay still.</li><li data-lang=\"en\"><strong>Stop and render assistance</strong>, provided you can do so without serious danger to your own vessel and crew. It is a legal duty.</li><li data-lang=\"en\"><strong>On both sides of the bow</strong>, above the waterline, in block characters of the required minimum height, contrasting with the hull.</li><li data-lang=\"en\"><strong>Ventilate the bilge and run the blower</strong>, and sniff for fuel vapour before turning the key.</li><li data-lang=\"en\"><strong>Headache, dizziness, nausea, fatigue, confusion</strong> — they closely resemble <strong>seasickness</strong>, which is why CO poisoning is missed aboard boats.</li><li data-lang=\"en\"><strong>20 to 33 knots.</strong></li><li data-lang=\"en\"><strong>Channel 16</strong> (156.800 MHz).</li><li data-lang=\"en\"><strong>MAYDAY</strong> (distress — grave and imminent danger), <strong>PAN PAN</strong> (urgency), <strong>SÉCURITÉ</strong> (safety).</li><li data-lang=\"en\"><strong>Your position.</strong> It is the one thing rescuers cannot work without.</li></ol></details><hr><h3><span data-lang=\"en\">12.6 After you pass</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Після складання</span></h3><p data-lang=\"en\">You now legally hold the card. Understand clearly what it does and doesn't mean:</p><ul><li data-lang=\"en\">✅ You may legally operate a motorised pleasure craft in Canada.</li><li data-lang=\"en\">✅ You know the rules of the road, the buoyage, and the emergency basics.</li><li data-lang=\"en\">❌ <strong>You cannot sail.</strong> Nothing in the PCOC taught you that.</li><li data-lang=\"en\">❌ No yacht club, insurer, or charter company will accept it as a sailing qualification.</li></ul><p data-lang=\"en\"><strong>So the next step is the water.</strong> Go to <a href=\"#/m13\" data-nav=\"m13\">Module 13</a> and <a href=\"#/m15\" data-nav=\"m15\">Module 15</a>, and book the Sail Canada courses. The PCOC was the paperwork. Now comes the actual skill.</p><p data-lang=\"ua\">Тепер ви юридично маєте картку. Чітко зрозумійте, що вона означає, а що ні:</p><ul><li data-lang=\"ua\">✅ Ви можете юридично керувати прогулянковим судном з двигуном у Канаді.</li><li data-lang=\"ua\">✅ Ви знаєте правила розходження, систему буїв і основи аварійних дій.</li><li data-lang=\"ua\">❌ <strong>Ви не вмієте ходити під вітрилами.</strong> Ніщо в PCOC вас цьому не навчило.</li><li data-lang=\"ua\">❌ Жоден яхт-клуб, страховик або чартерна компанія не приймуть її як вітрильну кваліфікацію.</li></ul><p data-lang=\"ua\"><strong>Тож наступний крок — вода.</strong> Переходьте до <a href=\"#/m13\" data-nav=\"m13\">Модуля 13</a> і <a href=\"#/m15\" data-nav=\"m15\">Модуля 15</a> і бронюйте курси Sail Canada. PCOC був паперовою роботою. Тепер починається справжня майстерність.</p><hr>"}, "m13": {"t_en": "13 · Engine & docking", "t_ua": "Двигун і швартування", "html": "<h2>Module 13 — Engine, Docking &amp; Handling Under Power</h2><h2 data-lang=\"ua\">Модуль 13 — Двигун, швартування та керування під двигуном</h2><p><strong>Study time / Час: ~2 hours + 6+ hours on the water</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Nobody dreams of learning to sail so they can operate a diesel engine and park a boat. But <strong>the overwhelming majority of damage to sailboats happens under power, within 50 metres of a dock</strong>, and engine failure at the wrong moment is how a pleasant day becomes a rescue. This is unglamorous and it is where your reputation as a skipper is actually made.</p><p data-lang=\"ua\">Ніхто не мріє навчитися вітрильному спорту, щоб керувати дизелем і паркувати судно. Але <strong>переважна більшість пошкоджень вітрильників відбувається під двигуном, у межах 50 метрів від причалу</strong>, а відмова двигуна в неправильний момент — це те, як приємний день стає рятувальною операцією. Це неромантично, і саме тут насправді робиться ваша репутація як шкіпера.</p></blockquote><hr><h3><span data-lang=\"en\">13.1 Why the engine matters on a sailboat</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Чому двигун важливий на вітрильнику</span></h3><p data-lang=\"en\">A cruising sailboat's engine is not a luxury. It is:</p><ul><li data-lang=\"en\">How you get in and out of a crowded marina.</li><li data-lang=\"en\">How you make progress in a flat calm, or against a foul tide.</li><li data-lang=\"en\">How you claw off a lee shore when the wind pins you against rocks.</li><li data-lang=\"en\"><strong>Your primary safety backup.</strong> In fog, in a shipping channel, in a squall, with a torn sail, with an injured crew member — the engine is the tool that gets you out.</li></ul><p data-lang=\"en\"><strong>Which means: engine reliability is a safety issue, not a convenience issue.</strong> A skipper who doesn't understand their engine is a skipper who will one day be towed, or worse.</p><p data-lang=\"ua\">Двигун круїзного вітрильника — не розкіш. Це:</p><ul><li data-lang=\"ua\">Як ви заходите і виходите з тісної марини.</li><li data-lang=\"ua\">Як ви рухаєтесь у повний штиль або проти течії.</li><li data-lang=\"ua\">Як ви відриваєтесь від підвітряного берега, коли вітер притискає вас до каміння.</li><li data-lang=\"ua\"><strong>Ваш основний резерв безпеки.</strong> У тумані, в судновому ходу, у шквалі, з порваним вітрилом, з травмованим членом екіпажу — двигун це інструмент, який вас виводить.</li></ul><p data-lang=\"ua\"><strong>А отже: надійність двигуна — це питання безпеки, а не зручності.</strong></p><hr><h3><span data-lang=\"en\">13.2 Pre-start and daily checks</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Перевірки перед запуском</span></h3><p data-lang=\"en\">The mnemonic used across the marine industry is <strong>\"WOBBLE\"</strong>:</p><div class=\"table-wrap\"><table><thead><tr><th>Letter</th><th>Check</th></tr></thead><tbody><tr><td><strong>W</strong> — Water</td><td>Coolant level in the header tank. <strong>Is the raw-water seacock OPEN?</strong> (Closing it and forgetting is how impellers burn out in 30 seconds.)</td></tr><tr><td><strong>O</strong> — Oil</td><td>Engine oil level on the dipstick, and gearbox oil. Look for the colour — milky oil means water intrusion.</td></tr><tr><td><strong>B</strong> — Belts</td><td>Alternator and water-pump belt tension and condition. A finger's deflection is about right.</td></tr><tr><td><strong>B</strong> — Bolts</td><td>Anything loose, vibrating, or missing. Engine mounts.</td></tr><tr><td><strong>L</strong> — Leaks</td><td>Fuel, oil, coolant, water. Look at the drip tray and the bilge. Any new stain is a message.</td></tr><tr><td><strong>E</strong> — Electrics</td><td>Battery voltage, terminals clean and tight, isolator on, alternator connections sound.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Additionally, every time:</strong></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Gear lever in NEUTRAL</strong> before turning the key.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Nothing in the water astern</strong> — no lines, no swimmers, no dinghy painter. <strong>This is the check people skip and it is how propellers get fouled.</strong> Look. Every time.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span><strong>Fuel level.</strong> Diesel engines hate running dry — air in the fuel system means bleeding it, which is a miserable job in a seaway.</span></label></li></ul><p data-lang=\"en\"><
