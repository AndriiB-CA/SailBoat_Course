<strong>талреп</strong> — чи на місці фіксуючі шпильки/кільця? Талреп, що сам розкрутиться, скине мачту.</li><li data-lang=\"ua\">Кожен <strong>обушок вант</strong> — тріщини, рух, або іржа, що виступає з палуби навколо нього?</li><li data-lang=\"ua\"><strong>Вертлюг ґіка</strong> і кріплення ґіка.</li><li data-lang=\"ua\"><strong>Шплінти заклеєні</strong> скотчем, щоб не зачепили вітрила чи шкіру.</li></ul><p data-lang=\"ua\">Це займає 90 секунд і це різниця між приємним днем і втратою мачти.</p><hr><h3><span data-lang=\"en\">3.4 Running rigging — the ropes you pull</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Бігучий такелаж — троси, які ви тягнете</span></h3><p data-lang=\"en\">Two categories, and the distinction is fundamental:</p><ul><li data-lang=\"en\"><strong>Halyards</strong> go <strong>up</strong>. They hoist sails. (<em>Halyard = \"haul yard\"</em>)</li><li data-lang=\"en\"><strong>Sheets</strong> go <strong>out and in</strong>. They control the <em>angle</em> of a sail to the wind.</li></ul><p data-lang=\"en\">Every new sailor mixes these two up at least once. \"Sheet in the jib\" means pull the jib closer to the boat's centreline. \"Hoist the halyard\" means raise the sail.</p><div class=\"table-wrap\"><table><thead><tr><th>Line</th><th>What it does</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Main halyard</strong></td><td>Hoists the mainsail up the mast</td><td>грота-фал</td></tr><tr><td><strong>Jib halyard</strong></td><td>Hoists the jib up the forestay</td><td>стаксель-фал</td></tr><tr><td><strong>Mainsheet</strong></td><td>Controls how far out the boom (and mainsail) goes</td><td>гика-шкот</td></tr><tr><td><strong>Jib sheets</strong> (two — port and starboard)</td><td>Control the jib's angle. Only the leeward one is loaded</td><td>стаксель-шкоти</td></tr><tr><td><strong>Boom vang / kicker</strong></td><td>Pulls the boom <em>down</em>, controlling sail twist</td><td>відтяжка ґіка</td></tr><tr><td><strong>Outhaul</strong></td><td>Pulls the mainsail's clew aft along the boom, flattening the sail</td><td>шкотовий відтяг</td></tr><tr><td><strong>Cunningham</strong></td><td>Tensions the mainsail luff, flattening the sail</td><td>канінгем</td></tr><tr><td><strong>Topping lift</strong></td><td>Holds the boom up when the mainsail is down</td><td>топенант</td></tr><tr><td><strong>Traveller</strong></td><td>A car on a track that moves the mainsheet attachment side to side</td><td>каретка гика-шкота</td></tr><tr><td><strong>Reefing lines</strong></td><td>Reduce sail area</td><td>риф-шкентелі</td></tr><tr><td><strong>Downhaul</strong></td><td>Pulls a sail down or forward</td><td>галс-відтяжка</td></tr><tr><td><strong>Furling line</strong></td><td>Rolls a headsail up around the forestay</td><td>закрутка</td></tr><tr><td><strong>Painter</strong></td><td>The bow rope of a dinghy</td><td>фалінь</td></tr><tr><td><strong>Docklines</strong></td><td>Ropes tying the boat to a dock: bow line, stern line, spring lines</td><td>швартові</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Vocabulary that will save you embarrassment:</strong></p><ul><li data-lang=\"en\">On a boat, a rope with a job has a <strong>name</strong>, not the word \"rope\". Say \"the halyard\" or \"the mainsheet\", not \"that rope\". Raw unassigned rope in a coil is \"line\" or \"cordage\".</li><li data-lang=\"en\"><strong>\"Ease\"</strong> = let out slowly, under control. <strong>\"Trim\"</strong> or <strong>\"sheet in\"</strong> = pull in. <strong>\"Cast off\"</strong> = release completely. <strong>\"Make fast\"</strong> or <strong>\"belay\"</strong> = secure it. <strong>\"Take up the slack\"</strong> = pull in the loose part only.</li><li data-lang=\"en\"><strong>\"Bear away\" / \"bear off\"</strong> = turn away from the wind. <strong>\"Head up\" / \"luff up\"</strong> = turn towards the wind. These are the two most-used steering commands in sailing.</li></ul><p data-lang=\"ua\">Дві категорії, і відмінність фундаментальна:</p><ul><li data-lang=\"ua\"><strong>Фали</strong> йдуть <strong>вгору</strong>. Вони піднімають вітрила.</li><li data-lang=\"ua\"><strong>Шкоти</strong> йдуть <strong>назовні й усередину</strong>. Вони керують <em>кутом</em> вітрила до вітру.</li></ul><p data-lang=\"ua\">Кожен новачок хоч раз їх плутає. «Sheet in the jib» означає підтягнути стаксель ближче до діаметральної площини. «Hoist the halyard» означає підняти вітрило.</p><p data-lang=\"ua\"><strong>Лексика, що врятує вас від сорому:</strong></p><ul><li data-lang=\"ua\">На судні трос, який має роботу, має <strong>назву</strong>, а не слово «трос». Кажіть «фал» або «гика-шкот», а не «та мотузка». Необроблений трос у бухті — це «line» або «cordage».</li><li data-lang=\"ua\"><strong>«Ease»</strong> = потравити повільно, під контролем. <strong>«Trim»</strong> або <strong>«sheet in»</strong> = добрати. <strong>«Cast off»</strong> = відпустити повністю. <strong>«Make fast»</strong> або <strong>«belay»</strong> = закріпити. <strong>«Take up the slack»</strong> = вибрати лише слабину.</li><li data-lang=\"ua\"><strong>«Bear away» / «bear off»</strong> = піти від вітру. <strong>«Head up» / «luff up»</strong> = піти до вітру. Це дві найчастіші команди керування у вітрильному спорті.</li></ul><hr><h3><span data-lang=\"en\">3.5 The sails</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Вітрила</span></h3><div class=\"pre-wrap\"><pre>              ┌ HEAD (топ)\n              │╲\n              │ ╲\n     LUFF     │  ╲     LEECH\n   (передня   │   ╲   (задня\n    шкаторина)│    ╲   шкаторина)\n              │     ╲\n              │      ╲\n              │       ╲\n       TACK ──┴────────╲ ── CLEW\n    (галсовий    FOOT   (шкотовий\n      кут)   (нижня шкаторина)  кут)</pre></div><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Mainsail (main)</strong></td><td>The sail behind the mast, attached to the boom</td><td>грот</td></tr><tr><td><strong>Jib</strong></td><td>The forward sail, smaller, doesn't overlap the mast</td><td>стаксель</td></tr><tr><td><strong>Genoa</strong></td><td>A large jib that overlaps past the mast</td><td>генуя</td></tr><tr><td><strong>Headsail / foresail</strong></td><td>Any sail forward of the mast</td><td>переднє вітрило</td></tr><tr><td><strong>Spinnaker</strong></td><td>Big balloon-like downwind sail</td><td>спінакер</td></tr><tr><td><strong>Gennaker / asymmetric</strong></td><td>Easier cruising downwind sail</td><td>асиметричний спінакер</td></tr><tr><td><strong>Storm jib / trysail</strong></td><td>Tiny very strong heavy-weather sails</td><td>штормовий стаксель / триселль</td></tr><tr><td><strong>Luff</strong></td><td>The leading (forward) edge</td><td>передня шкаторина</td></tr><tr><td><strong>Leech</strong></td><td>The trailing (aft) edge</td><td>задня шкаторина</td></tr><tr><td><strong>Foot</strong></td><td>The bottom edge</td><td>нижня шкаторина</td></tr><tr><td><strong>Head</strong></td><td>The top corner</td><td>топовий кут</td></tr><tr><td><strong>Tack</strong> (of a sail)</td><td>The bottom forward corner</td><td>галсовий кут</td></tr><tr><td><strong>Clew</strong></td><td>The bottom aft corner</td><td>шкотовий кут</td></tr><tr><td><strong>Batten</strong></td><td>Stiffening strip in the leech</td><td>лата</td></tr><tr><td><strong>Telltale</strong></td><td>A short ribbon showing airflow</td><td>колдунчик</td></tr><tr><td><strong>Reef points / reefing cringles</strong></td><td>Attachment points for reducing sail</td><td>риф-крінгли</td></tr><tr><td><strong>Bend on</strong></td><td>To attach a sail to the boat</td><td>приєднати вітрило</td></tr><tr><td><strong>Sail cover</strong></td><td>Protective cover over a stowed sail</td><td>чохол вітрила</td></tr><tr><td><strong>Lazy jacks</strong></td><td>Lines that catch the main as it drops</td><td>ліниві оттяжки</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Beware:</strong> the word <strong>\"tack\"</strong> has three completely different meanings in sailing, and context is everything:</p><ol><li data-lang=\"en\"><strong>Tack (noun, of a sail)</strong> — the bottom forward corner of the sail.</li><li data-lang=\"en\"><strong>Tack (noun, of a boat)</strong> — which side the wind is coming from. \"We're on starboard tack.\"</li><li data-lang=\"en\"><strong>Tack (verb)</strong> — to turn the bow through the wind. \"Prepare to tack.\"</li></ol><p data-lang=\"ua\"><strong>Обережно:</strong> слово <strong>«tack»</strong> має три абсолютно різні значення у вітрильному спорті, і все залежить від контексту:</p><ol><li data-lang=\"ua\"><strong>Tack (іменник, про вітрило)</strong> — нижній передній кут вітрила (галсовий кут).</li><li data-lang=\"ua\"><strong>Tack (іменник, про судно)</strong> — з якого борту приходить вітер. «We're on starboard tack» = «Ми на правому галсі».</li><li data-lang=\"ua\"><strong>Tack (дієслово)</strong> — повернути ніс через вітер (поворот оверштаг).</li></ol><hr><h3><span data-lang=\"en\">3.6 Hardware</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Обладнання</span></h3><div class=\"table-wrap\"><table><thead><tr><th>Term</th><th>Meaning</th><th>Ukrainian</th></tr></thead><tbody><tr><td><strong>Winch</strong></td><td>A drum you wind a sheet around for mechanical advantage</td><td>лебідка</td></tr><tr><td><strong>Winch handle</strong></td><td>The removable crank</td><td>ручка лебідки</td></tr><tr><td><strong>Cleat</strong></td><td>A fitting you tie a line off to</td><td>утка</td></tr><tr><td><strong>Jam cleat / clutch / cam cleat</strong></td><td>Grips a line so it holds under load, releases on demand</td><td>стопор</td></tr><tr><td><strong>Block</strong></td><td>A pulley</td><td>блок</td></tr><tr><td><strong>Fairlead</strong></td><td>Guides a line in the right direction</td><td>напрямний блок</td></tr><tr><td><strong>Shackle</strong></td><td>A metal U-link with a pin</td><td>такелажна скоба</td></tr><tr><td><strong>Snap shackle</strong></td><td>A quick-release shackle</td><td>карабін-скоба</td></tr><tr><td><strong>Fender</strong></td><td>An inflatable bumper protecting the hull at a dock</td><td>кранець</td></tr><tr><td><strong>Boat hook</strong></td><td>A pole with a hook, for grabbing mooring lines</td><td>відпорний гак</td></tr><tr><td><strong>Anchor / rode</strong></td><td>Anchor / the chain and rope attached to it</td><td>якір / якірний канат</td></tr><tr><td><strong>Windlass</strong></td><td>The winch for the anchor</td><td>шпіль</td></tr><tr><td><strong>Binnacle</strong></td><td>The pedestal holding the compass and wheel</td><td>пелорус / стійка компаса</td></tr><tr><td><strong>Mooring buoy</strong></td><td>A permanent floating attachment point</td><td>швартовий буй</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Using a winch safely</strong> (this is where fingers get hurt):</p><ol><li data-lang=\"en\">Wrap the sheet <strong>clockwise</strong> around the drum — always clockwise, on every winch, worldwide. Three turns is typical.</li><li data-lang=\"en\"><strong>Never put your fingers between the rope and the drum.</strong> A loaded winch will take a finger off.</li><li data-lang=\"en\">Load the winch, insert the handle, and grind. One hand tails (holds tension on the free end) while the other cranks — or use a self-tailing winch.</li><li data-lang=\"en\">To release, <strong>keep a turn on the drum and ease it gradually</strong>. Never just throw the whole thing off under load — the sheet will whip out and the sail will flog wildly.</li><li data-lang=\"en\">Watch for an <strong>override</strong>: a turn that crosses over another and jams. Under high load an override can be nearly impossible to clear, and it means you cannot release the sail. Prevent it by keeping the sheet coming onto the drum at a low angle.</li><li data-lang=\"en\"><strong>Remove the winch handle when you're done</strong> and stow it. Handles left in winches fall overboard, and they cost real money.</li></ol><p data-lang=\"ua\"><strong>Безпечна робота з лебідкою</strong> (саме тут травмують пальці):</p><ol><li data-lang=\"ua\">Намотуйте шкот <strong>за годинниковою стрілкою</strong> на барабан — завжди за годинниковою, на кожній лебідці, у всьому світі. Типово три оберти.</li><li data-lang=\"ua\"><strong>Ніколи не тримайте пальці між тросом і барабаном.</strong> Навантажена лебідка відірве палець.</li><li data-lang=\"ua\">Навантажте лебідку, вставте ручку і крутіть. Одна рука тримає натяг вільного кінця, інша крутить — або використовуйте самозатягуючу лебідку.</li><li data-lang=\"ua\">Щоб потравити, <strong>залиште оберт на барабані й попускайте поступово</strong>. Ніколи не скидайте все під навантаженням — шкот вилетить, а вітрило буде дико лопотіти.</li><li data-lang=\"ua\">Слідкуйте за <strong>накладанням (override)</strong>: коли оберт перехрещується з іншим і заклинює. Під великим навантаженням це буває майже неможливо розчепити, і це означає, що ви не можете потравити вітрило. Запобігайте, підводячи шкот до барабана під малим кутом.</li><li data-lang=\"ua\"><strong>Виймайте ручку лебідки, коли закінчили</strong>, і кладіть на місце. Забуті ручки падають за борт і коштують реальних грошей.</li></ol><hr><h3><span data-lang=\"en\">3.7 Practical: rig the boat at the dock</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Практика: підготовка судна на причалі</span></h3><p data-lang=\"en\">Ask your instructor or a club member if you can spend an hour on a boat at the dock, doing nothing but touching things and naming them. This is the single highest-value hour in the whole course, and it is free. Do it before your first sail.</p><p data-lang=\"en\"><strong>Typical sequence for rigging a small keelboat:</strong></p><ol><li data-lang=\"en\"><strong>Board safely</strong> — step onto the boat, don't jump. Face the boat, hold something fixed.</li><li data-lang=\"en\"><strong>Open up</strong> — unlock the companionway, open hatches to ventilate. Check the bilge for water. Look at the seacocks.</li><li data-lang=\"en\"><strong>Check the engine</strong> — fuel level, oil, cooling water intake open, battery on.</li><li data-lang=\"en\"><strong>Rig the mainsail</strong> — remove the sail cover. Attach the halyard to the head. Check the tack and clew are secured, the outhaul is rigged, and the battens are in. Confirm the mainsheet runs free.</li><li data-lang=\"en\"><strong>Rig the headsail</strong> — hank on or check the furling. Attach the halyard. Lead the sheets <strong>outside</strong> the shrouds, aft through the fairleads, onto the winches, and tie a <strong>stopper knot</strong> (figure-eight) in each end so a sheet can never escape overboard.</li><li data-lang=\"en\"><strong>Check the topping lift</strong> is holding the boom up.</li><li data-lang=\"en\"><strong>Fenders and docklines</strong> ready — plan how you'll leave the dock before you cast off anything.</li><li data-lang=\"en\"><strong>Safety gear located and shown to crew</strong> — PFDs, flares, extinguisher, first aid, VHF, bilge pump handle.</li><li data-lang=\"en\"><strong>Brief the crew</strong> — see <a href=\"#/m01\" data-nav=\"m01\">Module 01 §1.6</a>.</li><li data-lang=\"en\"><strong>Only now</strong> think about starting the engine and leaving.</li></ol><p data-lang=\"en\"><strong>The habit that separates good sailors from lucky ones:</strong> everything is checked <em>before</em> you need it. There is no time to find the bilge pump handle when you're taking water, and no time to learn where the flares are when the mast is down.</p><p data-lang=\"ua\">Попросіть інструктора або члена клубу дозволити провести годину на судні біля причалу, просто торкаючись речей і називаючи їх. Це найцінніша година в усьому курсі, і вона безкоштовна. Зробіть це до першого виходу.</p><p data-lang=\"ua\"><strong>Типова послідовність підготовки малої кільової яхти:</strong></p><ol><li data-lang=\"ua\"><strong>Безпечно зайдіть на борт</strong> — крокуйте, не стрибайте. Обличчям до судна, тримаючись за щось нерухоме.</li><li data-lang=\"ua\"><strong>Відкрийте судно</strong> — відімкніть вхідний люк, відкрийте люки для вентиляції. Перевірте трюм на воду. Огляньте кінгстони.</li><li data-lang=\"ua\"><strong>Перевірте двигун</strong> — рівень палива, масло, відкритий забір охолоджуючої води, увімкнений акумулятор.</li><li data-lang=\"ua\"><strong>Підготуйте грот</strong> — зніміть чохол. Приєднайте фал до топового кута. Перевірте, що галсовий і шкотовий кути закріплені, шкотовий відтяг заведений, лати на місці. Переконайтеся, що гика-шкот ходить вільно.</li><li data-lang=\"ua\"><strong>Підготуйте переднє вітрило</strong> — закріпіть або перевірте закрутку. Приєднайте фал. Проведіть шкоти <strong>зовні</strong> вант, назад через напрямні блоки, на лебідки, і зав'яжіть <strong>стопорний вузол</strong> (вісімку) на кожному кінці, щоб шкот ніколи не втік за борт.</li><li data-lang=\"ua\"><strong>Перевірте, що топенант</strong> тримає ґік.</li><li data-lang=\"ua\"><strong>Кранці та швартові готові</strong> — сплануйте, як будете відходити, ще до того, як щось відпускати.</li><li data-lang=\"ua\"><strong>Спорядження безпеки знайдено і показано екіпажу</strong> — жилети, фальшфейєри, вогнегасник, аптечка, VHF, ручка трюмного насоса.</li><li data-lang=\"ua\"><strong>Проінструктуйте екіпаж</strong> — див. <a href=\"#/m01\" data-nav=\"m01\">Модуль 01 §1.6</a>.</li><li data-lang=\"ua\"><strong>Лише тепер</strong> думайте про запуск двигуна і відхід.</li></ol><p data-lang=\"ua\"><strong>Звичка, що відрізняє добрих яхтсменів від щасливчиків:</strong> усе перевірено <em>до</em> того, як воно знадобилося. Немає часу шукати ручку трюмного насоса, коли ви набираєте воду, і немає часу вчити, де фальшфейєри, коли мачта вже впала.</p><hr><h3><span data-lang=\"en\">3.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Name, without hesitating: bow, stern, port, starboard, windward, leeward.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which colour light is on the port side?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the difference between a halyard and a sheet?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is the difference between standing and running rigging?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the three corners and three edges of a sail.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Give the three meanings of the word \"tack\".</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which direction do you wrap a sheet on a winch?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is your boat's draft, and why does it matter more than its length?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What are seacocks and why must you check them?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does \"ease the mainsheet\" mean? \"Bear away\"? \"Head up\"?</span></label></li></ul><p data-lang=\"ua\"></p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть без вагань: bow, stern, port, starboard, windward, leeward.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Якого кольору вогонь на лівому борту?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка різниця між фалом і шкотом?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка різниця між стоячим і бігучим такелажем?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть три кути і три шкаторини вітрила.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Наведіть три значення слова «tack».</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>У якому напрямку намотується шкот на лебідку?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Яка осадка вашого судна і чому вона важливіша за довжину?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке кінгстони і чому їх треба перевіряти?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Що означає «ease the mainsheet»? «Bear away»? «Head up»?</span></label></li></ul><hr>"}, "m04": {"t_en": "04 · Points of sail & trim", "t_ua": "Курси та налаштування", "html": "<h2>Module 04 — Points of Sail &amp; Sail Trim</h2><h2 data-lang=\"ua\">Модуль 04 — Курси відносно вітру та налаштування вітрил</h2><p><strong>Study time / Час: ~2.5 hours + ongoing practice</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Points of sail is the map. Sail trim is the driving. This module contains the two diagrams every sailor carries in their head for life.</p><p data-lang=\"ua\">Курси відносно вітру — це карта. Налаштування вітрил — це саме керування. Цей модуль містить дві схеми, які кожен яхтсмен носить у голові все життя.</p></blockquote><hr><h3><span data-lang=\"en\">4.1 The points of sail</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Курси відносно вітру</span></h3><p data-lang=\"en\">A \"point of sail\" is your boat's angle relative to the wind. It is <em>not</em> a compass direction. It determines how you trim your sails, how fast you go, and how much the boat heels. Learn this diagram cold.</p><div class=\"pre-wrap\"><pre>                          ↓↓↓  WIND  ↓↓↓\n                        (from the top of page)\n\n                          NO-GO ZONE\n                       (in irons / head to wind)\n                        sails just flap, boat stops\n                   ╲___________________________╱\n                    ╲    ~45°    │    ~45°    ╱\n                     ╲           │           ╱\n        CLOSE-HAULED  ╲          │          ╱  CLOSE-HAULED\n       (крутий         ╲         │         ╱     — as close to the wind\n        бейдевінд)      ╲        │        ╱        as the boat will sail\n                         ╲       │       ╱\n                          ╲      │      ╱\n        CLOSE REACH   ─────╳─────┼─────╳─────   CLOSE REACH\n       (повний бейдевінд)  │     │     │        ~60–70°\n                           │     │     │\n        BEAM REACH   ──────┼─────┼─────┼──────  BEAM REACH\n        (галфвінд)         │  BOAT AT  │        90° — wind on the beam\n                           │  CENTRE   │        usually fastest &amp; nicest\n        BROAD REACH  ──────┼─────┼─────┼──────  BROAD REACH\n        (бакштаг)          │     │     │        ~135°\n                          ╱      │      ╲\n                         ╱       │       ╲\n                        ╱        │        ╲\n                       ╱     RUNNING       ╲\n                      ╱     (фордевінд)     ╲\n                     ╱   wind directly behind ╲\n                    ╱     180° — least stable  ╲\n\n     (wind from port side,       │      (wind from starboard side,\n      boom out to starboard)     │       boom out to port)</pre></div><div class=\"table-wrap\"><table><thead><tr><th>Point of sail</th><th>Angle to wind</th><th>Ukrainian</th><th>Sails trimmed</th><th>Feel</th></tr></thead><tbody><tr><td><strong>In irons / head to wind</strong></td><td>0°</td><td>у левентик</td><td>flapping</td><td>Stopped. Not a sailing course.</td></tr><tr><td><strong>Close-hauled</strong></td><td>~45°</td><td>крутий бейдевінд</td><td>Sheeted in <strong>hard</strong>, near centreline</td><td>Heeled, wet, loud, slow over the ground but efficient upwind</td></tr><tr><td><strong>Close reach</strong></td><td>~60–70°</td><td>повний бейдевінд</td><td>Eased slightly</td><td>Fast and comfortable</td></tr><tr><td><strong>Beam reach</strong></td><td>90°</td><td>галфвінд</td><td>About halfway out</td><td><strong>Usually fastest and most pleasant.</strong> The point of sail to start on.</td></tr><tr><td><strong>Broad reach</strong></td><td>~135°</td><td>бакштаг</td><td>Well eased</td><td>Fast, comfortable, stable</td></tr><tr><td><strong>Running</strong></td><td>180°</td><td>фордевінд</td><td>All the way out</td><td>Calm-feeling, slow, <strong>least stable — gybe risk</strong></td></tr></tbody></table></div><p data-lang=\"en\"><strong>The one-sentence rule of sail trim:</strong></p><blockquote class=\"callout\"><p><strong>The further you turn away from the wind, the further out you let the sails.</strong></p><p data-lang=\"ua\"><strong>Чим далі ви повертаєте від вітру, тим далі випускаєте вітрила.</strong></p></blockquote><p>Close-hauled: sails almost on the centreline. Beam reach: about 45° out. Running: all the way out. That is 80% of sail trim, and it's a straight-line relationship you can apply immediately.</p><p data-lang=\"ua\">«Курс відносно вітру» — це кут вашого судна відносно вітру. Це <em>не</em> компасний напрямок. Він визначає, як налаштовувати вітрила, як швидко ви йдете і наскільки судно кренується. Вивчіть цю схему досконало.</p><hr><h3><span data-lang=\"en\">4.2 Port tack and starboard tack</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Правий і лівий галс</span></h3><p data-lang=\"en\">Which <strong>tack</strong> you are on is defined by <strong>which side the wind comes from</strong>, and it is one of the most important facts about your boat at any moment because it determines right of way.</p><ul><li data-lang=\"en\"><strong>Starboard tack</strong> — wind coming over the <strong>starboard</strong> side. Boom is out to <strong>port</strong>.</li><li data-lang=\"en\"><strong>Port tack</strong> — wind coming over the <strong>port</strong> side. Boom is out to <strong>starboard</strong>.</li></ul><p data-lang=\"en\"><strong>Memory aid: the boom is always on the opposite side to the wind.</strong> So look at the boom, flip it, and you have your tack.</p><p data-lang=\"en\"><strong>Why it matters enormously:</strong> under the collision regulations, when two sailing boats meet with the wind on different sides, <strong>the boat on port tack must keep clear of the boat on starboard tack.</strong> Starboard tack has right of way. This is the single most-used rule in sailing and it comes up every day. See <a href=\"#/m07\" data-nav=\"m07\">Module 07</a>.</p><p data-lang=\"en\"><strong>Practical drill:</strong> every few minutes on the water, ask yourself out loud: <em>\"What tack am I on? What point of sail am I on?\"</em> Do it until it's automatic. Experienced sailors know both at all times without thinking, the way a driver knows what gear they're in.</p><p data-lang=\"ua\">На якому <strong>галсі</strong> ви йдете, визначається тим, <strong>з якого борту приходить вітер</strong>, і це один з найважливіших фактів про ваше судно в будь-який момент, бо він визначає перевагу руху.</p><ul><li data-lang=\"ua\"><strong>Правий галс (starboard tack)</strong> — вітер приходить з <strong>правого</strong> борту. Ґік винесений на <strong>лівий</strong>.</li><li data-lang=\"ua\"><strong>Лівий галс (port tack)</strong> — вітер приходить з <strong>лівого</strong> борту. Ґік винесений на <strong>правий</strong>.</li></ul><p data-lang=\"ua\"><strong>Мнемоніка: ґік завжди з протилежного боку від вітру.</strong> Отже подивіться на ґік, переверніть — і ви знаєте свій галс.</p><p data-lang=\"ua\"><strong>Чому це надзвичайно важливо:</strong> за правилами запобігання столкновенням, коли два вітрильники зустрічаються з вітром з різних боків, <strong>судно на лівому галсі мусить уступити дорогу судну на правому галсі.</strong> Правий галс має перевагу. Це найчастіше застосовуване правило у вітрильному спорті, і воно виникає щодня. Див. <a href=\"#/m07\" data-nav=\"m07\">Модуль 07</a>.</p><p data-lang=\"ua\"><strong>Практичне вправляння:</strong> кожні кілька хвилин на воді питайте себе вголос: <em>«На якому я галсі? На якому курсі відносно вітру?»</em> Робіть це, доки не стане автоматичним. Досвідчені яхтсмени знають обидва завжди, не думаючи, як водій знає, яка передача включена.</p><hr><h3><span data-lang=\"en\">4.3 The universal trim method</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Універсальний метод налаштування</span></h3><p data-lang=\"en\">Here is a method that works on any sail, on any boat, at any point of sail, without any theory. Memorise it as a physical routine:</p><blockquote class=\"callout\"><p><strong>1. Ease the sheet until the front edge (luff) of the sail starts to flutter or \"luff\".</strong></p><p><strong>2. Trim it back in just until the fluttering stops.</strong></p><p><strong>3. That's it. That's correct trim.</strong></p></blockquote><p>That is the whole thing. It is called \"trimming to the luff\", and every good sailor does it constantly, in small adjustments, all day.</p><p><strong>Why it works:</strong> if the sail is too far out, air detaches and the leading edge collapses inward — that's the flutter. If it's too far in, the sail stalls: the airflow separates off the back, you lose lift, and you gain heel and drag. The correct setting is the narrow band right on the edge of luffing. Sail there.</p><p><strong>When to re-trim:</strong></p><ul><li>Every time you change course, even a few degrees.</li><li>Every time the wind shifts, which is constantly.</li><li>Every time the wind strength changes.</li><li>After any manoeuvre.</li></ul><p><strong>Beginner's mistake #1: setting the sails once and leaving them.</strong> Trim is not a setting, it's an activity. A good sailor's hands are on the sheets every minute.</p><p><strong>Beginner's mistake #2: over-trimming.</strong> Almost every beginner sheets in too hard, because a tight sail looks \"correct\" and a slightly luffing one looks wrong. An over-trimmed sail produces heel and drag instead of drive. When in doubt, <strong>ease.</strong> If you're not sure, let it out until it flutters, then bring it back.</p><p data-lang=\"ua\">Ось метод, що працює на будь-якому вітрилі, на будь-якому судні, на будь-якому курсі, без жодної теорії. Запам'ятайте як фізичну рутину:</p><blockquote class=\"callout\"><p data-lang=\"ua\"><strong>1. Травіть шкот, доки передня шкаторина вітрила не почне тріпотіти («заполіскувати»).</strong></p><p data-lang=\"ua\"><strong>2. Доберіть назад рівно настільки, щоб тріпотіння припинилося.</strong></p><p data-lang=\"ua\"><strong>3. Усе. Це і є правильне налаштування.</strong></p></blockquote><p data-lang=\"ua\">Це вся суть. Це називається «налаштування по передній шкаторині», і кожен добрий яхтсмен робить це постійно, малими правками, цілий день.</p><p data-lang=\"ua\"><strong>Чому це працює:</strong> якщо вітрило винесене задалеко, повітря відривається і передня кромка складається всередину — це і є тріпотіння. Якщо добране задалеко, вітрило «зривається»: потік відривається із задньої частини, ви втрачаєте підйомну силу і отримуєте крен та опір. Правильне положення — вузька смуга рівно на межі заполіскування. Йдіть саме там.</p><p data-lang=\"ua\"><strong>Коли перенастроювати:</strong></p><ul><li data-lang=\"ua\">Кожного разу, коли змінюєте курс, навіть на кілька градусів.</li><li data-lang=\"ua\">Кожного разу, коли вітер зсувається, а це постійно.</li><li data-lang=\"ua\">Кожного разу, коли змінюється сила вітру.</li><li data-lang=\"ua\">Після будь-якого маневру.</li></ul><p data-lang=\"ua\"><strong>Помилка новачка №1: налаштувати вітрила один раз і залишити.</strong> Налаштування — це не установка, це діяльність. Руки доброго яхтсмена на шкотах щохвилини.</p><p data-lang=\"ua\"><strong>Помилка новачка №2: перебирання.</strong> Майже кожен новачок добирає задалеко, бо натягнуте вітрило виглядає «правильним», а трохи заполіскуюче — неправильним. Перебране вітрило дає крен і опір замість тяги. Коли сумніваєтесь — <strong>травіть.</strong> Якщо не впевнені, випустіть до тріпотіння, потім доберіть трохи назад.</p><hr><h3><span data-lang=\"en\">4.4 Telltales — the sailor's instrument</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Колдунчики — прилад яхтсмена</span></h3><p data-lang=\"en\"><strong>Telltales</strong> are short pieces of yarn or ribbon taped to the sail, usually three pairs up the luff of the headsail — one on each side. They show you invisible airflow directly, and they are more accurate than any electronic instrument for trim.</p><p data-lang=\"en\"><strong>Reading them, close-hauled:</strong></p><div class=\"table-wrap\"><table><thead><tr><th>What you see</th><th>What it means</th><th>What to do</th></tr></thead><tbody><tr><td><strong>Both sides streaming straight aft</strong></td><td>Perfect. Attached flow both sides.</td><td>Nothing. This is the target.</td></tr><tr><td><strong>Windward telltale lifting/fluttering</strong></td><td>You are too close to the wind (pinching)</td><td><strong>Bear away</strong> slightly, or ease the sheet</td></tr><tr><td><strong>Leeward telltale fluttering or stalling</strong></td><td>You are too far off the wind, or over-trimmed</td><td><strong>Head up</strong> slightly, or trim in</td></tr><tr><td><strong>Both fluttering wildly</strong></td><td>Sail is luffing badly or badly stalled</td><td>Re-trim from scratch using §4.3</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The helmsman's game.</strong> When close-hauled, your job is to steer so the <em>windward</em> telltales are just occasionally lifting — dancing on the edge. That means you are sailing as close to the wind as possible without losing power. This narrow, feel-based zone is called <strong>\"the groove\"</strong>, and finding it is what upwind sailing skill actually is.</p><p data-lang=\"en\">There is also a masthead <strong>wind indicator</strong> (a small vane at the top of the mast) and often <strong>shroud telltales</strong> (bits of wool tied to the shrouds) showing apparent wind direction. Look up frequently. New sailors stare at the sails or the water; experienced sailors look up at the masthead every few seconds.</p><p data-lang=\"ua\"><strong>Колдунчики</strong> — короткі відрізки пряжі або ленти, наклеєні на вітрило, зазвичай три пари по передній шкаторині стакселя — по одному з кожного боку. Вони прямо показують невидимий потік повітря, і для налаштування вони точніші за будь-який електронний прилад.</p><p data-lang=\"ua\"><strong>Читання їх на крутому бейдевінді:</strong></p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Що ви бачите</th><th>Що це означає</th><th>Що робити</th></tr></thead><tbody><tr><td><strong>Обидва боки струяться прямо назад</strong></td><td>Ідеально. Потік прилягає з обох боків.</td><td>Нічого. Це і є цільове положення.</td></tr><tr><td><strong>Навітряний колдунчик піднімається/тріпоче</strong></td><td>Ви занадто круто до вітру (пінчинг)</td><td><strong>Трохи піти від вітру</strong>, або потравити шкот</td></tr><tr><td><strong>Підвітряний колдунчик тріпоче або зривається</strong></td><td>Ви занадто далеко від вітру, або перебрали</td><td><strong>Трохи піти до вітру</strong>, або добрати</td></tr><tr><td><strong>Обидва дико тріпочуть</strong></td><td>Вітрило сильно заполіскує або сильно зірване</td><td>Перенастроїть з нуля за §4.3</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Гра рульового.</strong> На крутому бейдевінді ваша задача — керувати так, щоб <em>навітряні</em> колдунчики лише інколи піднімалися, танцюючи на межі. Це означає, що ви йдете настільки круто до вітру, наскільки можливо, не втрачаючи тяги. Ця вузька зона, що знаходиться на відчуття, називається <strong>«the groove»</strong> («канавка»), і знайти її — це і є справжній навик ходіння проти вітру.</p><p data-lang=\"ua\">Є також <strong>флюгер на топі мачти</strong> (маленький вітрильчик на верхівці) і часто <strong>колдунчики на вантах</strong> (шматочки шерсті, прив'язані до вант), що показують напрямок видимого вітру. Дивіться вгору часто. Новачки витріщаються на вітрила або воду; досвідчені яхтсмени дивляться на топ мачти кожні кілька секунд.</p><hr><h3><span data-lang=\"en\">4.5 The other trim controls</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інші засоби налаштування</span></h3><p data-lang=\"en\">The sheet controls <em>how far out</em> the sail is. These controls change the sail's <em>shape</em>, and shape is what makes a sail powerful or flat. Rule of thumb: <strong>light wind wants a deep, curved, powerful sail; strong wind wants a flat, twisted, de-powered sail.</strong></p><div class=\"table-wrap\"><table><thead><tr><th>Control</th><th>Pull it ON to...</th><th>Ease it OFF to...</th><th>When</th></tr></thead><tbody><tr><td><strong>Boom vang / kicker</strong></td><td>Pull the boom down → tighten the leech, reduce twist, more power</td><td>Allow twist, de-power the top of the sail</td><td>Essential on a reach and downwind; also prevents the boom skying</td></tr><tr><td><strong>Traveller</strong></td><td>Move the mainsheet attachment to windward → more leech tension, more power</td><td>Move to leeward → reduce heel and weather helm instantly</td><td>Your fastest gust response upwind</td></tr><tr><td><strong>Outhaul</strong></td><td>Flatten the bottom of the main</td><td>Deepen the bottom → more power</td><td>Tighten as wind builds</td></tr><tr><td><strong>Cunningham</strong></td><td>Tension the luff → moves draft forward, flattens the sail</td><td>Deepen the sail</td><td>Tighten as wind builds</td></tr><tr><td><strong>Halyard tension</strong></td><td>Tension the luff → flatter</td><td>Deeper, more power</td><td>More tension in more wind</td></tr><tr><td><strong>Backstay</strong> (adjustable)</td><td>Bend the mast → flatten the main, tighten the forestay</td><td>Deepen the main</td><td>Tighten as wind builds</td></tr><tr><td><strong>Jib sheet lead / car position</strong></td><td>Move car aft → flatten the foot, twist off the top</td><td>Move forward → deeper, more leech tension</td><td>Tune for conditions</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The de-powering sequence for a gust, in order.</strong> Memorise this — it's what you do when the boat suddenly heels too far:</p><ol><li data-lang=\"en\"><strong>Ease the traveller down to leeward.</strong> Fastest, biggest effect, easy.</li><li data-lang=\"en\"><strong>Ease the mainsheet.</strong> Immediate.</li><li data-lang=\"en\"><strong>Head up slightly</strong> (luff up) to spill wind. Careful — don't stall.</li><li data-lang=\"en\"><strong>Flatten the sails</strong> — tighten outhaul, cunningham, backstay.</li><li data-lang=\"en\"><strong>Reef.</strong> If you're doing 1–4 repeatedly, stop and reef properly. See <a href=\"#/m05\" data-nav=\"m05\">Module 05</a>.</li></ol><p data-lang=\"en\"><strong>Do not fight a gust with the rudder alone.</strong> Heavy rudder input is drag and it doesn't fix the cause. Ease sheets first, steer second.</p><p data-lang=\"ua\">Шкот керує тим, <em>наскільки далеко</em> винесене вітрило. Ці засоби змінюють <em>форму</em> вітрила, а форма робить його потужним або плоским. Правило: <strong>слабкий вітер хоче глибоке, вигнуте, потужне вітрило; сильний вітер хоче плоске, скручене, знесилене.</strong></p><p data-lang=\"ua\"><strong>Послідовність зниження тяги при пориві, за порядком.</strong> Запам'ятайте — це те, що ви робите, коли судно раптово надто сильно кренується:</p><ol><li data-lang=\"ua\"><strong>Потравіть каретку (traveller) під вітер.</strong> Найшвидше, найбільший ефект, легко.</li><li data-lang=\"ua\"><strong>Потравіть гика-шкот.</strong> Негайно.</li><li data-lang=\"ua\"><strong>Трохи вийдіть до вітру</strong>, щоб скинути вітер. Обережно — не зірвіть потік.</li><li data-lang=\"ua\"><strong>Розпряміть вітрила</strong> — натягніть шкотовий відтяг, канінгем, ахтерштаг.</li><li data-lang=\"ua\"><strong>Візьміть риф.</strong> Якщо ви повторюєте 1–4 багато разів — зупиніться і візьміть риф як слід. Див. <a href=\"#/m05\" data-nav=\"m05\">Модуль 05</a>.</li></ol><p data-lang=\"ua\"><strong>Не боріться з поривом лише кермом.</strong> Сильне кермо — це опір, і воно не усуває причину. Спочатку травіть шкоти, потім керуйте.</p><hr><h3><span data-lang=\"en\">4.6 Sailing downwind safely</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Безпечний хід за вітром</span></h3><p data-lang=\"en\">Downwind is where beginners get hurt, so it gets its own section.</p><p data-lang=\"en\"><strong>Broad reach (~135°) is the safe, fast, comfortable downwind course.</strong> Sail this rather than dead downwind whenever you can. It's faster, the boat is more stable, and the gybe risk is far lower.</p><p data-lang=\"en\"><strong>Dead running (180°) hazards:</strong></p><ol><li data-lang=\"en\"><strong>Accidental gybe.</strong> If the wind gets even slightly to the wrong side of the mainsail, the boom slams across the boat at high speed. It can knock a person overboard, break bones, break the rig, or all three. <strong>This is the most common cause of serious injury in sailing.</strong> - <strong>Prevention:</strong> rig a <strong>preventer</strong> — a line from the end of the boom, forward to a strong point on the side deck, tensioned. It physically stops the boom crossing. Any time you sail downwind for more than a few minutes, rig a preventer. It takes two minutes and it is the mark of a careful skipper. - Also: steer accurately, watch the masthead wind indicator constantly, and don't sail dead downwind in a following sea if you can avoid it.</li><li data-lang=\"en\"><strong>Death roll.</strong> A running boat can start rolling rhythmically, worse each cycle, until it broaches or gybes. Fix it by heading up onto a broad reach and tightening the vang.</li><li data-lang=\"en\"><strong>Goosewinging (wing on wing)</strong> — mainsail on one side, headsail poled out on the other. Fast and efficient for a steady run, but it's unstable and unforgiving of steering error. Only with a preventer, and only with experience.</li><li data-lang=\"en\"><strong>Losing wind awareness.</strong> Because apparent wind is low, you feel becalmed while the true wind builds. See <a href=\"#/m02\" data-nav=\"m02\">Module 02 §2.4</a>.</li></ol><p data-lang=\"en\"><strong>Downwind crew discipline.</strong> Whenever sailing downwind: everyone knows where the boom is; nobody sits in the boom's path; nobody stands up in the cockpit without checking; and when you <em>do</em> gybe, the call is loud, clear, and answered before you turn.</p><p data-lang=\"ua\">Попутні курси — це те, де новачки травмуються, тому цьому окремий розділ.</p><p data-lang=\"ua\"><strong>Бакштаг (~135°) — безпечний, швидкий, комфортний попутний курс.</strong> Ходіть ним, а не чистим фордевіндом, коли можете. Швидше, судно стабільніше, а ризик повороту фордевінд значно нижчий.</p><p data-lang=\"ua\"><strong>Небезпеки чистого фордевінда (180°):</strong></p><ol><li data-lang=\"ua\"><strong>Непередбачений поворот фордевінд.</strong> Якщо вітер потрапить хоч трохи не на той бік грота, ґік з великою швидкістю перелітає через судно. Він може збити людину за борт, зламати кістки, зламати рангоут, або все разом. <strong>Це найпоширеніша причина серйозних травм у вітрильному спорті.</strong> - <strong>Профілактика:</strong> заведіть <strong>завал-таль (preventer)</strong> — кінець від кінця ґіка вперед до міцної точки на бортовій палубі, натягнутий. Він фізично не дає ґіку перелетіти. Кожного разу, коли йдете за вітром більше кількох хвилин, заводьте завал-таль. Це займає дві хвилини і це ознака обачного шкіпера. - Також: керуйте точно, постійно дивіться на флюгер топа мачти, і не ходіть чистим фордевіндом у попутній хвилі, якщо можете уникнути.</li><li data-lang=\"ua\"><strong>«Death roll» (розкачка).</strong> Судно на фордевінді може почати ритмічно розкачуватись, сильніше з кожним циклом, доки не зробить брочинг або поворот. Виправляється виходом на бакштаг і натягом відтяжки ґіка.</li><li data-lang=\"ua\"><strong>«Метелик» (goosewing / wing on wing)</strong> — грот на одному борту, стаксель винесений спінакер-ґіком на інший. Швидко й ефективно на стабільному фордевінді, але нестабільно і не прощає помилок керування. Лише з завал-талем і лише з досвідом.</li><li data-lang=\"ua\"><strong>Втрата відчуття вітру.</strong> Оскільки видимий вітер малий, вам здається штиль, поки справжній вітер наростає. Див. <a href=\"#/m02\" data-nav=\"m02\">Модуль 02 §2.4</a>.</li></ol><p data-lang=\"ua\"><strong>Дисципліна екіпажу на попутному курсі.</strong> Завжди, коли йдете за вітром: усі знають, де ґік; ніхто не сидить на шляху ґіка; ніхто не встає в кокпіті, не перевіривши; а коли ви <em>справді</em> робите поворот фордевінд — команда голосна, чітка, і на неї отримано відповідь до початку повороту.</p><hr><h3><span data-lang=\"en\">4.7 Reading the wind on the water</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Читання вітру по воді</span></h3><p data-lang=\"en\">This is the skill that makes you look experienced, and it's learnable in an afternoon of deliberate attention.</p><ul><li data-lang=\"en\"><strong>Dark patches on the water = more wind.</strong> Wind ripples the surface, which scatters light and darkens it. A dark patch moving towards you is a gust arriving. Watch for them upwind of you and prepare <em>before</em> they hit.</li><li data-lang=\"en\"><strong>Glassy patches = less wind (a hole).</strong> Avoid sailing into them; you'll stop.</li><li data-lang=\"en\"><strong>Wind lines</strong> — visible boundaries between different wind strengths or directions. Crossing one means a change; prepare.</li><li data-lang=\"en\"><strong>The direction the ripples travel</strong> shows wind direction.</li><li data-lang=\"en\"><strong>Other boats are your instruments.</strong> A boat upwind of you heeling suddenly tells you a gust is coming. A boat ahead that suddenly changes heel or angle has found a shift. Watch them constantly — this is free information.</li><li data-lang=\"en\"><strong>Flags, smoke, moored boats.</strong> Moored boats always lie head to wind (or head to current — know which). Flags ashore, chimney smoke, and the set of anchored boats all give you wind direction before you leave the dock.</li><li data-lang=\"en\"><strong>In Halifax specifically:</strong> the Northwest Arm is steep-sided and lined with trees and houses, which makes the wind <strong>gusty, shifty, and locally bent along the axis of the Arm</strong>. Expect sudden lulls in the lee of the western shore and hard gusts funnelling down between the hills. This makes it a great teacher and a slightly frustrating racecourse. Out in the main harbour and beyond McNabs Island the wind is far steadier.</li></ul><p data-lang=\"ua\">Це навик, який робить вас схожим на досвідченого, і його можна засвоїти за один вечір цілеспрямованої уваги.</p><ul><li data-lang=\"ua\"><strong>Темні плями на воді = більше вітру.</strong> Вітер робить рябь на поверхні, яка розсіює світло і темнить його. Темна пляма, що рухається до вас, — це порив, який наближається. Шукайте їх з навітряного боку і готуйтесь <em>до</em> того, як вони прийдуть.</li><li data-lang=\"ua\"><strong>Гладкі, як скло, плями = менше вітру («дірка»).</strong> Не заходьте туди — ви станете.</li><li data-lang=\"ua\"><strong>Лінії вітру</strong> — видимі межі між різною силою або напрямком вітру. Перетин означає зміну; готуйтесь.</li><li data-lang=\"ua\"><strong>Напрямок, у якому біжить рябь</strong>, показує напрямок вітру.</li><li data-lang=\"ua\"><strong>Інші судна — це ваші прилади.</strong> Судно з навітряного боку, яке раптово накренилося, повідомляє, що йде порив. Судно попереду, яке раптово змінило крен або курс, знайшло зсув вітру. Дивіться на них постійно — це безкоштовна інформація.</li><li data-lang=\"ua\"><strong>Прапори, дим, судна на швартовій бочці.</strong> Судна на бочці завжди стоять носом до вітру (або носом до течії — знайте, до чого саме). Прапори на берегі, дим з димарів і положення суден на якорі дають вам напрямок вітру ще до відходу від причалу.</li><li data-lang=\"ua\"><strong>Конкретно в Галіфаксі:</strong> Northwest Arm має крутих берегів, обсаджених деревами й будинками, через що вітер там <strong>поривчастий, зсувний і локально загнутий вздовж осі затоки</strong>. Очікуйте раптових затишків під західним берегом і сильних поривів, що спускаються між пагорбами. Це робить її добрим учителем і трохи дратівливою гоночною дистанцією. У самій гавані й за McNabs Island вітер значно стабільніший.</li></ul><hr><h3><span data-lang=\"en\">4.8 Checkpoint</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Контрольна точка</span></h3><p data-lang=\"en\">Draw the points of sail diagram from memory on a blank sheet. Then:</p><ul class=\"checklist\"><li><label><input type=\"checkbox\" class=\"ck\"><span>Name all six points of sail in order from head to wind to dead downwind.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which point of sail is usually fastest and most comfortable?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>How do you tell which tack you're on by looking at the boom?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Which tack has right of way?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>State the universal trim method in three steps.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does a fluttering <strong>windward</strong> telltale tell you to do?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Name the five steps of the de-powering sequence, in order.</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What is a preventer, and when must you rig one?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>Why is a broad reach safer than dead downwind?</span></label></li><li><label><input type=\"checkbox\" class=\"ck\"><span>What does a dark patch on the water mean?</span></label></li></ul><p data-lang=\"ua\">Намалюйте схему курсів відносно вітру з пам'яті на чистому аркуші. Потім:</p><ul class=\"checklist\"><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть усі шість курсів по порядку від левентика до чистого фордевінда.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який курс зазвичай найшвидший і найкомфортніший?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Як визначити свій галс, дивлячись на ґік?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Який галс має перевагу руху?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Сформулюйте універсальний метод налаштування у три кроки.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що вам каже робити тріпотливий <strong>навітряний</strong> колдунчик?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Назвіть п'ять кроків послідовності зниження тяги, за порядком.</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що таке завал-таль і коли її обов'язково заводити?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Чому бакштаг безпечніший за чистий фордевінд?</span></label></li><li data-lang=\"ua\"><label><input type=\"checkbox\" class=\"ck\"><span>Що означає темна пляма на воді?</span></label></li></ul><hr>"}, "m05": {"t_en": "05 · Manoeuvres", "t_ua": "Маневри", "html": "<h2>Module 05 — Manoeuvres: Tacking, Gybing, Heaving-To, Reefing</h2><h2 data-lang=\"ua\">Модуль 05 — Маневри: оверштаг, фордевінд, лежання в дрейфі, взяття рифів</h2><p><strong>Study time / Час: ~2.5 hours + continuous practice</strong></p><blockquote class=\"callout\"><p data-lang=\"en\">Every manoeuvre below is given with the <strong>exact English commands</strong> you will hear and must give. Learn the words as words. On a boat, the commands are a protocol — everyone knows what comes next, which is what makes a crew safe.</p><p data-lang=\"ua\">Кожен маневр нижче подано з <strong>точними англійськими командами</strong>, які ви почуєте і мусите давати. Вивчіть ці слова саме як слова. На судні команди — це протокол: усі знають, що буде далі, і саме це робить екіпаж безпечним.</p></blockquote><hr><h3><span data-lang=\"en\">5.1 The two ways to change tack</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Два способи змінити галс</span></h3><p data-lang=\"en\">There are exactly two ways to get the wind onto the other side of the boat, and confusing them is dangerous.</p><div class=\"table-wrap\"><table><thead><tr><th></th><th><strong>TACKING</strong> (going about)</th><th><strong>GYBING</strong> (jibing)</th></tr></thead><tbody><tr><td>Ukrainian</td><td>поворот оверштаг</td><td>поворот фордевінд</td></tr><tr><td>The <strong>bow</strong> passes through the wind</td><td>✅ Yes</td><td>❌ No</td></tr><tr><td>The <strong>stern</strong> passes through the wind</td><td>❌ No</td><td>✅ Yes</td></tr><tr><td>You turn <strong>towards</strong> the wind</td><td>✅</td><td>❌</td></tr><tr><td>You turn <strong>away</strong> from the wind</td><td>❌</td><td>✅</td></tr><tr><td>Boom movement</td><td>Crosses <strong>slowly</strong>, sails depower as you pass head to wind</td><td>Crosses <strong>violently</strong> unless controlled</td></tr><tr><td>Danger level</td><td>Low</td><td><strong>High</strong> — this is the dangerous one</td></tr><tr><td>Boat slows</td><td>Yes, significantly</td><td>Barely</td></tr><tr><td>Risk if done badly</td><td>Getting stuck \"in irons\"</td><td>Broken boom, broken rig, injured crew, MOB</td></tr></tbody></table></div><div class=\"pre-wrap\"><pre>   TACKING (bow through wind)              GYBING (stern through wind)\n            ↑ WIND                                  ↑ WIND\n              │                                       │\n      ╲       │       ╱                       │       │       │\n       ╲      │      ╱                        │       │       │\n        ╲     │     ╱                         │       │       │\n         ╲    ↑    ╱                          ╲       │      ╱\n          ╲  bow  ╱                            ╲             ╱\n           ╲ │  ╱                               ╲   stern  ╱\n            ╲│╱                                  ╲   ↓   ╱\n   close-hauled → head to wind →                  ╲  │  ╱\n   Slow, safe, sails flap in the middle     Fast, violent, boom slams across</pre></div><p data-lang=\"en\"><strong>The single most important safety fact in this module:</strong> during a tack the sails lose power as you point into the wind, so the boat is <em>de-powered</em> mid-manoeuvre and everything is gentle. During a gybe the sails stay <em>fully powered</em> throughout, and the boom crosses the boat with enormous force. <strong>Tacking is safe. Gybing must be controlled.</strong></p><p data-lang=\"ua\"><strong>Найважливіший факт безпеки в цьому модулі:</strong> під час повороту оверштаг вітрила втрачають тягу, коли ви йдете носом на вітер, тому судно <em>знесилене</em> посередині маневру і все відбувається м'яко. Під час повороту фордевінд вітрила залишаються <em>під повною тягою</em>, і ґік перелітає через судно з величезною силою. <strong>Оверштаг безпечний. Фордевінд треба контролювати.</strong></p><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">5.2 Tacking, step by step</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Поворот оверштаг, крок за кроком</span></h3><p data-lang=\"en\">Learn the commands verbatim. There is a call, a response, and an action; the crew must <em>answer</em> before the helm turns.</p><div class=\"table-wrap\"><table><thead><tr><th>Step</th><th>Skipper says</th><th>Crew says / does</th></tr></thead><tbody><tr><td>1</td><td><strong>\"Ready to tack?\"</strong> or <strong>\"Ready about?\"</strong></td><td>Crew moves to position. Jib sheets ready — new sheet uncoiled and in hand, old sheet with one turn ready to release. Answers: <strong>\"Ready!\"</strong></td></tr><tr><td>2</td><td><strong>\"Helm's a-lee!\"</strong> or <strong>\"Tacking!\"</strong> or <strong>\"Lee-oh!\"</strong></td><td><em>Now</em> the skipper turns the helm smoothly towards the wind.</td></tr><tr><td>3</td><td><em>(boat turns through head to wind)</em></td><td>Sails flap. Crew <strong>releases the old (now windward) jib sheet</strong> as the jib starts to backfill.</td></tr><tr><td>4</td><td><em>(boat passes through the wind)</em></td><td>Crew <strong>hauls in the new leeward jib sheet fast</strong>, taking up slack by hand before it loads, then finishing on the winch.</td></tr><tr><td>5</td><td><em>(new tack)</em></td><td>Skipper steers onto the new close-hauled course. Crew trims the jib properly, then the main. Duck under the boom as it crosses to the other side.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>Technique points that matter:</strong></p><ul><li data-lang=\"en\"><strong>Build speed first.</strong> Never tack from a slow, luffing state. You need momentum to carry the bow through the wind. If you're going slowly, bear away a little, build speed, <em>then</em> tack.</li><li data-lang=\"en\"><strong>Turn smoothly and continuously, not violently.</strong> A hard rudder throw stalls the rudder and stops the boat. A smooth, steady turn carries you through.</li><li data-lang=\"en\"><strong>Don't stop halfway.</strong> Commit. Hesitating leaves you head to wind with no way on — \"in irons\".</li><li data-lang=\"en\"><strong>Sheet the new jib in fast, but by hand first.</strong> Get as much in as you can with your hands while it's still unloaded — it's twenty times faster than winching, and every second the jib is loose is a second you're not accelerating.</li><li data-lang=\"en\"><strong>Duck.</strong> The boom crosses. It is low.</li></ul><p data-lang=\"en\"><strong>Getting out of irons</strong> (stuck head to wind, no steering, drifting backwards):</p><ol><li data-lang=\"en\">Don't panic — this happens to everyone and it is harmless in open water.</li><li data-lang=\"en\"><strong>Push the tiller <em>towards</em> the sail</strong> you want to back — usually push the boom out by hand on one side, or hold the jib out to one side to \"back\" it.</li><li data-lang=\"en\">The wind pushes the bow around. As the bow falls off the wind, <strong>centre the helm</strong>, sheet in, and you'll accelerate away.</li><li data-lang=\"en\">Remember: while drifting <strong>backwards</strong>, the rudder works in reverse. Steering feels inverted. That's normal.</li></ol><p data-lang=\"ua\">Вивчіть команди дослівно. Є виклик, відповідь і дія; екіпаж мусить <em>відповісти</em> до того, як кермо повернеться.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Крок</th><th>Шкіпер каже</th><th>Екіпаж каже / робить</th></tr></thead><tbody><tr><td>1</td><td><strong>«Ready to tack?»</strong> / <strong>«Ready about?»</strong></td><td>Екіпаж займає місця. Стаксель-шкоти готові: новий розбухтований у руці, старий з одним обертом готовий до віддачі. Відповідає: <strong>«Ready!»</strong></td></tr><tr><td>2</td><td><strong>«Helm's a-lee!»</strong> / <strong>«Tacking!»</strong> / <strong>«Lee-oh!»</strong></td><td><em>Тепер</em> шкіпер плавно перекладає кермо до вітру.</td></tr><tr><td>3</td><td><em>(судно проходить левентик)</em></td><td>Вітрила заполіскують. Екіпаж <strong>віддає старий (тепер навітряний) стаксель-шкот</strong>, коли стаксель починає наповнюватися з іншого боку.</td></tr><tr><td>4</td><td><em>(судно проходить через вітер)</em></td><td>Екіпаж <strong>швидко добирає новий підвітряний стаксель-шкот</strong>, вибираючи слабину руками до навантаження, потім довершує на лебідці.</td></tr><tr><td>5</td><td><em>(новий галс)</em></td><td>Шкіпер виводить на новий курс крутого бейдевінда. Екіпаж налаштовує стаксель як слід, потім грот. Пірніть під ґік, коли він переходить на інший борт.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Важливі технічні моменти:</strong></p><ul><li data-lang=\"ua\"><strong>Спочатку набрати швидкість.</strong> Ніколи не робіть оверштаг з повільного, заполіскуючого стану. Потрібна інерція, щоб пронести ніс через вітер. Якщо йдете повільно — трохи відійдіть від вітру, наберіть швидкість, <em>потім</em> повертайте.</li><li data-lang=\"ua\"><strong>Повертайте плавно і безперервно, а не різко.</strong> Різкий кидок керма зриває потік з керма і зупиняє судно.</li><li data-lang=\"ua\"><strong>Не зупиняйтесь на півдорозі.</strong> Ідіть до кінця. Вагання залишає вас носом на вітер без хода — «in irons».</li><li data-lang=\"ua\"><strong>Швидко добирайте новий стаксель, спочатку руками.</strong> Виберіть руками максимум, поки він не навантажений — це в двадцять разів швидше, ніж лебідкою.</li><li data-lang=\"ua\"><strong>Пірніть.</strong> Ґік переходить. Він низько.</li></ul><p data-lang=\"ua\"><strong>Вихід з левентика</strong> (застрягли носом на вітер, керма немає, дрейфуєте назад):</p><ol><li data-lang=\"ua\">Не панікуйте — це трапляється з усіма і в чистій воді це безпечно.</li><li data-lang=\"ua\"><strong>Перекладіть румпель <em>у бік</em> вітрила</strong>, яке хочете виставити «навпаки» — зазвичай виштовхніть ґік рукою на один бік, або притримайте стаксель на один борт, щоб він набрав вітер «навпаки».</li><li data-lang=\"ua\">Вітер розвертає ніс. Коли ніс піде від вітру, <strong>поставте кермо прямо</strong>, доберіть шкоти — і ви розженетесь.</li><li data-lang=\"ua\">Пам'ятайте: коли дрейфуєте <strong>назад</strong>, кермо працює навпаки. Керування відчувається інвертованим. Це нормально.</li></ol><hr><h3 data-lang=\"ua\"><span data-lang=\"en\">5.3 Gybing, step by step</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Поворот фордевінд, крок за кроком</span></h3><p data-lang=\"en\">Treat every gybe as a controlled operation. The boom carries enough force to kill.</p><div class=\"table-wrap\"><table><thead><tr><th>Step</th><th>Skipper says</th><th>Crew says / does</th></tr></thead><tbody><tr><td>0</td><td><em>(Before anything)</em></td><td><strong>Look around.</strong> Is there room? Is anyone in the boom's path? Is the mainsheet clear to run?</td></tr><tr><td>1</td><td><strong>\"Ready to gybe?\"</strong></td><td>Crew clears both jib sheets, moves clear of the boom's path, and answers <strong>\"Ready!\"</strong></td></tr><tr><td>2</td><td><strong>\"Gybe-ho!\"</strong> or <strong>\"Gybing!\"</strong></td><td>Everyone <strong>ducks and stays down.</strong></td></tr><tr><td>3</td><td>—</td><td><strong>Skipper or crew hauls the mainsheet in hard</strong>, bringing the boom towards the centreline <em>before</em> the stern passes through the wind. This is the key step.</td></tr><tr><td>4</td><td>—</td><td>Skipper bears away smoothly through dead downwind.</td></tr><tr><td>5</td><td>—</td><td>As the wind crosses the stern, the boom comes across — but it only travels a short distance because you shortened it. <strong>Ease the mainsheet out</strong> in a controlled way on the new side.</td></tr><tr><td>6</td><td>—</td><td>Crew swaps the jib sheets. Skipper settles on the new course.</td></tr></tbody></table></div><p data-lang=\"en\"><strong>The whole secret of a safe gybe</strong> is step 3: <strong>sheet the main in before you turn, and ease it out after.</strong> An uncontrolled gybe with the boom fully out means the boom accelerates across a 4-metre arc and arrives at the end of its travel with enough force to break the boom, break the gooseneck, break the vang, snap the mainsheet, or break a person. A controlled gybe with the main sheeted in means the boom travels perhaps a metre. Same manoeuvre, completely different consequence.</p><p data-lang=\"en\"><strong>Additional safety:</strong></p><ul><li data-lang=\"en\"><strong>Rig a preventer</strong> for any sustained downwind sailing (see <a href=\"#/m04\" data-nav=\"m04\">Module 04 §4.6</a>). Note: you must release the preventer before an intentional gybe, then re-rig it on the new side.</li><li data-lang=\"en\"><strong>In strong wind, consider not gybing at all.</strong> You can <strong>\"chicken gybe\"</strong> (also called wearing ship): instead of turning the stern through the wind, turn the <em>other way</em> — head up, tack around through the wind the long way. It takes longer and loses ground, but the boom never slams. In heavy weather, experienced skippers do this deliberately.</li><li data-lang=\"en\"><strong>Never gybe with a crew member forward of the mast</strong> unless absolutely necessary and they know.</li></ul><p data-lang=\"ua\">Ставтесь до кожного повороту фордевінд як до контрольованої операції. Ґік несе силу, достатню, щоб убити.</p><div class=\"table-wrap\" data-lang=\"ua\"><table><thead><tr><th>Крок</th><th>Шкіпер каже</th><th>Екіпаж каже / робить</th></tr></thead><tbody><tr><td>0</td><td><em>(до всього)</em></td><td><strong>Огляньтесь.</strong> Чи є місце? Чи є хтось на шляху ґіка? Чи вільний гика-шкот, щоб потравитися?</td></tr><tr><td>1</td><td><strong>«Ready to gybe?»</strong></td><td>Екіпаж готує обидва стаксель-шкоти, відходить зі шляху ґіка і відповідає <strong>«Ready!»</strong></td></tr><tr><td>2</td><td><strong>«Gybe-ho!»</strong> / <strong>«Gybing!»</strong></td><td>Усі <strong>пригинаються і залишаються низько.</strong></td></tr><tr><td>3</td><td>—</td><td><strong>Шкіпер або екіпаж сильно добирає гика-шкот</strong>, підводячи ґік до діаметральної площини <em>до</em> того, як корма пройде через вітер. Це ключовий крок.</td></tr><tr><td>4</td><td>—</td><td>Шкіпер плавно відводить судно через чистий фордевінд.</td></tr><tr><td>5</td><td>—</td><td>Коли вітер переходить корму, ґік переходить — але лише на коротку відстань, бо ви його підтягнули. <strong>Потравіть гика-шкот</strong> контрольовано на новому борту.</td></tr><tr><td>6</td><td>—</td><td>Екіпаж міняє стаксель-шкоти. Шкіпер виходить на новий курс.</td></tr></tbody></table></div><p data-lang=\"ua\"><strong>Уся таємниця безпечного повороту фордевінд</strong> — це крок 3: <strong>доберіть грот до повороту і потравіть після.</strong> Неконтрольований поворот з повністю винесеним ґіком означає, що ґік розганяється по 4-метровій дузі і приходить у кінець руху з силою, достатньою, щоб зламати ґік, вертлюг, відтяжку, порвати гика-шкот або зламати людину. Контрольований поворот з добраним гротом означає, що ґік проходить, можливо, метр. Той самий маневр, зовсім інші наслідки.</p><p data-lang=\"ua\"><strong>Додаткова безпека:</strong></p><ul><li data-lang=\"ua\"><strong>Заводьте завал-таль</strong> для будь-якого тривалого ходу за вітром. Зауважте: перед свідомим поворотом фордевінд її потрібно віддати, а потім завести знову на новий борт.</li><li data-lang=\"ua\"><strong>При сильному вітрі розгляньте варіант не робити поворот фордевінд узагалі.</strong> Можна зробити <strong>«chicken gybe»</strong> (поворот через оверштаг): замість того, щоб проносити корму через вітер, повертайте <em>в інший бік</em> — до вітру, через оверштаг довгим шляхом. Це довше і втрачає позицію, але ґік ніколи не б'є. У важку погоду досвідчені шкіпери роблять саме так.</li><li data-lang=\"ua\"><strong>Ніколи не робіть поворот фордевінд, коли член екіпажу перед мачтою</strong>, якщо це не абсолютно необхідно і він не попереджений.</li></ul><hr><h3><span data-lang=\"en\">5.4 Heaving-to — the sailor's pause button</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Лежання в дрейфі — «пауза» для яхтсмена</span></h3><p data-lang=\"en\">This is one of the most useful and least-taught skills in sailing. Heaving-to stops the boat in a stable, controlled, self-maintaining attitude — without dropping sails and without an engine. Once you can do it, everything gets easier.</p><p data-lang=\"en\"><strong>Use it to:</strong> eat lunch, reef safely, fix a problem, deal with seasickness, read a chart, wait for a lift bridge, wait out a squall, tend to an injury, or calm a frightened crew.</p><p data-lang=\"en\"><strong>How to heave-to (from close-hauled):</strong></p><ol><li data-lang=\"en\">Sail close-hauled with main and jib set.</li><li data-lang=\"en\"><strong>Tack, but do not release the jib sheet.</strong> The jib ends up \"backed\" — filled from the wrong side, pushing the bow away from the wind.</li><li data-lang=\"en\"><strong>Ease the mainsail</strong> out substantially so it's not driving.</li><li data-lang=\"en\"><strong>Put the helm hard over towards the wind</strong> (tiller to leeward) and lash or hold it there.</li><li data-lang=\"en\">Now the forces balance: the backed jib pushes the bow down, the rudder and main push it up. The boat sits at roughly 50–60° to the wind, moving slowly forward and sideways (typically 1–2 knots of drift), riding the waves comfortably.</li></ol><p data-lang=\"en\"><strong>Why it's worth learning properly:</strong> in the middle of a real problem — someone hurt, gear failure, sudden squall — being able to make the boat <em>stop behaving like a boat under sail</em> changes everything. It converts a crisis you're managing at 6 knots into a problem you're solving while stationary. Practise it in flat water on a calm day until it's routine, because you'll want it when it isn't calm.</p><p data-lang=\"en\"><strong>Note on drift:</strong> you are still moving downwind and sideways, typically 1–2 knots. Never heave-to close to a lee shore without knowing how much sea room you have and for how long.</p><p data-lang=\"ua\">Це один з найкорисніших і найменш викладаних навичок. Лежання в дрейфі зупиняє судно в стабільному, контрольованому, самопідтримуючому положенні — без спуску вітрил і без двигуна. Коли ви це вмієте, усе стає легшим.</p><p data-lang=\"ua\"><strong>Використовуйте, щоб:</strong> поїсти, безпечно взяти риф, усунути проблему, справитись з морською хворобою, прочитати карту, дочекатися розводного мосту, перечекати шквал, надати допомогу при травмі або заспокоїти зляканий екіпаж.</p><p data-lang=\"ua\"><strong>Як лягти в дрейф (з крутого бейдевінда):</strong></p><ol><li data-lang=\"ua\">Ідіть крутим бейдевіндом з гротом і стакселем.</li><li data-lang=\"ua\"><strong>Зробіть поворот оверштаг, але не віддавайте стаксель-шкот.</strong> Стаксель виявиться «навпаки» — наповненим з неправильного боку, відштовхуючи ніс від вітру.</li><li data-lang=\"ua\"><strong>Значно потравіть грот</strong>, щоб він не тягнув.</li><li data-lang=\"ua\"><strong>Покладіть кермо повністю до вітру</strong> (румпель під вітер) і закріпіть або тримайте його там.</li><li data-lang=\"ua\">Тепер сили врівноважуються: стаксель «навпаки» відводить ніс, а кермо й грот піднімають його. Судно стоїть приблизно під 50–60° до вітру, повільно рухаючись уперед і вбік (зазвичай дрейф 1–2 вузли), комфортно приймаючи хвилі.</li></ol><p data-lang=\"ua\"><strong>Чому варто вивчити як слід:</strong> посеред справжньої проблеми — хтось травмований, відмова обладнання, раптовий шквал — можливість змусити судно <em>перестати вести себе як судно під вітрилами</em> змінює все. Це перетворює кризу, з якою ви справляєтесь на 6 вузлах, у проблему, яку ви вирішуєте стоячи. Тренуйтеся в спокійній воді тихого дня, доки це не стане рутиною, бо знадобиться вам це тоді, коли спокійно не буде.</p><p data-lang=\"ua\"><strong>Про дрейф:</strong> ви все одно рухаєтесь під вітер і вбік, зазвичай 1–2 вузли. Ніколи не лягайте в дрейф близько до підвітряного берега, не знаючи, скільки у вас запасу води і на скільки часу.</p><hr><h3><span data-lang=\"en\">5.5 Reefing — reducing sail area</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Взяття рифів — зменшення площі вітрил</span></h3><p data-lang=\"en\">Reefing means making the sails smaller so the boat isn't overpowered. It is not an admission of failure; it is what competent sailors do, routinely, and often.</p><p data-lang=\"en\"><strong>The most-repeated advice in sailing, and it is correct:</strong></p><blockquote class=\"callout\"><p><strong>\"Reef early, reef often.\"</strong> And: <strong>\"The time to reef is the first time you think about it.\"</strong></p><p data-lang=\"ua\"><strong>«Беріть риф рано, беріть риф часто.»</strong> І: <strong>«Час брати риф — це коли ви вперше про це подумали.»</strong></p></blockquote><p><strong>Why the \"first time you think about it\" rule works:</strong> the moment the thought crosses your mind, conditions are already at the edge of comfortable. Reefing gets progressively harder and more dangerous as the wind builds — the boat is more violent, the deck is wetter, and everyone is more tired. Reefing 15 minutes early takes five easy minutes. Reefing 15 minutes late takes twenty frightening ones.</p><p><strong>Signs you should already have reefed:</strong></p><ul><li>Heel consistently over 20–25°.</li><li>Heavy weather helm; you're fighting the tiller.</li><li>The leeward rail is going under.</li><li>You're spilling wind constantly to keep control.</li><li>Crew look worried, or have stopped talking.</li><li><strong>You are asking yourself whether you should reef.</strong></li></ul><p><strong>Typical wind thresholds</strong> (very boat-dependent — learn <em>your</em> boat's numbers):</p><div class=\"table-wrap\"><table><thead><tr><th>Wind</th><th>Typical action on a small cruiser</th></tr></thead><tbody><tr><td>Under 12 kt</td><td>Full sail</td></tr><tr><td>12–18 kt</td><td>Full sail or first reef; change down headsail</td></tr><tr><td>18–24 kt</td><td><strong>First reef</strong> in the main, smaller headsail</td></tr><tr><td>24–30 kt</td><td><strong>Second reef</strong>, much smaller headsail</td></tr><tr><td>Over 30 kt</td><td>Third reef / storm jib — and honestly, be somewhere else</td></tr></tbody></table></div><p><strong>How to reef (slab reefing, the common system):</strong></p><ol><li><strong>Prepare before you need it.</strong> Reef <em>before</em> leaving harbour if the forecast says you'll want it — you can always shake it out.</li><li><strong>Reduce load first.</strong> Head up into the wind, or better, <strong>heave-to</strong> (§5.4). Some boats reef best on a close reach with the main eased.</li><li><strong>Take up the topping lift</strong> so the boom doesn't drop on anyone's head.</li><li><strong>Ease the main halyard</strong> to the marked reefing position.</li><li><strong>Secure the new tack</strong> — hook the luff reefing cringle onto the reefing horn or tension the luff line.</li><li><strong>Haul in the reefing line at the clew</strong> to pull the new foot tight along the boom.</li><li><strong>Re-tension the main halyard.</strong> Tidy the loose sail with reefing ties — never tie them around the boom in a way that traps the foot.</li><li><strong>Ease the topping lift</strong>, sheet in, and carry on. Trim for the new smaller sail.</li><li><strong>Reduce headsail too.</strong> A common beginner error is reefing only the main, which leaves the boat unbalanced with lee helm. Reduce both, roughly proportionally.</li></ol><p><strong>Shaking out a reef</strong> (removing it) is the reverse, and much easier. Do it when the wind eases and you find yourself slow and upright.</p><p data-lang=\"ua\">Взяття рифів означає зменшення вітрил, щоб судно не було перевантажене вітром. Це не признання невдачі; це те, що компетентні яхтсмени роблять регулярно і часто.</p><p data-lang=\"ua\"><strong>Чому правило «коли вперше подумали» працює:</strong> у момент, коли думка з'явилася, умови вже на межі комфортного. Брати риф стає прогресивно важче й небезпечніше з наростанням вітру — судно різкіше, палуба мокріша, усі втомленіші. Риф на 15 хвилин раніше — це п'ять легких хвилин. Риф на 15 хвилин пізніше — двадцять страшних.</p><p data-lang=\"ua\"><strong>Ознаки, що вам уже давно треба було взяти риф:</strong></p><ul><li data-lang=\"ua\">Крен постійно понад 20–25°.</li><li data-lang=\"ua\">Сильне навітряне кермо; ви боретесь з румпелем.</li><li data-lang=\"ua\">Підвітряний борт заходить під воду.</li><li data-lang=\"ua\">Ви постійно скидаєте вітер, щоб зберегти контроль.</li><li data-lang=\"ua\">Екіпаж виглядає стурбованим або замовк.</li><li data-lang=\"ua\"><strong>Ви питаєте себе, чи не взяти риф.</strong></li></ul><p data-lang=\"ua\"><strong>Як брати риф (slab reefing — поширена система):</strong></p><ol><li data-lang=\"ua\"><strong>Готуйте до того, як знадобиться.</strong> Візьміть риф <em>до</em> виходу з гавані, якщо прогноз каже, що він знадобиться — розпустити завжди можна.</li><li data-lang=\"ua\"><strong>Спочатку зменште навантаження.</strong> Вийдіть до вітру, а краще — <strong>ляжте в дрейф</strong> (§5.4).</li><li data-lang=\"ua\"><strong>Підберіть топенант</strong>, щоб ґік не впав комусь на голову.</li><li data-lang=\"ua\"><strong>Потравіть грота-фал</strong> до позначеної рифової позиції.</li><li data-lang=\"ua\"><strong>Закріпіть новий галсовий кут</strong> — надіньте рифовий крінгль на рифовий рог або натягніть галс-відтяжку.</li><li data-lang=\"ua\"><strong>Доберіть риф-шкентель на шкотовому куті</strong>, щоб натягнути нову нижню шкаторину по ґіку.</li><li data-lang=\"ua\"><strong>Знову натягніть грота-фал.</strong> Приберіть зайве полотнище риф-штертами — ніколи не обв'язуйте їх навколо ґіка так, щоб защемити нижню шкаторину.</li><li data-lang=\"ua\"><strong>Потравіть топенант</strong>, доберіть шкот і йдіть далі. Налаштуйте під нове менше вітрило.</li><li data-lang=\"ua\"><strong>Зменшіть і переднє вітрило.</strong> Поширена помилка новачків — рифити лише грот, що залишає судно розбалансованим з підвітряним кермом. Зменшуйте обидва, приблизно пропорційно.</li></ol><hr><h3><span data-lang=\"en\">5.6 Other essential manoeuvres</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Інші необхідні маневри</span></h3><h4 data-lang=\"ua\">Head up / bear away / Вихід до вітру / відхід від вітру</h4><p data-lang=\"en\">The two basic steering actions, and the sails must follow:</p><ul><li data-lang=\"en\"><strong>Head up (luff up)</strong> — turn towards the wind. <strong>Trim sails IN</strong> as you turn, or they'll luff.</li><li data-lang=\"en\"><strong>Bear away (bear off)</strong> — turn away from the wind. <strong>Ease sails OUT</strong> as you turn, or you'll over-heel.</li></ul><p data-lang=\"en\">Coordinating helm and sheets together is the fundamental skill. Beginners turn first and trim later, which is slow and uncomfortable. Do them simultaneously.</p><p data-lang=\"ua\">Дві базові дії керування, і вітрила мусять слідувати:</p><ul><li data-lang=\"ua\"><strong>До вітру (head up / luff up)</strong> — повертати до вітру. <strong>Добирайте вітрила</strong> одночасно з поворотом, інакше вони заполіскують.</li><li data-lang=\"ua\"><strong>Від вітру (bear away)</strong> — повертати від вітру. <strong>Травіть вітрила</strong> одночасно, інакше отримаєте надмірний крен.</li></ul><h4><span data-lang=\"en\">Stopping the boat</span><span class=\"sep\" data-lang=\"both\"> / </span><span data-lang=\"ua\">Зупинка судна</span></h4><p data-lang=\"en\">A sailboat has no brakes. You stop by taking away drive:</p><ul><li data-lang=\"en\"><strong>Luff up into the wind</strong> — the fastest way to stop. The sails flap, the boat slows and stops within a boat length or two.</li><li data-lang=\"en\"><strong>Ease all sheets fully</strong> — the sails flog and the boat coasts to a stop. Noisy and hard on sails, but effective.</li><li data-lang=\"en\"><strong>Heave-to</strong> (§5.4) — a controlled, sustainable stop.</li><li data-lang=\"en\"><strong>Drop sails and use the engine</strong> — the practical answer near docks.</li></ul><p da
